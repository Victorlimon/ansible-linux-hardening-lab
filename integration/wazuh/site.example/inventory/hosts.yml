---
# FICTITIOUS EXAMPLE. Copy this directory to the institution's private "site"
# repository and replace every name and address. Addresses below belong to the
# documentation range RFC 5737 (192.0.2.0/24); they are not real hosts.
#
# Group names are fixed by the gateway: ubuntu / ubuntu_2404 for Ubuntu 24.04,
# debian_12 for Debian 12. A host alias must never equal a group name.
all:
  children:
    cis_targets:
      children:
        ubuntu_2404:
        debian_12:
    ubuntu:
      children:
        ubuntu_2404:
    debian:
      children:
        debian_12:
    ubuntu_2404:
      hosts:
        ubuntu-app01:
          ansible_host: 192.0.2.21
        ubuntu-app02:
          ansible_host: 192.0.2.22
    debian_12:
      hosts:
        debian-db01:
          ansible_host: 192.0.2.31
  vars:
    # Non-root automation account that already exists on every managed node.
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
    # The private key is installed on the controller by install_controller.py
    # (bootstrap); it is never part of a bundle. This exact path is required.
    ansible_ssh_private_key_file: /var/lib/ansible-wazuh/ssh/id_rsa
    # Verify host keys against the controller's known_hosts file.
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile=/var/lib/ansible-wazuh/ssh/known_hosts
    ansible_become: true
    ansible_become_method: sudo
