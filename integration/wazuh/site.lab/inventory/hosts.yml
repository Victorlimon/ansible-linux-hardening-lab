---
# Lab site (VirtualBox host-only network 192.168.56.0/24, lab only).
all:
  children:
    cis_targets:
      children:
        ubuntu_2404:
        debian_12:
    ubuntu:
      children:
        ubuntu_2404:
    debian:
      children:
        debian_12:
    ubuntu_2404:
      hosts:
        ubuntu24:
          ansible_host: 192.168.56.12
    debian_12:
      hosts:
        debian12:
          ansible_host: 192.168.56.11
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: /var/lib/ansible-wazuh/ssh/id_rsa
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile=/var/lib/ansible-wazuh/ssh/known_hosts
    ansible_become: true
    ansible_become_method: sudo
