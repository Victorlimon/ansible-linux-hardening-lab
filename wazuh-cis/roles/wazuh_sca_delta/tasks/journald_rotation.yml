---
# Delta | journald log file rotation — Wazuh 35708 (Ubuntu, CIS 6.1.1.3).
# The policy regexes (^SystemMaxUse\s*=\s*\d+ etc.) demand PLAIN INTEGER values
# (byte counts / seconds), written in the MAIN /etc/systemd/journald.conf —
# drop-ins under journald.conf.d would not be seen by the f: rule.

- name: Delta journald rotation | Pin integer rotation keys in journald.conf
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^\s*#?\s*{{ item.name }}\b'
    line: "{{ item.name }}={{ item.value }}"
    create: false
  loop: "{{ wazuh_delta_journald_rotation_settings }}"
  loop_control:
    label: "{{ item.name }}={{ item.value }}"
  notify: Delta | Restart journald

- name: Delta journald rotation | Flush handlers before validating
  ansible.builtin.meta: flush_handlers

- name: Delta journald rotation | Verify every required key is an active integer line
  ansible.builtin.command: "grep -E '^{{ item.name }}=[0-9]+$' /etc/systemd/journald.conf"
  register: wazuh_delta_rotation_grep
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ wazuh_delta_journald_rotation_settings }}"
  loop_control:
    label: "{{ item.name }}"

- name: Delta journald rotation | Assert the rotation configuration matches Wazuh 35708
  ansible.builtin.assert:
    that:
      - wazuh_delta_rotation_grep.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      Missing non-integer rotation keys:
      {{ wazuh_delta_rotation_grep.results
         | selectattr('rc', 'ne', 0) | map(attribute='item') | map(attribute='name') | list }}
    success_msg: "All five journald rotation keys are active integer lines"
