---
# Wazuh CIS v1.0.0 password aging + SHA-512 backend (33163/33165-33167,
# 35695-35698). Sets login.defs defaults, the useradd INACTIVE default, and
# applies chage to every account that has a password hash so the per-user
# `chage -l` audits pass.

- name: Aging | Set PASS_MIN_DAYS
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MIN_DAYS\s+'
    line: 'PASS_MIN_DAYS {{ wazuh_delta_pass_min_days }}'
    backup: true

- name: Aging | Set PASS_WARN_AGE
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_WARN_AGE\s+'
    line: 'PASS_WARN_AGE {{ wazuh_delta_pass_warn_age }}'
    backup: true

- name: Aging | Set ENCRYPT_METHOD
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*ENCRYPT_METHOD\s+'
    line: 'ENCRYPT_METHOD {{ wazuh_delta_encrypt_method }}'
    backup: true

- name: Aging | Set useradd INACTIVE default
  ansible.builtin.command: "useradd -D -f {{ wazuh_delta_inactive_days }}"
  changed_when: true

- name: Aging | Rewrite pam_unix to sha512 (Debian)
  ansible.builtin.replace:
    path: "{{ wazuh_delta_pam_password_file }}"
    regexp: '^(\s*password\s+\[\S+\]\s+pam_unix\.so\s+).*$'
    replace: '\1sha512'
  when: wazuh_delta_pam_password_file | length > 0

- name: Aging | Apply chage to password-hashed accounts
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk -F: '($2 ~ /^\$/) {print $1}' /etc/shadow | while read -r u; do
        chage -m {{ wazuh_delta_pass_min_days }} -W {{ wazuh_delta_pass_warn_age }} -I {{ wazuh_delta_inactive_days }} "$u"
      done
    executable: /bin/bash
  changed_when: false
