---
# LAB-ONLY inventory for the Wazuh SCA delta. Deliberately separate from
# ansible/inventories so the delta never travels with production inventories.
# Connection model mirrors ansible/inventories/local (run from ansible-control).
all:
  children:
    wazuh_delta_targets:
      children:
        debian_12:
          hosts:
            debian12:
              ansible_host: 192.168.56.11
              wazuh_delta_platform: debian_12
              wazuh_delta_agent_id: "005"
              # LAB EXCEPTION ONLY — crypt(6) hash of the throwaway lab root
              # password documented in docs/PREPRODUCCION.md. In production this
              # value must come from ansible-vault and must never be committed.
              wazuh_delta_root_password_hash: "$6$P1MvQcFpUB9bjYVK$DrTgRwayTDxniWgAs4I1DVzv7/6A.6PMVnyAT9ZqMZU/b72auza56vou37gH4XWNpoQ7.BEZzOZssrfQh0xmg0"
        ubuntu_2404:
          hosts:
            ubuntu24:
              ansible_host: 192.168.56.12
              wazuh_delta_platform: ubuntu_2404
              wazuh_delta_agent_id: "004"
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    # Aislamiento exclusivo del laboratorio efímero. Producción debe verificar
    # host keys mediante known_hosts y no debe copiar esta excepción.
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    ansible_become: true
    ansible_become_method: sudo
