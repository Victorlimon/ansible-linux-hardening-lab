# Self-contained configuration for the Wazuh SCA delta. Run playbooks from
# this directory so inventory and roles paths resolve.
[defaults]
inventory = inventory/lab/hosts.yml
roles_path = ./roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections
stdout_callback = default
display_skipped_hosts = false
# The lab inventory below already carries the StrictHostKeyChecking exception
# as an ansible_ssh_common_args variable; do not weaken host key checking here.
