all:
  children:
    cis_targets:
      children:
        ubuntu_2404:
        debian_12:
    ubuntu:
      children:
        ubuntu_2404:
    debian:
      children:
        debian_12:
    ubuntu_2404:
      hosts:
        ubuntu24:
          ansible_host: 192.168.56.12
    debian_12:
      hosts:
        debian12:
          ansible_host: 192.168.56.11
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    # Aislamiento exclusivo del laboratorio efímero. Producción debe verificar
    # host keys mediante known_hosts y no debe copiar esta excepción.
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    ansible_become: yes
    ansible_become_method: sudo
    # No se necesita contraseña de sudo porque las VMs tienen NOPASSWD.
