---
# Control manual y de solo lectura. No habilita ni deshabilita IPv6.
cis_debian_12_3_1_1_ipv6_audit: true

# Decisión local documentable: enabled, disabled o undecided.
cis_debian_12_ipv6_site_policy: undecided

# Las remediaciones canario requieren los tres gates: entry point remediation,
# habilitación global y confirmación explícita del operador.
cis_debian_12_execution_mode: audit
cis_debian_12_remediation_enabled: false
cis_debian_12_canary_confirmed: false

cis_debian_12_7_1_1_passwd_permissions: true
cis_debian_12_7_1_5_shadow_permissions: true
# Low-risk SYN-flood protection; Debian remediation still requires canary gates.
cis_debian_12_3_3_10_tcp_syncookies: true
# Does not install cron or create /etc/crontab when the subsection is not applicable.
cis_debian_12_2_4_1_2_crontab_permissions: true

# CIS 1.6.2 can always be audited. Remediation and PASS verification require
# organization-specific text reviewed by legal counsel.
cis_debian_12_1_6_2_issue_banner: true
cis_debian_12_banner_remediation_enabled: false
cis_debian_12_banner_text_approved: false
cis_debian_12_issue_banner_text: ""
