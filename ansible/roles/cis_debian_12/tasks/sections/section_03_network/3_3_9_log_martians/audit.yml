---
- name: Audit Debian 12 CIS 3.3.9 suspicious packets
  ansible.builtin.include_role: {name: cis_linux_common, tasks_from: sections/section_03_network/3_3_9_log_martians/audit.yml, apply: {tags: always}}
  vars: {cis_linux_common_control_id: "3.3.9", cis_linux_common_platform: debian_12, cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0, cis_linux_common_sysctl_parameter: "{{ item.parameter }}", cis_linux_common_sysctl_runtime_path: "{{ item.runtime }}", cis_linux_common_sysctl_value: '1', cis_linux_common_sysctl_file: "{{ item.file }}"}
  loop: [{parameter: net.ipv4.conf.all.log_martians, runtime: /proc/sys/net/ipv4/conf/all/log_martians, file: /etc/sysctl.d/99-cis-3-3-9-ipv4-all.conf}, {parameter: net.ipv4.conf.default.log_martians, runtime: /proc/sys/net/ipv4/conf/default/log_martians, file: /etc/sysctl.d/99-cis-3-3-9-ipv4-default.conf}]
