---
- name: Verify Debian 12 CIS 3.3.4 broadcast ICMP requests
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_03_network/3_3_4_broadcast_icmp/verification.yml
  vars:
    cis_linux_common_control_id: "3.3.4"
    cis_linux_common_platform: debian_12
    cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0
    cis_linux_common_sysctl_parameter: net.ipv4.icmp_echo_ignore_broadcasts
    cis_linux_common_sysctl_runtime_path: /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts
    cis_linux_common_sysctl_value: '1'
    cis_linux_common_sysctl_file: /etc/sysctl.d/99-cis-3-3-4-broadcast-icmp.conf
