---
- name: CIS 3.3.7 | Remediation | Run common mechanism
  ansible.builtin.include_role:
    name: cis_linux_common
    tasks_from: sections/section_03_network/3_3_7_reverse_path_filtering/remediation.yml
    apply:
      tags: always
  vars: {cis_linux_common_control_id: "3.3.7", cis_linux_common_platform: debian_12, cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0, cis_linux_common_sysctl_parameter: "{{ item.parameter }}", cis_linux_common_sysctl_runtime_path: "{{ item.runtime }}", cis_linux_common_sysctl_value: '1', cis_linux_common_sysctl_file: "{{ item.file }}"}
  loop:
    - {parameter: net.ipv4.conf.all.rp_filter, runtime: /proc/sys/net/ipv4/conf/all/rp_filter, file: /etc/sysctl.d/99-cis-3-3-7-ipv4-all.conf}
    - {parameter: net.ipv4.conf.default.rp_filter, runtime: /proc/sys/net/ipv4/conf/default/rp_filter, file: /etc/sysctl.d/99-cis-3-3-7-ipv4-default.conf}
