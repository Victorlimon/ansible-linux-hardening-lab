---
- name: Audit Debian 12 CIS 3.3.6 secure redirects
  ansible.builtin.include_role: {name: cis_linux_common, tasks_from: sections/section_03_network/3_3_6_secure_redirects/audit.yml, apply: {tags: always}}
  vars: {cis_linux_common_control_id: "3.3.6", cis_linux_common_platform: debian_12, cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0, cis_linux_common_sysctl_parameter: "{{ item.parameter }}", cis_linux_common_sysctl_runtime_path: "{{ item.runtime }}", cis_linux_common_sysctl_value: '0', cis_linux_common_sysctl_file: "{{ item.file }}"}
  loop: [{parameter: net.ipv4.conf.all.secure_redirects, runtime: /proc/sys/net/ipv4/conf/all/secure_redirects, file: /etc/sysctl.d/99-cis-3-3-6-ipv4-all.conf}, {parameter: net.ipv4.conf.default.secure_redirects, runtime: /proc/sys/net/ipv4/conf/default/secure_redirects, file: /etc/sysctl.d/99-cis-3-3-6-ipv4-default.conf}]
