---
- name: Audit Debian 12 CIS 3.3.1 IPv4 forwarding
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_03_network/3_3_1_ip_forwarding/audit.yml
  vars:
    cis_linux_common_control_id: "3.3.1"
    cis_linux_common_platform: debian_12
    cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0
    cis_linux_common_sysctl_parameter: net.ipv4.ip_forward
    cis_linux_common_sysctl_runtime_path: /proc/sys/net/ipv4/ip_forward
    cis_linux_common_sysctl_value: '0'
    cis_linux_common_sysctl_file: /etc/sysctl.d/99-cis-3-3-1-ipv4.conf

- name: Audit Debian 12 CIS 3.3.1 IPv6 forwarding
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_03_network/3_3_1_ip_forwarding/audit.yml
  vars:
    cis_linux_common_control_id: "3.3.1"
    cis_linux_common_platform: debian_12
    cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0
    cis_linux_common_sysctl_parameter: net.ipv6.conf.all.forwarding
    cis_linux_common_sysctl_runtime_path: /proc/sys/net/ipv6/conf/all/forwarding
    cis_linux_common_sysctl_value: '0'
    cis_linux_common_sysctl_file: /etc/sysctl.d/99-cis-3-3-1-ipv6.conf
