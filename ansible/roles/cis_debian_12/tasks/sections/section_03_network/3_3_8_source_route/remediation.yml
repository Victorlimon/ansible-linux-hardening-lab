---
- name: Remediate Debian 12 CIS 3.3.8 source routes
  ansible.builtin.include_role: {name: cis_linux_common, tasks_from: sections/section_03_network/3_3_8_source_route/remediation.yml}
  vars: {cis_linux_common_control_id: "3.3.8", cis_linux_common_platform: debian_12, cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0, cis_linux_common_sysctl_parameter: "{{ item.parameter }}", cis_linux_common_sysctl_runtime_path: "{{ item.runtime }}", cis_linux_common_sysctl_value: '0', cis_linux_common_sysctl_file: "{{ item.file }}"}
  loop: [{parameter: net.ipv4.conf.all.accept_source_route, runtime: /proc/sys/net/ipv4/conf/all/accept_source_route, file: /etc/sysctl.d/99-cis-3-3-8-ipv4-all.conf}, {parameter: net.ipv4.conf.default.accept_source_route, runtime: /proc/sys/net/ipv4/conf/default/accept_source_route, file: /etc/sysctl.d/99-cis-3-3-8-ipv4-default.conf}, {parameter: net.ipv6.conf.all.accept_source_route, runtime: /proc/sys/net/ipv6/conf/all/accept_source_route, file: /etc/sysctl.d/99-cis-3-3-8-ipv6-all.conf}, {parameter: net.ipv6.conf.default.accept_source_route, runtime: /proc/sys/net/ipv6/conf/default/accept_source_route, file: /etc/sysctl.d/99-cis-3-3-8-ipv6-default.conf}]
