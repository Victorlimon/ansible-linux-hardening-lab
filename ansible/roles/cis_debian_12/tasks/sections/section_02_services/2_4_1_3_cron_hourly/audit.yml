---
- name: CIS 2.4.1.3 | Audit | Run the common applicable-directory mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_02_services/2_4_1_3_cron_hourly/audit.yml
  vars:
    cis_linux_common_control_id: "2.4.1.3"
    cis_linux_common_platform: debian_12
    cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0
    cis_linux_common_package_name: cron
    cis_linux_common_fixed_file_path: /etc/cron.hourly
    cis_linux_common_fixed_file_expected_type: directory
    cis_linux_common_fixed_file_owner: root
    cis_linux_common_fixed_file_group: root
    cis_linux_common_fixed_file_remediation_mode: '0700'
    cis_linux_common_fixed_file_expected_mode_description: 0700 root:root directory
    cis_linux_common_fixed_file_max_mode: '0700'
