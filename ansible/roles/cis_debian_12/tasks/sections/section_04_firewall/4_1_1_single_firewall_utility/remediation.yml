---
- ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_04_firewall/4_1_1_single_firewall_utility/remediation.yml
  vars:
    cis_linux_common_control_id: '4.1.1'
    cis_linux_common_platform: debian_12
    cis_linux_common_firewall_utility: "{{ cis_firewall }}"
    cis_linux_common_firewall_utilities:
      - {name: ufw, service: ufw, path: /usr/sbin/ufw}
      - {name: nftables, service: nftables, path: /usr/sbin/nft}
      - {name: iptables, service: iptables, path: /usr/sbin/iptables}
