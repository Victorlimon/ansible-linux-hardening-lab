---
- name: CIS 6.2.3.11 | remediation | debian_12 common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_2_3_11_session/remediation.yml}
  vars:
    cis_linux_common_control_id: '6.2.3.11'
    cis_linux_common_platform: debian_12
    cis_linux_common_config_line: '-w /var/run/utmp -p wa -k session'
    cis_linux_common_config_line_regexp: '^-w\ /var/run/utmp\ -p\ wa\ -k\ session$'
    cis_linux_common_config_line_path: /etc/audit/rules.d/cis_6_2_3_11.rules
    cis_linux_common_config_line_package: auditd
