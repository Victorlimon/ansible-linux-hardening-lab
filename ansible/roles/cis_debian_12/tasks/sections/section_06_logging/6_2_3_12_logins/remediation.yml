---
- name: CIS 6.2.3.12 | remediation | debian_12 common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_2_3_12_logins/remediation.yml}
  vars:
    cis_linux_common_control_id: '6.2.3.12'
    cis_linux_common_platform: debian_12
    cis_linux_common_config_line: '-w /var/log/lastlog -p wa -k logins'
    cis_linux_common_config_line_regexp: '^-w\ /var/log/lastlog\ -p\ wa\ -k\ logins$'
    cis_linux_common_config_line_path: /etc/audit/rules.d/cis_6_2_3_12.rules
    cis_linux_common_config_line_package: auditd
