---
- name: CIS 6.1.2.3 | Remediation | Debian common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_1_2_3_compress/remediation.yml}
  vars: {cis_linux_common_control_id: "6.1.2.3", cis_linux_common_platform: debian_12, cis_linux_common_config_line_package: systemd, cis_linux_common_config_line_path: /etc/systemd/journald.conf, cis_linux_common_config_line: "Compress=yes", cis_linux_common_config_line_regexp: '^\s*Compress\s*=\s*yes\s*$'}
