---
- name: CIS 6.2.3.9 | audit | debian_12 common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_2_3_9_perm_mod/audit.yml}
  vars:
    cis_linux_common_control_id: '6.2.3.9'
    cis_linux_common_platform: debian_12
    cis_linux_common_config_line: '-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod'
    cis_linux_common_config_line_regexp: '^-a\ always,exit\ -F\ arch=b64\ -S\ chmod,fchmod,fchmodat\ -F\ auid>=1000\ -F\ auid!=unset\ -k\ perm_mod$'
    cis_linux_common_config_line_path: /etc/audit/rules.d/cis_6_2_3_9.rules
    cis_linux_common_config_line_package: auditd
