---
- name: CIS 6.1.2.2 | Remediation | Debian common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_1_2_2_forward_to_syslog/remediation.yml}
  vars: {cis_linux_common_control_id: "6.1.2.2", cis_linux_common_platform: debian_12, cis_linux_common_config_line_package: systemd, cis_linux_common_config_line_path: /etc/systemd/journald.conf, cis_linux_common_config_line: "ForwardToSyslog=no", cis_linux_common_config_line_regexp: '^\s*ForwardToSyslog\s*=\s*no\s*$'}
