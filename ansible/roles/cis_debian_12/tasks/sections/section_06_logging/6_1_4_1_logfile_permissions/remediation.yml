---
- name: CIS 6.1.4.1 | Remediation | Debian common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_1_4_1_logfile_permissions/remediation.yml}
  vars:
    cis_linux_common_control_id: "6.1.4.1"
    cis_linux_common_platform: debian_12
    cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0
    cis_linux_common_fixed_file_owner: root
    cis_linux_common_fixed_file_group: root
    cis_linux_common_fixed_file_max_mode: '0640'
    cis_linux_common_fixed_file_remediation_mode: 'u-x,g-wx,o-rwx'
    cis_linux_common_fixed_file_expected_mode_description: >-
      0640 or more restrictive for every file found under /var/log
    cis_linux_common_fixed_file_scopes:
      - {label: utmp-accounting, search: {paths: /var/log, patterns: [wtmp*, btmp*, lastlog*, README], file_type: file, follow: true}, owners: [root], groups: [root, utmp], max_mode: '0664', remediation_mode: 'ug-x,o-wx', description: '0664 or more restrictive, root-owned, group root or utmp'}
      - {label: cloud-init, search: {paths: /var/log, patterns: [cloud-init.log*, localmessages*, waagent.log*], file_type: file, follow: true}, owners: [root, syslog], groups: [root, adm], max_mode: '0644', remediation_mode: 'u-x,go-wx', description: '0644 or more restrictive'}
      - {label: apt-logs, search: {paths: /var/log/apt, patterns: ['*'], recurse: true, file_type: file, follow: true}, owners: [root], groups: [root, adm], max_mode: '0644', remediation_mode: 'u-x,go-wx', description: '0644 or more restrictive'}
      - {label: sensitive-logs, search: {paths: /var/log, patterns: [secure*, auth.log, syslog, messages], file_type: file, follow: true}, owners: [root, syslog], groups: [root, adm], max_mode: '0640', remediation_mode: 'u-x,g-wx,o-rwx', description: '0640 or more restrictive'}
      - {label: sssd-logs, search: {paths: /var/log, patterns: [SSSD, sssd], file_type: file, follow: true}, owners: [root, SSSD], groups: [root, SSSD], max_mode: '0660', remediation_mode: 'ug-x,o-wx', description: '0660 or more restrictive'}
      - {label: gdm-logs, search: {paths: /var/log, patterns: [gdm, gdm3], file_type: file, follow: true}, owners: [root], groups: [root, gdm, gdm3], max_mode: '0660', remediation_mode: 'ug-x,o-wx', description: '0660 or more restrictive'}
      - {label: journal-logs, search: {paths: /var/log/journal, patterns: ['*.journal', '*.journal~'], recurse: true, file_type: file, follow: true}, owners: [root], groups: [root, systemd-journal], max_mode: '0640', remediation_mode: 'u-x,g-wx,o-rwx', description: '0640 or more restrictive'}
      - {label: default-logfiles, allow_system_owner: true, search: {paths: /var/log, patterns: ['*'], recurse: true, hidden: true, file_type: file, follow: true}, owners: [root, syslog], groups: [root, adm], max_mode: '0640', remediation_mode: 'u-x,g-wx,o-rwx', description: '0640 or more restrictive'}
