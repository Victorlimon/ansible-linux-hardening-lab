---
- name: CIS 1.6.2 | Audit | Inspect /etc/issue metadata
  ansible.builtin.stat:
    path: /etc/issue
    follow: true
  register: cis_debian_12_1_6_2_issue_stat

- name: CIS 1.6.2 | Audit | Read /etc/issue without changing it
  ansible.builtin.slurp:
    src: /etc/issue
  register: cis_debian_12_1_6_2_issue_slurp
  no_log: true
  when: cis_debian_12_1_6_2_issue_stat.stat.exists | default(false)

- name: CIS 1.6.2 | Audit | Normalize /etc/issue evidence
  ansible.builtin.set_fact:
    cis_debian_12_1_6_2_issue_content: >-
      {{
        (cis_debian_12_1_6_2_issue_slurp.content | b64decode)
        if cis_debian_12_1_6_2_issue_stat.stat.exists | default(false)
        else ''
      }}
  no_log: true

- name: CIS 1.6.2 | Audit | Classify /etc/issue
  ansible.builtin.set_fact:
    cis_debian_12_1_6_2_issue_prohibited: >-
      {{
        '\\m' in cis_debian_12_1_6_2_issue_content
        or '\\r' in cis_debian_12_1_6_2_issue_content
        or '\\s' in cis_debian_12_1_6_2_issue_content
        or '\\v' in cis_debian_12_1_6_2_issue_content
        or 'debian' in cis_debian_12_1_6_2_issue_content | lower
      }}
    cis_debian_12_1_6_2_issue_metadata_compliant: >-
      {{
        cis_debian_12_1_6_2_issue_stat.stat.exists | default(false)
        and cis_debian_12_1_6_2_issue_stat.stat.isreg | default(false)
        and cis_debian_12_1_6_2_issue_stat.stat.pw_name | default('') == 'root'
        and cis_debian_12_1_6_2_issue_stat.stat.gr_name | default('') == 'root'
        and (cis_debian_12_1_6_2_issue_stat.stat.mode | default('9999'))[1]
            in ['0', '2', '4', '6']
        and (cis_debian_12_1_6_2_issue_stat.stat.mode | default('9999'))[2]
            in ['0', '4']
        and (cis_debian_12_1_6_2_issue_stat.stat.mode | default('9999'))[3]
            in ['0', '4']
      }}
  no_log: true

- name: CIS 1.6.2 | Audit | Report sanitized /etc/issue status
  ansible.builtin.debug:
    msg:
      control: "1.6.2"
      platform: debian_12
      benchmark: CIS Debian Linux 12 Benchmark v1.1.0
      classification: >-
        {{
          'FAIL'
          if (not cis_debian_12_1_6_2_issue_metadata_compliant or
              cis_debian_12_1_6_2_issue_prohibited)
          else ('PASS'
                if (cis_debian_12_banner_text_approved | bool and
                    cis_debian_12_1_6_2_issue_content | trim ==
                    cis_debian_12_issue_banner_text | trim)
                else 'MANUAL')
        }}
      approved_site_policy_available: >-
        {{ cis_debian_12_banner_text_approved | bool }}
      prohibited_os_information_detected: >-
        {{ cis_debian_12_1_6_2_issue_prohibited }}
      metadata_compliant: >-
        {{ cis_debian_12_1_6_2_issue_metadata_compliant }}
      observed_mode: >-
        {{ cis_debian_12_1_6_2_issue_stat.stat.mode | default('unavailable') }}
      content_redacted: true
      changed_target: false
