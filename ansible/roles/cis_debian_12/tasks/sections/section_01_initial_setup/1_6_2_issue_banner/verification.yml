---
- name: CIS 1.6.2 | Verification | Require an approved site policy
  ansible.builtin.assert:
    that:
      - cis_debian_12_banner_text_approved | bool
      - cis_debian_12_issue_banner_text | trim | length > 0
    fail_msg: CIS 1.6.2 cannot be verified PASS without approved banner text.

- name: CIS 1.6.2 | Verification | Inspect /etc/issue metadata
  ansible.builtin.stat:
    path: /etc/issue
    follow: true
  register: cis_debian_12_1_6_2_verification_stat

- name: CIS 1.6.2 | Verification | Read /etc/issue
  ansible.builtin.slurp:
    src: /etc/issue
  register: cis_debian_12_1_6_2_verification_slurp
  when: cis_debian_12_1_6_2_verification_stat.stat.exists | default(false)

- name: CIS 1.6.2 | Verification | Assert approved content and metadata
  ansible.builtin.assert:
    that:
      - cis_debian_12_1_6_2_verification_stat.stat.exists | default(false)
      - cis_debian_12_1_6_2_verification_stat.stat.isreg | default(false)
      - cis_debian_12_1_6_2_verification_stat.stat.pw_name | default('') == 'root'
      - cis_debian_12_1_6_2_verification_stat.stat.gr_name | default('') == 'root'
      - >-
        (cis_debian_12_1_6_2_verification_stat.stat.mode | default('9999'))[1]
        in ['0', '2', '4', '6']
      - >-
        (cis_debian_12_1_6_2_verification_stat.stat.mode | default('9999'))[2]
        in ['0', '4']
      - >-
        (cis_debian_12_1_6_2_verification_stat.stat.mode | default('9999'))[3]
        in ['0', '4']
      - >-
        cis_debian_12_1_6_2_verification_slurp.content | b64decode | trim ==
        cis_debian_12_issue_banner_text | trim
    fail_msg: /etc/issue does not match the approved Debian banner policy.
