---
- name: CIS 1.7.2 | Audit | Run common GDM configuration mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_01_initial_setup/1_7_2_gdm_banner/audit.yml
  vars:
    cis_linux_common_control_id: '1.7.2'
    cis_linux_common_platform: debian_12
    cis_linux_common_benchmark: 'CIS Debian Linux 12 Benchmark v1.1.0'
    cis_linux_common_gdm_gate_package: gdm3
    cis_linux_common_gdm_checks:
      - 'gsettings|org.gnome.login-screen|banner-message-enable|^true$'
      - 'gsettings_text|org.gnome.login-screen|banner-message-text'
