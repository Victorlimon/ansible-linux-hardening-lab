---
- name: CIS 1.7.10 | Audit | Run common GDM configuration mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_01_initial_setup/1_7_10_gdm_xdmcp/audit.yml
  vars:
    cis_linux_common_control_id: '1.7.10'
    cis_linux_common_platform: debian_12
    cis_linux_common_benchmark: 'CIS Debian Linux 12 Benchmark v1.1.0'
    cis_linux_common_gdm_gate_package: gdm3
    cis_linux_common_gdm_checks:
      - 'xdmcp'
    cis_linux_common_gdm_apply_gate: false
