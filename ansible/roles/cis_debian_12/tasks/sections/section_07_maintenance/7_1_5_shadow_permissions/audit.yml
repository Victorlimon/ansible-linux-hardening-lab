---
- name: CIS 7.1.5 | Audit | Inspect /etc/shadow
  ansible.builtin.import_tasks: sections/section_07_maintenance/7_1_5_shadow_permissions/inspect.yml

- name: CIS 7.1.5 | Audit | Report sanitized /etc/shadow status
  ansible.builtin.debug:
    msg:
      control: "7.1.5"
      platform: debian_12
      benchmark: CIS Debian Linux 12 Benchmark v1.1.0
      classification: >-
        {{ 'PASS' if cis_debian_12_7_1_5_shadow_compliant else 'FAIL' }}
      observed:
        exists: "{{ cis_debian_12_7_1_5_shadow.stat.exists | default(false) }}"
        is_regular: "{{ cis_debian_12_7_1_5_shadow.stat.isreg | default(false) }}"
        owner: "{{ cis_debian_12_7_1_5_shadow.stat.pw_name | default('unavailable') }}"
        group: "{{ cis_debian_12_7_1_5_shadow.stat.gr_name | default('unavailable') }}"
        mode: "{{ cis_debian_12_7_1_5_shadow.stat.mode | default('unavailable') }}"
      content_redacted: true
      changed_target: false
