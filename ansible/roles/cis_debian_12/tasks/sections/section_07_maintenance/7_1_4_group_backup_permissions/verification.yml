---
- name: CIS 7.1.4 | Verification | Use the common fixed-file mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_1_4_group_backup_permissions/verification.yml
  vars:
    cis_linux_common_control_id: "7.1.4"
    cis_linux_common_platform: debian_12
    cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0
    cis_linux_common_fixed_file_path: /etc/group-
    cis_linux_common_fixed_file_owner: root
    cis_linux_common_fixed_file_group: root
    cis_linux_common_fixed_file_remediation_mode: 'u-x,go-wx'
    cis_linux_common_fixed_file_expected_mode_description: >-
      0644 or more restrictive without execute bits
    cis_linux_common_fixed_file_max_mode: '0644'
