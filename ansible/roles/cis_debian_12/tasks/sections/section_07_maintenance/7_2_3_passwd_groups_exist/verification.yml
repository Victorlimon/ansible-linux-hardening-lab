---
- name: CIS 7.2.3 | Verification | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_2_3_passwd_groups_exist/verification.yml
  vars: {cis_linux_common_control_id: "7.2.3", cis_linux_common_platform: debian_12, cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0, cis_linux_common_account_check: groups_exist, cis_linux_common_account_command: 'for g in $(awk -F: ''{print $4}'' /etc/passwd | tr '','' ''\n'' | sort -u); do getent group $g >/dev/null || echo $g; done'}
