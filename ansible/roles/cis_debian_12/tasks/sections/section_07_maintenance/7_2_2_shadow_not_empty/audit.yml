---
- name: CIS 7.2.2 | Audit | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_2_2_shadow_not_empty/audit.yml
  vars: {cis_linux_common_control_id: "7.2.2", cis_linux_common_platform: debian_12, cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0, cis_linux_common_account_check: shadow_empty, cis_linux_common_account_command: 'awk -F: ''($2 == "") {print $1}'' /etc/shadow'}
