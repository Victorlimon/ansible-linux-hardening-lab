---
- name: CIS 7.2.7 | Remediation | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_2_7_no_duplicate_users/remediation.yml
  vars: {cis_linux_common_control_id: "7.2.7", cis_linux_common_platform: debian_12, cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0, cis_linux_common_account_check: dup_user, cis_linux_common_account_command: 'cut -d: -f1 /etc/passwd | sort | uniq -d'}
