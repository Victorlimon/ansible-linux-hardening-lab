---
- name: CIS 5.4.1.2 | Verify | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_1_2_min_password_days/verification.yml
  vars: {cis_linux_common_control_id: '5.4.1.2', cis_linux_common_platform: debian_12, cis_linux_common_benchmark: 'CIS Debian Linux 12 Benchmark v1.1.0', cis_linux_common_config_line_path: '/etc/login.defs', cis_linux_common_config_line_package: 'login', cis_linux_common_config_line_regexp: '^\s*PASS_MIN_DAYS\s+[1-9]'}
