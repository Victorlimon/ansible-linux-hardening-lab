---
- name: CIS 5.4.1.6 | Remediation | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_1_6_last_password_change/remediation.yml
  vars: {cis_linux_common_control_id: "5.4.1.6", cis_linux_common_platform: debian_12, cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0, cis_linux_common_account_check: last_change, cis_linux_common_account_command: 'for u in $(awk -F: ''$3>=1000 && $7 !~ /nologin|false/ {print $1}'' /etc/passwd); do chage -l $u 2>/dev/null | grep -q ''password must be changed'' && echo $u; done'}
