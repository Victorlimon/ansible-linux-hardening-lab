---
- name: CIS 5.4.1.5 | Verification | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_1_5_inactive_password_lock/verification.yml
  vars: {cis_linux_common_control_id: "5.4.1.5", cis_linux_common_platform: debian_12, cis_linux_common_benchmark: CIS Debian Linux 12 Benchmark v1.1.0, cis_linux_common_account_check: inactive_lock, cis_linux_common_account_command: 'useradd -D | grep -qE ''^INACTIVE=([0-9]|[1-3][0-9]|4[0-5])'' || echo missing'}
