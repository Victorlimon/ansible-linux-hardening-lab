---
- name: Validate the Debian 12 adapter target
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '12'
    fail_msg: >-
      The cis_debian_12 adapter supports Debian 12 only; detected
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
  tags: [always, cis_debian_12, platform]

- name: Validate the Debian 12 execution mode
  ansible.builtin.assert:
    that:
      - cis_debian_12_execution_mode in ['audit', 'remediation', 'verification']
      - >-
        not (cis_debian_12_remediation_enabled | bool) or
        cis_debian_12_execution_mode == 'remediation'
      - >-
        not (cis_debian_12_remediation_enabled | bool) or
        cis_debian_12_canary_confirmed | bool
    fail_msg: >-
      Debian remediation requires execution_mode=remediation,
      cis_debian_12_remediation_enabled=true and
      cis_debian_12_canary_confirmed=true.
  tags: [always, cis_debian_12, safety]

- name: Audit Debian 12 network applicability controls
  ansible.builtin.import_tasks: audit/3_1_1_identify_ipv6.yml
  when:
    - cis_debian_12_execution_mode == 'audit'
    - cis_debian_12_3_1_1_ipv6_audit | bool
  tags:
    - cis_debian_12
    - cis_debian_12_audit
    - cis_3
    - cis_3_1
    - cis_3_1_1
    - network
    - ipv6
    - ipv6_audit
    - level_1

- name: Verify Debian 12 CIS 3.1.1
  ansible.builtin.import_tasks: verification/3_1_1_identify_ipv6.yml
  when:
    - cis_debian_12_execution_mode == 'verification'
    - cis_debian_12_3_1_1_ipv6_audit | bool
  tags:
    - cis_debian_12
    - cis_debian_12_verification
    - cis_3
    - cis_3_1
    - cis_3_1_1
    - network
    - ipv6
    - ipv6_audit
    - level_1

- name: Audit Debian 12 CIS 3.3.10
  ansible.builtin.import_tasks: audit/3_3_10_tcp_syncookies.yml
  when:
    - cis_debian_12_execution_mode == 'audit'
    - cis_debian_12_3_3_10_tcp_syncookies | bool
  tags:
    - cis_debian_12
    - cis_debian_12_audit
    - cis_3
    - cis_3_3
    - cis_3_3_10
    - network
    - sysctl
    - tcp_syncookies
    - level_1

- name: Remediate Debian 12 CIS 3.3.10
  ansible.builtin.import_tasks: remediation/3_3_10_tcp_syncookies.yml
  when:
    - cis_debian_12_execution_mode == 'remediation'
    - cis_debian_12_remediation_enabled | bool
    - cis_debian_12_3_3_10_tcp_syncookies | bool
  tags:
    - cis_debian_12
    - cis_debian_12_remediation
    - cis_3
    - cis_3_3
    - cis_3_3_10
    - network
    - sysctl
    - tcp_syncookies
    - level_1

- name: Verify Debian 12 CIS 3.3.10
  ansible.builtin.import_tasks: verification/3_3_10_tcp_syncookies.yml
  when:
    - cis_debian_12_execution_mode == 'verification'
    - cis_debian_12_3_3_10_tcp_syncookies | bool
  tags:
    - cis_debian_12
    - cis_debian_12_verification
    - cis_3
    - cis_3_3
    - cis_3_3_10
    - network
    - sysctl
    - tcp_syncookies
    - level_1

