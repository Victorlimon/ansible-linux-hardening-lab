---
- name: Common bootloader password | Fail if no password hash supplied
  ansible.builtin.fail:
    msg: "cis_linux_common_grub_password must be a pbkdf2 hash generated by grub-mkpasswd-pbkdf2"
  when: (cis_linux_common_grub_password | default('')) == ''

- name: Common bootloader password | Set grub superuser password
  ansible.builtin.lineinfile:
    path: /etc/grub.d/40_custom
    line: 'set superusers="root"'
    create: true
    mode: '0755'

- name: Common bootloader password | Set pbkdf2 password line
  ansible.builtin.lineinfile:
    path: /etc/grub.d/40_custom
    line: 'password_pbkdf2 root {{ cis_linux_common_grub_password }}'
    regexp: '^password_pbkdf2 root '

- name: Common bootloader password | Regenerate grub config
  ansible.builtin.command: update-grub
  changed_when: true
