---
- name: Common disabled service | Gather package and service facts
  ansible.builtin.package_facts:
    manager: auto

- name: Common disabled service | Gather service facts
  ansible.builtin.service_facts:
  when: cis_linux_common_service_package in ansible_facts.packages

- name: Common disabled service | Stop and mask service
  ansible.builtin.systemd:
    name: "{{ cis_linux_common_service_name }}"
    state: stopped
    enabled: false
    masked: true
  when:
    - cis_linux_common_service_package in ansible_facts.packages
    - cis_linux_common_service_name in ansible_facts.services
