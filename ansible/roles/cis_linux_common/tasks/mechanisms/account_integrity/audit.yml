---
- name: Common account integrity | Run parameterized check
  ansible.builtin.shell: "{{ cis_linux_common_account_command }}"
  register: cis_acct
  changed_when: false
  failed_when: false

- name: Common account integrity | Classify
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      check: "{{ cis_linux_common_account_check }}"
      classification: "{{ 'PASS' if (cis_acct.stdout | trim) == '' else 'FAIL' }}"
      changed_target: false
