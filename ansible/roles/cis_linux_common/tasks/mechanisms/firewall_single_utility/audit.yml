---
- name: Common single firewall | Gather utility paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ cis_linux_common_firewall_utilities }}"
  register: cis_linux_common_firewall_utility_paths

- name: Common single firewall | Check enabled services
  ansible.builtin.command:
    argv: [systemctl, is-enabled, --quiet, "{{ item.0.service }}"]
  loop: "{{ cis_linux_common_firewall_utilities | zip(cis_linux_common_firewall_utility_paths.results) }}"
  register: cis_linux_common_firewall_enabled
  when: item.1.stat.exists
  changed_when: false
  failed_when: false
  check_mode: false

- name: Common single firewall | Check active services
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, "{{ item.0.service }}"]
  loop: "{{ cis_linux_common_firewall_utilities | zip(cis_linux_common_firewall_utility_paths.results) }}"
  register: cis_linux_common_firewall_active
  when: item.1.stat.exists
  changed_when: false
  failed_when: false
  check_mode: false

- name: Common single firewall | Initialize active utilities
  ansible.builtin.set_fact:
    cis_linux_common_active_firewall_utilities: []

- name: Common single firewall | Select enabled and active utilities
  ansible.builtin.set_fact:
    cis_linux_common_active_firewall_utilities: >-
      {{ cis_linux_common_active_firewall_utilities + [cis_linux_common_firewall_utilities[item].name] }}
  loop: "{{ range(cis_linux_common_firewall_utilities | length) | list }}"
  when:
    - cis_linux_common_firewall_utility_paths.results[item].stat.exists
    - cis_linux_common_firewall_enabled.results[item].rc | default(1) == 0
    - cis_linux_common_firewall_active.results[item].rc | default(1) == 0

- name: Common single firewall | Report utility state
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      active_utilities: "{{ cis_linux_common_active_firewall_utilities }}"
      classification: >-
        {{ 'PASS' if cis_linux_common_active_firewall_utilities | length == 1 else 'FAIL' }}
      changed_target: false
