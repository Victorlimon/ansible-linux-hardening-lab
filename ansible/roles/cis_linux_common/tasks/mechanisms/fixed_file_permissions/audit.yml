---
- name: Common fixed file permissions | Load audit contract
  ansible.builtin.import_tasks: mechanisms/fixed_file_permissions/validate.yml

- name: Common fixed file permissions | Discover every benchmark target
  ansible.builtin.import_tasks: mechanisms/fixed_file_permissions/discover.yml

- name: Common fixed file permissions | Evaluate every benchmark target
  ansible.builtin.import_tasks: mechanisms/fixed_file_permissions/evaluate.yml

- name: Common fixed file permissions | Classify observed metadata
  ansible.builtin.set_fact:
    cis_linux_common_fixed_file_audit_compliant: "{{ cis_linux_common_fixed_file_compliant }}"

- name: Common fixed file permissions | Report observed metadata
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      benchmark: "{{ cis_linux_common_benchmark }}"
      classification: "{{ 'PASS' if cis_linux_common_fixed_file_compliant else 'FAIL' }}"
      expected:
        scopes: >-
          {{ cis_linux_common_fixed_file_plan.scopes
             | map(attribute='label') | list }}
        literals: >-
          {{ cis_linux_common_fixed_file_plan.scopes
             | map(attribute='literals') | flatten | list }}
        searches: "{{ cis_linux_common_fixed_file_plan.search_specs }}"
        owner: "{{ cis_linux_common_fixed_file_owner }}"
        group: >-
          {{ cis_linux_common_fixed_file_allowed_groups
             | default([cis_linux_common_fixed_file_group])
             if cis_linux_common_fixed_file_enforce_group | default(true)
             else 'not constrained' }}
        mode: "{{ cis_linux_common_fixed_file_expected_mode_description }}"
      observed:
        checked: "{{ cis_linux_common_fixed_file_checked }}"
        non_compliant_count: "{{ cis_linux_common_fixed_file_violations | length }}"
        violations: "{{ cis_linux_common_fixed_file_violations }}"
      changed_target: false
