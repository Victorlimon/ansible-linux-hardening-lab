---
- name: Common fixed file permissions | Load verification contract
  ansible.builtin.import_tasks: mechanisms/fixed_file_permissions/validate.yml

- name: Common fixed file permissions | Discover every benchmark target
  ansible.builtin.import_tasks: mechanisms/fixed_file_permissions/discover.yml

- name: Common fixed file permissions | Evaluate every benchmark target
  ansible.builtin.import_tasks: mechanisms/fixed_file_permissions/evaluate.yml

- name: Common fixed file permissions | Assert declared metadata
  ansible.builtin.assert:
    that:
      - cis_linux_common_fixed_file_compliant
    fail_msg: >-
      {{ 'The fixed-file set does not satisfy the platform adapter contract: '
         ~ (cis_linux_common_fixed_file_violations
            | map(attribute='path') | join(', '))
         ~ ' [' ~ (cis_linux_common_fixed_file_violations
                   | map(attribute='reasons') | map('join', '; ') | join(' | ')) ~ ']' }}
    success_msg: >-
      {{ 'The fixed-file verification passed for '
         ~ cis_linux_common_fixed_file_checked ~ ' target(s).' }}
