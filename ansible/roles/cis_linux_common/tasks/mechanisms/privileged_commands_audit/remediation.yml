---
# CIS privileged-commands audit mechanism remediation.
#
# Mirrors the benchmark remediation exactly: enumerate the setuid/setgid files
# over the traversable partitions, generate the canonical rule set into
# /etc/audit/rules.d/50-privileged.rules, then `augenrules --load`. Two
# deliberate deviations, both fail-closed:
#   * the owned file is written as the EXACT generated set (plus header),
#     not the benchmark's merge-with-old example, so stale privileged rules
#     are removed and the verifier can demand "no stale rules";
#   * the load is skipped while the audit configuration is immutable
#     (`auditctl -s` -> `enabled 2`): augenrules cannot change the running set
#     then and only warns silently per the benchmark, so the rules stay on
#     disk for the next boot and the report says "reboot required".
#
# Ordering: this control runs before 6.2.3.20 (the `-e 2` immutable control,
# written to 99-finalize.rules and applied by auditd at boot). augenrules
# merges every rules.d fragment in priority order, so rules from all
# previously remediated controls are in place when this load happens; if a
# locked (-e 2) runtime already exists, the skip above protects it.
#
# Opt-in is enforced upstream by the platform routing: <control> and
# <control>_remediate (default false) plus the global remediation gate.

- name: Common privileged commands remediation | Inspect benchmark state
  ansible.builtin.import_tasks: mechanisms/privileged_commands_audit/discover.yml
  vars:
    cis_linux_common_privileged_emit_rules: "1"

- name: Common privileged commands remediation | Fail closed on unreadable state
  ansible.builtin.assert:
    that:
      - cis_linux_common_privileged_required == 'no' or cis_linux_common_privileged_readable == 'yes'
    fail_msg: >-
      Refusing to write {{ cis_linux_common_privileged_rules_path }}: the privileged
      command set or the current rule state could not be read. Evidence={{
      cis_linux_common_privileged_evidence[:25] }}.
    success_msg: Privileged command enumeration readable; writing the rules file.

- name: Common privileged commands remediation | Write the exact benchmark rule set
  ansible.builtin.copy:
    dest: "{{ cis_linux_common_privileged_rules_path }}"
    owner: root
    group: root
    mode: "0640"
    content: |
      # CIS {{ cis_linux_common_control_id }} - privileged commands (setuid/setgid) audit rules.
      # Generated by the cis_linux_common privileged_commands_audit mechanism. The verifier
      # requires this file to contain exactly the current privileged set: no missing rules,
      # no stale or extra lines (comments and blank lines excepted).
      {% for rule in cis_linux_common_privileged_generated %}
      {{ rule }}
      {% endfor %}
  become: true
  register: cis_linux_common_privileged_file
  when: cis_linux_common_privileged_required == 'yes'

- name: Common privileged commands remediation | Merge and load rules with augenrules
  ansible.builtin.command:
    cmd: augenrules --load
  become: true
  changed_when: true
  register: cis_linux_common_privileged_load
  when:
    - cis_linux_common_privileged_required == 'yes'
    - not ansible_check_mode
    - cis_linux_common_privileged_immutable == 'no'
    - >-
        (cis_linux_common_privileged_file.changed | default(false))
        or (cis_linux_common_privileged_missing_running | int > 0)

- name: Common privileged commands remediation | Report load outcome
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      rules_file: "{{ cis_linux_common_privileged_rules_path }}"
      generated_rules: "{{ cis_linux_common_privileged_generated | length }}"
      file_changed: "{{ cis_linux_common_privileged_file.changed | default(false) }}"
      immutable: "{{ cis_linux_common_privileged_immutable }}"
      # A skipped task registers {'skipped': true}; an executed result has no
      # 'skipped' key at all, so the default must be false.
      load_executed: "{{ not (cis_linux_common_privileged_load.skipped | default(false)) }}"
      note: >-
        {{ 'audit configuration is immutable (-e 2): rules are on disk, a reboot is '
           'required to load them (benchmark Additional Information)'
           if cis_linux_common_privileged_immutable == 'yes'
           else 'augenrules --load merges every /etc/audit/rules.d fragment in priority order' }}
