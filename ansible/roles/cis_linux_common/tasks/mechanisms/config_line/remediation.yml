---
- name: Common config line | Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Common config line | Inspect existing configuration file
  ansible.builtin.stat:
    path: "{{ cis_linux_common_config_line_path }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: cis_linux_common_config_line_stat
  when: cis_linux_common_config_line_package in ansible_facts.packages

- name: Common config line | Set authorized configuration line
  ansible.builtin.lineinfile:
    path: "{{ cis_linux_common_config_line_path }}"
    regexp: "{{ cis_linux_common_config_line_regexp }}"
    line: "{{ cis_linux_common_config_line }}"
    create: true
    owner: root
    group: root
    mode: "{{ '0440' if cis_linux_common_config_line_path == '/etc/sudoers' or cis_linux_common_config_line_path.startswith('/etc/sudoers.d/') else (omit if cis_linux_common_config_line_stat.stat.exists else '0644') }}"
    validate: "{{ '/usr/sbin/visudo -cf %s' if cis_linux_common_config_line_path == '/etc/sudoers' or cis_linux_common_config_line_path.startswith('/etc/sudoers.d/') else omit }}"
  when: cis_linux_common_config_line_package in ansible_facts.packages
