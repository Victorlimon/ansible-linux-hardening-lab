---
- name: Common pwhistory parameter | Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Common pwhistory parameter | Delegate to shared stack inspection
  ansible.builtin.import_tasks: mechanisms/pam_pwhistory_stack/inspect.yml

- name: Common pwhistory parameter | Compute parameter evidence
  ansible.builtin.import_tasks: mechanisms/pwhistory_parameter/evaluate.yml

- name: Common pwhistory parameter | Report parameter state
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      classification: >-
        {{ 'NOT_APPLICABLE' if cis_linux_common_pwhistory_package not in ansible_facts.packages else
           ('PASS' if cis_linux_common_pwhistory_parameter_ok else 'FAIL') }}
      changed_target: false
      evidence:
        named_lines: "{{ cis_linux_common_pwhistory_param_named_count }}"
        compliant_lines: "{{ cis_linux_common_pwhistory_param_compliant_count }}"
        pwhistory_password_lines: "{{ cis_linux_common_pwhistory_line_total }}"
        inline_override_files: "{{ cis_linux_common_pwhistory_override_files }}"
        unreadable_files: "{{ cis_linux_common_pwhistory_unreadable_files }}"
