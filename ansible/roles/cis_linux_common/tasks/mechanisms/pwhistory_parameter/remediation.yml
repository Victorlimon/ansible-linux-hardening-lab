---
# CIS 5.3.3.3.1-.3 dedicated remediation: the pam_pwhistory arguments are
# inseparable parts of the single canonical line owned by the
# /usr/share/pam-configs/pwhistory profile (the same profile 5.3.2.4 owns).
# Establishing one parameter therefore establishes the whole canonical line,
# so the remediation imports the pam_pwhistory_stack remediation — the only
# place the profile content is defined — and then proves the parameter
# evidence itself. The generated /etc/pam.d/common-password is never edited
# directly and any inline-override variant fails closed with evidence.

- name: Common pwhistory parameter | Establish the canonical profile line
  ansible.builtin.import_tasks: mechanisms/pam_pwhistory_stack/remediation.yml

- name: Common pwhistory parameter | Compute post-remediation evidence
  ansible.builtin.import_tasks: mechanisms/pwhistory_parameter/evaluate.yml

# In check mode the remediation above is only simulated, so the
# post-remediation state cannot be asserted; verify/ playbooks and real
# runs still assert it.
- name: Common pwhistory parameter | Verify the remediated parameter
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - cis_linux_common_pwhistory_package not in ansible_facts.packages or
        cis_linux_common_pwhistory_parameter_ok
    fail_msg: >-
      {{ cis_linux_common_pwhistory_param }} could not be established on the
      canonical pam_pwhistory profile line:
      named_lines={{ cis_linux_common_pwhistory_param_named_count }},
      compliant_lines={{ cis_linux_common_pwhistory_param_compliant_count }},
      inline_override_files={{ cis_linux_common_pwhistory_override_files }},
      unreadable_files={{ cis_linux_common_pwhistory_unreadable_files }}.
      Duplicate or malformed pam_pwhistory lines require manual consolidation
      into /usr/share/pam-configs/pwhistory.
    success_msg: "Pwhistory parameter remediation verified: {{ cis_linux_common_pwhistory_param }}"
