---
- name: Common UFW rule | Read effective rules
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  register: cis_linux_common_ufw_rule_status
  changed_when: false
  failed_when: false

- name: Common UFW rule | Report rule state
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      classification: "{{ 'PASS' if cis_linux_common_ufw_rule_status.stdout is search(cis_linux_common_ufw_rule_match) else 'FAIL' }}"
      changed_target: false
