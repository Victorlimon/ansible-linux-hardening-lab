---
- name: Common allow-deny restriction | Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Common allow-deny restriction | Create authorized-users allow file
  ansible.builtin.copy:
    dest: "{{ cis_linux_common_allow_path }}"
    content: ''
    force: false
    owner: root
    group: root
    mode: '0600'
  register: cis_linux_common_allow_file_created
  when: cis_linux_common_restriction_package in ansible_facts.packages

# The copy above never touches an existing file (force: false keeps its
# authorized user list), so ownership and mode are enforced separately.
# In check mode a file the copy would create does not exist yet; the copy
# already reports the change, so this task only runs for existing files.
- name: Common allow-deny restriction | Enforce allow file ownership and mode
  ansible.builtin.file:
    path: "{{ cis_linux_common_allow_path }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - cis_linux_common_restriction_package in ansible_facts.packages
    - not (ansible_check_mode and cis_linux_common_allow_file_created is changed)

- name: Common allow-deny restriction | Remove deny file
  ansible.builtin.file:
    path: "{{ cis_linux_common_deny_path }}"
    state: absent
  when: cis_linux_common_restriction_package in ansible_facts.packages
