---
- name: Common UFW policy | Read effective policy
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  register: cis_linux_common_ufw_policy_status
  changed_when: false
  failed_when: false

- name: Common UFW policy | Report policy state
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      classification: >-
        {{ 'PASS' if cis_linux_common_ufw_policy_status.rc == 0 and
           ((cis_linux_common_ufw_policy_status.stdout | default('')) is search(cis_linux_common_ufw_policy_match)) else 'FAIL' }}
      changed_target: false
