---
- name: Common enabled service | Gather package and service facts
  ansible.builtin.package_facts:
    manager: auto

- name: Common enabled service | Check enablement
  ansible.builtin.command:
    argv: [systemctl, is-enabled, --quiet, "{{ cis_linux_common_service_name }}"]
  register: cis_linux_common_service_enabled
  when: cis_linux_common_service_package in ansible_facts.packages
  changed_when: false
  failed_when: false
  check_mode: false

- name: Common enabled service | Check activity
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, "{{ cis_linux_common_service_name }}"]
  register: cis_linux_common_service_active
  when: cis_linux_common_service_package in ansible_facts.packages
  changed_when: false
  failed_when: false
  check_mode: false

- name: Common enabled service | Verify service state
  ansible.builtin.assert:
    that:
      - cis_linux_common_service_package not in ansible_facts.packages or
        (cis_linux_common_service_enabled.rc == 0 and
         cis_linux_common_service_active.rc == 0)
    fail_msg: The service is not enabled and running.
    success_msg: The service verification passed.
