---
- name: Common orphan files | Reassign orphaned files to root
  ansible.builtin.shell: |
    if df --local -P | awk 'NR>1 {print $6}' | xargs -I '{}' find '{}' -xdev \( -nouser -o -nogroup \) -print -quit 2>/dev/null | grep -q .; then
      df --local -P | awk 'NR>1 {print $6}' | xargs -I '{}' find '{}' -xdev \( -nouser -o -nogroup \) -print0 2>/dev/null | xargs -0 -r chown root:root
      echo CHANGED
    fi
  register: cis_linux_common_orphan_remediation
  changed_when: "'CHANGED' in cis_linux_common_orphan_remediation.stdout_lines"
