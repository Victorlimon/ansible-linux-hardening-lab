---
- name: Common orphan files | Enumerate files without owner or group
  ansible.builtin.shell: |
    df --local -P | awk 'NR>1 {print $6}' | xargs -I '{}' find '{}' -xdev \( -nouser -o -nogroup \) 2>/dev/null
  register: cis_orphan
  changed_when: false
  failed_when: false

- name: Common orphan files | Classify
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      classification: "{{ 'PASS' if (cis_orphan.stdout | trim) == '' else 'FAIL' }}"
      changed_target: false
