---
- name: Common AIDE crypto | Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Common AIDE crypto | Read the audit-tool crypto rules
  ansible.builtin.slurp:
    src: /etc/aide/aide.conf.d/50-audit-tools.conf
  register: cis_linux_common_aide_crypto_file
  failed_when: false
  when: '"aide" in ansible_facts.packages'

- name: Common AIDE crypto | Report crypto state
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      classification: >-
        {{ 'NOT_APPLICABLE' if 'aide' not in ansible_facts.packages else
           ('PASS' if ((cis_linux_common_aide_crypto_file.content | default('') | b64decode)
                       is search('sha512')
                       and (cis_linux_common_aide_crypto_file.content | default('') | b64decode)
                       is search('acl')
                       and (cis_linux_common_aide_crypto_file.content | default('') | b64decode)
                       is search('xattrs'))
            else 'FAIL') }}
      changed_target: false
