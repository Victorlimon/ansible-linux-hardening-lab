---
- name: Common AIDE scheduled | Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Common AIDE scheduled | Unmask the AIDE check timer and service
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: false
  loop:
    - dailyaidecheck.timer
    - dailyaidecheck.service
  when: '"aide-common" in ansible_facts.packages'

- name: Common AIDE scheduled | Enable and start the AIDE check timer
  ansible.builtin.systemd:
    name: dailyaidecheck.timer
    enabled: true
    state: started
  when: '"aide-common" in ansible_facts.packages'
