---
- name: CIS 6.1.2.1.3 | Audit | Check configured upload service
  ansible.builtin.import_tasks: mechanisms/service_enabled/audit.yml
  when: cis_linux_common_journal_upload_url | length > 0

- name: CIS 6.1.2.1.3 | Audit | Gather package facts without a destination
  ansible.builtin.package_facts:
    manager: auto
  when: cis_linux_common_journal_upload_url | length == 0

- name: CIS 6.1.2.1.3 | Audit | Gather upload service facts without a destination
  ansible.builtin.service_facts:
  when:
    - cis_linux_common_journal_upload_url | length == 0
    - cis_linux_common_service_package in ansible_facts.packages

- name: CIS 6.1.2.1.3 | Audit | Inspect failed unconfigured upload unit
  ansible.builtin.command:
    argv: [systemctl, is-failed, --quiet, "{{ cis_linux_common_service_name }}"]
  register: cis_linux_common_journal_upload_failed
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cis_linux_common_journal_upload_url | length == 0
    - cis_linux_common_service_package in ansible_facts.packages
    - cis_linux_common_service_name in (ansible_facts.services | default({}))

- name: CIS 6.1.2.1.3 | Audit | Report unconfigured upload as not applicable
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      classification: >-
        {{ 'FAIL' if (cis_linux_common_journal_upload_failed.rc | default(1)) == 0 or
           (cis_linux_common_service_name in (ansible_facts.services | default({})) and
            (ansible_facts.services[cis_linux_common_service_name].state == 'running' or
             ansible_facts.services[cis_linux_common_service_name].status == 'enabled')) else 'NOT_APPLICABLE' }}
      changed_target: false
  when: cis_linux_common_journal_upload_url | length == 0
