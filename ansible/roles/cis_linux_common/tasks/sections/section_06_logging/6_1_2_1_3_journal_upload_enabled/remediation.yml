---
- name: CIS 6.1.2.1.3 | Remediation | Validate the explicit upload destination
  ansible.builtin.assert:
    that:
      - cis_linux_common_journal_upload_url is string
      - cis_linux_common_journal_upload_url == cis_linux_common_journal_upload_url | trim
      - cis_linux_common_journal_upload_url is not search('\\s')
      - cis_linux_common_journal_upload_url | urlsplit('scheme') == 'https'
      - cis_linux_common_journal_upload_url | urlsplit('hostname') | default('', true) | length > 0
      - cis_linux_common_journal_upload_url | urlsplit('username') is none
      - cis_linux_common_journal_upload_url | urlsplit('password') is none
      - cis_linux_common_journal_upload_url | urlsplit('fragment') | length == 0
    fail_msg: Journal upload requires an explicit HTTPS URL without credentials or whitespace.
  when: cis_linux_common_journal_upload_url | length > 0

- name: CIS 6.1.2.1.3 | Remediation | Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  when: cis_linux_common_journal_upload_url | length > 0

- name: CIS 6.1.2.1.3 | Remediation | Configure the upload destination
  ansible.builtin.lineinfile:
    path: /etc/systemd/journal-upload.conf
    regexp: '^\s*#?\s*URL\s*='
    insertafter: '^\[Upload\]$'
    line: "URL={{ cis_linux_common_journal_upload_url }}"
    create: false
    owner: root
    group: root
    mode: '0644'
  register: cis_linux_common_journal_upload_config
  when:
    - cis_linux_common_journal_upload_url | length > 0
    - cis_linux_common_service_package in ansible_facts.packages

- name: CIS 6.1.2.1.3 | Remediation | Enable upload with a destination
  ansible.builtin.import_tasks: mechanisms/service_enabled/remediation.yml
  when: cis_linux_common_journal_upload_url | length > 0

- name: CIS 6.1.2.1.3 | Remediation | Restart after destination changes
  ansible.builtin.systemd:
    name: "{{ cis_linux_common_service_name }}"
    state: restarted
  when:
    - cis_linux_common_journal_upload_url | length > 0
    - cis_linux_common_journal_upload_config is changed

- name: CIS 6.1.2.1.3 | Remediation | Keep unconfigured upload disabled
  ansible.builtin.import_tasks: mechanisms/service_disabled/remediation.yml
  when: cis_linux_common_journal_upload_url | length == 0

- name: CIS 6.1.2.1.3 | Remediation | Inspect failed unconfigured upload unit
  ansible.builtin.command:
    argv: [systemctl, is-failed, --quiet, "{{ cis_linux_common_service_name }}"]
  register: cis_linux_common_journal_upload_failed
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cis_linux_common_journal_upload_url | length == 0
    - cis_linux_common_service_package in ansible_facts.packages
    - cis_linux_common_service_name in (ansible_facts.services | default({}))

- name: CIS 6.1.2.1.3 | Remediation | Clear stale failed upload state
  ansible.builtin.command:
    argv: [systemctl, reset-failed, "{{ cis_linux_common_service_name }}"]
  when:
    - not ansible_check_mode
    - cis_linux_common_journal_upload_url | length == 0
    - cis_linux_common_service_package in ansible_facts.packages
    - cis_linux_common_service_name in (ansible_facts.services | default({}))
    - cis_linux_common_journal_upload_failed.rc == 0
