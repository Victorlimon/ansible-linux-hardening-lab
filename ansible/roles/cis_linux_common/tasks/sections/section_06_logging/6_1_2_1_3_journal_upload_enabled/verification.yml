---
- name: CIS 6.1.2.1.3 | Verification | Check configured upload service
  ansible.builtin.import_tasks: mechanisms/service_enabled/verification.yml
  when: cis_linux_common_journal_upload_url | length > 0

- name: CIS 6.1.2.1.3 | Verification | Check unconfigured upload is disabled
  ansible.builtin.import_tasks: mechanisms/service_disabled/verification.yml
  when: cis_linux_common_journal_upload_url | length == 0

- name: CIS 6.1.2.1.3 | Verification | Inspect failed unconfigured upload unit
  ansible.builtin.command:
    argv: [systemctl, is-failed, --quiet, "{{ cis_linux_common_service_name }}"]
  register: cis_linux_common_journal_upload_failed
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cis_linux_common_journal_upload_url | length == 0
    - cis_linux_common_service_package in ansible_facts.packages
    - cis_linux_common_service_name in (ansible_facts.services | default({}))

- name: CIS 6.1.2.1.3 | Verification | Reject failed unconfigured upload unit
  ansible.builtin.assert:
    that:
      - cis_linux_common_journal_upload_failed.rc != 0
    fail_msg: Unconfigured journal upload remains in a failed systemd state.
  when:
    - cis_linux_common_journal_upload_url | length == 0
    - cis_linux_common_service_package in ansible_facts.packages
    - cis_linux_common_service_name in (ansible_facts.services | default({}))
