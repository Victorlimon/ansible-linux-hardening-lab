---
- name: CIS 6.1.4.1 | Remediation | Cover every logfile discovered under /var/log
  ansible.builtin.include_tasks:
    file: mechanisms/fixed_file_permissions/remediation.yml
    apply:
      tags: always

# The sysstat sa1/sa2 scripts default to UMASK=0022 (world-readable sarDD/saDD
# files), which CIS 6.1.4.1 rejects. Restrict the producer so future files are
# 0640 instead of 0644; existing files are corrected by the mechanism above.
- name: CIS 6.1.4.1 | Remediation | Gather package facts for producer config
  ansible.builtin.package_facts:
    manager: auto

- name: CIS 6.1.4.1 | Remediation | Restrict sysstat log umask to 0027
  ansible.builtin.lineinfile:
    path: /etc/sysstat/sysstat
    regexp: '^\s*UMASK='
    line: 'UMASK=0027'
    backup: true
  when: '"sysstat" in ansible_facts.packages'
