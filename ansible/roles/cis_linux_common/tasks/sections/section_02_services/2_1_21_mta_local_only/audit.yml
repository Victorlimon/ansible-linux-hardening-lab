---
# CIS 2.1.21 routes by the installed MTA, mirroring the benchmark: the
# remediation is designed around postfix (`inet_interfaces = loopback-only`),
# a host whose MTA is exim4 instead gets NOT_APPLICABLE per the benchmark
# note ("consult the documentation for your installed MTA"), and a host with
# no MTA at all matches the benchmark's "- MTA not detected or in use"
# passing branch. The postfix audit requires a loopback value instead of any
# inet_interfaces line (the previous regexp accepted `inet_interfaces = all`).
- name: CIS 2.1.21 | Audit | Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: CIS 2.1.21 | Audit | Route by installed MTA
  ansible.builtin.set_fact:
    cis_2_1_21_postfix: "{{ 'postfix' in ansible_facts.packages }}"
    cis_2_1_21_exim4: "{{ 'exim4' in ansible_facts.packages or 'exim4-base' in ansible_facts.packages }}"

- name: CIS 2.1.21 | Audit | Postfix route through config_line mechanism
  ansible.builtin.import_tasks: mechanisms/config_line/audit.yml
  vars:
    cis_linux_common_config_line_path: /etc/postfix/main.cf
    cis_linux_common_config_line_regexp: '(?i)^\s*inet_interfaces\s*=\s*(loopback-only|127\.0\.0\.1|\[::1\]|::1|localhost)(\s*,\s*(loopback-only|127\.0\.0\.1|\[::1\]|::1|localhost))*\s*$'
    cis_linux_common_config_line: 'inet_interfaces = loopback-only'
    cis_linux_common_config_line_package: postfix
  when: cis_2_1_21_postfix

- name: CIS 2.1.21 | Audit | Non-postfix route classification
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      classification: "{{ 'NOT_APPLICABLE' if cis_2_1_21_exim4 else 'PASS' }}"
      reason: >-
        {{ 'exim4 is the installed MTA; the benchmark remediation is designed around postfix and directs sites to the installed MTA documentation'
           if cis_2_1_21_exim4
           else 'MTA not detected or in use, matching the benchmark audit passing branch' }}
      changed_target: false
  when: not cis_2_1_21_postfix
