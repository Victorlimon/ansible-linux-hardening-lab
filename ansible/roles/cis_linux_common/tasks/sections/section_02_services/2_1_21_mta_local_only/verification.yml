---
# Verification mirrors the audit routing: the postfix route asserts the
# loopback-only inet_interfaces line, while exim4 (NOT_APPLICABLE) and
# absent-MTA (PASS) routes have nothing to assert.
- name: CIS 2.1.21 | Verification | Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: CIS 2.1.21 | Verification | Route by installed MTA
  ansible.builtin.set_fact:
    cis_2_1_21_postfix: "{{ 'postfix' in ansible_facts.packages }}"
    cis_2_1_21_exim4: "{{ 'exim4' in ansible_facts.packages or 'exim4-base' in ansible_facts.packages }}"

- name: CIS 2.1.21 | Verification | Postfix route through config_line mechanism
  ansible.builtin.import_tasks: mechanisms/config_line/verification.yml
  vars:
    cis_linux_common_config_line_path: /etc/postfix/main.cf
    cis_linux_common_config_line_regexp: '(?i)^\s*inet_interfaces\s*=\s*(loopback-only|127\.0\.0\.1|\[::1\]|::1|localhost)(\s*,\s*(loopback-only|127\.0\.0\.1|\[::1\]|::1|localhost))*\s*$'
    cis_linux_common_config_line_package: postfix
  when: cis_2_1_21_postfix

- name: CIS 2.1.21 | Verification | Non-postfix route has no postfix contract to assert
  ansible.builtin.debug:
    msg: >-
      CIS {{ cis_linux_common_control_id }} verification is trivially satisfied on
      {{ 'exim4 (NOT_APPLICABLE per benchmark note)' if cis_2_1_21_exim4 else 'hosts without an installed MTA (PASS)' }}.
  when: not cis_2_1_21_postfix
