---
- name: Pwquality enforcing verification | Delegate to pwquality_parameter
  ansible.builtin.import_tasks: mechanisms/pwquality_parameter/verification.yml
  vars:
    cis_linux_common_pwq_param: enforcing
    cis_linux_common_pwq_kind: not_zero
    cis_linux_common_pwq_line: 'enforcing = 1'
    cis_linux_common_pwq_managed_path: /etc/security/pwquality.conf.d/50-pwenforcing.conf
    cis_linux_common_pwq_name_regex: '(?mi)^[ \t]*enforcing\b.*$'
    cis_linux_common_pwq_value_regex: '(?mi)^[ \t]*enforcing\b.*$'
    cis_linux_common_pwq_forbidden_regex: '(?mi)^[ \t]*enforcing[ \t]*=[ \t]*0\b'
    cis_linux_common_pwq_line_regexp: '(?i)^[ \t]*enforcing\b.*$'
    cis_linux_common_pwq_inline_bad_regex: '(?mi)^[ \t]*password[ \t]+[^#\n\r]+[ \t]+pam_pwquality\.so[ \t]+(?:[^#\n\r]+[ \t]+)?enforcing=0\b'
