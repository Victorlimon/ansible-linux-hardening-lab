---
- {name: 'CIS 5.1.15 | Remediation | Delegate to config-line mechanism', ansible.builtin.import_tasks: mechanisms/config_line/remediation.yml, vars: {cis_linux_common_config_line_regexp: '^MACs\s+', cis_linux_common_config_line: 'MACs -hmac-md5,hmac-md5-96,hmac-ripemd160,hmac-sha1-96,umac-64@openssh.com,hmac-md5-etm@openssh.com,hmac-md5-96-etm@openssh.com,hmac-ripemd160-etm@openssh.com,hmac-sha1-96-etm@openssh.com,umac-64-etm@openssh.com,umac-128-etm@openssh.com'}}
- {name: 'CIS 5.1.15 | Remediation | Restore sshd_config permissions', ansible.builtin.file: {path: '{{ cis_linux_common_config_line_path }}', owner: root, group: root, mode: '0600'}}
