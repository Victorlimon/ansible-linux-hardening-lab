---
- name: CIS 5.1.7 | Verification | Check ClientAliveInterval
  ansible.builtin.import_tasks: mechanisms/config_line/verification.yml
  vars:
    cis_linux_common_config_line_effective_command: 'sshd -T'
    cis_linux_common_config_line_regexp: '^[ \t]*clientaliveinterval[ \t]+[1-9][0-9]*[ \t]*$'
- name: CIS 5.1.7 | Verification | Check ClientAliveCountMax
  ansible.builtin.import_tasks: mechanisms/config_line/verification.yml
  vars:
    cis_linux_common_config_line_effective_command: 'sshd -T'
    cis_linux_common_config_line_regexp: '^[ \t]*clientalivecountmax[ \t]+[1-9][0-9]*[ \t]*$'
