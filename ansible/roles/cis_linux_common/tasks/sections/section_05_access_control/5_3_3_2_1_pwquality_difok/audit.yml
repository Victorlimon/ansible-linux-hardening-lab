---
- name: Pwquality difok audit | Delegate to pwquality_parameter
  ansible.builtin.import_tasks: mechanisms/pwquality_parameter/audit.yml
  vars:
    cis_linux_common_pwq_param: difok
    cis_linux_common_pwq_kind: numeric_min
    cis_linux_common_pwq_line: 'difok = 2'
    cis_linux_common_pwq_managed_path: /etc/security/pwquality.conf.d/50-pwdifok.conf
    cis_linux_common_pwq_name_regex: '(?mi)^[ \t]*difok\b.*$'
    cis_linux_common_pwq_value_regex: '(?mi)^[ \t]*difok[ \t]*=[ \t]*([2-9]|[1-9][0-9]+)\b'
    cis_linux_common_pwq_forbidden_regex: ''
    cis_linux_common_pwq_line_regexp: '(?i)^[ \t]*difok\b.*$'
    cis_linux_common_pwq_inline_bad_regex: '(?mi)^[ \t]*password[ \t]+(requisite|required|sufficient)[ \t]+pam_pwquality\.so[ \t]+(?:[^#\n\r]+[ \t]+)?difok[ \t]*=[ \t]*[01]\b'
