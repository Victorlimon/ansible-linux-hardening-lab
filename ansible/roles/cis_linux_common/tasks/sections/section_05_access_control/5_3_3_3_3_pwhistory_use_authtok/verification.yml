---
- name: Pwhistory use_authtok verification | Delegate to pwhistory_parameter
  ansible.builtin.import_tasks: mechanisms/pwhistory_parameter/verification.yml
  vars:
    cis_linux_common_pwhistory_param: use_authtok
    cis_linux_common_pwhistory_name_regex: '\buse_authtok\b'
    cis_linux_common_pwhistory_value_regex: '^\s*password\s+requisite\s+pam_pwhistory\.so\s+remember=24\s+enforce_for_root\s+try_first_pass\s+use_authtok\s*$'
