---
- name: CIS 5.1.6 | Remediation | Delegate to config-line mechanism
  ansible.builtin.import_tasks: mechanisms/config_line/remediation.yml
  vars: {cis_linux_common_config_line_regexp: '^Ciphers', cis_linux_common_config_line: 'Ciphers -3des-cbc,aes128-cbc,aes192-cbc,aes256-cbc,chacha20-poly1305@openssh.com'}
- name: CIS 5.1.6 | Remediation | Restore sshd_config permissions
  ansible.builtin.file: {path: "{{ cis_linux_common_config_line_path }}", owner: root, group: root, mode: '0600'}
