---
- name: CIS 5.1.6 | Audit | Delegate to config-line mechanism
  ansible.builtin.import_tasks: mechanisms/config_line/audit.yml
  vars:
    cis_linux_common_config_line_effective_command: 'sshd -T'
    cis_linux_common_config_line_regexp: '^[ \t]*ciphers[ \t]+(?!(?:.*\b(?:3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc)\b))[^ \t]+$'
