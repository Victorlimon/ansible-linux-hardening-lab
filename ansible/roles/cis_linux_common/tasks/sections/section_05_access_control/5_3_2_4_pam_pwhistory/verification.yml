---
- name: Config line verification | Delegate to config_line
  ansible.builtin.import_tasks: mechanisms/config_line/verification.yml
  vars:
    cis_linux_common_config_line: 'password required pam_pwhistory.so remember=24'
    cis_linux_common_config_line_regexp: '^password\s+required\s+pam_pwhistory\.so'
