---
- name: Config line verification | Delegate to config_line
  ansible.builtin.import_tasks: mechanisms/config_line/verification.yml
  vars:
    cis_linux_common_config_line: 'auth required pam_wheel.so use_uid'
    cis_linux_common_config_line_regexp: '^auth\s+required\s+pam_wheel\.so\s+use_uid'
