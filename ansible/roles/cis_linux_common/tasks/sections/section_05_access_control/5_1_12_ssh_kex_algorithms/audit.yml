---
- name: CIS 5.1.12 | Audit | Delegate to config-line mechanism
  ansible.builtin.import_tasks: mechanisms/config_line/audit.yml
  vars:
    cis_linux_common_config_line_effective_command: 'sshd -T'
    cis_linux_common_config_line_regexp: '^[ \t]*kexalgorithms[ \t]+(?!(?:.*\b(?:diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1)\b))[^ \t]+$'
