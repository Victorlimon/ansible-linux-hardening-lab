---
- name: CIS 5.1.13 | Audit | Delegate to config-line mechanism
  ansible.builtin.import_tasks: mechanisms/config_line/audit.yml
  vars:
    cis_linux_common_config_line_effective_command: 'sshd -T'
    cis_linux_common_config_line_regexp: '^[ \t]*logingracetime[ \t]+(?:[1-9]|[1-5][0-9]|60)[ \t]*$'
