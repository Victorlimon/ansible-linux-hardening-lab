---
- name: Default umask remediation | Delegate to script_line
  ansible.builtin.import_tasks: mechanisms/script_line/remediation.yml
  vars:
    cis_linux_common_script_required_regexps:
      - '(?im)^[ \t]*umask[ \t]+(0?[0-7][2-7]7|u(=[rwx]{0,3}),g=([rx]{0,2}),o=)([ \t]*#.*)?$'
    cis_linux_common_script_or_regexps:
      - '(?im)^[ \t]*session[ \t]+[^#\n\r]+[ \t]+pam_umask\.so[ \t]+(?:[^#\n\r]+[ \t]+)?umask=(0?[0-7][2-7]7)\b'
    cis_linux_common_script_forbidden_regexps:
      - '(?im)^[ \t]*umask[ \t]+(([0-7][0-7][01][0-7]\b|[0-7][0-7][0-7][0-6]\b)|([0-7][01][0-7]\b|[0-7][0-7][0-6]\b)|(u=[rwx]{1,3},)?(((g=[rx]?[rx]?w[rx]?[rx]?\b)(,o=[rwx]{1,3})?)|((g=[wrx]{1,3},)?o=[wrx]{1,3}\b)))'
    cis_linux_common_script_extra_files:
      - /etc/login.defs
      - /etc/pam.d/postlogin
      - /etc/default/login
    cis_linux_common_script_managed_path: /etc/profile.d/50-systemwide_umask.sh
    cis_linux_common_script_managed_content: |
      umask 027
