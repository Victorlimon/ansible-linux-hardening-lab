---
- name: CIS 5.1.2 | Remediation | Cover every private host key found under /etc/ssh
  ansible.builtin.include_tasks:
    file: mechanisms/fixed_file_permissions/remediation.yml
    apply:
      tags: always
  vars:
    cis_linux_common_fixed_file_search:
      paths: /etc/ssh
      patterns: ssh_host_*_key
      file_type: file
