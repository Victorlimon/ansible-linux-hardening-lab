---
- name: Config line remediation | Delegate to config_line
  ansible.builtin.import_tasks: mechanisms/config_line/remediation.yml
  vars:
    cis_linux_common_config_line: 'auth required pam_faillock.so preauth'
    cis_linux_common_config_line_regexp: '^auth\s+required\s+pam_faillock\.so\s+preauth'
