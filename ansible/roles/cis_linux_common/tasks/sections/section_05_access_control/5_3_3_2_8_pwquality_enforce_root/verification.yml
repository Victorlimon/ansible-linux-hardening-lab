---
- name: Pwquality enforce_for_root verification | Delegate to pwquality_parameter
  ansible.builtin.import_tasks: mechanisms/pwquality_parameter/verification.yml
  vars:
    cis_linux_common_pwq_param: enforce_for_root
    cis_linux_common_pwq_kind: flag
    cis_linux_common_pwq_line: 'enforce_for_root'
    cis_linux_common_pwq_managed_path: /etc/security/pwquality.conf.d/50-pwroot.conf
    cis_linux_common_pwq_name_regex: '(?mi)^[ \t]*enforce_for_root\b.*$'
    cis_linux_common_pwq_value_regex: '(?mi)^[ \t]*enforce_for_root[ \t]*$'
    cis_linux_common_pwq_forbidden_regex: '(?mi)^[ \t]*enforce_for_root[ \t]*=[ \t]*(0|false|no)\b'
    cis_linux_common_pwq_line_regexp: '(?i)^[ \t]*enforce_for_root\b.*$'
    cis_linux_common_pwq_inline_bad_regex: ''
