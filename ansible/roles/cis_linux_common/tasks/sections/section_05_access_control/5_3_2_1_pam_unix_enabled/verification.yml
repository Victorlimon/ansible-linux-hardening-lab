---
# CIS 5.3.2.1 verification accepts both compliant jump renderings:
# [success=1] on the stock stack and [success=2] on a stack hardened by the
# CIS 5.3.2.2 pam_faillock profiles (see remediation.yml for the rationale).
- name: Config line verification | Delegate to config_line
  ansible.builtin.import_tasks: mechanisms/config_line/verification.yml
  vars:
    cis_linux_common_config_line: 'auth [success=2 default=ignore] pam_unix.so nullok try_first_pass'
    cis_linux_common_config_line_regexp: '^auth\s+\[success=[12] default=ignore\]\s+pam_unix\.so'
