---
- name: Kernel module usb-storage | Add install rule
  ansible.builtin.import_tasks: mechanisms/config_line/remediation.yml
  vars:
    cis_linux_common_config_line: "install usb-storage /bin/true"
    cis_linux_common_config_line_regexp: "^install usb-storage /bin/true$"
- name: Kernel module usb-storage | Add blacklist rule
  ansible.builtin.import_tasks: mechanisms/config_line/remediation.yml
  vars:
    cis_linux_common_config_line: "blacklist usb-storage"
    cis_linux_common_config_line_regexp: "^blacklist usb-storage$"
