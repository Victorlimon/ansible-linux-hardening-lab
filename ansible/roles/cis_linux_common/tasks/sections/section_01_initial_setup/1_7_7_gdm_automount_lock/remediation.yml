---
# CIS 1.7.7 remediation: benchmark locks branch — 00-media-automount lock
# file with the automount=false entries the audit greps under
# /etc/dconf/db/local.d/locks/*, then dconf update (inside the shared
# mechanism). No-op while gdm3 is absent; opt-in behind the
# cis_<platform>_1_7_7_gdm_automount_lock_remediate gate (default false).
- name: CIS 1.7.7 | Remediation | Delegate the GDM automount lock artifacts
  ansible.builtin.import_tasks: mechanisms/gdm_configuration/remediation.yml
  vars:
    cis_linux_common_gdm_remediate_files:
      - path: /etc/dconf/db/local.d/locks/00-media-automount
        content: |
          [org/gnome/desktop/media-handling]
          automount=false
          automount-open=false
    cis_linux_common_gdm_remediate_profiles: []
