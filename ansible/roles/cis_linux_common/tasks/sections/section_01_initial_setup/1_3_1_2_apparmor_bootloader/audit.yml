---
- name: CIS 1.3.1.2 | Audit | Check AppArmor boot parameter
  ansible.builtin.import_tasks: mechanisms/grub_boot_parameter/audit.yml
  vars: {cis_linux_common_grub_parameter: apparmor, cis_linux_common_grub_value: '1', cis_linux_common_grub_parameter_regexp: '\bapparmor=1\b'}
- name: CIS 1.3.1.2 | Audit | Check AppArmor security parameter
  ansible.builtin.import_tasks: mechanisms/grub_boot_parameter/audit.yml
  vars: {cis_linux_common_grub_parameter: security, cis_linux_common_grub_value: apparmor, cis_linux_common_grub_parameter_regexp: '\bsecurity=apparmor\b'}
