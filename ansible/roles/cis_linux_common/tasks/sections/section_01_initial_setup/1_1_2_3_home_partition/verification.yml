---
- name: mount_options verification | Delegate to mechanism
  ansible.builtin.import_tasks: mechanisms/mount_options/verification.yml
  vars:
    cis_linux_common_mount_path: /home
    cis_linux_common_mount_unit: home.mount
    cis_linux_common_mount_check: partition
    cis_linux_common_mount_unit_required: 'no'
