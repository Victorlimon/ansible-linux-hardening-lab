---
- name: Kernel module udf | Add install rule
  ansible.builtin.import_tasks: mechanisms/config_line/remediation.yml
  vars:
    cis_linux_common_config_line: "install udf /bin/true"
    cis_linux_common_config_line_regexp: "^install udf /bin/true$"
- name: Kernel module udf | Add blacklist rule
  ansible.builtin.import_tasks: mechanisms/config_line/remediation.yml
  vars:
    cis_linux_common_config_line: "blacklist udf"
    cis_linux_common_config_line_regexp: "^blacklist udf$"
