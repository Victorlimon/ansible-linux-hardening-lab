---
- name: mount_options audit | Delegate to mechanism
  ansible.builtin.import_tasks: mechanisms/mount_options/audit.yml
  vars:
    cis_linux_common_mount_path: /var/tmp
    cis_linux_common_mount_unit: var-tmp.mount
    cis_linux_common_mount_check: nosuid
    cis_linux_common_mount_unit_required: 'no'
