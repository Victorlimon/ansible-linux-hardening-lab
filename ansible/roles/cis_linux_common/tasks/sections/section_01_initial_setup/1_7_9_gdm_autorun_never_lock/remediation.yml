---
# CIS 1.7.9 remediation: benchmark locks branch — 00-media-autorun lock file
# with the autorun-never=true entry the audit greps under
# /etc/dconf/db/local.d/locks/*, then dconf update (inside the shared
# mechanism). No-op while gdm3 is absent; opt-in behind the
# cis_<platform>_1_7_9_gdm_autorun_never_lock_remediate gate (default false).
- name: CIS 1.7.9 | Remediation | Delegate the GDM autorun-never lock artifacts
  ansible.builtin.import_tasks: mechanisms/gdm_configuration/remediation.yml
  vars:
    cis_linux_common_gdm_remediate_files:
      - path: /etc/dconf/db/local.d/locks/00-media-autorun
        content: |
          [org/gnome/desktop/media-handling]
          autorun-never=true
    cis_linux_common_gdm_remediate_profiles: []
