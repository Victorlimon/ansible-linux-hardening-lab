---
- name: Kernel module tipc | Add install rule
  ansible.builtin.import_tasks: mechanisms/config_line/remediation.yml
  vars:
    cis_linux_common_config_line: "install tipc /bin/true"
    cis_linux_common_config_line_regexp: "^install tipc /bin/true$"
- name: Kernel module tipc | Add blacklist rule
  ansible.builtin.import_tasks: mechanisms/config_line/remediation.yml
  vars:
    cis_linux_common_config_line: "blacklist tipc"
    cis_linux_common_config_line_regexp: "^blacklist tipc$"
