---
- name: Common installed-package file | Load audit applicability contract
  ansible.builtin.import_tasks: installed_package_fixed_file/validate.yml

- name: Common installed-package file | Gather packages for audit applicability
  ansible.builtin.package_facts:
    manager: auto

- name: Common installed-package file | Report control as not applicable
  ansible.builtin.debug:
    msg:
      control: "{{ cis_linux_common_control_id }}"
      platform: "{{ cis_linux_common_platform }}"
      benchmark: "{{ cis_linux_common_benchmark }}"
      classification: NOT_APPLICABLE
      reason: "Package {{ cis_linux_common_package_name }} is not installed."
      changed_target: false
  when: cis_linux_common_package_name not in ansible_facts.packages

- name: Common installed-package file | Audit metadata when applicable
  ansible.builtin.import_tasks: fixed_file_permissions/audit.yml
  when: cis_linux_common_package_name in ansible_facts.packages
