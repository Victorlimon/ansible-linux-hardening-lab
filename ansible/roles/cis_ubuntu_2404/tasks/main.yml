---
- name: Validate the Ubuntu 24.04 adapter target and execution mode
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version is version('24.04', '>=')
      - cis_ubuntu_2404_execution_mode in ['audit', 'remediation', 'verification']
    fail_msg: The cis_ubuntu_2404 adapter requires Ubuntu 24.04 and a valid mode.
  tags: [always, cis_ubuntu_2404, platform, safety]

# Adaptador estable de Ubuntu. Mantiene el rol histórico aislado mientras los
# controles compartidos se extraen únicamente después de probar equivalencia.
- name: Run the validated Ubuntu 24.04 benchmark implementation
  ansible.builtin.import_role:
    name: cis_benchmark
  when: cis_ubuntu_2404_execution_mode == 'remediation'

- name: Load Ubuntu CIS 3.1.1 audit adapter
  ansible.builtin.import_tasks: sections/section_03_network/3_1_1_ipv6_status/audit.yml

- name: Load Ubuntu CIS 3.1.1 verification adapter
  ansible.builtin.import_tasks: sections/section_03_network/3_1_1_ipv6_status/verification.yml

- name: Load Ubuntu CIS 3.3.10 audit adapter
  ansible.builtin.import_tasks: sections/section_03_network/3_3_10_tcp_syncookies/audit.yml

- name: Load Ubuntu CIS 3.3.10 remediation adapter
  ansible.builtin.import_tasks: sections/section_03_network/3_3_10_tcp_syncookies/remediation.yml

- name: Load Ubuntu CIS 3.3.10 verification adapter
  ansible.builtin.import_tasks: sections/section_03_network/3_3_10_tcp_syncookies/verification.yml

- name: Load Ubuntu CIS 7.1.1 audit adapter
  ansible.builtin.import_tasks: sections/section_07_maintenance/7_1_1_passwd_permissions/audit.yml

- name: Load Ubuntu CIS 2.4.1.2 audit adapter
  ansible.builtin.import_tasks: sections/section_02_services/2_4_1_2_crontab_permissions/audit.yml

- name: Load Ubuntu CIS 2.4.1.2 remediation adapter
  ansible.builtin.import_tasks: sections/section_02_services/2_4_1_2_crontab_permissions/remediation.yml

- name: Load Ubuntu CIS 2.4.1.2 verification adapter
  ansible.builtin.import_tasks: sections/section_02_services/2_4_1_2_crontab_permissions/verification.yml

- name: Load Ubuntu CIS 7.1.1 remediation adapter
  ansible.builtin.import_tasks: sections/section_07_maintenance/7_1_1_passwd_permissions/remediation.yml

- name: Load Ubuntu CIS 7.1.1 verification adapter
  ansible.builtin.import_tasks: sections/section_07_maintenance/7_1_1_passwd_permissions/verification.yml
