---
- name: CIS 6.2.3.10 | verification | ubuntu_2404 common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_2_3_10_mounts/verification.yml}
  vars:
    cis_linux_common_control_id: '6.2.3.10'
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_config_line: '-a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k mounts'
    cis_linux_common_config_line_regexp: '^-a\ always,exit\ -F\ arch=b64\ -S\ mount\ -F\ auid>=1000\ -F\ auid!=unset\ -k\ mounts$'
    cis_linux_common_config_line_path: /etc/audit/rules.d/cis_6_2_3_10.rules
    cis_linux_common_config_line_package: auditd
