---
- name: CIS 6.1.3.3 | Remediation | Ubuntu common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_1_3_3_journald_to_rsyslog/remediation.yml}
  vars: {cis_linux_common_control_id: "6.1.3.3", cis_linux_common_platform: ubuntu_2404, cis_linux_common_config_line_package: rsyslog, cis_linux_common_config_line_path: /etc/systemd/journald.conf, cis_linux_common_config_line: "ForwardToSyslog=yes", cis_linux_common_config_line_regexp: '^\s*ForwardToSyslog\s*=\s*yes\s*$'}
