---
- name: CIS 6.2.3.6 | Remediation | Run common privileged-commands audit mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_06_logging/6_2_3_6_privileged_commands/remediation.yml
  vars:
    cis_linux_common_control_id: '6.2.3.6'
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0
    cis_linux_common_privileged_package: auditd
    cis_linux_common_privileged_rules_path: /etc/audit/rules.d/50-privileged.rules
    cis_linux_common_privileged_key: privileged
