---
- name: CIS 6.2.2.1 | Audit | Ubuntu common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_2_2_1_audit_log_size/audit.yml}
  vars: {cis_linux_common_control_id: '6.2.2.1', cis_linux_common_platform: ubuntu_2404, cis_linux_common_config_line: 'max_log_file = 100', cis_linux_common_config_line_regexp: '^\s*max_log_file\s*=\s*\d+\s*$', cis_linux_common_config_line_path: /etc/audit/auditd.conf, cis_linux_common_config_line_package: auditd}
