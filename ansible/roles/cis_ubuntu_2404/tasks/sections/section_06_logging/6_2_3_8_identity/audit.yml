---
- name: CIS 6.2.3.8 | audit | ubuntu_2404 common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_2_3_8_identity/audit.yml}
  vars:
    cis_linux_common_control_id: '6.2.3.8'
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_config_line: '-w /etc/group -p wa -k identity'
    cis_linux_common_config_line_regexp: '^-w\ /etc/group\ -p\ wa\ -k\ identity$'
    cis_linux_common_config_line_path: /etc/audit/rules.d/cis_6_2_3_8.rules
    cis_linux_common_config_line_package: auditd
