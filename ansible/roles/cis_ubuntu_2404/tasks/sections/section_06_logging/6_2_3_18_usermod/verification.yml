---
- name: CIS 6.2.3.18 | verification | ubuntu_2404 common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_2_3_18_usermod/verification.yml}
  vars:
    cis_linux_common_control_id: '6.2.3.18'
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_config_line: '-a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=unset -k usermod'
    cis_linux_common_config_line_regexp: '^-a\ always,exit\ -F\ path=/usr/sbin/usermod\ -F\ perm=x\ -F\ auid>=1000\ -F\ auid!=unset\ -k\ usermod$'
    cis_linux_common_config_line_path: /etc/audit/rules.d/cis_6_2_3_18.rules
    cis_linux_common_config_line_package: auditd
