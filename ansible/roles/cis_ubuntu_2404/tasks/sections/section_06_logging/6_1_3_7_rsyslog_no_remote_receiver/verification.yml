---
- name: CIS 6.1.3.7 | Verification | Ubuntu common route
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_06_logging/6_1_3_7_rsyslog_no_remote_receiver/verification.yml}
  vars: {cis_linux_common_control_id: "6.1.3.7", cis_linux_common_platform: ubuntu_2404, cis_linux_common_config_line_package: rsyslog, cis_linux_common_config_line_path: /etc/rsyslog.conf, cis_linux_common_config_line: "#module(load=\"imtcp\")", cis_linux_common_config_line_regexp: '^\s*#\s*(?:module\s*\(\s*load\s*=\s*"?im(?:tcp|udp)|\$ModLoad\s+im(?:tcp|udp))\b'}
