---
- name: Audit Ubuntu 24.04 CIS 2.4.1.2 with the common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_02_services/2_4_1_2_crontab_permissions/audit.yml
  vars:
    cis_linux_common_control_id: "2.4.1.2"
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0
    cis_linux_common_package_name: cron
    cis_linux_common_fixed_file_path: /etc/crontab
    cis_linux_common_fixed_file_owner: root
    cis_linux_common_fixed_file_group: root
    cis_linux_common_fixed_file_remediation_mode: '0600'
    cis_linux_common_fixed_file_expected_mode_description: >-
      0600 or more restrictive without execute bits
    cis_linux_common_fixed_file_allowed_owner_digits: ['0', '2', '4', '6']
    cis_linux_common_fixed_file_allowed_group_digits: ['0']
    cis_linux_common_fixed_file_allowed_other_digits: ['0']
  when:
    - cis_ubuntu_2404_execution_mode == 'audit'
    - cis_ubuntu_2404_2_4_1_2_crontab_permissions | bool
  tags:
    - cis_ubuntu_2404
    - cis_ubuntu_2404_audit
    - cis_2
    - cis_sec2
    - cis_2_4
    - cis_2_4_1
    - cis_2_4_1_2
    - cis_2.4.1.2
    - cron
    - fixed_file_permissions
