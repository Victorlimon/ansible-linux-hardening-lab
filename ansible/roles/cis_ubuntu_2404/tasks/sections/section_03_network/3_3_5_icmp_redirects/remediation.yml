---
- name: Remediate Ubuntu 24.04 CIS 3.3.5 IPv4 all redirects
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_03_network/3_3_5_icmp_redirects/remediation.yml}
  vars: {cis_linux_common_control_id: "3.3.5", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_sysctl_parameter: net.ipv4.conf.all.accept_redirects, cis_linux_common_sysctl_runtime_path: /proc/sys/net/ipv4/conf/all/accept_redirects, cis_linux_common_sysctl_value: '0', cis_linux_common_sysctl_file: /etc/sysctl.d/99-cis-3-3-5-ipv4-all.conf}
- name: Remediate Ubuntu 24.04 CIS 3.3.5 IPv4 default redirects
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_03_network/3_3_5_icmp_redirects/remediation.yml}
  vars: {cis_linux_common_control_id: "3.3.5", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_sysctl_parameter: net.ipv4.conf.default.accept_redirects, cis_linux_common_sysctl_runtime_path: /proc/sys/net/ipv4/conf/default/accept_redirects, cis_linux_common_sysctl_value: '0', cis_linux_common_sysctl_file: /etc/sysctl.d/99-cis-3-3-5-ipv4-default.conf}
- name: Remediate Ubuntu 24.04 CIS 3.3.5 IPv6 all redirects
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_03_network/3_3_5_icmp_redirects/remediation.yml}
  vars: {cis_linux_common_control_id: "3.3.5", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_sysctl_parameter: net.ipv6.conf.all.accept_redirects, cis_linux_common_sysctl_runtime_path: /proc/sys/net/ipv6/conf/all/accept_redirects, cis_linux_common_sysctl_value: '0', cis_linux_common_sysctl_file: /etc/sysctl.d/99-cis-3-3-5-ipv6-all.conf}
- name: Remediate Ubuntu 24.04 CIS 3.3.5 IPv6 default redirects
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_03_network/3_3_5_icmp_redirects/remediation.yml}
  vars: {cis_linux_common_control_id: "3.3.5", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_sysctl_parameter: net.ipv6.conf.default.accept_redirects, cis_linux_common_sysctl_runtime_path: /proc/sys/net/ipv6/conf/default/accept_redirects, cis_linux_common_sysctl_value: '0', cis_linux_common_sysctl_file: /etc/sysctl.d/99-cis-3-3-5-ipv6-default.conf}
