---
- name: Remediate Ubuntu 24.04 CIS 3.3.8 source routes
  ansible.builtin.include_role:
    name: cis_linux_common
    tasks_from: sections/section_03_network/3_3_8_source_route/remediation.yml
    apply:
      tags: always
  vars: {cis_linux_common_control_id: "3.3.8", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_sysctl_parameter: "{{ item.parameter }}", cis_linux_common_sysctl_runtime_path: "{{ item.runtime }}", cis_linux_common_sysctl_value: '0', cis_linux_common_sysctl_file: "{{ item.file }}"}
  loop:
    - {parameter: net.ipv4.conf.all.accept_source_route, runtime: /proc/sys/net/ipv4/conf/all/accept_source_route, file: /etc/sysctl.d/99-cis-3-3-8-ipv4-all.conf}
    - {parameter: net.ipv4.conf.default.accept_source_route, runtime: /proc/sys/net/ipv4/conf/default/accept_source_route, file: /etc/sysctl.d/99-cis-3-3-8-ipv4-default.conf}
    - {parameter: net.ipv6.conf.all.accept_source_route, runtime: /proc/sys/net/ipv6/conf/all/accept_source_route, file: /etc/sysctl.d/99-cis-3-3-8-ipv6-all.conf}
    - {parameter: net.ipv6.conf.default.accept_source_route, runtime: /proc/sys/net/ipv6/conf/default/accept_source_route, file: /etc/sysctl.d/99-cis-3-3-8-ipv6-default.conf}
