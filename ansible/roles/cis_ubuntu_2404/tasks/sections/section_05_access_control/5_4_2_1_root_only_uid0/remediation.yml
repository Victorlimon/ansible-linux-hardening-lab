---
- name: CIS 5.4.2.1 | Remediation | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_2_1_root_only_uid0/remediation.yml
  vars: {cis_linux_common_control_id: "5.4.2.1", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: uid_zero, cis_linux_common_account_command: 'awk -F: ''($3==0 && $1!="root") {print $1}'' /etc/passwd'}
