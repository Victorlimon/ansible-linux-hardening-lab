---
- name: CIS 5.4.2.5 | Verification | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_2_5_root_path_integrity/verification.yml
  vars: {cis_linux_common_control_id: "5.4.2.5", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: root_path, cis_linux_common_account_command: 'echo $PATH | grep -qE ''(^|:)\.($|:)|::'' && echo insecure'}
