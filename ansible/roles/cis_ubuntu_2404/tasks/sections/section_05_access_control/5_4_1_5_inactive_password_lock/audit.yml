---
- name: CIS 5.4.1.5 | Audit | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_1_5_inactive_password_lock/audit.yml
  vars: {cis_linux_common_control_id: "5.4.1.5", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: inactive_lock, cis_linux_common_account_command: 'grep -E ''^INACTIVE=-1'' /etc/default/useradd || echo missing'}
