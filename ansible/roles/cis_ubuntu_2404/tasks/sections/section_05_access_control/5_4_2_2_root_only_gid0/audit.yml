---
- name: CIS 5.4.2.2 | Audit | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_2_2_root_only_gid0/audit.yml
  vars: {cis_linux_common_control_id: "5.4.2.2", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: gid_zero, cis_linux_common_account_command: 'awk -F: ''($4==0 && $1!="root") {print $1}'' /etc/passwd'}
