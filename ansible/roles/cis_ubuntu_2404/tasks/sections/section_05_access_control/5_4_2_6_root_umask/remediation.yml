---
- name: CIS 5.4.2.6 | Remediation | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_2_6_root_umask/remediation.yml
  vars: {cis_linux_common_control_id: "5.4.2.6", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: root_umask, cis_linux_common_account_command: 'grep -qE ''^umask 0[2-7]7'' /root/.bashrc /root/.profile 2>/dev/null || echo missing'}
