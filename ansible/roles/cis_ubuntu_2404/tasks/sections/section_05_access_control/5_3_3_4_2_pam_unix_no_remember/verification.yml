---
- {name: 'CIS 5.3.3.4.2 | Verification | Ubuntu adapter', ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_05_access_control/5_3_3_4_2_pam_unix_no_remember/verification.yml}, vars: {cis_linux_common_control_id: '5.3.3.4.2', cis_linux_common_platform: ubuntu_2404, cis_linux_common_config_line_package: libpam-runtime, cis_linux_common_config_line_path: /etc/pam.d/common-password, cis_linux_common_config_line_regexp: '^password\s+\[success=1\s+default=ignore\]\s+pam_unix\.so.*$', cis_linux_common_config_line: 'password [success=1 default=ignore] pam_unix.so obscure use_authtok try_first_pass yescrypt'}}
