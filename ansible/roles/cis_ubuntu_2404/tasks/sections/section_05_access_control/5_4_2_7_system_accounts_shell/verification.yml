---
- name: CIS 5.4.2.7 | Verification | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_2_7_system_accounts_shell/verification.yml
  vars: {cis_linux_common_control_id: "5.4.2.7", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: sys_shell, cis_linux_common_account_command: 'awk -F: ''($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && $3<1000 && $7 !~ /(nologin|\/false)/) {print $1}'' /etc/passwd'}
