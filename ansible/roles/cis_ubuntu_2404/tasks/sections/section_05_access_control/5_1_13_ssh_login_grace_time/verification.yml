---
- {name: 'CIS 5.1.13 | Verification | Ubuntu adapter', ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_05_access_control/5_1_13_ssh_login_grace_time/verification.yml}, vars: {cis_linux_common_control_id: '5.1.13', cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: 'CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0', cis_linux_common_config_line_package: openssh-server, cis_linux_common_config_line_path: /etc/ssh/sshd_config, cis_linux_common_config_line_effective_command: 'sshd -T', cis_linux_common_config_line_regexp: '^[ \t]*logingracetime[ \t]+(?:[1-9]|[1-5][0-9]|60)[ \t]*$'}}
