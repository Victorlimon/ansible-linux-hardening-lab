---
- name: CIS 5.4.2.8 | Verification | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_05_access_control/5_4_2_8_accounts_locked/verification.yml
  vars: {cis_linux_common_control_id: "5.4.2.8", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: accounts_locked, cis_linux_common_account_command: 'for u in $(awk -F: ''($3<1000 && $7 ~ /(nologin|\/false)/) {print $1}'' /etc/passwd); do passwd -S $u 2>/dev/null | grep -qv '' L '' && echo $u; done'}
