---
- name: CIS 5.1.6 | Verification | Ubuntu adapter
  ansible.builtin.import_role: {name: cis_linux_common, tasks_from: sections/section_05_access_control/5_1_6_ssh_ciphers/verification.yml}
  vars: {cis_linux_common_control_id: "5.1.6", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_config_line_package: openssh-server, cis_linux_common_config_line_path: /etc/ssh/sshd_config, cis_linux_common_config_line_effective_command: 'sshd -T', cis_linux_common_config_line_regexp: '^[ \t]*ciphers[ \t]+(?!(?:.*\b(?:3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc)\b))[^ \t]+$'}
