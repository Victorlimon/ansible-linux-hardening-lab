---
- name: CIS 7.2.1 | Verification | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_2_1_shadowed_passwords/verification.yml
  vars: {cis_linux_common_control_id: "7.2.1", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: shadowed, cis_linux_common_account_command: 'awk -F: ''($2 != "x" && $2 != "*" && $2 != "!") {print $1}'' /etc/passwd'}
