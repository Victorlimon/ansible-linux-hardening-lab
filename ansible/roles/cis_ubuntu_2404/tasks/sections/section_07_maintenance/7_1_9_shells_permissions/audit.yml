---
- name: CIS 7.1.9 | Audit | Use the common fixed-file mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_1_9_shells_permissions/audit.yml
  vars:
    cis_linux_common_control_id: "7.1.9"
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark
    cis_linux_common_fixed_file_path: /etc/shells
    cis_linux_common_fixed_file_owner: root
    cis_linux_common_fixed_file_group: root
    cis_linux_common_fixed_file_remediation_mode: 'u-x,go-wx'
    cis_linux_common_fixed_file_expected_mode_description: >-
      0644 or more restrictive without execute bits
    cis_linux_common_fixed_file_allowed_owner_digits: ['0', '2', '4', '6']
    cis_linux_common_fixed_file_allowed_group_digits: ['0', '4']
    cis_linux_common_fixed_file_allowed_other_digits: ['0', '4']
