---
- name: Remediate Ubuntu 24.04 CIS 7.1.5 with the common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_1_5_shadow_permissions/remediation.yml
  vars:
    cis_linux_common_control_id: "7.1.5"
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark
    cis_linux_common_fixed_file_path: /etc/shadow
    cis_linux_common_fixed_file_owner: root
    cis_linux_common_fixed_file_group: shadow
    cis_linux_common_fixed_file_remediation_mode: 'u-x,g-wx,o-rwx'
    cis_linux_common_fixed_file_expected_mode_description: >-
      0640 or more restrictive
    cis_linux_common_fixed_file_allowed_owner_digits: ['0', '2', '4', '6']
    cis_linux_common_fixed_file_allowed_group_digits: ['0', '4']
    cis_linux_common_fixed_file_allowed_other_digits: ['0']
  when:
    - cis_ubuntu_2404_execution_mode == 'remediation'
    - cis_ubuntu_2404_remediation_enabled | bool
    - cis_ubuntu_2404_7_1_5_shadow_permissions | bool
  tags:
    - cis_ubuntu_2404
    - cis_ubuntu_2404_remediation
    - cis_7
    - cis_sec7
    - cis_7_1
    - cis_7_1_5
    - fixed_file_permissions
