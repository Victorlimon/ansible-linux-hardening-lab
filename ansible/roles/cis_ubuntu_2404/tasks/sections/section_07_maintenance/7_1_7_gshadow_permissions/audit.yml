---
- name: CIS 7.1.7 | Audit | Use the common fixed-file mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_1_7_gshadow_permissions/audit.yml
  vars:
    cis_linux_common_control_id: "7.1.7"
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark
    cis_linux_common_fixed_file_path: /etc/gshadow
    cis_linux_common_fixed_file_owner: root
    cis_linux_common_fixed_file_group: shadow
    cis_linux_common_fixed_file_remediation_mode: 'u-x,g-wx,o-rwx'
    cis_linux_common_fixed_file_expected_mode_description: >-
      0640 or more restrictive without execute bits
    cis_linux_common_fixed_file_max_mode: '0640'
