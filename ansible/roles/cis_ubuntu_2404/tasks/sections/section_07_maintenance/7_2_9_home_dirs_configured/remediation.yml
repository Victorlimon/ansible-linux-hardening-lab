---
- name: CIS 7.2.9 | Remediation | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_2_9_home_dirs_configured/remediation.yml
  vars: {cis_linux_common_control_id: "7.2.9", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: home_dirs, cis_linux_common_account_command: 'for u in $(awk -F: ''($3>=1000 && $7 !~ /nologin|false/) {print $1}'' /etc/passwd); do d=$(getent passwd $u | cut -d: -f6); [ -d "$d" ] || echo $u; done'}
