---
- name: CIS 7.2.4 | Remediation | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_2_4_shadow_group_empty/remediation.yml
  vars: {cis_linux_common_control_id: "7.2.4", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: shadow_group, cis_linux_common_account_command: 'awk -F: ''($1=="shadow") {print $4}'' /etc/group'}
