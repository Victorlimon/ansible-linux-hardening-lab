---
- name: Remediate Ubuntu 24.04 CIS 7.1.3 with the common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_1_3_group_backup_permissions/remediation.yml
  vars:
    cis_linux_common_control_id: "7.1.3"
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark
    cis_linux_common_fixed_file_path: /etc/group
    cis_linux_common_fixed_file_owner: root
    cis_linux_common_fixed_file_group: root
    cis_linux_common_fixed_file_remediation_mode: 'u-x,go-wx'
    cis_linux_common_fixed_file_expected_mode_description: >-
      0644 or more restrictive without execute bits
    cis_linux_common_fixed_file_max_mode: '0644'
  when:
    - cis_ubuntu_2404_execution_mode == 'remediation'
    - cis_ubuntu_2404_remediation_enabled | bool
    - cis_ubuntu_2404_7_1_3_group_backup_permissions | bool
  tags:
    - cis_ubuntu_2404
    - cis_ubuntu_2404_remediation
    - cis_7
    - cis_sec7
    - cis_7_1
    - cis_7_1_3
    - fixed_file_permissions
