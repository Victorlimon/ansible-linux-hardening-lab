---
- name: CIS 7.2.3 | Audit | Run common mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_07_maintenance/7_2_3_passwd_groups_exist/audit.yml
  vars: {cis_linux_common_control_id: "7.2.3", cis_linux_common_platform: ubuntu_2404, cis_linux_common_benchmark: CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0, cis_linux_common_account_check: groups_exist, cis_linux_common_account_command: 'for g in $(awk -F: ''{print $4}'' /etc/passwd | tr '','' ''\n'' | sort -u); do getent group $g >/dev/null || echo $g; done'}
