---
- ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_04_firewall/4_2_1_ufw_installed/remediation.yml
  vars: {cis_linux_common_control_id: '4.2.1', cis_linux_common_platform: ubuntu_2404, cis_linux_common_package_name: ufw}

- name: CIS 4.2.1 | Preserve CIS 3.3.9 after installing UFW
  ansible.builtin.import_tasks: sections/section_03_network/3_3_9_log_martians/remediation.yml
  when:
    - cis_firewall == 'ufw'
    - cis_ubuntu_2404_3_3_9_log_martians | bool
    - not ansible_check_mode or 'ufw' in ansible_facts.packages
