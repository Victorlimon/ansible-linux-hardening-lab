---
- name: CIS 1.7.6 | Audit | Run common GDM configuration mechanism
  ansible.builtin.import_role:
    name: cis_linux_common
    tasks_from: sections/section_01_initial_setup/1_7_6_gdm_automount/audit.yml
  vars:
    cis_linux_common_control_id: '1.7.6'
    cis_linux_common_platform: ubuntu_2404
    cis_linux_common_benchmark: 'CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0'
    cis_linux_common_gdm_gate_package: gdm3
    cis_linux_common_gdm_checks:
      - 'gsettings|org.gnome.desktop.media-handling|automount|^false$'
      - 'gsettings|org.gnome.desktop.media-handling|automount-open|^false$'
