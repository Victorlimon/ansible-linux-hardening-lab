---
- name: Validate the runner-owned log before changing the host
  ansible.builtin.import_tasks: log_preflight.yml

- name: Validate critical-stage policy before changing the host
  ansible.builtin.import_tasks: critical_preflight.yml
  when: controller_critical_enabled | bool

- name: Install unattended updates and audit service
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - auditd
      - logrotate
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable distribution-configured unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/90ansible-control-auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Keep systemd journal persistently with bounded disk use
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-ansible-control.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=1G
  notify: Restart systemd-journald

- name: Keep auditd enabled and running
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started

- name: Rotate restricted Ansible execution logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/ansible-control
    owner: root
    group: root
    mode: '0644'
    content: |
      /var/log/ansible-control/ansible.log {
          weekly
          rotate 12
          missingok
          notifempty
          compress
          create 0600 root root
      }

- name: Set a restrictive umask for interactive controller shells
  ansible.builtin.copy:
    dest: /etc/profile.d/90-ansible-control-umask.sh
    owner: root
    group: root
    mode: '0644'
    content: |
      case $- in
        *i*) umask 027 ;;
      esac

- name: Protect explicitly approved controller paths
  ansible.builtin.import_tasks: critical_permissions.yml
  when: controller_critical_enabled | bool
