---
# Section 1 entry points.
cis_section1_initial_setup: true
cis_section1_1_filesystem: true
cis_section1_2_packages: true
cis_section1_3_mac: true
cis_section1_4_bootloader: true
cis_section1_5_process_hardening: true
cis_section1_6_banners: true
# Workstation-only controls are opt-in on the Server profile.
cis_section1_7_gdm: false

# 1.1.1 - Disable uncommon filesystem modules. Modules commonly required by
# containers, installation media, or removable storage remain opt-in.
cis_1_1_1_kernel_modules: true
cis_1_1_1_disable_cramfs: true
cis_1_1_1_disable_freevxfs: true
cis_1_1_1_disable_hfs: true
cis_1_1_1_disable_hfsplus: true
cis_1_1_1_disable_jffs2: true
cis_1_1_1_disable_overlayfs: false
cis_1_1_1_disable_squashfs: false
cis_1_1_1_disable_udf: false
cis_1_1_1_disable_usb_storage: false
cis_1_1_1_10_unused_modules_manual: false

# 1.1.2 - Existing separate mounts are hardened. Provisioning or migrating
# partitions is intentionally left to a maintenance window.
cis_1_1_2_partitions: true
cis_1_1_2_tmp_partition: true
cis_1_1_2_tmp_nodev: true
cis_1_1_2_tmp_nosuid: true
cis_1_1_2_tmp_noexec: false
cis_1_1_2_dev_shm_partition: true
cis_1_1_2_dev_shm_nodev: true
cis_1_1_2_dev_shm_nosuid: true
cis_1_1_2_dev_shm_noexec: false
cis_1_1_2_home_partition: true
cis_1_1_2_home_nodev: true
cis_1_1_2_home_nosuid: true
cis_1_1_2_var_partition: true
cis_1_1_2_var_nodev: true
cis_1_1_2_var_nosuid: true
cis_1_1_2_var_tmp_partition: true
cis_1_1_2_var_tmp_nodev: true
cis_1_1_2_var_tmp_nosuid: true
cis_1_1_2_var_tmp_noexec: false
cis_1_1_2_var_log_partition: true
cis_1_1_2_var_log_nodev: true
cis_1_1_2_var_log_nosuid: true
cis_1_1_2_var_log_noexec: false
cis_1_1_2_var_log_audit_partition: true
cis_1_1_2_var_log_audit_nodev: true
cis_1_1_2_var_log_audit_nosuid: true
cis_1_1_2_var_log_audit_noexec: false

# 1.2 - Keep signed Ubuntu repositories. Removing third-party repositories and
# enabling unattended changes require explicit site approval.
cis_1_2_1_configure_repositories: true
cis_1_2_1_1_gpg_keys: true
cis_1_2_1_remove_third_party: false
cis_1_2_2_configure_updates: true
cis_1_2_2_auto_updates: false

# 1.3 - Installing and enabling AppArmor at boot is safe. Changing every loaded
# profile to enforcement is a deliberate opt-in after application testing.
cis_1_3_1_1_apparmor_installed: true
cis_1_3_1_2_apparmor_bootloader: true
cis_1_3_1_3_apparmor_profiles_active: false
cis_1_3_1_4_apparmor_enforcing: false
cis_apparmor_default_mode: enforce

# 1.4 - A GRUB password requires a separately vaulted hash and is opt-in.
cis_1_4_1_grub_password: false
cis_1_4_2_grub_permissions: true

# 1.5 - Process hardening suitable for Ubuntu Server.
cis_1_5_1_enable_aslr: true
cis_1_5_2_restrict_ptrace: true
cis_ptrace_scope: 1
cis_1_5_3_restrict_core_dumps: true
# Package removals can affect local workflows and are opt-in.
cis_1_5_4_prelink_absent: false
cis_1_5_5_disable_apport: false

# 1.6 - Generic legal text avoids exposing OS and organization details.
cis_1_6_1_login_banner_text: true
cis_1_6_2_issue_banner_text: true
cis_1_6_3_remote_login_banner: true
cis_1_6_4_motd_permissions: true
cis_1_6_5_issue_permissions: true
cis_1_6_6_issue_net_permissions: true
cis_banner_text: "Authorized users only. All activity may be monitored and reported."
cis_issue_text: "{{ cis_banner_text }}"
cis_issue_net_text: "{{ cis_banner_text }}"

# 1.7 - These values apply only when both the workstation profile and section
# are enabled. Removing GDM remains an explicit disruptive choice.
cis_1_7_1_gdm_removed: false
cis_1_7_2_gdm_login_banner: true
cis_1_7_3_gdm_disable_user_list: true
cis_1_7_4_gdm_screen_lock_idle: true
cis_1_7_5_gdm_screen_lock_override: true
cis_1_7_6_gdm_automount_disabled: true
cis_1_7_7_gdm_automount_not_overridden: true
cis_1_7_8_gdm_autorun_never: true
cis_1_7_9_gdm_autorun_not_overridden: true
cis_1_7_10_xdmcp_disabled: true
cis_gdm_banner_message: "{{ cis_banner_text }}"
cis_gdm_idle_delay_seconds: 900
