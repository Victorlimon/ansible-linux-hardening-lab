---
# =================================================================
# CIS Benchmark 6.2: System Auditing (auditd) - Default Variables
# Ubuntu 24.04 LTS - Configurable via group_vars or host_vars
# =================================================================

section6_logging:
  # -----------------------------------------------------------------
  # 6.2.1 - Configure auditd Service
  # -----------------------------------------------------------------
  
  # 6.2.1.1 - Ensure auditd packages are installed
  '6_2_1_1_auditd_packages':
    enabled: true
    packages:
      - auditd
      - audispd-plugins
  
  # 6.2.1.2 - Ensure auditd service is enabled and active
  '6_2_1_2_auditd_enabled':
    enabled: true
  
  # 6.2.1.3 - Ensure auditing for processes that start prior to auditd is enabled
  '6_2_1_3_audit_boot_param':
    enabled: true
  
  # 6.2.1.4 - Ensure audit_backlog_limit is sufficient
  '6_2_1_4_audit_backlog_limit':
    enabled: true
    value: "8192"  # Recommended minimum; increase for high-activity systems
  
  # -----------------------------------------------------------------
  # 6.2.2 - Configure Data Retention
  # -----------------------------------------------------------------
  
  # 6.2.2.1 - Ensure audit log storage size is configured
  '6_2_2_1_max_log_file':
    enabled: true
    value: "100"  # Size in MB; adjust based on available disk space
  
  # 6.2.2.2 - Ensure audit logs are not automatically deleted
  '6_2_2_2_max_log_file_action':
    enabled: true
    value: "keep_logs"  # Options: keep_logs, rotate, ignore
  
  # 6.2.2.3 - Ensure system is disabled when audit logs are full
  #  LAB-SAFE DEFAULTS: Use 'syslog' instead of 'halt' for safety
  # For production, change to 'halt' or 'single' per security policy
  '6_2_2_3_disk_actions':
    enabled: true
    disk_full_action: "syslog"      # LAB: syslog | PROD: halt or single
    disk_error_action: "syslog"     # Options: syslog, halt, single
  
  # 6.2.2.4 - Ensure system warns when audit logs are low on space
  '6_2_2_4_space_warnings':
    enabled: true
    space_left: "100"                    # Warning threshold in MB
    space_left_action: "email"           # Options: email, exec, syslog, halt
    admin_space_left: "50"               # Critical threshold in MB
    admin_space_left_action: "halt"      # Options: halt, single
    action_mail_acct: "root"             # Email account for warnings
  
  # -----------------------------------------------------------------
  # 6.2.3 - Configure auditd Rules
  # -----------------------------------------------------------------
  
  # 6.2.3.1 - Ensure changes to system administration scope (sudoers) is collected
  '6_2_3_1_sudoers_scope':
    enabled: true
  
  # 6.2.3.2 - Ensure actions as another user are always logged
  '6_2_3_2_user_emulation':
    enabled: true
  
  # 6.2.3.3 - Ensure events that modify the sudo log file are collected
  '6_2_3_3_sudo_log':
    enabled: true
  
  # 6.2.3.4 - Ensure events that modify date and time information are collected
  '6_2_3_4_time_change':
    enabled: true
  
  # 6.2.3.5 - Ensure events that modify the system's network environment are collected
  '6_2_3_5_system_locale':
    enabled: true
  
  # 6.2.3.6 - Ensure use of privileged commands are collected
  # ⚠️ PERFORMANCE WARNING: This can generate significant audit volume
  # Disabled by default; enable only after capacity planning
  '6_2_3_6_privileged_cmds':
    enabled: false  # Set to true after testing performance impact
  
  # 6.2.3.7 - Ensure unsuccessful file access attempts are collected
  '6_2_3_7_access_failures':
    enabled: true
  
  # 6.2.3.8 - Ensure events that modify user/group information are collected
  '6_2_3_8_identity':
    enabled: true
  
  # 6.2.3.9 - Ensure discretionary access control permission modification events are collected
  '6_2_3_9_perm_mod':
    enabled: true
  
  # 6.2.3.10 - Ensure successful file system mounts are collected
  '6_2_3_10_mounts':
    enabled: true
  
  # 6.2.3.11 - Ensure session initiation information is collected
  '6_2_3_11_session':
    enabled: true
  
  # 6.2.3.12 - Ensure login and logout events are collected
  '6_2_3_12_logins':
    enabled: true
  
  # 6.2.3.13 - Ensure file deletion events by users are collected
  '6_2_3_13_delete':
    enabled: true
  
  # 6.2.3.14 - Ensure events that modify the system's Mandatory Access Controls are collected
  '6_2_3_14_mac_policy':
    enabled: true
  
  # 6.2.3.15-18 - Ensure privileged command usage is collected (chcon, setfacl, chacl, usermod)
  '6_2_3_15_18_priv_commands':
    enabled: true
  
  # 6.2.3.19 - Ensure kernel module loading unloading and modification is collected
  '6_2_3_19_kernel_modules':
    enabled: true
  
  # 6.2.3.20 - Ensure the audit configuration is immutable
  # ⚠️ REBOOT REQUIRED: Changes take effect only after reboot
  '6_2_3_20_immutable':
    enabled: false  # Enable only when ready to lock configuration
  
  # 6.2.3.21 - Ensure the running and on disk configuration is the same
  '6_2_3_21_sync_rules':
    enabled: true
  
  # -----------------------------------------------------------------
  # 6.2.4 - Configure auditd File Access
  # -----------------------------------------------------------------
  
  # 6.2.4.1 - Ensure audit log files mode is configured
  '6_2_4_1_log_mode':
    enabled: true
  
  # 6.2.4.2 - Ensure audit log files owner is configured
  '6_2_4_2_log_owner':
    enabled: true
  
  # 6.2.4.3 - Ensure audit log files group owner is configured
  '6_2_4_3_log_group':
    enabled: true
    value: "adm"  # Options: adm, root
  
  # 6.2.4.4 - Ensure the audit log file directory mode is configured
  '6_2_4_4_log_dir_mode':
    enabled: true
  
  # 6.2.4.5 - Ensure audit configuration files mode is configured
  '6_2_4_5_config_mode':
    enabled: true
  
  # 6.2.4.6 - Ensure audit configuration files owner is configured
  '6_2_4_6_config_owner':
    enabled: true
  
  # 6.2.4.7 - Ensure audit configuration files group owner is configured
  '6_2_4_7_config_group':
    enabled: true
  
  # 6.2.4.8 - Ensure audit tools mode is configured
  '6_2_4_8_tools_mode':
    enabled: true
  
  # 6.2.4.9 - Ensure audit tools owner is configured
  '6_2_4_9_tools_owner':
    enabled: true
  
  # 6.2.4.10 - Ensure audit tools group owner is configured
  '6_2_4_10_tools_group':
    enabled: true

  # =================================================================
  # CIS Benchmark 6.3: Configure Integrity Checking (AIDE) - Default Variables
  # Ubuntu 24.04 LTS - Configurable via group_vars or host_vars
  # =================================================================
  
  # -----------------------------------------------------------------
  # 6.3.1 - Ensure AIDE is installed
  # -----------------------------------------------------------------
  
  # 6.3.1.1 - Ensure AIDE packages are installed
  '6_3_1_aide_installed':
    enabled: true
    packages:
      - aide
      - aide-common
  
  # 6.3.1.2 - Initialize AIDE database after installation
  '6_3_1_aide_init':
    enabled: true
    db_path: "/var/lib/aide/aide.db"
    db_new_path: "/var/lib/aide/aide.db.new"
  
  # -----------------------------------------------------------------
  # 6.3.2 - Ensure filesystem integrity is regularly checked
  # -----------------------------------------------------------------
  
  # 6.3.2.1 - Ensure daily AIDE check timer is enabled and active
  '6_3_2_aide_timer':
    enabled: true
    timer_name: "dailyaidecheck.timer"
    service_name: "dailyaidecheck.service"
    timer_schedule: "daily"
    timer_on_calendar: "*-*-* 05:00:00"  # Default: 5 AM daily
  
  # 6.3.2.2 - Configure AIDE check wrapper script
  '6_3_2_aide_wrapper':
    enabled: true
    wrapper_path: "/usr/bin/aide.wrapper"
    use_wrapper: true  # Ubuntu recommends using wrapper for database protection
  
  # -----------------------------------------------------------------
  # 6.3.3 - Ensure cryptographic mechanisms protect integrity of audit tools
  # -----------------------------------------------------------------
  
  # 6.3.3.1 - Configure AIDE rules for audit tools integrity
  '6_3_3_aide_audit_tools_integrity':
    enabled: true
    aide_conf: "/etc/aide/aide.conf"
    audit_tool_attrs: "p+i+n+u+g+s+b+acl+xattrs+sha512"
    audit_tools:
      - "/usr/sbin/auditctl"
      - "/usr/sbin/auditd"
      - "/usr/sbin/ausearch"
      - "/usr/sbin/aureport"
      - "/usr/sbin/autrace"
      - "/usr/sbin/augenrules"
  
  # 6.3.3.2 - Ensure AIDE configuration file permissions
  '6_3_3_aide_conf_permissions':
    enabled: true
    mode: '0640'
    owner: "root"
    group: "root"
  
  # 6.3.3.3 - Validate AIDE configuration syntax
  '6_3_3_aide_config_validation':
    enabled: true
    validate_cmd: "aide --config-check"
