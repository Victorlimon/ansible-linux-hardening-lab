# =================================================================
# CIS Benchmark Ubuntu 24.04 LTS / Debian 12 - defaults/main.yml
# Variables granulares para habilitar/deshabilitar controles CIS
# =================================================================

# =================================================================
# VARIABLES GLOBALES
# =================================================================
cis_benchmark_version: "v1.0.0"
cis_target_os: "{{ ansible_facts.distribution | default('Ubuntu') }}"
cis_target_release: "{{ ansible_facts.distribution_release | default('noble') }}"

# =================================================================
# SECCIÓN 1: INITIAL SETUP
# =================================================================
cis_section1_initial_setup: true
cis_section1_1_filesystem: true
cis_section1_2_packages: true
cis_section1_3_mac: true
cis_section1_4_bootloader: true
cis_section1_5_process_hardening: true
cis_section1_6_banners: true
cis_section1_7_gdm: false  # Solo workstation con GUI

# --- 1.1.1 Kernel Modules ---
cis_1_1_1_kernel_modules: true
cis_1_1_1_10_unused_modules_manual: false

cis_1_1_1_disable_filesystem_modules:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - overlayfs
  - squashfs
  - udf
  - usb-storage

cis_1_1_1_disable_cramfs: true
cis_1_1_1_disable_freevxfs: true
cis_1_1_1_disable_hfs: true
cis_1_1_1_disable_hfsplus: true
cis_1_1_1_disable_jffs2: true
cis_1_1_1_disable_overlayfs: false
cis_1_1_1_disable_squashfs: false
cis_1_1_1_disable_udf: false
cis_1_1_1_disable_usb_storage: true

# --- 1.1.2 Partitions ---
cis_1_1_2_partitions: true
cis_1_1_2_tmp_partition: true
cis_1_1_2_tmp_nodev: true
cis_1_1_2_tmp_nosuid: true
cis_1_1_2_tmp_noexec: true
cis_1_1_2_dev_shm_partition: true
cis_1_1_2_dev_shm_nodev: true
cis_1_1_2_dev_shm_nosuid: true
cis_1_1_2_dev_shm_noexec: true
cis_1_1_2_home_partition: true
cis_1_1_2_home_nodev: true
cis_1_1_2_home_nosuid: true
cis_1_1_2_var_partition: true
cis_1_1_2_var_nodev: true
cis_1_1_2_var_nosuid: true
cis_1_1_2_var_tmp_partition: true
cis_1_1_2_var_tmp_nodev: true
cis_1_1_2_var_tmp_nosuid: true
cis_1_1_2_var_tmp_noexec: true
cis_1_1_2_var_log_partition: false
cis_1_1_2_var_log_nodev: true
cis_1_1_2_var_log_nosuid: true
cis_1_1_2_var_log_noexec: true
cis_1_1_2_var_log_audit_partition: false
cis_1_1_2_var_log_audit_nodev: true
cis_1_1_2_var_log_audit_nosuid: true
cis_1_1_2_var_log_audit_noexec: true

# --- 1.3 AppArmor ---
cis_1_3_1_1_apparmor_installed: true
cis_1_3_1_2_apparmor_bootloader: true
cis_1_3_1_3_apparmor_profiles_active: true
cis_1_3_1_4_apparmor_enforcing: false
cis_apparmor_default_mode: enforce

# --- 1.4 Bootloader ---
cis_1_4_1_grub_password: false
cis_1_4_2_grub_permissions: true

# --- 1.5 Process Hardening ---
cis_1_5_1_disable_core_dumps: true
cis_1_5_2_restrict_core_dumps: true
cis_1_5_3_enable_aslr: true
cis_1_5_4_prevent_users_from_using_cron: false

# --- 1.6 Login Banners ---
cis_1_6_1_login_banner_text: true
cis_1_6_2_issue_banner_text: true
cis_1_6_3_remote_login_banner: true
cis_banner_text: "Authorized uses only. All activity may be monitored and reported."
cis_issue_text: "{{ cis_banner_text }}"
cis_issue_net_text: "{{ cis_banner_text }}"
cis_banner_remove_os_info: true

# --- 1.7 GDM (Workstation) ---
cis_1_7_1_gdm_login_banner: true
cis_1_7_2_gdm_disable_user_list: true
cis_1_7_3_gdm_lock_timeout: true
cis_gdm_lock_timeout_seconds: 900

# =================================================================
# SECCIÓN 2: SERVICES CONFIGURATION
# =================================================================
cis_section2_services: true

# --- 2.1 | CONFIGURE SERVER SERVICES ---
cis_2_1_server_services:
  '2_1_1_autofs': true
  '2_1_2_avahi': true
  '2_1_3_dhcp': true
  '2_1_4_dns': true
  '2_1_5_dnsmasq': true
  '2_1_6_ftp': true
  '2_1_7_ldap': true
  '2_1_8_mail_access': true
  '2_1_9_nfs': true
  '2_1_10_nis': true
  '2_1_11_print': true
  '2_1_12_rpcbind': true
  '2_1_13_rsync': true
  '2_1_14_samba': true
  '2_1_15_snmp': true
  '2_1_16_tftp': true
  '2_1_17_proxy': true
  '2_1_18_webserver': true
  '2_1_19_xinetd': true
  '2_1_20_xwindow': true
  '2_1_21_mta_local_only': true

cis_2_1_required_services:
  autofs: false
  avahi_daemon: false
  isc_dhcp_server: false
  bind9: false
  dnsmasq: false
  vsftpd: false
  slapd: false
  dovecot: false
  nfs_kernel_server: false
  ypserv: false
  cups: false
  rpcbind: false
  rsync: false
  samba: false
  snmpd: false
  tftpd_hpa: false
  squid: false
  apache2: false
  nginx: false
  xinetd: false
  xserver_common: false

# --- 2.2 | CONFIGURE CLIENT SERVICES ---
cis_2_2_client_services:
  '2_2_1_nis_client': true
  '2_2_2_rsh_client': true
  '2_2_3_talk_client': true
  '2_2_4_telnet_client': true
  '2_2_5_ldap_client': true
  '2_2_6_ftp_client': true

# --- 2.3 | CONFIGURE TIME SYNCHRONIZATION ---
cis_2_3_time_sync:
  '2_3_1_1_single_daemon': true
  '2_3_2_1_timesyncd_config': true
  '2_3_2_2_timesyncd_enabled': true
  '2_3_3_1_chrony_config': true
  '2_3_3_2_chrony_user': true
  '2_3_3_3_chrony_enabled': true

cis_time_sync_daemon: chrony
cis_chrony_servers:
  - "pool time.nist.gov iburst maxsources 4"
  - "server time-a-g.nist.gov iburst"
  - "server time-b-g.nist.gov iburst"
cis_timesyncd_servers: "time.nist.gov"
cis_timesyncd_fallback: "time-a-g.nist.gov time-b-g.nist.gov time-c-g.nist.gov"

# --- 2.4 | CONFIGURE JOB SCHEDULERS ---
cis_2_4_job_schedulers:
  '2_4_1_1_cron_enabled': true
  '2_4_1_2_crontab_perms': true
  '2_4_1_3_cron_hourly_perms': true
  '2_4_1_4_cron_daily_perms': true
  '2_4_1_5_cron_weekly_perms': true
  '2_4_1_6_cron_monthly_perms': true
  '2_4_1_7_cron_d_perms': true
  '2_4_1_8_cron_allow': true
  '2_4_2_1_at_allow': true

# =================================================================
# SECCIÓN 3: NETWORK CONFIGURATION
# =================================================================
cis_section3_network: true

# --- 3.1 Disable Unused Network Protocols ---
cis_3_1_disable_ipv6: false  # false si usas IPv6
cis_3_1_disable_sctp: true
cis_3_1_disable_dccp: true
cis_3_1_disable_rds: true
cis_3_1_disable_tipc: true

# --- 3.2 Network Parameters (Host Only) ---
cis_3_2_network_params:
  '3_2_1_send_redirects': true
  '3_2_2_ip_forwarding': true
  '3_2_3_packet_redirects': true
  '3_2_4_source_routed_packets': true
  '3_2_5_icmp_redirects': true
  '3_2_6_secure_icmp_redirects': true
  '3_2_7_suspicious_packets': true
  '3_2_8_tcp_syncookies': true
  '3_2_9_ipv6_router_advertisements': true

# --- 3.3 Network Parameters (Host and Router) ---
cis_3_3_network_params_router:
  '3_3_1_ip_forwarding': true
  '3_3_2_send_redirects': true
  '3_3_3_source_routed_packets': true
  '3_3_4_log_martians': true
  '3_3_5_tcp_syncookies': true
  '3_3_6_ignore_icmp_broadcast': true
  '3_3_7_ignore_bogus_icmp': true
  '3_3_8_reverse_path_filtering': true
  '3_3_9_log_martians': true
  '3_3_10_tcp_syncookies': true

# =================================================================
# SECCIÓN 4: FIREWALL CONFIGURATION
# =================================================================
cis_section4_firewall: true
cis_firewall_engine: "{{ 'ufw' if ansible_facts.distribution == 'Ubuntu' else 'nftables' }}"
cis_nftables_family: "{{ 'inet' if ansible_facts.distribution == 'Debian' else 'ip' }}"

# --- 4.1 Single Firewall Utility ---
cis_4_1_single_utility: true

# --- 4.2 UFW ---
cis_4_2_ufw: "{{ cis_firewall_engine == 'ufw' }}"
cis_4_2_1_ufw_install: true
cis_4_2_2_ufw_remove_legacy: true
cis_4_2_3_ufw_enable_service: true
cis_4_2_4_ufw_configure_loopback: true
cis_4_2_5_ufw_configure_outbound: true
cis_4_2_6_ufw_rules_for_open_ports: true
cis_4_2_7_ufw_default_deny: true

cis_ufw_ssh_port: 22
cis_ufw_allowed_out_ports:
  - { port: 53, proto: udp }
  - { port: 53, proto: tcp }
  - { port: 80, proto: tcp }
  - { port: 443, proto: tcp }
  - { port: 123, proto: udp }

# --- 4.3 nftables ---
cis_4_3_nftables: "{{ cis_firewall_engine == 'nftables' }}"
cis_4_3_1_nftables_install: true
cis_4_3_2_nftables_disable_ufw: true
cis_4_3_3_nftables_flush_iptables: true
cis_4_3_4_nftables_table_exists: true
cis_4_3_5_nftables_base_chains: true
cis_4_3_6_nftables_loopback: true
cis_4_3_7_nftables_outbound: true
cis_4_3_8_nftables_default_deny: true
cis_4_3_9_nftables_service_enabled: true
cis_4_3_10_nftables_rules_permanent: true

cis_nftables_table_name: filter
cis_nftables_remove_ufw: true

# --- 4.4 iptables (Legacy) ---
cis_4_4_iptables: "{{ cis_firewall_engine == 'iptables' }}"
cis_4_4_1_1_iptables_install: true
cis_4_4_1_2_iptables_disable_nftables: true
cis_4_4_1_3_iptables_disable_ufw: true
cis_4_4_2_1_iptables_default_deny: true
cis_4_4_2_2_iptables_loopback: true
cis_4_4_2_3_iptables_outbound: true
cis_4_4_2_4_iptables_rules_for_open_ports: true
cis_4_4_3_1_ip6tables_default_deny: true
cis_4_4_3_2_ip6tables_loopback: true
cis_4_4_3_3_ip6tables_outbound: true
cis_4_4_3_4_ip6tables_rules_for_open_ports: true

cis_iptables_ssh_port: 22

# =================================================================
# SECCIÓN 5: ACCESS CONTROL - SSH SERVER CONFIGURATION
# =================================================================
cis_section5_1_ssh_server: true
cis_ssh_config:
  config_files: true
  host_keys: true
  access_control: true
  use_allow_list: true
  allowed_users_groups: "sshusers"
  banner: true
  ciphers: true
  client_alive: true
  disable_forwarding: true
  gssapi_auth: true
  hostbased_auth: true
  ignore_rhosts: true
  kex_algorithms: true
  login_grace_time: true
  log_level: true
  macs: true
  max_auth_tries: true
  max_sessions: true
  max_startups: true
  permit_empty_passwords: true
  permit_root_login: true
  permit_user_environment: true
  use_pam: true
  Ciphers: "-3des-cbc,aes128-cbc,aes192-cbc,aes256-cbc,chacha20-poly1305@openssh.com"
  ClientAliveInterval: 15
  ClientAliveCountMax: 3
  KexAlgorithms: "-diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1"
  LoginGraceTime: 60
  LogLevel: "VERBOSE"
  MACs: "-hmac-md5,hmac-md5-96,hmac-ripemd160,hmac-sha1-96,umac-64@openssh.com,hmac-md5-etm@openssh.com,hmac-md5-96-etm@openssh.com,hmac-ripemd160-etm@openssh.com,hmac-sha1-96-etm@openssh.com,umac-64-etm@openssh.com,umac-128-etm@openssh.com"
  MaxAuthTries: 4
  MaxSessions: 10
  MaxStartups: "10:30:60"
  PermitEmptyPasswords: "no"
  PermitRootLogin: "no"
  PermitUserEnvironment: "no"
  UsePAM: "yes"

# =================================================================
# SECCIÓN 5: ACCESS CONTROL - PRIVILEGE ESCALATION
# =================================================================
cis_section5_2_privilege_escalation: true
cis_5_2_1_sudo_install: true
cis_5_2_2_sudo_use_pty: true
cis_5_2_3_sudo_logfile: true
cis_5_2_4_sudo_no_password: false
cis_5_2_5_sudo_authenticate: true
cis_5_2_6_sudo_timestamp_timeout: true
cis_5_2_7_su_command_restricted: true

cis_sudo_logfile: "/var/log/sudo.log"
cis_sudo_timestamp_timeout: 15
cis_su_restricted_group: "sugroup"

# =================================================================
# SECCIÓN 5: ACCESS CONTROL - PAM CONFIGURATION
# =================================================================
cis_section5_3_pam: true

# --- 5.3.1 | PAM SOFTWARE PACKAGES ---
cis_5_3_1_1_pam_runtime: true
cis_5_3_1_2_libpam_modules: true
cis_5_3_1_3_libpam_pwquality: true

# --- 5.3.2 | PAM AUTH-UPDATE PROFILES ---
cis_5_3_2_1_pam_unix: true
cis_5_3_2_2_pam_faillock: true
cis_5_3_2_3_pam_pwquality: true
cis_5_3_2_4_pam_pwhistory: true

# --- 5.3.3 | PAM ARGUMENTS ---
# pam_faillock arguments
cis_5_3_3_1_1_faillock_deny: true
cis_5_3_3_1_2_faillock_unlock_time: true
cis_5_3_3_1_3_faillock_audit: true
cis_pam_faillock_deny: 5
cis_pam_faillock_unlock_time: 900

# pam_pwquality arguments
cis_5_3_3_2_1_pwquality_retry: true
cis_5_3_3_2_2_pwquality_minlen: true
cis_5_3_3_2_3_pwquality_dcredit: true
cis_5_3_3_2_4_pwquality_ucredit: true
cis_5_3_3_2_5_pwquality_ocredit: true
cis_5_3_3_2_6_pwquality_lcredit: true
cis_5_3_3_2_7_pwquality_difok: true
cis_5_3_3_2_8_pwquality_enforce_for_root: true
cis_pam_pwquality_retry: 3
cis_pam_pwquality_minlen: 14
cis_pam_pwquality_dcredit: -1
cis_pam_pwquality_ucredit: -1
cis_pam_pwquality_ocredit: -1
cis_pam_pwquality_lcredit: -1
cis_pam_pwquality_difok: 3

# pam_pwhistory arguments
cis_5_3_3_3_1_pwhistory_remember: true
cis_5_3_3_3_2_pwhistory_enforce_for_root: true
cis_5_3_3_3_3_pwhistory_use_authtok: true
cis_pam_pwhistory_remember: 5

# pam_unix arguments
cis_5_3_3_4_1_unix_sha512: true
cis_5_3_3_4_2_unix_obscure: true
cis_5_3_3_4_3_unix_rounds: true
cis_5_3_3_4_4_unix_use_authtok: true
cis_pam_unix_rounds: 5000

# =================================================================
# SECCIÓN 5: ACCESS CONTROL - USER ACCOUNTS CONFIGURATION
# =================================================================
cis_section5_4_user_accounts: true

# --- 5.4.1 | SHADOW PASSWORD SUITE PARAMETERS ---
cis_5_4_1_1_password_max_days: true
cis_5_4_1_2_password_min_days: true
cis_5_4_1_3_password_warn_days: true
cis_5_4_1_4_password_hashing: true
cis_5_4_1_5_password_inactive: true
cis_5_4_1_6_password_change_past: true

cis_password_max_days: 365
cis_password_min_days: 1
cis_password_warn_days: 7
cis_password_encrypt_method: "YESCRYPT"
cis_password_inactive_days: 30

# --- 5.4.2 | ROOT AND SYSTEM ACCOUNTS ---
cis_5_4_2_1_root_uid_zero: true
cis_5_4_2_2_root_gid_zero: true
cis_5_4_2_3_root_group_gid_zero: true
cis_5_4_2_4_root_access_controlled: true
cis_5_4_2_5_root_path_integrity: true
cis_5_4_2_6_root_only_uid_zero: true
cis_5_4_2_7_no_legacy_entries: true
cis_5_4_2_8_no_legacy_group_entries: true

# --- 5.4.3 | USER DEFAULT ENVIRONMENT ---
cis_5_4_3_1_nologin_not_in_shells: true
cis_5_4_3_2_default_shell_timeout: true
cis_5_4_3_3_default_umask: true

cis_default_shell_timeout: 900  # 15 minutes
cis_default_umask: "027"

# =================================================================
# SECCIÓN 6: LOGGING AND AUDITING
# =================================================================
cis_section6_logging_audit: true
# ... (resto de variables de sección 6)
