---
- name: Update grub
  ansible.builtin.command:
    argv: [update-grub]
  changed_when: true

- name: Update dconf databases
  ansible.builtin.command:
    argv: [dconf, update]
  changed_when: true

- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart postfix
  ansible.builtin.systemd_service:
    name: postfix.service
    state: restarted

- name: Rebuild exim4 configuration
  ansible.builtin.command:
    argv: [update-exim4.conf]
  changed_when: true
  listen: Restart exim4

- name: Restart exim4 service
  ansible.builtin.systemd_service:
    name: exim4.service
    state: restarted
  listen: Restart exim4

- name: Restart systemd-timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    state: restarted

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony.service
    state: restarted
