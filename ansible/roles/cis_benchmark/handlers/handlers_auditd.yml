---
# =================================================================
# CIS Benchmark 6.2: Handlers for auditd Service
# Ubuntu 24.04 LTS - Resilient Handlers with Extended Timeouts
# =================================================================

# Handler: Restart auditd service (with extended timeout for VMs)
- name: Restart auditd
  ansible.builtin.systemd:
    name: auditd.service
    state: restarted
    daemon_reload: true
  timeout: 60  # Extended timeout for VMs/Vagrant
  ignore_errors: true
  failed_when: false
  listen: "Restart auditd"

# Handler: Reload auditd configuration without full restart
- name: Reload auditd config
  ansible.builtin.command: auditctl -R /etc/audit/auditd.conf
  timeout: 30
  ignore_errors: true
  failed_when: false
  changed_when: true
  listen: "Reload auditd config"

# Handler: Update GRUB configuration (requires update-grub command)
- name: Update grub
  ansible.builtin.command: update-grub
  timeout: 30
  ignore_errors: true
  failed_when: false
  changed_when: true
  listen: "Update grub"

# Handler: Load audit rules via augenrules
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  timeout: 30
  ignore_errors: true
  failed_when: false
  changed_when: true
  listen: "Load audit rules"

# Handler: Load audit rules and warn about reboot requirement
- name: Load audit rules and warn reboot
  block:
    - name: Load audit rules
      ansible.builtin.command: augenrules --load
      timeout: 30
      ignore_errors: true
      failed_when: false
      changed_when: true

    - name: Warn about reboot requirement for immutable mode
      ansible.builtin.debug:
        msg: "⚠️  WARNING: Audit configuration is now immutable (-e 2). A system reboot is required for changes to take full effect."
  listen: "Load audit rules and warn reboot"

# Handler: Restart auditd if needed (conditional)
- name: Restart auditd if needed
  ansible.builtin.systemd:
    name: auditd.service
    state: restarted
  timeout: 60
  ignore_errors: true
  failed_when: false
  when: audit_config_changed | default(false)
  listen: "Restart auditd if needed"
