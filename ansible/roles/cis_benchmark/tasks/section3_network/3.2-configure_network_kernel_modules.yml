---
# =================================================================
# CIS 3.2 | Configure Network Kernel Modules
# Basado en CIS Benchmark Ubuntu 24.04 LTS v1.0.0
# =================================================================
# ⚠️ ADVERTENCIA: Deshabilitar módulos del kernel puede afectar funcionalidad
# =================================================================

# =================================================================
# CONTROL 3.2.1 | Ensure dccp kernel module is not available (Automated)
# Level 2 - Server/Workstation
# =================================================================
- name: "3.2.1 | Ensure dccp kernel module is not available"
  block:
    - name: "3.2.1 | AUDIT | Check if dccp module exists"
      ansible.builtin.shell: |
        find /lib/modules/$(uname -r) -name 'dccp.ko*' 2>/dev/null | head -1
      changed_when: false
      failed_when: false
      register: _dccp_module_path

    - name: "3.2.1 | AUDIT | Check if dccp is loaded"
      ansible.builtin.command: lsmod
      changed_when: false
      failed_when: false
      register: _lsmod_output

    - name: "3.2.1 | AUDIT | Check modprobe config for dccp"
      ansible.builtin.shell: |
        grep -r '^\s*\(install\|blacklist\)\s*dccp\b' /etc/modprobe.d/ 2>/dev/null || echo "not_configured"
      changed_when: false
      failed_when: false
      register: _dccp_modprobe_config

    - name: "3.2.1 | REPORT | DCCP module status"
      ansible.builtin.debug:
        msg: |
          === CIS 3.2.1 — DCCP Module Status ===
          Module file exists: {{ 'YES' if _dccp_module_path.stdout else 'NO' }}
          Module loaded: {{ 'YES' if 'dccp' in _lsmod_output.stdout else 'NO' }}
          Modprobe config: {{ _dccp_modprobe_config.stdout }}
          
          ⚠️ Para deshabilitar dccp, configure:
          section3_network['3_2_network_modules'].disable_dccp: true
      tags: [report]

    - name: "3.2.1 | Remediation | Disable dccp module"
      block:
        - name: "3.2.1 | Create modprobe config for dccp"
          ansible.builtin.copy:
            dest: "/etc/modprobe.d/cis_dccp.conf"
            content: |
              # CIS 3.2.1 - Disable DCCP kernel module
              install dccp /bin/false
              blacklist dccp
            mode: '0644'
            owner: root
            group: root
          when: _dccp_module_path.stdout | length > 0

        - name: "3.2.1 | Unload dccp if loaded"
          ansible.builtin.command: modprobe -r dccp
          when:
            - _dccp_module_path.stdout | length > 0
            - "'dccp' in _lsmod_output.stdout"
          ignore_errors: true
          changed_when: false

      when:
        - section3_network['3_2_network_modules'].disable_dccp | default(false) | bool
        - _dccp_module_path.stdout | length > 0
      tags: [remediation]

  rescue:
    - name: "3.2.1 | ERROR | DCCP remediation failed"
      ansible.builtin.debug:
        msg: "No se pudo deshabilitar módulo dccp. Verificar manualmente."

  tags:
    - cis_3
    - cis_3_2
    - cis_3_2_1
    - network
    - kernel_modules
    - dccp
    - level_2

