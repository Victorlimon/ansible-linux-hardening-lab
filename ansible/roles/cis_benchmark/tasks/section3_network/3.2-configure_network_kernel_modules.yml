---
# Persist the install override even when a module is not present in the running
# kernel: a later installed kernel must not make the protocol loadable again.

- name: "3.2 | Read modules loaded by the running kernel"
  ansible.builtin.slurp:
    src: /proc/modules
  register: _cis_loaded_network_modules
  changed_when: false
  tags:
    - cis_3
    - cis_3_2
    - cis_3_2_1
    - cis_3_2_2
    - cis_3_2_3
    - cis_3_2_4
    - network
    - kernel_modules

- name: "3.2.1 | Ensure dccp kernel module is not available"
  when: section3_network['3_2_network_modules'].disable_dccp | default(true) | bool
  block:
    - name: "3.2.1 | Persistently disable dccp"
      ansible.builtin.copy:
        dest: /etc/modprobe.d/cis_dccp.conf
        content: |
          install dccp /bin/false
          blacklist dccp
        owner: root
        group: root
        mode: '0644'
    - name: "3.2.1 | Unload dccp from the running kernel"
      community.general.modprobe:
        name: dccp
        state: absent
      when: (_cis_loaded_network_modules.content | b64decode) is regex('(?m)^dccp\\s')
  tags: [cis_3, cis_3_2, cis_3_2_1, network, kernel_modules, dccp, level_2]

- name: "3.2.2 | Ensure tipc kernel module is not available"
