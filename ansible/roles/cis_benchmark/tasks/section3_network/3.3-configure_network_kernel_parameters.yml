---
# =================================================================
# CIS 3.3 | Configure Network Kernel Parameters (Sysctl)
# Basado en CIS Benchmark Ubuntu 24.04 LTS v1.0.0
# =================================================================
# ⚠️ ADVERTENCIA CRÍTICA DE CONECTIVIDAD:
#   - 3.3.1: Deshabilitar IP forwarding puede romper routing
#   - 3.3.2/3.3.5-3.3.6: Configurar ICMP puede afectar troubleshooting
#   - 3.3.7: Reverse path filtering puede romper routing asimétrico
#   - 3.3.8: Source routing settings pueden afectar redes complejas
#   ⚠️ Verificar compatibilidad con entorno antes de aplicar!
# =================================================================

# =================================================================
# CONTROL 3.3.1 | Ensure IP forwarding is disabled (Automated)
# Level 1 - Server/Workstation
# =================================================================
- name: "3.3.1 | Ensure IP forwarding is disabled"
  block:
    - name: "3.3.1 | AUDIT | Check IPv4 forwarding"
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: _ipv4_forward
      changed_when: false
      failed_when: false

    - name: "3.3.1 | AUDIT | Check IPv6 forwarding"
      ansible.builtin.command: sysctl -n net.ipv6.conf.all.forwarding
      register: _ipv6_forward
      changed_when: false
      failed_when: false

    - name: "3.3.1 | REPORT | IP forwarding status"
      ansible.builtin.debug:
        msg: |
          === CIS 3.3.1 — IP Forwarding Status ===
          IPv4 forwarding: {{ _ipv4_forward.stdout | default('N/A') }}
          IPv6 forwarding: {{ _ipv6_forward.stdout | default('N/A') }}
          
          ⚠️ Para deshabilitar forwarding, configure:
          section3_network['3_3_network_kernel_parameters'].ip_forward_disabled: true
          
          ⚠️ ADVERTENCIA: Esto puede romper routing en sistemas multi-interfaz!
      tags: [report]

    - name: "3.3.1 | Remediation | Disable IPv4 forwarding"
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '0'
        sysctl_file: /etc/sysctl.d/99-cis-network.conf
        state: present
        reload: true
        ignoreerrors: true
      when:
        - section3_network['3_3_network_kernel_parameters'].ip_forward_disabled | default(false) | bool
        - _ipv4_forward.stdout | default('0') != '0'
      tags: [remediation]

    - name: "3.3.1 | Remediation | Disable IPv6 forwarding"
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: '0'
        sysctl_file: /etc/sysctl.d/99-cis-network.conf
        state: present
        reload: true
        ignoreerrors: true
      when:
        - section3_network['3_3_network_kernel_parameters'].ip_forward_disabled | default(false) | bool
        - _ipv6_forward.stdout | default('0') != '0'
      tags: [remediation]

  rescue:
    - name: "3.3.1 | ERROR | IP forwarding remediation failed"
      ansible.builtin.debug:
        msg: "No se pudo configurar IP forwarding. Verificar manualmente."

  tags:
    - cis_3
    - cis_3_3
    - cis_3_3_1
    - network
    - sysctl
    - ip_forward
    - level_1

- name: "CIS 3.3.1 | Remediation | Ensure IP forwarding is disabled"
  when: section3_network['3_3_network_kernel_parameters'].ip_forward_disabled | default(true)
  block:
    - name: "CIS 3.3.1 | AUDIT | Check IP forwarding status"
      ansible.builtin.command: sysctl net.ipv4.ip_forward
      register: _cis_ip_forward_current
      changed_when: false
      failed_when: false
      tags: ['section3', 'network', 'cis_3.3.1', 'sysctl', 'audit']

    - name: "CIS 3.3.1 | AUDIT | Check IPv6 forwarding status"
      ansible.builtin.command: sysctl net.ipv6.conf.all.forwarding
      register: _cis_ipv6_forward_current
      changed_when: false
      failed_when: false
      tags: ['section3', 'network', 'cis_3.3.1', 'sysctl', 'audit']

    - name: "CIS 3.3.1 | Remediation | Configure net.ipv4.ip_forward = 0"
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '0'
        sysctl_file: /etc/sysctl.d/99-cis-network.conf
        state: present
        reload: yes
        ignoreerrors: yes
      when: _cis_ip_forward_current.stdout | default('') | trim | regex_replace('^.*=\\s*', '') | int != 0
      tags: ['section3', 'network', 'cis_3.3.1', 'sysctl', 'remediation']

    - name: "CIS 3.3.1 | Remediation | Configure net.ipv6.conf.all.forwarding = 0"
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: '0'
        sysctl_file: /etc/sysctl.d/99-cis-network.conf
        state: present
        reload: yes
        ignoreerrors: yes
      when: _cis_ipv6_forward_current.stdout | default('') | trim | regex_replace('^.*=\\s*', '') | int != 0
      tags: ['section3', 'network', 'cis_3.3.1', 'sysctl', 'remediation']

