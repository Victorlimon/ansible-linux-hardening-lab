---
# CIS Ubuntu 24.04 LTS 3.3. The same late-loading file is used for every
# parameter so the persistent and running configurations cannot diverge.

- name: "3.3.1 | Ensure IP forwarding is disabled"
  when: section3_network['3_3_network_kernel_parameters'].ip_forward_disabled | default(true) | bool
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-network.conf
    sysctl_set: true
    reload: true
  loop: >-
    {{ ['net.ipv4.ip_forward'] +
       (['net.ipv6.conf.all.forwarding']
        if section3_network['3_1_network_devices'].ipv6_enabled | default(true) | bool
        else []) }}
  tags: [cis_3, cis_3_3, cis_3_3_1, network, sysctl, level_1]

- name: "3.3.2 | Ensure packet redirect sending is disabled"
  when: section3_network['3_3_network_kernel_parameters'].send_redirects_disabled | default(true) | bool
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-network.conf
    sysctl_set: true
    reload: true
  loop:
    - net.ipv4.conf.all.send_redirects
    - net.ipv4.conf.default.send_redirects
  tags: [cis_3, cis_3_3, cis_3_3_2, network, sysctl, level_1]

- name: "3.3.3 | Ensure bogus ICMP responses are ignored"
  when: section3_network['3_3_network_kernel_parameters'].icmp_ignore_bogus | default(true) | bool
  ansible.posix.sysctl:
    name: net.ipv4.icmp_ignore_bogus_error_responses
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-network.conf
    sysctl_set: true
    reload: true
  tags: [cis_3, cis_3_3, cis_3_3_3, network, sysctl, level_1]

- name: "3.3.4 | Ensure broadcast ICMP requests are ignored"
  when: section3_network['3_3_network_kernel_parameters'].icmp_echo_ignore_broadcasts | default(true) | bool
  ansible.posix.sysctl:
    name: net.ipv4.icmp_echo_ignore_broadcasts
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-network.conf
    sysctl_set: true
    reload: true
  tags: [cis_3, cis_3_3, cis_3_3_4, network, sysctl, level_1]

- name: "3.3.5 | Ensure ICMP redirects are not accepted"
  when: section3_network['3_3_network_kernel_parameters'].accept_redirects_disabled | default(true) | bool
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-network.conf
    sysctl_set: true
    reload: true
  loop: >-
    {{ ['net.ipv4.conf.all.accept_redirects',
        'net.ipv4.conf.default.accept_redirects'] +
       (['net.ipv6.conf.all.accept_redirects',
         'net.ipv6.conf.default.accept_redirects']
        if section3_network['3_1_network_devices'].ipv6_enabled | default(true) | bool
        else []) }}
  tags: [cis_3, cis_3_3, cis_3_3_5, network, sysctl, ipv6, level_1]

- name: "3.3.6 | Ensure secure ICMP redirects are not accepted"
  when: section3_network['3_3_network_kernel_parameters'].secure_redirects_disabled | default(true) | bool
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-network.conf
    sysctl_set: true
    reload: true
  loop:
    - net.ipv4.conf.all.secure_redirects
    - net.ipv4.conf.default.secure_redirects
  tags: [cis_3, cis_3_3, cis_3_3_6, network, sysctl, level_1]

- name: "3.3.7 | Ensure reverse path filtering is enabled"
  when: section3_network['3_3_network_kernel_parameters'].rp_filter_enabled | default(true) | bool
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-network.conf
    sysctl_set: true
    reload: true
  loop:
    - net.ipv4.conf.all.rp_filter
    - net.ipv4.conf.default.rp_filter
  tags: [cis_3, cis_3_3, cis_3_3_7, network, sysctl, level_1]

- name: "3.3.8 | Ensure source routed packets are not accepted"
  when: section3_network['3_3_network_kernel_parameters'].accept_source_route_disabled | default(true) | bool
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-network.conf
    sysctl_set: true
    reload: true
  loop: >-
    {{ ['net.ipv4.conf.all.accept_source_route',
        'net.ipv4.conf.default.accept_source_route'] +
       (['net.ipv6.conf.all.accept_source_route',
         'net.ipv6.conf.default.accept_source_route']
        if section3_network['3_1_network_devices'].ipv6_enabled | default(true) | bool
        else []) }}
  tags: [cis_3, cis_3_3, cis_3_3_8, network, sysctl, ipv6, level_1]

- name: "3.3.9 | Ensure suspicious packets are logged"
  when: section3_network['3_3_network_kernel_parameters'].log_martians | default(true) | bool
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-network.conf
    sysctl_set: true
    reload: true
  loop:
    - net.ipv4.conf.all.log_martians
    - net.ipv4.conf.default.log_martians
  tags: [cis_3, cis_3_3, cis_3_3_9, network, sysctl, level_1]
