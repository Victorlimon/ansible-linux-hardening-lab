---
- name: "3.1.2 | Persistently disable wireless module {{ _module }}"
  ansible.builtin.copy:
    dest: "/etc/modprobe.d/cis_{{ _module }}.conf"
    content: |
      install {{ _module }} /bin/false
      blacklist {{ _module }}
    owner: root
    group: root
    mode: '0644'
  tags: [cis_3, cis_3_1, cis_3_1_2, network, wireless, level_1]

- name: "3.1.2 | Unload wireless module {{ _module }}"
  community.general.modprobe:
    name: "{{ _module }}"
    state: absent
  tags: [cis_3, cis_3_1, cis_3_1_2, network, wireless, level_1]
