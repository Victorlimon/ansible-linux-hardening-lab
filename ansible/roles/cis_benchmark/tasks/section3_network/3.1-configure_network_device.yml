---
- name: "3.1.2 | Ensure wireless interfaces are disabled"
  when: section3_network['3_1_network_devices'].wireless_disabled | default(false) | bool
  block:
    - name: "3.1.2 | Find wireless interfaces"
      ansible.builtin.command:
        argv:
          - find
          - -L
          - /sys/class/net
          - -path
          - '*/wireless'
          - -type
          - d
      register: _cis_wireless_paths
      changed_when: false

    - name: "3.1.2 | Inspect wireless driver module links"
      ansible.builtin.stat:
        path: "{{ item | dirname }}/device/driver/module"
        follow: false
      loop: "{{ _cis_wireless_paths.stdout_lines }}"
      register: _cis_wireless_module_links

    - name: "3.1.2 | Disable detected wireless driver modules"
      ansible.builtin.include_tasks: _disable_network_module.yml
      loop: >-
        {{ _cis_wireless_module_links.results | default([]) |
           selectattr('stat.lnk_source', 'defined') |
           map(attribute='stat.lnk_source') | map('basename') | unique | list }}
      loop_control:
        loop_var: _module
        label: "{{ _module }}"
  tags: [cis_3, cis_3_1, cis_3_1_2, network, wireless, level_1]

- name: "3.1.3 | Ensure Bluetooth services are not in use"
  when: section3_network['3_1_network_devices'].bluetooth_disabled | default(false) | bool
  ansible.builtin.apt:
    name: bluez
    state: absent
    purge: true
  tags: [cis_3, cis_3_1, cis_3_1_3, network, bluetooth, level_1]
