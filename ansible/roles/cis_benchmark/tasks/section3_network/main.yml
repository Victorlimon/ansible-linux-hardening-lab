---
# =================================================================
# SECCIÓN 3: NETWORK CONFIGURATION
# Basado en CIS Benchmark Ubuntu 24.04 LTS v1.0.0
# =================================================================
# IMPORTANTE: Usar import_tasks (estático) para que los tags funcionen correctamente
# con --tags cis_3_X. Los tags son acumulativos para ejecución modular.
# =================================================================

- name: "Include 3.1 | Configure network devices"
  when: section3_network['3_1_network_devices'] is defined
  ansible.builtin.import_tasks: 3.1-configure_network_device.yml
  tags:
    - cis_3
    - cis_3_1
    - cis_3_1_1
    - cis_3_1_2
    - cis_3_1_3
    - network
    - network_devices
    - ipv6
    - wireless
    - bluetooth
    - level_1

- name: "Include 3.2 | Configure network kernel modules"
  when: section3_network['3_2_network_modules'] is defined
  ansible.builtin.import_tasks: 3.2-configure_network_kernel_modules.yml
  tags:
    - cis_3
    - cis_3_2
    - cis_3_2_1
    - cis_3_2_2
    - cis_3_2_3
    - cis_3_2_4
    - network
    - network_modules
    - kernel_modules
    - dccp
    - tipc
    - rds
    - sctp
    - level_2

- name: "Include 3.3 | Configure network kernel parameters (sysctl)"
  when: section3_network['3_3_network_kernel_parameters'] is defined
  ansible.builtin.import_tasks: 3.3-configure_network_kernel_parameters.yml
  tags:
    - cis_3
    - cis_3_3
    - cis_3_3_1
    - cis_3_3_2
    - cis_3_3_3
    - cis_3_3_4
    - cis_3_3_5
    - cis_3_3_6
    - cis_3_3_7
    - cis_3_3_8
    - cis_3_3_9
    - cis_3_3_10
    - network
    - network_sysctl
    - sysctl
    - level_1