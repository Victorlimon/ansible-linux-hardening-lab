---
# ==============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 2.2: Configure Client Services
# Hardening idempotente, basado en facts y compatible con --check
# ==============================================================================

# 2.2.1 | Ensure NIS Client is not installed
- name: "CIS 2.2.1 | Remediation | Ensure NIS Client is not installed"
  ansible.builtin.apt:
    name: nis
    state: absent
    purge: true
  when:
    - cis_section2_services | default(true)
    - cis_2_2_client_services['2_2_1_nis_client'] | default(true)
    - "'nis' in ansible_facts.packages"
  tags: ['cis_sec2', 'cis_2.2.1', 'level1-server', 'level1-workstation', 'NIST800-53R5_CM-7', 'NIST800-53R5_CM-11']

