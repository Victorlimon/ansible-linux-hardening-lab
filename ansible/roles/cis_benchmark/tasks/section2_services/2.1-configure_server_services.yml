# 2.1.21 | Ensure mail transfer agent is configured for local-only mode
- name: "CIS 2.1.21 | Remediation | Ensure mail transfer agent is configured for local-only mode"
  block:
    - name: "CIS 2.1.21 | Configure postfix for local-only mode"
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: '^inet_interfaces\s*='
        line: 'inet_interfaces = loopback-only'
        create: false
      notify: Restart postfix
      when: "'postfix' in ansible_facts.packages"

    - name: "CIS 2.1.21 | Configure exim4 for local-only mode"
      ansible.builtin.lineinfile:
        path: /etc/exim4/update-exim4.conf.conf
        regexp: '^dc_local_interfaces='
        line: "dc_local_interfaces='127.0.0.1 ; ::1'"
        create: false
      notify: Restart exim4
      when: "'exim4-base' in ansible_facts.packages"
  when:
    - cis_section2_services | default(true)
    - cis_2_1_server_services['2_1_21_mta_local_only'] | default(true)
  tags: ['cis_sec2', 'cis_2.1.21', 'level1-server', 'level1-workstation', 'NIST800-53R5_CM-7']

# 2.1.22 | Ensure only approved services are listening on a network interface
- name: "CIS 2.1.22 | Audit | List services listening on network interfaces"
  ansible.builtin.command:
    argv: [ss, -plntu]
  register: _cis_listening_services
  changed_when: false
  check_mode: false
  when:
    - cis_section2_services | default(true)
    - cis_2_1_server_services['2_1_22_listening_services'] | default(true)
  tags: ['cis_sec2', 'cis_2.1.22']

- name: "CIS 2.1.22 | Manual | Report listening services for approval"
  ansible.builtin.debug:
    msg:
      - "MANUAL: Verify every listening service, port, and interface against local site policy."
      - "{{ _cis_listening_services.stdout_lines }}"
  when:
    - cis_section2_services | default(true)
    - cis_2_1_server_services['2_1_22_listening_services'] | default(true)
  tags: ['cis_sec2', 'cis_2.1.22']
