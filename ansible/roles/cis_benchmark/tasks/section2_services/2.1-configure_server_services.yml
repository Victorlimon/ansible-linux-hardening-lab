# 2.1.18 | Ensure web server services are not in use
- name: "CIS 2.1.18 | Remediation | Ensure web server services are not in use"
  block:
    - name: "CIS 2.1.18 | Stop and mask Apache services (dependency required)"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: ['apache2.socket', 'apache2.service']
      when:
        - "'apache2' in ansible_facts.packages"
        - cis_2_1_required_services.apache2 | default(false)
        - item in ansible_facts.services

    - name: "CIS 2.1.18 | Remove Apache package"
      ansible.builtin.apt:
        name: apache2
        state: absent
        purge: true
      when:
        - "'apache2' in ansible_facts.packages"
        - not (cis_2_1_required_services.apache2 | default(false))

    - name: "CIS 2.1.18 | Stop and mask Nginx service (dependency required)"
      ansible.builtin.systemd_service:
        name: nginx.service
        state: stopped
        enabled: false
        masked: true
      when:
        - "'nginx' in ansible_facts.packages"
        - cis_2_1_required_services.nginx | default(false)
        - "'nginx.service' in ansible_facts.services"

    - name: "CIS 2.1.18 | Remove Nginx package"
      ansible.builtin.apt:
        name: nginx
        state: absent
        purge: true
      when:
        - "'nginx' in ansible_facts.packages"
        - not (cis_2_1_required_services.nginx | default(false))
  when:
    - cis_section2_services | default(true)
    - cis_2_1_server_services['2_1_18_webserver'] | default(true)
    - "'apache2' in ansible_facts.packages or 'nginx' in ansible_facts.packages"
  tags: ['cis_sec2', 'cis_2.1.18', 'level1-server', 'level1-workstation', 'NIST800-53R5_CM-7']

