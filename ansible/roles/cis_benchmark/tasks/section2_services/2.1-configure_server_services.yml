---
# ==============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 2.1: Configure Server Services
# Hardening idempotente, basado en facts y compatible con --check
# ==============================================================================

# 2.1.1 | Ensure autofs services are not in use
- name: "CIS 2.1.1 | Remediation | Ensure autofs services are not in use"
  block:
    - name: "CIS 2.1.1 | Stop and mask autofs service (dependency required)"
      ansible.builtin.systemd:
        name: autofs
        state: stopped
        enabled: false
        masked: true
      when: cis_2_1_required_services.autofs | default(false)

    - name: "CIS 2.1.1 | Remove autofs package"
      ansible.builtin.apt:
        name: autofs
        state: absent
        purge: true
      when: not (cis_2_1_required_services.autofs | default(false))
  when:
    - cis_section2_services | default(true)
    - cis_2_1_server_services['2_1_1_autofs'] | default(true)
    - "'autofs' in ansible_facts.packages"
  tags: ['cis_sec2', 'cis_2.1.1', 'level1-server', 'level2-workstation', 'NIST800-53R5_SI-3', 'NIST800-53R5_MP-7']

