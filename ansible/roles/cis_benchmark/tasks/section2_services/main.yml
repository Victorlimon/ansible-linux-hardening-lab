---
# ==============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 2: Services
# Main entry point - Imports all subsections
# ==============================================================================

- name: Gather package facts for Section 2
  ansible.builtin.package_facts:
    manager: auto
  tags: always

- name: Gather service facts for Section 2
  ansible.builtin.service_facts:
  tags: always

- name: "CIS Section 2.1 | Configure Server Services"
  ansible.builtin.import_tasks: 2.1-configure_server_services.yml
  tags: ['cis_sec2', 'cis_2.1']

- name: "CIS Section 2.2 | Configure Client Services"
  ansible.builtin.import_tasks: 2.2-configure_client_services.yml
  tags: ['cis_sec2', 'cis_2.2']

- name: "CIS Section 2.3 | Configure Time Synchronization"
  ansible.builtin.import_tasks: 2.3-configure_synchronization/main.yml
  tags: ['cis_sec2', 'cis_2.3']

- name: "CIS Section 2.4 | Configure Job Schedulers"
  ansible.builtin.import_tasks: 2.4-Job_Schedulers/main.yml
  tags: ['cis_sec2', 'cis_2.4']
