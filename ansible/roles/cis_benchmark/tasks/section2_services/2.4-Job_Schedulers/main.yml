---
# ==============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 2.4: Job Schedulers
# Hardening idempotente, basado en facts y compatible con --check
# ==============================================================================

# 2.4.1.1 | Ensure cron daemon is enabled and active
- name: "CIS 2.4.1.1 | Remediation | Ensure cron daemon is enabled and active"
  block:
    - name: "CIS 2.4.1.1 | Install cron package"
      ansible.builtin.apt:
        name: cron
        state: present

    - name: "CIS 2.4.1.1 | Unmask, enable and start cron service"
      ansible.builtin.systemd:
        name: cron.service
        state: started
        enabled: true
        masked: false
  when:
    - cis_section2_services | default(true)
    - cis_2_4_job_schedulers['2_4_1_1_cron_enabled'] | default(true)
  tags: ['cis_sec2', 'cis_2.4.1.1', 'level1-server', 'level1-workstation', 'NIST800-53R5_CM-1', 'NIST800-53R5_CM-2', 'NIST800-53R5_CM-6', 'NIST800-53R5_CM-7', 'NIST800-53R5_IA-5']

# 2.4.1.3 | Ensure permissions on /etc/cron.hourly are configured
- name: "CIS 2.4.1.3 | Remediation | Ensure permissions on /etc/cron.hourly are configured"
  ansible.builtin.file:
    path: /etc/cron.hourly
    state: directory
    owner: root
    group: root
    mode: '0700'
  when:
    - cis_section2_services | default(true)
    - cis_2_4_job_schedulers['2_4_1_3_cron_hourly_perms'] | default(true)
  tags: ['cis_sec2', 'cis_2.4.1.3', 'level1-server', 'level1-workstation', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']

