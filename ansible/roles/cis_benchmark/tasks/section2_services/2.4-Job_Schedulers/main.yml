  tags: ['cis_sec2', 'cis_2.4.1.5', 'level1-server', 'level1-workstation', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']

# 2.4.1.6 | Ensure permissions on /etc/cron.monthly are configured
- name: "CIS 2.4.1.6 | Remediation | Ensure permissions on /etc/cron.monthly are configured"
  ansible.builtin.file:
