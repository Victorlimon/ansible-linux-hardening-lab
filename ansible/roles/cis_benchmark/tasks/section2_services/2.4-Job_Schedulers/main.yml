  when:
    - cis_section2_services | default(true)
    - cis_2_4_job_schedulers['2_4_1_7_cron_d_perms'] | default(true)
  tags: ['cis_sec2', 'cis_2.4.1.7', 'level1-server', 'level1-workstation', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']

# 2.4.1.8 | Ensure crontab is restricted to authorized users
- name: "CIS 2.4.1.8 | Remediation | Ensure crontab is restricted to authorized users"
  block:
    - name: "CIS 2.4.1.8 | Audit | Gather local groups"
      ansible.builtin.getent:
        database: group

    - name: "CIS 2.4.1.8 | Remediation | Ensure /etc/cron.allow exists"
      ansible.builtin.copy:
        dest: /etc/cron.allow
        content: ''
        force: false
        owner: root
        group: "{{ 'crontab' if 'crontab' in ansible_facts.getent_group else 'root' }}"
        mode: '0640'

    - name: "CIS 2.4.1.8 | Remove /etc/cron.deny to enforce allow list"
      ansible.builtin.file:
        path: /etc/cron.deny
        state: absent
  when:
    - cis_section2_services | default(true)
    - cis_2_4_job_schedulers['2_4_1_8_cron_allow'] | default(true)
  tags: ['cis_sec2', 'cis_2.4.1.8', 'level1-server', 'level1-workstation', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']

# 2.4.2.1 | Ensure at is restricted to authorized users
- name: "CIS 2.4.2.1 | Remediation | Ensure at is restricted to authorized users"
  block:
    - name: "CIS 2.4.2.1 | Audit | Gather local groups"
      ansible.builtin.getent:
        database: group

    - name: "CIS 2.4.2.1 | Remediation | Ensure /etc/at.allow exists"
      ansible.builtin.copy:
        dest: /etc/at.allow
        content: ''
        force: false
        owner: root
        group: "{{ 'daemon' if 'daemon' in ansible_facts.getent_group else 'root' }}"
        mode: '0640'

    - name: "CIS 2.4.2.1 | Remove /etc/at.deny to enforce allow list"
      ansible.builtin.file:
        path: /etc/at.deny
        state: absent
  when:
    - cis_section2_services | default(true)
    - cis_2_4_job_schedulers['2_4_2_1_at_allow'] | default(true)
    - "'at' in ansible_facts.packages"
  tags: ['cis_sec2', 'cis_2.4.2.1', 'level1-server', 'level1-workstation', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']
