---
# =============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 4.2: Configure UFW
# Nota: Este archivo se ejecuta solo si cis_firewall_engine == 'ufw'
#       (auto-seleccionado para Ubuntu 24.04)
# =============================================================================

- name: "CIS 4.2.1 | Remediation | Ensure ufw is installed"
  when:
    - cis_4_2_1_ufw_install | default(true)
    - "'ufw' not in ansible_facts.packages"
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: yes
  tags: ['cis_sec4', 'cis_4.2.1', 'ufw', 'level1', 'NIST800-53R5_SC-7']

- name: "CIS 4.2.2 | Remediation | Ensure iptables-persistent is not installed with ufw"
  when:
    - cis_4_2_2_ufw_remove_legacy | default(true)
    - "'iptables-persistent' in ansible_facts.packages"
  ansible.builtin.apt:
    name: iptables-persistent
    state: absent
    purge: yes
  tags: ['cis_sec4', 'cis_4.2.2', 'ufw', 'level1', 'NIST800-53R5_SC-7']

- name: "CIS 4.2.3 | Remediation | Ensure ufw service is enabled"
  when: cis_4_2_3_ufw_enable_service | default(true)
  block:
    - name: "CIS 4.2.3 | Allow SSH port"
      community.general.ufw:
        rule: allow
        port: "{{ cis_ufw_ssh_port | default(22) }}"
        proto: tcp
      notify: restart_ufw_service
      when: "'ufw' in ansible_facts.packages"

    - name: "CIS 4.2.3 | Enable and start UFW service"
      ansible.builtin.systemd:
        name: ufw
        enabled: true
        state: started
      when: "'ufw.service' in ansible_facts.services"
  tags: ['cis_sec4', 'cis_4.2.3', 'ufw', 'level1', 'NIST800-53R5_SC-7']

- name: "CIS 4.2.4 | Remediation | Ensure ufw loopback traffic is configured"
  when:
    - cis_4_2_4_ufw_configure_loopback | default(true)
    - "'ufw' in ansible_facts.packages"
    - ansible_facts.services['ufw.service'].state == 'running' | default(false)
  block:
    - name: "CIS 4.2.4 | Allow loopback inbound traffic"
      community.general.ufw:
        rule: allow
        direction: in
        interface: lo
      notify: restart_ufw_service

    - name: "CIS 4.2.4 | Allow loopback outbound traffic"
      community.general.ufw:
        rule: allow
        direction: out
        interface: lo
      notify: restart_ufw_service

    - name: "CIS 4.2.4 | Deny spoofed IPv4 loopback traffic"
      community.general.ufw:
        rule: deny
        direction: in
        from_ip: 127.0.0.0/8
      notify: restart_ufw_service

    - name: "CIS 4.2.4 | Deny spoofed IPv6 loopback traffic"
      community.general.ufw:
        rule: deny
        direction: in
        from_ip: "::1"
      notify: restart_ufw_service
  tags: ['cis_sec4', 'cis_4.2.4', 'ufw', 'level1', 'NIST800-53R5_SC-7']

- name: "CIS 4.2.5 | Remediation | Ensure ufw outbound connections are configured"
  when:
    - cis_4_2_5_ufw_configure_outbound | default(true)
    - "'ufw' in ansible_facts.packages"
    - ansible_facts.services['ufw.service'].state == 'running' | default(false)
  block:
    - name: "CIS 4.2.5 | Allow custom outbound ports"
      when: cis_ufw_allow_out_ports != "all"
      community.general.ufw:
        rule: allow
        direction: out
        proto: "{{ item.proto }}"
        port: "{{ item.port }}"
      loop: "{{ cis_ufw_allow_out_ports }}"
      loop_control:
        label: "{{ item.port }}"
      notify: restart_ufw_service

    - name: "CIS 4.2.5 | Allow all outbound traffic"
      when: cis_ufw_allow_out_ports == "all"
      community.general.ufw:
        direction: outgoing
        policy: allow
      notify: restart_ufw_service
  tags: ['cis_sec4', 'cis_4.2.5', 'ufw', 'level1', 'NIST800-53R5_SC-7']

- name: "CIS 4.2.6 | Remediation | Ensure ufw firewall rules exist for all open ports"
  when:
    - cis_4_2_6_ufw_rules_for_open_ports | default(true)
    - "'ufw' in ansible_facts.packages"
    - ansible_facts.services['ufw.service'].state == 'running' | default(false)
  block:
    - name: "CIS 4.2.6 | AUDIT | List open ports (non-loopback)"
      ansible.builtin.shell: |
        ss -tuln | awk '($5!~/%lo:/ && $5!~/127.0.0.1:/ && $5!~/\[?::1\]?:/) {split($5, a, ":"); print a[2]}' | sort -u
      changed_when: false
      failed_when: false
      check_mode: false
      register: _cis_open_ports

    - name: "CIS 4.2.6 | AUDIT | List ports with UFW rules"
      ansible.builtin.shell: ufw status verbose | grep -Po '^\h*\d+\b' | sort -u
      changed_when: false
      failed_when: false
      check_mode: false
      register: _cis_ufw_ports

    - name: "CIS 4.2.6 | REPORT | Display ports without rules"
      ansible.builtin.debug:
        msg:
          - "=== CIS 4.2.6 — Ports without UFW rules ==="
          - "Open ports: {{ _cis_open_ports.stdout_lines }}"
          - "UFW rules: {{ _cis_ufw_ports.stdout_lines }}"
          - "Missing rules: {{ _cis_open_ports.stdout_lines | difference(_cis_ufw_ports.stdout_lines) }}"
      when: _cis_open_ports.stdout_lines | difference(_cis_ufw_ports.stdout_lines) | length > 0

    - name: "CIS 4.2.6 | Remediation | Add rules for missing ports (site policy)"
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ cis_ufw_allowed_ports | default(_cis_open_ports.stdout_lines | difference(_cis_ufw_ports.stdout_lines)) }}"
      when: item in (_cis_open_ports.stdout_lines | difference(_cis_ufw_ports.stdout_lines))
      notify: restart_ufw_service
  tags: ['cis_sec4', 'cis_4.2.6', 'ufw', 'level1', 'NIST800-53R5_SC-7']

- name: "CIS 4.2.7 | Remediation | Ensure ufw default deny firewall policy"
  when:
    - cis_4_2_7_ufw_default_deny | default(true)
    - "'ufw' in ansible_facts.packages"
    - ansible_facts.services['ufw.service'].state == 'running' | default(false)
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: deny }
    - { direction: routed, policy: deny }
  notify: restart_ufw_service
  tags: ['cis_sec4', 'cis_4.2.7', 'ufw', 'level1', 'NIST800-53R5_SC-7']
