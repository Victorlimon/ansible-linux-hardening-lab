---
- name: "4.2 | Validate the explicit UFW policy"
  ansible.builtin.assert:
    that:
      - cis_ufw_ssh_port | int >= 1
      - cis_ufw_ssh_port | int <= 65535
      - (cis_ufw_ssh_allowed_sources | default(['any'])) | length > 0
      - (cis_ufw_ssh_allowed_sources | default(['any'])) is not string
      - (cis_ufw_allowed_out_ports | default([])) is iterable
      - (cis_ufw_allowed_out_ports | default([])) is not string
      - (cis_ufw_allowed_in_rules | default([])) is iterable
      - (cis_ufw_allowed_in_rules | default([])) is not string
      - >-
        cis_ufw_ssh_allowed_sources |
        intersect(['192.0.2.0/24', '198.51.100.0/24', '203.0.113.0/24']) |
        length == 0
    fail_msg: >-
      UFW requires an SSH port, at least one explicit SSH source, and list-valued
      inbound/outbound allowlists. No listener-discovered rule is ever opened.
  tags:
    - cis_sec4
    - cis_4_2
    - cis_4_2_1
    - cis_4_2_2
    - cis_4_2_3
    - cis_4_2_4
    - cis_4_2_5
    - cis_4_2_6
    - cis_4_2_7
    - ufw

- name: "4.2.1 | Ensure UFW is installed before policy inspection"
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: cis_4_2_1_ufw_install | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_1, ufw, level1]

- name: "4.2 | Validate SSH management sources"
  ansible.builtin.assert:
    that:
      - item is string
      - item | lower != 'any'
      - item is not match('^(192\.0\.2\.|198\.51\.100\.|203\.0\.113\.|2001:db8:)')
    fail_msg: "Use an approved management CIDR; 'any' and documentation networks are refused."
  loop: "{{ cis_ufw_ssh_allowed_sources }}"
  loop_control:
    label: "{{ item }}"
  tags: [cis_sec4, cis_4_2, cis_4_2_3, ufw, firewall]

- name: "4.2 | Validate SSH management CIDR syntax"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import ipaddress, sys;
        ipaddress.ip_network(sys.argv[1], strict=True)
      - "{{ item }}"
  loop: "{{ cis_ufw_ssh_allowed_sources }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  check_mode: false
  tags: [cis_sec4, cis_4_2, cis_4_2_3, ufw, firewall]

- name: "4.2 | Validate outbound UFW rules"
  ansible.builtin.assert:
    that:
      - item.port is defined
      - item.port | int >= 1
      - item.port | int <= 65535
      - item.proto is defined
      - item.proto in ['tcp', 'udp']
    fail_msg: "Every outbound rule requires a TCP/UDP protocol and a port from 1 to 65535."
  loop: "{{ cis_ufw_allowed_out_ports | default([]) }}"
  loop_control:
    label: "{{ item }}"
  tags: [cis_sec4, cis_4_2, cis_4_2_5, ufw, firewall]

- name: "4.2 | Validate outbound destination CIDR syntax"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import ipaddress, sys;
        ipaddress.ip_network(sys.argv[1], strict=True)
      - "{{ item.to_ip }}"
  loop: "{{ cis_ufw_allowed_out_ports | default([]) }}"
  loop_control:
    label: "{{ item.to_ip | default('any') }}"
  when: item.to_ip | default('any') | lower != 'any'
  changed_when: false
  check_mode: false
  tags: [cis_sec4, cis_4_2, cis_4_2_5, ufw, firewall]

- name: "4.2 | Validate inbound UFW rules"
  ansible.builtin.assert:
    that:
      - item.port is defined
      - item.port | int >= 1
      - item.port | int <= 65535
      - item.proto is defined
      - item.proto in ['tcp', 'udp']
      - item.from_ip | default('any') is string
      - item.to_ip | default('any') is string
      - item.interface_in | default('') is match('^[A-Za-z0-9_.:-]*$')
    fail_msg: "Every inbound rule requires a TCP/UDP protocol and a port from 1 to 65535."
  loop: "{{ cis_ufw_allowed_in_rules | default([]) }}"
  loop_control:
    label: "{{ item }}"
  tags: [cis_sec4, cis_4_2, cis_4_2_6, ufw, firewall]

- name: "4.2 | Validate inbound source CIDR syntax"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import ipaddress, sys;
        ipaddress.ip_network(sys.argv[1], strict=True)
      - "{{ item.from_ip }}"
  loop: "{{ cis_ufw_allowed_in_rules | default([]) }}"
  loop_control:
    label: "{{ item.from_ip | default('any') }}"
  when: item.from_ip | default('any') | lower != 'any'
  changed_when: false
  check_mode: false
  tags: [cis_sec4, cis_4_2, cis_4_2_6, ufw, firewall]

- name: "4.2 | Validate inbound destination IP syntax"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import ipaddress, sys;
        ipaddress.ip_network(sys.argv[1], strict=True)
      - "{{ item.to_ip }}"
  loop: "{{ cis_ufw_allowed_in_rules | default([]) }}"
  loop_control:
    label: "{{ item.to_ip | default('any') }}"
  when: item.to_ip | default('any') | lower != 'any'
  changed_when: false
  check_mode: false
  tags: [cis_sec4, cis_4_2, cis_4_2_6, ufw, firewall]

- name: "4.2 | Read effective IPv6 kernel state"
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -n, net.ipv6.conf.all.disable_ipv6]
  register: _cis_ufw_ipv6_disabled
  changed_when: false
  check_mode: false
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Inspect UFW IPv6 configuration"
  ansible.builtin.stat:
    path: /etc/default/ufw
  register: _cis_ufw_defaults_file
  check_mode: false
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Read UFW IPv6 configuration"
  ansible.builtin.slurp:
    src: /etc/default/ufw
  register: _cis_ufw_defaults
  check_mode: false
  when: _cis_ufw_defaults_file.stat.exists
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Require declared, kernel, and UFW IPv6 states to agree"
  ansible.builtin.assert:
    that:
      - >-
        ((_cis_ufw_ipv6_disabled.stdout | int) == 0) ==
        (section3_network['3_1_network_devices'].ipv6_enabled | default(true) | bool)
      - >-
        ansible_check_mode or _cis_ufw_defaults_file.stat.exists
      - >-
        not _cis_ufw_defaults_file.stat.exists or
        (((_cis_ufw_defaults.content | default('') | b64decode |
           regex_search('(?im)^\s*IPV6=yes\s*$')) is not none) ==
         (section3_network['3_1_network_devices'].ipv6_enabled | default(true) | bool))
    fail_msg: >-
      The declared IPv6 policy, kernel state, and /etc/default/ufw IPV6 setting
      must agree before rebuilding firewall rules.
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Calculate the authoritative UFW policy fingerprint"
  ansible.builtin.set_fact:
    _cis_ufw_policy_fingerprint: >-
      {{ {
        'ssh_port': cis_ufw_ssh_port | int,
        'ssh_sources': cis_ufw_ssh_allowed_sources,
        'inbound': cis_ufw_allowed_in_rules | default([]),
        'outbound': cis_ufw_allowed_out_ports | default([]),
        'configure_outbound': cis_4_2_5_ufw_configure_outbound | bool,
        'configure_inbound': cis_4_2_6_ufw_rules_for_open_ports | bool,
        'enable_service': cis_4_2_3_ufw_enable_service | bool,
        'loopback': cis_4_2_4_ufw_configure_loopback | bool,
        'default_deny': cis_4_2_7_ufw_default_deny | bool,
        'ipv6': section3_network['3_1_network_devices'].ipv6_enabled | default(true) | bool
      } | to_json | hash('sha256') }}
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Inspect the current IPv4 UFW rules file"
  ansible.builtin.stat:
    path: /etc/ufw/user.rules
    checksum_algorithm: sha256
  register: _cis_ufw_ipv4_rules_before
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Inspect the current IPv6 UFW rules file"
  ansible.builtin.stat:
    path: /etc/ufw/user6.rules
    checksum_algorithm: sha256
  register: _cis_ufw_ipv6_rules_before
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Calculate the current UFW rules fingerprint"
  ansible.builtin.set_fact:
    _cis_ufw_rules_fingerprint_before: >-
      {{ {
        'ipv4': _cis_ufw_ipv4_rules_before.stat.checksum | default('missing'),
        'ipv6': _cis_ufw_ipv6_rules_before.stat.checksum | default('missing')
      } | to_json | hash('sha256') }}
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Inspect the applied UFW policy marker"
  ansible.builtin.stat:
    path: "{{ cis_ufw_policy_marker }}"
  register: _cis_ufw_policy_marker_file
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Read the applied UFW policy marker"
  ansible.builtin.slurp:
    src: "{{ cis_ufw_policy_marker }}"
  register: _cis_ufw_policy_marker_content
  when: _cis_ufw_policy_marker_file.stat.exists
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Determine whether UFW requires an authoritative reset"
  ansible.builtin.set_fact:
    _cis_ufw_policy_reset_required: >-
      {{ not _cis_ufw_policy_marker_file.stat.exists or
         (_cis_ufw_policy_marker_content.content | default('') | b64decode).splitlines()
         != [_cis_ufw_policy_fingerprint, _cis_ufw_rules_fingerprint_before] }}
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Ensure the hardening state directory exists"
  ansible.builtin.file:
    path: "{{ cis_ufw_policy_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Reset stale UFW rules before applying the approved policy"
  ansible.builtin.assert:
    that:
      - cis_ufw_authoritative_reset_confirmed | bool
    fail_msg: >-
      UFW policy drift requires a destructive reset. Review --check --diff,
      keep recovery access open, and set cis_ufw_authoritative_reset_confirmed=true
      only for the approved maintenance window.
  when:
    - _cis_ufw_policy_reset_required | bool
    - not ansible_check_mode
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Reset stale UFW rules before applying the approved policy"
  community.general.ufw:
    state: reset
  when: _cis_ufw_policy_reset_required | bool
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2.2 | Ensure iptables-persistent is absent"
  ansible.builtin.apt:
    name: iptables-persistent
    state: absent
    purge: true
  when: cis_4_2_2_ufw_remove_legacy | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_2, ufw, level1]

- name: "4.2 | Check for the persistent CIS sysctl file"
  ansible.builtin.stat:
    path: /etc/sysctl.d/99-cis-network.conf
  register: _cis_network_sysctl_file
  tags: [cis_sec4, cis_4_2, cis_4_2_3, ufw]

- name: "4.2 | Prevent UFW from overriding the persistent CIS sysctls"
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^IPT_SYSCTL='
    line: IPT_SYSCTL=/etc/sysctl.d/99-cis-network.conf
  when: _cis_network_sysctl_file.stat.exists
  tags: [cis_sec4, cis_4_2, cis_4_2_3, ufw]

- name: "4.2.3 | Ensure UFW service is unmasked and enabled at boot"
  ansible.builtin.systemd_service:
    name: ufw.service
    enabled: true
    masked: false
  when: cis_4_2_3_ufw_enable_service | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_3, ufw, level1]

- name: "4.2.3 | Allow SSH before applying default deny"
  community.general.ufw:
    rule: allow
    direction: in
    from_ip: "{{ item }}"
    to_ip: any
    port: "{{ cis_ufw_ssh_port | string }}"
    proto: tcp
    comment: CIS SSH management allowlist
  loop: "{{ cis_ufw_ssh_allowed_sources | default(['any']) }}"
  loop_control:
    label: "{{ item }} -> tcp/{{ cis_ufw_ssh_port }}"
  tags: [cis_sec4, cis_4_2, cis_4_2_3, ufw, ssh, level1]

- name: "4.2.4 | Allow loopback traffic"
  community.general.ufw:
    rule: allow
    direction: "{{ item.direction }}"
    interface: lo
  loop:
    - direction: in
    - direction: out
  when: cis_4_2_4_ufw_configure_loopback | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_4, ufw, level1]

- name: "4.2.4 | Deny spoofed loopback traffic"
  community.general.ufw:
    rule: deny
    direction: in
    from_ip: "{{ item }}"
  loop: >-
    {{ ['127.0.0.0/8'] +
       (['::1'] if section3_network['3_1_network_devices'].ipv6_enabled |
        default(true) | bool else []) }}
  when: cis_4_2_4_ufw_configure_loopback | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_4, ufw, level1]

- name: "4.2.5 | Apply the explicit outbound allowlist"
  community.general.ufw:
    rule: allow
    direction: out
    to_ip: "{{ item.to_ip | default('any') }}"
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default('CIS outbound site policy') }}"
  loop: "{{ cis_ufw_allowed_out_ports | default([]) }}"
  loop_control:
    label: "{{ item.to_ip | default('any') }} -> {{ item.proto }}/{{ item.port }}"
  when: cis_4_2_5_ufw_configure_outbound | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_5, ufw, level1]

- name: "4.2.6 | Apply the explicit inbound service allowlist"
  community.general.ufw:
    rule: allow
    direction: in
    from_ip: "{{ item.from_ip | default('any') }}"
    to_ip: "{{ item.to_ip | default('any') }}"
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    interface: "{{ item.interface_in | default(omit) }}"
    comment: "{{ item.comment | default('CIS inbound site policy') }}"
  loop: "{{ cis_ufw_allowed_in_rules | default([]) }}"
  loop_control:
    label: >-
      {{ item.from_ip | default('any') }} -> {{ item.proto }}/{{ item.port }}
  when: cis_4_2_6_ufw_rules_for_open_ports | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_6, ufw, level1]

- name: "4.2.6 | Audit listening network sockets without changing policy"
  ansible.builtin.command:
    argv: [ss, -H, -lntu]
  register: _cis_listening_sockets
  changed_when: false
  when: cis_4_2_6_ufw_rules_for_open_ports | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_6, ufw, audit, level1]

- name: "4.2.6 | Report listeners for comparison with the site allowlist"
  ansible.builtin.debug:
    msg:
      listeners: "{{ _cis_listening_sockets.stdout_lines }}"
      allowed_inbound: "{{ cis_ufw_allowed_in_rules | default([]) }}"
      note: Unlisted listeners remain blocked; they are never opened automatically.
  when: cis_4_2_6_ufw_rules_for_open_ports | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_6, ufw, audit, level1]

- name: "4.2.7 | Apply UFW default deny policies"
  community.general.ufw:
    direction: "{{ item }}"
    policy: deny
  loop:
    - incoming
    - outgoing
    - routed
  when: cis_4_2_7_ufw_default_deny | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_7, ufw, level1]

- name: "4.1.1 | Stop competing nftables service before enabling UFW"
  ansible.builtin.systemd_service:
    name: nftables.service
    state: stopped
    enabled: false
  when: "'nftables.service' in ansible_facts.services"
  tags: [cis_sec4, cis_4_1, cis_4_1_1, cis_4_2, ufw, firewall]

- name: "4.2.3 | Enable UFW after management rules and policies exist"
  community.general.ufw:
    state: enabled
  when: cis_4_2_3_ufw_enable_service | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_3, ufw, level1]

- name: "4.2.3 | Ensure UFW service is started"
  ansible.builtin.systemd_service:
    name: ufw.service
    state: started
    enabled: true
    masked: false
  when: cis_4_2_3_ufw_enable_service | default(true) | bool
  tags: [cis_sec4, cis_4_2, cis_4_2_3, ufw, level1]

- name: "4.2 | Inspect the applied IPv4 UFW rules file"
  ansible.builtin.stat:
    path: /etc/ufw/user.rules
    checksum_algorithm: sha256
  register: _cis_ufw_ipv4_rules_after
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Inspect the applied IPv6 UFW rules file"
  ansible.builtin.stat:
    path: /etc/ufw/user6.rules
    checksum_algorithm: sha256
  register: _cis_ufw_ipv6_rules_after
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Calculate the applied UFW rules fingerprint"
  ansible.builtin.set_fact:
    _cis_ufw_rules_fingerprint_after: >-
      {{ {
        'ipv4': _cis_ufw_ipv4_rules_after.stat.checksum | default('missing'),
        'ipv6': _cis_ufw_ipv6_rules_after.stat.checksum | default('missing')
      } | to_json | hash('sha256') }}
  tags: [cis_sec4, cis_4_2, ufw, firewall]

- name: "4.2 | Record the successfully applied UFW policy"
  ansible.builtin.copy:
    dest: "{{ cis_ufw_policy_marker }}"
    content: |-
      {{ _cis_ufw_policy_fingerprint }}
      {{ _cis_ufw_rules_fingerprint_after }}
    owner: root
    group: root
    mode: '0600'
  tags: [cis_sec4, cis_4_2, ufw, firewall]
