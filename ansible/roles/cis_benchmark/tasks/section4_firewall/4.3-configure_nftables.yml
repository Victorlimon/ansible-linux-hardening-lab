---
- name: "4.3 | Refuse incomplete nftables remediation"
  ansible.builtin.assert:
    that:
      - false
    fail_msg: >-
      cis_firewall_engine=nftables is opt-in but not implemented safely by this
      role. The previous rules were non-idempotent and were not atomically
      persisted. Select ufw on Ubuntu 24.04 or provide a complete site ruleset.
