---
- name: "4.1.1 | Refresh package facts after firewall configuration"
  ansible.builtin.package_facts:
    manager: auto
  tags: [cis_sec4, cis_4_1, cis_4_1_1, firewall, level1_server, level1_workstation]

- name: "4.1.1 | Ensure nftables service is disabled when UFW is selected"
  ansible.builtin.systemd_service:
    name: nftables.service
    state: stopped
    enabled: false
  when:
    - cis_firewall_engine == 'ufw'
    - "'nftables.service' in ansible_facts.services"
  tags: [cis_sec4, cis_4_1, cis_4_1_1, firewall, level1_server, level1_workstation]

- name: "4.1.1 | Read UFW status"
  ansible.builtin.command:
    argv: [ufw, status]
  register: _cis_ufw_status
  changed_when: false
  check_mode: false
  when: cis_firewall_engine == 'ufw'
  tags: [cis_sec4, cis_4_1, cis_4_1_1, firewall, level1_server, level1_workstation]

- name: "4.1.1 | Verify UFW is the active firewall utility"
  ansible.builtin.assert:
    that:
      - "'Status: active' in _cis_ufw_status.stdout"
      - "'iptables-persistent' not in ansible_facts.packages"
    fail_msg: >-
      UFW is not active or iptables-persistent is still installed. Section 4.1
      cannot claim compliance until exactly the selected utility manages policy.
  when:
    - cis_firewall_engine == 'ufw'
    - not ansible_check_mode
  tags: [cis_sec4, cis_4_1, cis_4_1_1, firewall, level1_server, level1_workstation]
