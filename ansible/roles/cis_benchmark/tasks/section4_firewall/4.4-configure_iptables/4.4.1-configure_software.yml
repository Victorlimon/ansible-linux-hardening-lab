---
# =============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 4.4.1: Configure iptables Software
# =============================================================================

- name: "CIS 4.4.1.1 | Remediation | Ensure iptables packages are installed"
  when:
    - cis_4_4_1_1_iptables_install | default(true)
    - "'iptables' not in ansible_facts.packages"
  ansible.builtin.apt:
    name:
      - iptables
      - iptables-persistent
    state: present
    update_cache: yes
  tags: ['cis_sec4', 'cis_4.4.1.1', 'iptables', 'level1', 'NIST800-53R5_CA-9']

- name: "CIS 4.4.1.2 | Remediation | Ensure nftables is not installed with iptables"
  when:
    - cis_4_4_1_2_iptables_disable_nftables | default(true)
    - "'nftables' in ansible_facts.packages"
  block:
    - name: "CIS 4.4.1.2 | Remediation | Remove nftables package"
      ansible.builtin.apt:
        name: nftables
        state: absent
        purge: yes

    - name: "CIS 4.4.1.2 | Remediation | Disable and mask nftables service"
      ansible.builtin.systemd:
        name: nftables
        state: stopped
        enabled: false
        masked: true
      ignore_errors: true
  tags: ['cis_sec4', 'cis_4.4.1.2', 'iptables', 'level1', 'NIST800-53R5_SC-7']

- name: "CIS 4.4.1.3 | Remediation | Ensure ufw is not installed with iptables"
  when:
    - cis_4_4_1_3_iptables_disable_ufw | default(true)
    - "'ufw' in ansible_facts.packages"
  block:
    - name: "CIS 4.4.1.3 | Remediation | Remove ufw package"
      ansible.builtin.apt:
        name: ufw
        state: absent
        purge: yes

    - name: "CIS 4.4.1.3 | Remediation | Disable and mask ufw service"
      ansible.builtin.systemd:
        name: ufw
        state: stopped
        enabled: false
        masked: true
      ignore_errors: true
  tags: ['cis_sec4', 'cis_4.4.1.3', 'iptables', 'level1', 'NIST800-53R5_SC-7']
