---
- name: "CIS 4 | Validate firewall engine selection"
  ansible.builtin.assert:
    that:
      - cis_firewall_engine in ['ufw', 'nftables', 'iptables']
      - cis_firewall_engine != 'ufw' or ansible_facts.distribution == 'Ubuntu'
    fail_msg: >-
      cis_firewall_engine must be ufw, nftables, or iptables. UFW is supported
      here only on Ubuntu; Ubuntu 24.04 must use ufw unless an alternative is
      deliberately selected and fully implemented.
  tags: [always, cis_sec4, firewall]

- name: "CIS 4 | Gather package facts"
  ansible.builtin.package_facts:
    manager: auto
  tags: [always, cis_sec4, firewall]

- name: "CIS 4 | Gather service facts"
  ansible.builtin.service_facts:
  tags: [always, cis_sec4, firewall]

- name: "CIS 4.2 | Configure UFW"
  ansible.builtin.import_tasks: 4.2-configure_uncomplicated_firewall.yml
  when: cis_firewall_engine == 'ufw'
  tags: [cis_sec4, cis_4_2, ufw, ubuntu]

- name: "CIS 4.3 | Configure nftables (opt-in)"
  ansible.builtin.import_tasks: 4.3-configure_nftables.yml
  when: cis_firewall_engine == 'nftables'
  tags: [cis_sec4, cis_4_3, nftables]

- name: "CIS 4.4 | Configure iptables (opt-in)"
  ansible.builtin.import_tasks: 4.4-configure_iptables/main.yml
  when: cis_firewall_engine == 'iptables'
  tags: [cis_sec4, cis_4_4, iptables]

- name: "CIS 4.1 | Verify a single firewall utility"
  ansible.builtin.import_tasks: 4.1-configure_single_firewall_utility.yml
  when: cis_4_1_single_utility | default(true) | bool
  tags: [cis_sec4, cis_4_1, cis_4_1_1, firewall]
