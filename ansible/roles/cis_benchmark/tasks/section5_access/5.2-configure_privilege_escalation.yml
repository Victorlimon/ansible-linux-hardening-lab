---
# =============================================================================
# CIS Ubuntu 24.04 LTS / Debian 12 Benchmark v1.0.0 - Section 5.2: Privilege Escalation
# Sudo hardening and configuration
# =============================================================================

- name: "CIS 5.2.1 | Remediation | Ensure sudo is installed"
  when:
    - cis_5_2_1_sudo_install | default(true)
    - "'sudo' not in ansible_facts.packages"
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.2.1
    - NIST800-53R5_AC-6
    - sudo

- name: "CIS 5.2.2 | Remediation | Ensure sudo commands use pty"
  when: cis_5_2_2_sudo_use_pty | default(true)
  block:
    - name: "CIS 5.2.2 | Remediation | Remove !use_pty from all sudoers files"
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^\s*Defaults\s+.*!use_pty.*$'
        replace: ''
        validate: '/usr/sbin/visudo -cf %s'
      loop: "{{ lookup('ansible.builtin.fileglob', '/etc/sudoers.d/*', wantlist=True) | reject('search', '[~#]$') | list + ['/etc/sudoers'] }}"
      ignore_errors: true

    - name: "CIS 5.2.2 | Remediation | Ensure Defaults use_pty is present"
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/99-use-pty"
        create: true
        mode: '0440'
        owner: root
        group: root
        line: "Defaults use_pty"
        validate: '/usr/sbin/visudo -cf %s'
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.2.2
    - NIST800-53R5_AC-6
    - sudo

- name: "CIS 5.2.3 | Remediation | Ensure sudo log file exists"
  when: cis_5_2_3_sudo_logfile | default(true)
  block:
    - name: "CIS 5.2.3 | Remediation | Ensure sudo log file exists"
      ansible.builtin.file:
        path: "{{ cis_sudo_logfile | default('/var/log/sudo.log') }}"
        state: touch
        owner: root
        group: root
        mode: "0600"

    - name: "CIS 5.2.3 | Remediation | Ensure sudo logfile is configured"
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/99-sudo-logfile"
        create: true
        mode: "0440"
        owner: root
        group: root
        line: 'Defaults logfile="{{ cis_sudo_logfile | default("/var/log/sudo.log") }}"'
        validate: "/usr/sbin/visudo -cf %s"
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.2.3
    - NIST800-53R5_AU-3
    - sudo

- name: "CIS 5.2.4 | Remediation | Ensure users must provide password for privilege escalation"
  when: cis_5_2_4_sudo_no_password | default(false)
  block:
    - name: "CIS 5.2.4 | AUDIT | Find NOPASSWD entries in sudoers"
      ansible.builtin.command: "grep -r '^[^#].*NOPASSWD' /etc/sudoers /etc/sudoers.d/"
      register: _cis_nopasswd_audit
      failed_when: false
      changed_when: false

    - name: "CIS 5.2.4 | REPORT | Display NOPASSWD entries requiring review"
      ansible.builtin.debug:
        msg:
          - "=== CIS 5.2.4 — NOPASSWD entries found (manual review required) ==="
          - "{{ _cis_nopasswd_audit.stdout_lines }}"
      when: _cis_nopasswd_audit.stdout | default('') | length > 0
  tags:
    - level1-server
    - level1-workstation
    - audit
    - cis_5.2.4
    - NIST800-53R5_AC-6
    - sudo

- name: "CIS 5.2.5 | Remediation | Ensure re-authentication for privilege escalation is not disabled globally"
  when: cis_5_2_5_sudo_authenticate | default(true)
  block:
    - name: "CIS 5.2.5 | AUDIT | Find !authenticate entries in sudoers"
      ansible.builtin.command: "grep -r '^[^#].*!authenticate' /etc/sudoers /etc/sudoers.d/"
      register: _cis_authenticate_audit
      failed_when: false
      changed_when: false

    - name: "CIS 5.2.5 | REPORT | Display !authenticate entries requiring review"
      ansible.builtin.debug:
        msg:
          - "=== CIS 5.2.5 — !authenticate entries found (manual review required) ==="
          - "{{ _cis_authenticate_audit.stdout_lines }}"
      when: _cis_authenticate_audit.stdout | default('') | length > 0
  tags:
    - level1-server
    - level1-workstation
    - audit
    - cis_5.2.5
    - NIST800-53R5_AC-6
    - sudo

- name: "CIS 5.2.6 | Remediation | Ensure sudo authentication timeout is configured correctly"
  when: cis_5_2_6_sudo_timestamp_timeout | default(true)
  block:
    - name: "CIS 5.2.6 | Remediation | Set timestamp_timeout in sudoers"
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/cis_timestamp_timeout"
        line: "Defaults timestamp_timeout={{ cis_sudo_timestamp_timeout | default(15) }}"
        create: true
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.2.6
    - NIST800-53R5_AC-6
    - sudo

- name: "CIS 5.2.7 | Remediation | Ensure access to the su command is restricted"
  when: cis_5_2_7_su_command_restricted | default(true)
  block:
    - name: "CIS 5.2.7 | Remediation | Create restricted group for su access"
      ansible.builtin.group:
        name: "{{ cis_su_restricted_group | default('sugroup') }}"
        state: present

    - name: "CIS 5.2.7 | Remediation | Configure pam_wheel.so in /etc/pam.d/su"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^#?\s*auth\s+required\s+pam_wheel\.so'
        line: 'auth required pam_wheel.so use_uid group={{ cis_su_restricted_group | default("sugroup") }}'
        state: present
        backup: true

    - name: "CIS 5.2.7 | AUDIT | Verify restricted group is empty"
      ansible.builtin.shell: "grep '^{{ cis_su_restricted_group | default('sugroup') }}:' /etc/group | cut -d: -f4"
      register: _cis_sugroup_members
      changed_when: false
      failed_when: false

    - name: "CIS 5.2.7 | REPORT | Warn if restricted group has members"
      ansible.builtin.debug:
        msg:
          - "=== CIS 5.2.7 — {{ cis_su_restricted_group | default('sugroup') }} group members ==="
          - "Members: {{ _cis_sugroup_members.stdout | default('none') }}"
          - "Note: Only authorized users should be added to this group for su access."
      when: _cis_sugroup_members.stdout | default('') | length > 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.2.7
    - NIST800-53R5_AC-3
    - sudo
    - pam
