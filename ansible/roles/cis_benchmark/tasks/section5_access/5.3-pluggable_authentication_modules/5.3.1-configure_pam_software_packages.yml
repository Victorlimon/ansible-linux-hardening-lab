---
# =============================================================================
# CIS Ubuntu 24.04 LTS / Debian 12 Benchmark v1.0.0 - Section 5.3.1: PAM Software Packages
# =============================================================================

- name: "CIS 5.3.1.1 | Remediation | Ensure pam-runtime is installed"
  when:
    - cis_5_3_1_1_pam_runtime | default(true)
    - "'pam-runtime' not in ansible_facts.packages"
  ansible.builtin.apt:
    name: libpam-runtime
    state: present
    update_cache: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.1.1
    - NIST800-53R5_IA-5
    - pam

- name: "CIS 5.3.1.2 | Remediation | Ensure libpam-modules is installed"
  when:
    - cis_5_3_1_2_libpam_modules | default(true)
    - "'libpam-modules' not in ansible_facts.packages"
  ansible.builtin.apt:
    name: libpam-modules
    state: present
    update_cache: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.1.2
    - NIST800-53R5_IA-5
    - pam

- name: "CIS 5.3.1.3 | Remediation | Ensure libpam-pwquality is installed"
  when:
    - cis_5_3_1_3_libpam_pwquality | default(true)
    - "'libpam-pwquality' not in ansible_facts.packages"
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present
    update_cache: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.1.3
    - NIST800-53R5_IA-5
    - pam
