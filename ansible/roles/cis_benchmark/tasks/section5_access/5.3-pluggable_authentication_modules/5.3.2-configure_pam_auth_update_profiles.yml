---
# =============================================================================
# CIS Ubuntu 24.04 LTS / Debian 12 Benchmark v1.0.0 - Section 5.3.2: PAM Auth-Update Profiles
# =============================================================================

- name: "CIS 5.3.2.1 | Remediation | Ensure pam_unix is configured for password authentication"
  when: cis_5_3_2_1_pam_unix | default(true)
  block:
    - name: "CIS 5.3.2.1 | AUDIT | Check pam_unix in common-auth"
      ansible.builtin.command: grep -E '^\s*auth\s+.*\bpam_unix\.so\b' /etc/pam.d/common-auth
      register: _cis_pam_unix_auth
      changed_when: false
      failed_when: false

    - name: "CIS 5.3.2.1 | Remediation | Ensure pam_unix is present in common-auth"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^\s*auth\s+.*\bpam_unix\.so\b'
        line: 'auth\t[success=1 default=ignore]\tpam_unix.so obscure'
        backup: yes
      when: _cis_pam_unix_auth.rc != 0

    - name: "CIS 5.3.2.1 | AUDIT | Check pam_unix in common-password"
      ansible.builtin.command: grep -E '^\s*password\s+.*\bpam_unix\.so\b' /etc/pam.d/common-password
      register: _cis_pam_unix_pass
      changed_when: false
      failed_when: false

    - name: "CIS 5.3.2.1 | Remediation | Ensure pam_unix is present in common-password"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^\s*password\s+.*\bpam_unix\.so\b'
        line: 'password\t[success=1 default=ignore]\tpam_unix.so obscure yescrypt'
        backup: yes
      when: _cis_pam_unix_pass.rc != 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.2.1
    - NIST800-53R5_IA-5
    - pam

- name: "CIS 5.3.2.2 | Remediation | Ensure pam_faillock is configured for account lockout"
  when: cis_5_3_2_2_pam_faillock | default(true)
  block:
    - name: "CIS 5.3.2.2 | Remediation | Ensure pam_faillock.so is in common-auth (preauth)"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^\s*auth\s+.*\bpam_faillock\.so\s+preauth\b'
        line: 'auth\trequired\tpam_faillock.so preauth silent audit deny={{ cis_pam_faillock_deny | default(5) }} unlock_time={{ cis_pam_faillock_unlock_time | default(900) }}'
        insertbefore: '^\s*auth\s+.*\bpam_unix\.so\b'
        backup: yes

    - name: "CIS 5.3.2.2 | Remediation | Ensure pam_faillock.so is in common-auth (authfail)"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^\s*auth\s+.*\bpam_faillock\.so\s+authfail\b'
        line: 'auth\t[default=die]\tpam_faillock.so authfail audit deny={{ cis_pam_faillock_deny | default(5) }} unlock_time={{ cis_pam_faillock_unlock_time | default(900) }}'
        insertafter: '^\s*auth\s+.*\bpam_unix\.so\b'
        backup: yes

    - name: "CIS 5.3.2.2 | Remediation | Ensure pam_faillock.so is in common-account"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-account
        regexp: '^\s*account\s+.*\bpam_faillock\.so\b'
        line: 'account\trequired\tpam_faillock.so'
        backup: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.2.2
    - NIST800-53R5_AC-7
    - pam

- name: "CIS 5.3.2.3 | Remediation | Ensure pam_pwquality is configured for password quality"
  when: cis_5_3_2_3_pam_pwquality | default(true)
  block:
    - name: "CIS 5.3.2.3 | Remediation | Ensure pam_pwquality.so is in common-password"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^\s*password\s+.*\bpam_pwquality\.so\b'
        line: 'password\trequisite\tpam_pwquality.so retry={{ cis_pam_pwquality_retry | default(3) }} minlen={{ cis_pam_pwquality_minlen | default(14) }} dcredit={{ cis_pam_pwquality_dcredit | default(-1) }} ucredit={{ cis_pam_pwquality_ucredit | default(-1) }} ocredit={{ cis_pam_pwquality_ocredit | default(-1) }} lcredit={{ cis_pam_pwquality_lcredit | default(-1) }}'
        insertbefore: '^\s*password\s+.*\bpam_unix\.so\b'
        backup: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.2.3
    - NIST800-53R5_IA-5
    - pam

- name: "CIS 5.3.2.4 | Remediation | Ensure pam_pwhistory is configured for password history"
  when: cis_5_3_2_4_pam_pwhistory | default(true)
  block:
    - name: "CIS 5.3.2.4 | Remediation | Ensure pam_pwhistory.so is in common-password"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^\s*password\s+.*\bpam_pwhistory\.so\b'
        line: 'password\trequisite\tpam_pwhistory.so remember={{ cis_pam_pwhistory_remember | default(5) }}'
        insertbefore: '^\s*password\s+.*\bpam_unix\.so\b'
        backup: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.2.4
    - NIST800-53R5_IA-5
    - pam
