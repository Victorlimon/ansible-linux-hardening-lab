---
- name: "CIS 5.3.2.1 | Remediation | Install managed pam_unix profile"
  when: cis_5_3_2_1_pam_unix | default(true)
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/unix
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: Unix authentication
      Default: yes
      Priority: 256
      Auth-Type: Primary
      Auth:
              [success=end default=ignore] pam_unix.so try_first_pass
      Auth-Initial:
              [success=end default=ignore] pam_unix.so
      Account-Type: Primary
      Account:
              [success=end new_authtok_reqd=done default=ignore] pam_unix.so
      Account-Initial:
              [success=end new_authtok_reqd=done default=ignore] pam_unix.so
      Session-Type: Additional
      Session:
              required pam_unix.so
      Session-Initial:
              required pam_unix.so
      Password-Type: Primary
      Password:
              [success=end default=ignore] pam_unix.so obscure use_authtok try_first_pass yescrypt
      Password-Initial:
              [success=end default=ignore] pam_unix.so obscure yescrypt
  register: _cis_pam_unix_profile
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.2.1
    - cis_5.3.3.4.1
    - cis_5.3.3.4.2
    - cis_5.3.3.4.3
    - cis_5.3.3.4.4
    - pam

- name: "CIS 5.3.2.2 | Remediation | Install pam_faillock profiles"
  when: cis_5_3_2_2_pam_faillock | default(true)
  block:
    - name: "CIS 5.3.2.2 | Remediation | Install faillock authfail profile"
      ansible.builtin.copy:
        dest: /usr/share/pam-configs/faillock
        owner: root
        group: root
        mode: "0644"
        content: |
          Name: Enable pam_faillock to deny access
          Default: yes
          Priority: 0
          Auth-Type: Primary
          Auth:
                  [default=die] pam_faillock.so authfail
      register: _cis_pam_faillock_profile

    - name: "CIS 5.3.2.2 | Remediation | Install faillock preauth and account profile"
      ansible.builtin.copy:
        dest: /usr/share/pam-configs/faillock_notify
        owner: root
        group: root
        mode: "0644"
        content: |
          Name: Notify failed login attempts and reset count on success
          Default: yes
          Priority: 1024
          Auth-Type: Primary
          Auth:
                  requisite pam_faillock.so preauth
          Account-Type: Primary
          Account:
                  required pam_faillock.so
      register: _cis_pam_faillock_notify_profile
  tags: [level1-server, level1-workstation, remediation, cis_5.3.2.2, pam]

- name: "CIS 5.3.2.3 | Remediation | Install pam_pwquality profile"
  when: cis_5_3_2_3_pam_pwquality | default(true)
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/pwquality
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: Pwquality password strength checking
      Default: yes
      Priority: 1024
      Conflicts: cracklib
      Password-Type: Primary
      Password:
              requisite pam_pwquality.so retry={{ cis_pam_pwquality_retry | default(3) }}
  register: _cis_pam_pwquality_profile
  tags: [level1-server, level1-workstation, remediation, cis_5.3.2.3, pam]

- name: "CIS 5.3.2.4 | Remediation | Install pam_pwhistory profile"
  when: cis_5_3_2_4_pam_pwhistory | default(true)
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/pwhistory
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: Pwhistory password history checking
      Default: yes
      Priority: 1024
      Password-Type: Primary
      Password:
              requisite pam_pwhistory.so remember={{ [cis_pam_pwhistory_remember | default(24) | int, 24] | max }} enforce_for_root try_first_pass use_authtok
  register: _cis_pam_pwhistory_profile
  tags: [level1-server, level1-workstation, remediation, cis_5.3.2.4, pam]

- name: "CIS 5.3.2 | Audit | Check modules in generated PAM stacks"
  ansible.builtin.shell: |
    grep -q 'pam_unix\.so' /etc/pam.d/common-auth &&
    grep -q 'pam_unix\.so' /etc/pam.d/common-account &&
    grep -q 'pam_unix\.so' /etc/pam.d/common-password &&
    grep -q 'pam_faillock\.so.*preauth' /etc/pam.d/common-auth &&
    grep -q 'pam_faillock\.so.*authfail' /etc/pam.d/common-auth &&
    grep -q 'pam_faillock\.so' /etc/pam.d/common-account &&
    grep -q 'pam_pwquality\.so' /etc/pam.d/common-password &&
    grep -q 'pam_pwhistory\.so' /etc/pam.d/common-password
  args:
    executable: /bin/bash
  register: _cis_pam_modules_present
  changed_when: false
  failed_when: _cis_pam_modules_present.rc not in [0, 1]
  check_mode: false
  tags: [verification, cis_5.3.2.1, cis_5.3.2.2, cis_5.3.2.3, cis_5.3.2.4, pam]

- name: "CIS 5.3.2 | Remediation | Regenerate PAM stacks from enabled profiles"
  when: >-
    (_cis_pam_unix_profile | default({'changed': false})).changed or
    (_cis_pam_faillock_profile | default({'changed': false})).changed or
    (_cis_pam_faillock_notify_profile | default({'changed': false})).changed or
    (_cis_pam_pwquality_profile | default({'changed': false})).changed or
    (_cis_pam_pwhistory_profile | default({'changed': false})).changed or
    (_cis_pam_modules_present.rc | default(1)) == 1
  ansible.builtin.command:
    argv:
      - /usr/sbin/pam-auth-update
      - --force
      - --enable
      - unix
      - --enable
      - faillock
      - --enable
      - faillock_notify
      - --enable
      - pwquality
      - --enable
      - pwhistory
  register: _cis_pam_auth_update
  changed_when: _cis_pam_auth_update.rc == 0
  tags: [level1-server, level1-workstation, remediation, cis_5.3.2.1, cis_5.3.2.2, cis_5.3.2.3, cis_5.3.2.4, pam]

- name: "CIS 5.3.2 | Verification | Verify all generated PAM stacks"
  ansible.builtin.shell: |
    grep -q 'pam_unix\.so' /etc/pam.d/common-auth &&
    grep -q 'pam_unix\.so' /etc/pam.d/common-account &&
    grep -q 'pam_unix\.so' /etc/pam.d/common-password &&
    grep -q 'pam_faillock\.so.*preauth' /etc/pam.d/common-auth &&
    grep -q 'pam_faillock\.so.*authfail' /etc/pam.d/common-auth &&
    grep -q 'pam_faillock\.so' /etc/pam.d/common-account &&
    grep -q 'pam_pwquality\.so' /etc/pam.d/common-password &&
    grep -q 'pam_pwhistory\.so' /etc/pam.d/common-password
  args:
    executable: /bin/bash
  changed_when: false
  tags: [verification, cis_5.3.2.1, cis_5.3.2.2, cis_5.3.2.3, cis_5.3.2.4, pam]
