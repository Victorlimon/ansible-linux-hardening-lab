# ------------------------------------------------------------------------------
# 5.3.3.4 - pam_unix arguments
# ------------------------------------------------------------------------------
- name: "CIS 5.3.3.4.1 | Remediation | Ensure pam_unix sha512 is configured"
  when: cis_5_3_3_4_1_unix_sha512 | default(true)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-password
    regexp: '^\s*password\s+.*\bpam_unix\.so.*\b(sha512|yescrypt)\b'
    line: 'password\t[success=1 default=ignore]\tpam_unix.so obscure yescrypt'
    backup: yes
  tags:
