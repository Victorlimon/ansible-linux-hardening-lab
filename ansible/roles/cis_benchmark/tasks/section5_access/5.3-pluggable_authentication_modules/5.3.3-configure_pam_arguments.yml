---
# =============================================================================
# CIS Ubuntu 24.04 LTS / Debian 12 Benchmark v1.0.0 - Section 5.3.3: PAM Arguments
# =============================================================================

# ------------------------------------------------------------------------------
# 5.3.3.1 - pam_faillock arguments
# ------------------------------------------------------------------------------
- name: "CIS 5.3.3.1.1 | Remediation | Ensure pam_faillock deny is configured"
  when: cis_5_3_3_1_1_faillock_deny | default(true)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    regexp: '^\s*auth\s+.*\bpam_faillock\.so.*\bdeny='
    line: 'auth\trequired\tpam_faillock.so preauth silent audit deny={{ cis_pam_faillock_deny | default(5) }} unlock_time={{ cis_pam_faillock_unlock_time | default(900) }}'
    backup: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.3.1.1
    - NIST800-53R5_AC-7
    - pam

- name: "CIS 5.3.3.1.2 | Remediation | Ensure pam_faillock unlock_time is configured"
  when: cis_5_3_3_1_2_faillock_unlock_time | default(true)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    regexp: '^\s*auth\s+.*\bpam_faillock\.so.*\bunlock_time='
    line: 'auth\trequired\tpam_faillock.so preauth silent audit deny={{ cis_pam_faillock_deny | default(5) }} unlock_time={{ cis_pam_faillock_unlock_time | default(900) }}'
    backup: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.3.1.2
    - NIST800-53R5_AC-7
    - pam

- name: "CIS 5.3.3.1.3 | Remediation | Ensure pam_faillock audit is configured"
  when: cis_5_3_3_1_3_faillock_audit | default(true)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    regexp: '^\s*auth\s+.*\bpam_faillock\.so.*\baudit\b'
    line: 'auth\trequired\tpam_faillock.so preauth silent audit deny={{ cis_pam_faillock_deny | default(5) }} unlock_time={{ cis_pam_faillock_unlock_time | default(900) }}'
    backup: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.3.1.3
    - NIST800-53R5_AC-7
    - pam

