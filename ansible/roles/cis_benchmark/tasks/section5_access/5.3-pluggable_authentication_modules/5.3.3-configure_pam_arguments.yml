---
- name: "CIS 5.3.3.1 | Safety | Validate pam_faillock values"
  ansible.builtin.assert:
    that:
      - cis_pam_faillock_deny | default(5) | int >= 1
      - cis_pam_faillock_deny | default(5) | int <= 5
      - cis_pam_faillock_unlock_time | default(900) | int == 0 or cis_pam_faillock_unlock_time | default(900) | int >= 900
      - cis_pam_faillock_root_unlock_time | default(900) | int >= 60
    fail_msg: "pam_faillock values do not satisfy CIS 5.3.3.1."
  tags: [cis_5.3.3.1.1, cis_5.3.3.1.2, cis_5.3.3.1.3, pam]

- name: "CIS 5.3.3.1.1 | Remediation | Configure failed-attempt lockout"
  when: cis_5_3_3_1_1_faillock_deny | default(true)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*#?\s*deny\s*='
    line: "deny = {{ cis_pam_faillock_deny | default(5) }}"
  tags: [level1-server, level1-workstation, remediation, cis_5.3.3.1.1, pam]

- name: "CIS 5.3.3.1.2 | Remediation | Configure password unlock time"
  when: cis_5_3_3_1_2_faillock_unlock_time | default(true)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*#?\s*unlock_time\s*='
    line: "unlock_time = {{ cis_pam_faillock_unlock_time | default(900) }}"
  tags: [level1-server, level1-workstation, remediation, cis_5.3.3.1.2, pam]

- name: "CIS 5.3.3.1.3 | Remediation | Include root in failed-attempt lockout"
  when: cis_5_3_3_1_3_faillock_root | default(cis_5_3_3_1_3_faillock_audit | default(true))
  block:
    - name: "CIS 5.3.3.1.3 | Remediation | Enable root lockout"
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^\s*#?\s*even_deny_root\s*$'
        line: even_deny_root

    - name: "CIS 5.3.3.1.3 | Remediation | Configure root unlock time"
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^\s*#?\s*root_unlock_time\s*='
        line: "root_unlock_time = {{ cis_pam_faillock_root_unlock_time | default(900) }}"
  tags: [level2-server, level2-workstation, remediation, cis_5.3.3.1.3, pam]

- name: "CIS 5.3.3.2 | Remediation | Ensure pwquality drop-in directory exists"
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - cis_5.3.3.2.1
    - cis_5.3.3.2.2
    - cis_5.3.3.2.3
    - cis_5.3.3.2.4
    - cis_5.3.3.2.5
    - cis_5.3.3.2.6
    - cis_5.3.3.2.7
    - cis_5.3.3.2.8
    - pam

- name: "CIS 5.3.3.2.1-2.8 | Remediation | Configure automated pwquality controls"
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf.d/50-cis.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - CIS Ubuntu 24.04 section 5.3.3.2
      {% if cis_5_3_3_2_1_pwquality_difok | default(true) %}difok = {{ cis_pam_pwquality_difok | default(2) }}
      {% endif %}
      {% if cis_5_3_3_2_2_pwquality_minlen | default(true) %}minlen = {{ cis_pam_pwquality_minlen | default(14) }}
      {% endif %}
      {% if cis_5_3_3_2_4_pwquality_maxrepeat | default(true) %}maxrepeat = {{ cis_pam_pwquality_maxrepeat | default(3) }}
      {% endif %}
      {% if cis_5_3_3_2_5_pwquality_maxsequence | default(true) %}maxsequence = {{ cis_pam_pwquality_maxsequence | default(3) }}
      {% endif %}
      {% if cis_5_3_3_2_6_pwquality_dictcheck | default(true) %}dictcheck = 1
      {% endif %}
      {% if cis_5_3_3_2_7_pwquality_enforcing | default(true) %}enforcing = 1
      {% endif %}
      {% if cis_5_3_3_2_8_pwquality_enforce_for_root | default(true) %}enforce_for_root
      {% endif %}
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.3.2.1
    - cis_5.3.3.2.2
    - cis_5.3.3.2.4
    - cis_5.3.3.2.5
    - cis_5.3.3.2.6
    - cis_5.3.3.2.7
    - cis_5.3.3.2.8
    - pam

- name: "CIS 5.3.3.2.3 | Manual | Report password complexity policy"
  ansible.builtin.debug:
    msg: >-
      CIS 5.3.3.2.3 is manual. Set cis_5_3_3_2_3_pwquality_complexity_remediation=true
      only after approving the local minclass/credit policy.
  tags: [level1-server, level1-workstation, audit, manual, cis_5.3.3.2.3, pam]

- name: "CIS 5.3.3.2.3 | Manual remediation | Configure approved password complexity"
  when: cis_5_3_3_2_3_pwquality_complexity_remediation | default(false)
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf.d/51-cis-complexity.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Manual site policy for CIS 5.3.3.2.3
      minclass = {{ cis_pam_pwquality_minclass | default(3) }}
      dcredit = {{ cis_pam_pwquality_dcredit | default(-1) }}
      ucredit = {{ cis_pam_pwquality_ucredit | default(-1) }}
      lcredit = {{ cis_pam_pwquality_lcredit | default(-1) }}
      ocredit = {{ cis_pam_pwquality_ocredit | default(0) }}
  tags: [never, manual-remediation, cis_5.3.3.2.3, pam]

- name: "CIS 5.3.3.3.1-3.3 | Safety | Validate password history depth"
  ansible.builtin.assert:
    that:
      - "[cis_pam_pwhistory_remember | default(24) | int, 24] | max >= 24"
    fail_msg: "Password history must remember at least 24 passwords."
  tags: [cis_5.3.3.3.1, cis_5.3.3.3.2, cis_5.3.3.3.3, pam]

- name: "CIS 5.3.3.3 | Check whether the managed pwhistory profile exists"
  ansible.builtin.stat:
    path: /usr/share/pam-configs/pwhistory
  register: _cis_pwhistory_profile
  tags: [cis_5.3.3.3.1, cis_5.3.3.3.2, cis_5.3.3.3.3, pam]

- name: "CIS 5.3.3.3.1-3.3 | Remediation | Add pam_pwhistory arguments idempotently"
  ansible.builtin.lineinfile:
    path: /usr/share/pam-configs/pwhistory
    regexp: '^\s+requisite\s+pam_pwhistory\.so\b'
    line: "        requisite pam_pwhistory.so remember={{ [cis_pam_pwhistory_remember | default(24) | int, 24] | max }} enforce_for_root try_first_pass use_authtok"
  register: _cis_pwhistory_arguments
  when:
    - not ansible_check_mode or _cis_pwhistory_profile.stat.exists
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.3.3.3.1
    - cis_5.3.3.3.2
    - cis_5.3.3.3.3
    - pam

- name: "CIS 5.3.3 | Remediation | Regenerate PAM stacks after profile argument changes"
  when: "(_cis_pwhistory_arguments | default({'changed': false})).changed"
  ansible.builtin.command:
    argv:
      - /usr/sbin/pam-auth-update
      - --force
      - --enable
      - unix
      - --enable
      - faillock
      - --enable
      - faillock_notify
      - --enable
      - pwquality
      - --enable
      - pwhistory
  register: _cis_pam_arguments_update
  changed_when: _cis_pam_arguments_update.rc == 0
  tags:
    - remediation
    - cis_5.3.3.3.1
    - cis_5.3.3.3.2
    - cis_5.3.3.3.3
    - cis_5.3.3.4.1
    - cis_5.3.3.4.2
    - cis_5.3.3.4.3
    - cis_5.3.3.4.4
    - pam

- name: "CIS 5.3.3 | Verification | Verify generated PAM password stack"
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - -Eq
      - pam_pwhistory\.so.*remember=(2[4-9]|[3-9][0-9]|[1-9][0-9]{2,}).*enforce_for_root.*use_authtok
      - /etc/pam.d/common-password
  register: _cis_pam_password_stack
  changed_when: false
  failed_when: _cis_pam_password_stack.rc != 0
  when: not ansible_check_mode
  tags: [verification, cis_5.3.3.3.1, cis_5.3.3.3.2, cis_5.3.3.3.3, pam]
