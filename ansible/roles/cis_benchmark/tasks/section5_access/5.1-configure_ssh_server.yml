---

- name: "CIS 5.1.1 | Remediation | Ensure permissions on /etc/ssh/sshd_config are configured"
  when: cis_ssh_config.config_files | default(true)
  block:
    - name: "CIS 5.1.1 | Remediation | Set permissions on /etc/ssh/sshd_config"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: 'u-x,og-rwx'
        state: file
    - name: "CIS 5.1.1 | Remediation | Set permissions on additional SSH config files in sshd_config.d"
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        file_type: file
      register: sshd_config_files
      ignore_errors: yes   
    - name: "CIS 5.1.1 | Remediation | Apply strict permissions to each SSH config file"
      ansible.builtin.file:
        path: "{{ item.path }}"
        recurse: false
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        state: file
      loop: "{{ sshd_config_files.files | default([]) }}"
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.1.1
    - cis
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - sshd

- name: "CIS 5.1.2 | Remediation | Ensure permissions on SSH private host key files are configured"
  when: cis_ssh_config.host_keys | default(true)
  block:
    - name: "CIS 5.1.2 | Audit | Set permissions on SSH private host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key'
        file_type: file
      register: ssh_private_keys
    - name: "CIS 5.1.2 | Remediation | Apply strict permissions to SSH private host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        state: file
      loop: "{{ ssh_private_keys.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.1.2
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - sshd

- name: "CIS 5.1.3 | Remediation | Ensure permissions on SSH public host key files are configured"
  when: cis_ssh_config.host_keys | default(true)
  block:
    - name: "CIS 5.1.3 | Audit | Set permissions on SSH public host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key.pub'
        file_type: file
      register: ssh_public_keys
    - name: "CIS 5.1.3 | Remediation | Apply strict permissions to SSH public host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        state: file
      loop: "{{ ssh_public_keys.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - rule_5.1.3
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - sshd

- name: "CIS 5.1.4 | Remediation | Ensure sshd access is configured"
  when: cis_ssh_config.access_control | default(true)
  block:
    - name: "CIS 5.1.4 | Remediation | Configure AllowUsers or AllowGroups"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^(AllowUsers|AllowGroups)'
        line: "{{ cis_ssh_config.access_control_type | default('AllowGroups') }} {{ cis_ssh_config.allowed_users_groups | default('sshusers') }}"
        insertafter: '^# Authentication'
        validate: 'sshd -t -f %s'
        state: present
      notify: restart sshd
      when: cis_ssh_config.use_allow_list | default(true)

    - name: "CIS 5.1.4 | Remediation | Configure DenyUsers or DenyGroups (alternative)"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^(DenyUsers|DenyGroups)'
        line: "{{ cis_ssh_config.access_control_type | default('DenyUsers') }} {{ cis_ssh_config.denied_users_groups | default('') }}"
        insertafter: '^# Authentication'
        validate: 'sshd -t -f %s'
        state: present
      notify: restart sshd
      when: not (cis_ssh_config.use_allow_list | default(true))
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.1.4
    - NIST800-53R5_AC-3
    - sshd

- name: "CIS 5.1.5 - Configure SSH banner"
  when: cis_ssh_config.banner | default(true)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Banner'
    line: "Banner /etc/issue.net"
    state: present
    insertafter: '^# no default banner path'
    validate: 'sshd -t -f %s'
  notify: restart sshd
  tags: 
    - level1-server
    - level1-workstation
    - patch
    - rule_5.1.5
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - sshd

