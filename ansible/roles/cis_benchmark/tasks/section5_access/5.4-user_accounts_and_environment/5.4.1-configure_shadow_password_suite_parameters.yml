---
- name: "CIS 5.4.1.1 | Remediation | Configure maximum password age for new accounts"
  when: cis_5_4_1_1_password_max_days | default(true)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MAX_DAYS\s+'
    line: "PASS_MAX_DAYS   {{ cis_password_max_days | default(365) }}"
  tags: [level1-server, level1-workstation, remediation, cis_5.4.1.1, password]

- name: "CIS 5.4.1.2 | Manual remediation | Configure minimum password age for new accounts"
  when: cis_5_4_1_2_password_min_days | default(true)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MIN_DAYS\s+'
    line: "PASS_MIN_DAYS   {{ cis_password_min_days | default(1) }}"
  tags: [never, manual-remediation, cis_5.4.1.2, password]

- name: "CIS 5.4.1.3 | Remediation | Configure password warning for new accounts"
  when: cis_5_4_1_3_password_warn_days | default(true)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_WARN_AGE\s+'
    line: "PASS_WARN_AGE   {{ cis_password_warn_days | default(7) }}"
  tags: [level1-server, level1-workstation, remediation, cis_5.4.1.3, password]

- name: "CIS 5.4.1.4 | Remediation | Configure strong group password hashing"
  when: cis_5_4_1_4_password_hashing | default(true)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*ENCRYPT_METHOD\s+'
    line: "ENCRYPT_METHOD {{ cis_password_encrypt_method | default('YESCRYPT') | upper }}"
  tags: [level1-server, level1-workstation, remediation, cis_5.4.1.4, password]

- name: "CIS 5.4.1.5 | Remediation | Configure inactive password lock for new accounts"
  when: cis_5_4_1_5_password_inactive | default(true)
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: '^\s*INACTIVE='
    line: "INACTIVE={{ cis_password_inactive_days | default(30) }}"
  tags: [level1-server, level1-workstation, remediation, cis_5.4.1.5, password]

- name: "CIS 5.4.1.1-5.4.1.5 | Audit | Find password users requiring aging changes"
  ansible.builtin.command:
    argv:
      - /usr/bin/awk
      - "-F:"
      - >-
        ($2 ~ /^\$.+\$/) &&
        (($5 < 1 || $5 > {{ cis_password_max_days | default(365) }}) ||
         ($4 < {{ cis_password_min_days | default(1) }}) ||
         ($6 < {{ cis_password_warn_days | default(7) }}) ||
         ($7 < 0 || $7 > {{ cis_password_inactive_days | default(30) }})) {print $1}
      - /etc/shadow
  register: _cis_users_requiring_aging
  changed_when: false
  check_mode: false
  tags: [audit, cis_5.4.1.1, cis_5.4.1.2, cis_5.4.1.3, cis_5.4.1.5, password]

- name: "CIS 5.4.1.1-5.4.1.5 | Manual | Report existing users requiring aging changes"
  when:
    - _cis_users_requiring_aging.stdout_lines | length > 0
    - not (cis_5_4_1_apply_existing_users | default(false))
  ansible.builtin.debug:
    msg: >-
      Existing users require aging changes: {{ _cis_users_requiring_aging.stdout_lines }}.
      Review service and remote accounts, then set cis_5_4_1_apply_existing_users=true.
  tags: [audit, manual, cis_5.4.1.1, cis_5.4.1.2, cis_5.4.1.3, cis_5.4.1.5, password]

- name: "CIS 5.4.1.1-5.4.1.5 | Destructive remediation | Update approved existing users"
  when: cis_5_4_1_apply_existing_users | default(false)
  ansible.builtin.command:
    argv:
      - /usr/bin/chage
      - --maxdays
      - "{{ cis_password_max_days | default(365) }}"
      - --mindays
      - "{{ cis_password_min_days | default(1) }}"
      - --warndays
      - "{{ cis_password_warn_days | default(7) }}"
      - --inactive
      - "{{ cis_password_inactive_days | default(30) }}"
      - "{{ item }}"
  loop: "{{ _cis_users_requiring_aging.stdout_lines }}"
  loop_control:
    label: "{{ item }}"
  tags:
    - never
    - destructive-remediation
    - cis_5.4.1.1
    - cis_5.4.1.2
    - cis_5.4.1.3
    - cis_5.4.1.5
    - password

- name: "CIS 5.4.1.6 | Audit | Find future password change dates"
  ansible.builtin.shell: |
    set -o pipefail
    today_days=$(( $(date +%s) / 86400 ))
    awk -F: -v today="$today_days" '$2 ~ /^\$.+\$/ && $3 > today {print $1}' /etc/shadow
  args:
    executable: /bin/bash
  register: _cis_future_password_users
  changed_when: false
  check_mode: false
  tags: [level1-server, level1-workstation, audit, manual, cis_5.4.1.6, password]

- name: "CIS 5.4.1.6 | Manual | Report future password change dates"
  when: _cis_future_password_users.stdout_lines | length > 0
  ansible.builtin.debug:
    msg: >-
      Manual investigation required for future password dates:
      {{ _cis_future_password_users.stdout_lines }}. No account is expired or locked automatically.
  tags: [level1-server, level1-workstation, audit, manual, cis_5.4.1.6, password]
