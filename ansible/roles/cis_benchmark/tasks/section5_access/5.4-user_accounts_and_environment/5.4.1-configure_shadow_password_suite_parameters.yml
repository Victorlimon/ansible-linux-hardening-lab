---
# =============================================================================
# CIS Ubuntu 24.04 LTS / Debian 12 Benchmark v1.0.0 - Section 5.4.1: Shadow Password Suite Parameters
# =============================================================================

- name: "CIS 5.4.1.1 | Remediation | Ensure password expiration is 365 days or less"
  when: cis_5_4_1_1_password_max_days | default(true)
  block:
    - name: "CIS 5.4.1.1 | Remediation | Set PASS_MAX_DAYS in /etc/login.defs"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MAX_DAYS\s'
        line: 'PASS_MAX_DAYS   {{ cis_password_max_days | default(365) }}'
        backup: yes

    - name: "CIS 5.4.1.1 | AUDIT | Get users with password set"
      ansible.builtin.command: "awk -F: '($2 ~ /^\\$.+\\$/) {print $1}' /etc/shadow"
      register: _cis_users_with_password
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.1.1 | Remediation | Apply chage to existing users"
      ansible.builtin.command: "chage --maxdays {{ cis_password_max_days | default(365) }} {{ item }}"
      loop: "{{ _cis_users_with_password.stdout_lines }}"
      changed_when: false
      when: _cis_users_with_password.stdout_lines | length > 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.1.1
    - NIST800-53R5_IA-5
    - password

- name: "CIS 5.4.1.2 | Remediation | Ensure minimum days between password changes is configured"
  when: cis_5_4_1_2_password_min_days | default(true)
  block:
    - name: "CIS 5.4.1.2 | Remediation | Set PASS_MIN_DAYS in /etc/login.defs"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MIN_DAYS\s'
        line: 'PASS_MIN_DAYS   {{ cis_password_min_days | default(1) }}'
        backup: yes

    - name: "CIS 5.4.1.2 | AUDIT | Get users with password set"
      ansible.builtin.command: "awk -F: '($2 ~ /^\\$.+\\$/) {print $1}' /etc/shadow"
      register: _cis_users_with_password
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.1.2 | Remediation | Apply chage to existing users"
      ansible.builtin.command: "chage --mindays {{ cis_password_min_days | default(1) }} {{ item }}"
      loop: "{{ _cis_users_with_password.stdout_lines }}"
      changed_when: false
      when: _cis_users_with_password.stdout_lines | length > 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.1.2
    - NIST800-53R5_IA-5
    - password

- name: "CIS 5.4.1.3 | Remediation | Ensure password expiration warning days is configured"
  when: cis_5_4_1_3_password_warn_days | default(true)
  block:
    - name: "CIS 5.4.1.3 | Remediation | Set PASS_WARN_AGE in /etc/login.defs"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_WARN_AGE\s'
        line: 'PASS_WARN_AGE   {{ cis_password_warn_days | default(7) }}'
        backup: yes

    - name: "CIS 5.4.1.3 | AUDIT | Get users with password set"
      ansible.builtin.command: "awk -F: '($2 ~ /^\\$.+\\$/) {print $1}' /etc/shadow"
      register: _cis_users_with_password
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.1.3 | Remediation | Apply chage to existing users"
      ansible.builtin.command: "chage --warndays {{ cis_password_warn_days | default(7) }} {{ item }}"
      loop: "{{ _cis_users_with_password.stdout_lines }}"
      changed_when: false
      when: _cis_users_with_password.stdout_lines | length > 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.1.3
    - NIST800-53R5_IA-5
    - password

- name: "CIS 5.4.1.4 | Remediation | Ensure strong password hashing algorithm is configured"
  when: cis_5_4_1_4_password_hashing | default(true)
  block:
    - name: "CIS 5.4.1.4 | Remediation | Set ENCRYPT_METHOD in /etc/login.defs"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^ENCRYPT_METHOD\s'
        line: 'ENCRYPT_METHOD {{ cis_password_encrypt_method | default("YESCRYPT") }}'
        backup: yes

    - name: "CIS 5.4.1.4 | Remediation | Ensure PAM uses strong hashing"
      ansible.builtin.replace:
        path: /etc/pam.d/common-password
        regexp: '(pam_unix\.so\s+.*?)(sha512|md5|yescrypt)?'
        replace: '\1{{ cis_password_encrypt_method | default("yescrypt") }}'
        backup: yes
      notify: restart sshd
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.1.4
    - NIST800-53R5_IA-5
    - password

- name: "CIS 5.4.1.5 | Remediation | Ensure inactive password lock is configured"
  when: cis_5_4_1_5_password_inactive | default(true)
  block:
    - name: "CIS 5.4.1.5 | Remediation | Set INACTIVE in /etc/login.defs"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^INACTIVE\s'
        line: 'INACTIVE        {{ cis_password_inactive_days | default(30) }}'
        backup: yes

    - name: "CIS 5.4.1.5 | AUDIT | Get users with password set"
      ansible.builtin.command: "awk -F: '($2 ~ /^\\$.+\\$/) {print $1}' /etc/shadow"
      register: _cis_users_with_password
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.1.5 | Remediation | Apply chage to existing users"
      ansible.builtin.command: "chage --inactive {{ cis_password_inactive_days | default(30) }} {{ item }}"
      loop: "{{ _cis_users_with_password.stdout_lines }}"
      changed_when: false
      when: _cis_users_with_password.stdout_lines | length > 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.1.5
    - NIST800-53R5_IA-5
    - password

- name: "CIS 5.4.1.6 | Remediation | Ensure all users last password change date is in the past"
  when: cis_5_4_1_6_password_change_past | default(true)
  block:
    - name: "CIS 5.4.1.6 | AUDIT | Detect users with password change in future"
      ansible.builtin.shell: |
        while IFS= read -r user; do
          last_change=$(chage --list "$user" 2>/dev/null | grep '^Last password change' | cut -d: -f2 | grep -v 'never$' | xargs)
          if [ -n "$last_change" ]; then
            change_epoch=$(date -d "$last_change" +%s 2>/dev/null)
            current_epoch=$(date +%s)
            if [ "$change_epoch" -gt "$current_epoch" ] 2>/dev/null; then
              echo "$user"
            fi
          fi
        done < <(awk -F: '($2 ~ /^\\$.+\\$/) {print $1}' /etc/shadow)
      register: _cis_future_password_users
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.1.6 | Remediation | Force password change for users with future dates"
      ansible.builtin.command: "chage -d 0 {{ item }}"
      loop: "{{ _cis_future_password_users.stdout_lines }}"
      when: _cis_future_password_users.stdout_lines | length > 0
      changed_when: true
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.1.6
    - NIST800-53R5_IA-5
    - password
