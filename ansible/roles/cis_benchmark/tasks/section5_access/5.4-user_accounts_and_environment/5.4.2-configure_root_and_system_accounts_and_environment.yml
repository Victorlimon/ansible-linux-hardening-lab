---
# =============================================================================
# CIS Ubuntu 24.04 LTS / Debian 12 Benchmark v1.0.0 - Section 5.4.2: Root and System Accounts
# =============================================================================

- name: "CIS 5.4.2.1 | Remediation | Ensure root is the only UID 0 account"
  when: cis_5_4_2_1_root_uid_zero | default(true)
  block:
    - name: "CIS 5.4.2.1 | AUDIT | Find accounts with UID 0"
      ansible.builtin.command: "awk -F: '($3 == 0) {print $1}' /etc/passwd"
      register: _cis_uid_zero_accounts
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.2.1 | Remediation | Ensure root has UID 0"
      ansible.builtin.user:
        name: root
        uid: 0

    - name: "CIS 5.4.2.1 | REPORT | Alert if non-root accounts have UID 0"
      ansible.builtin.debug:
        msg:
          - "=== CIS 5.4.2.1 — WARNING: Non-root accounts with UID 0 ==="
          - "Accounts: {{ _cis_uid_zero_accounts.stdout_lines | difference(['root']) }}"
          - "Action: Manually review and remove or change UID for these accounts"
      when: _cis_uid_zero_accounts.stdout_lines | difference(['root']) | length > 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.2.1
    - NIST800-53R5_AC-3
    - users

- name: "CIS 5.4.2.2 | Remediation | Ensure root is the only GID 0 account"
  when: cis_5_4_2_2_root_gid_zero | default(true)
  block:
    - name: "CIS 5.4.2.2 | AUDIT | Find accounts with primary GID 0"
      ansible.builtin.command: "awk -F: '($4 == 0 && $1 != \"root\") {print $1}' /etc/passwd"
      register: _cis_gid_zero_accounts
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.2.2 | Remediation | Ensure root has primary GID 0"
      ansible.builtin.user:
        name: root
        group: root

    - name: "CIS 5.4.2.2 | Remediation | Ensure root group has GID 0"
      ansible.builtin.group:
        name: root
        gid: 0

    - name: "CIS 5.4.2.2 | REPORT | Alert if non-root accounts have GID 0"
      ansible.builtin.debug:
        msg:
          - "=== CIS 5.4.2.2 — WARNING: Non-root accounts with primary GID 0 ==="
          - "Accounts: {{ _cis_gid_zero_accounts.stdout_lines }}"
          - "Action: Manually review and change primary group for these accounts"
      when: _cis_gid_zero_accounts.stdout_lines | length > 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.2.2
    - NIST800-53R5_AC-3
    - users

- name: "CIS 5.4.2.3 | Remediation | Ensure group root is the only GID 0 group"
  when: cis_5_4_2_3_root_group_gid_zero | default(true)
  block:
    - name: "CIS 5.4.2.3 | AUDIT | Find groups with GID 0"
      ansible.builtin.command: "awk -F: '($3 == 0) {print $1}' /etc/group"
      register: _cis_gid_zero_groups
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.2.3 | Remediation | Ensure root group has GID 0"
      ansible.builtin.group:
        name: root
        gid: 0

    - name: "CIS 5.4.2.3 | REPORT | Alert if non-root groups have GID 0"
      ansible.builtin.debug:
        msg:
          - "=== CIS 5.4.2.3 — WARNING: Non-root groups with GID 0 ==="
          - "Groups: {{ _cis_gid_zero_groups.stdout_lines | difference(['root']) }}"
          - "Action: Manually review and change GID for these groups"
      when: _cis_gid_zero_groups.stdout_lines | difference(['root']) | length > 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.2.3
    - NIST800-53R5_AC-3
    - users

- name: "CIS 5.4.2.4 | Remediation | Ensure root account access is controlled"
  when: cis_5_4_2_4_root_access_controlled | default(true)
  block:
    - name: "CIS 5.4.2.4 | AUDIT | Check root password status"
      ansible.builtin.command: "passwd -S root"
      register: _cis_root_passwd_status
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.2.4 | Remediation | Lock root password if not already locked"
      when: "'L' not in _cis_root_passwd_status.stdout and 'LK' not in _cis_root_passwd_status.stdout"
      ansible.builtin.user:
        name: root
        password_lock: true

    - name: "CIS 5.4.2.4 | REPORT | Display root account status"
      ansible.builtin.debug:
        msg:
          - "=== CIS 5.4.2.4 — Root account status ==="
          - "Status: {{ _cis_root_passwd_status.stdout }}"
          - "Note: Root should be locked; use sudo for privileged access"
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.2.4
    - NIST800-53R5_AC-3
    - users

- name: "CIS 5.4.2.5 | Remediation | Ensure root PATH integrity"
  when: cis_5_4_2_5_root_path_integrity | default(true)
  block:
    - name: "CIS 5.4.2.5 | AUDIT | Check for world-writable directories in root PATH"
      ansible.builtin.shell: |
        IFS=:; for path in $PATH; do
          [ -d "$path" ] && [ "$(stat -c '%a' "$path" 2>/dev/null)" ] && \
          [ $(( $(stat -c '%a' "$path") & 002 )) -ne 0 ] && echo "$path"
        done
      register: _cis_writable_paths
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.2.5 | REPORT | Alert on world-writable PATH directories"
      ansible.builtin.debug:
        msg:
          - "=== CIS 5.4.2.5 — WARNING: World-writable directories in PATH ==="
          - "Paths: {{ _cis_writable_paths.stdout_lines }}"
          - "Action: Remove write permissions: chmod o-w <path>"
      when: _cis_writable_paths.stdout_lines | length > 0

    - name: "CIS 5.4.2.5 | AUDIT | Check for empty directories in root PATH"
      ansible.builtin.shell: |
        IFS=:; for path in $PATH; do
          [ -d "$path" ] && [ -z "$(ls -A "$path" 2>/dev/null)" ] && echo "$path"
        done
      register: _cis_empty_paths
      changed_when: false
      failed_when: false

    - name: "CIS 5.4.2.5 | REPORT | Alert on empty directories in PATH"
      ansible.builtin.debug:
        msg:
          - "=== CIS 5.4.2.5 — WARNING: Empty directories in PATH ==="
          - "Paths: {{ _cis_empty_paths.stdout_lines }}"
          - "Action: Remove empty directories from PATH or populate them"
      when: _cis_empty_paths.stdout_lines | length > 0
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.2.5
    - NIST800-53R5_CM-6
    - users

- name: "CIS 5.4.2.6 | Remediation | Ensure root is the only UID 0 account in /etc/passwd"
  when: cis_5_4_2_6_root_only_uid_zero | default(true)
  ansible.builtin.lineinfile:
    path: /etc/passwd
    regexp: '^(?!root:)[^:]+:[^:]*:0:'
    state: absent
    backup: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.2.6
    - NIST800-53R5_AC-3
    - users

- name: "CIS 5.4.2.7 | Remediation | Ensure no legacy '+' entries exist in /etc/passwd"
  when: cis_5_4_2_7_no_legacy_entries | default(true)
  ansible.builtin.lineinfile:
    path: /etc/passwd
    regexp: '^\+:'
    state: absent
    backup: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.2.7
    - NIST800-53R5_CM-6
    - users

- name: "CIS 5.4.2.8 | Remediation | Ensure no legacy '+' entries exist in /etc/group"
  when: cis_5_4_2_8_no_legacy_group_entries | default(true)
  ansible.builtin.lineinfile:
    path: /etc/group
    regexp: '^\+:'
    state: absent
    backup: yes
  tags:
    - level1-server
    - level1-workstation
    - remediation
    - cis_5.4.2.8
    - NIST800-53R5_CM-6
    - users
