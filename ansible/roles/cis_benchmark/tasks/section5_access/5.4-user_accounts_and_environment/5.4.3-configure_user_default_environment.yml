---
- name: "CIS 5.4.3.1 | Remediation | Remove nologin from valid shells"
  when: cis_5_4_3_1_nologin_not_in_shells | default(true)
  ansible.builtin.lineinfile:
    path: /etc/shells
    regexp: '^\s*[^#]*\/nologin\s*$'
    state: absent
  tags: [level2-server, level2-workstation, remediation, cis_5.4.3.1, users]

- name: "CIS 5.4.3.2 | Safety | Validate default shell timeout"
  ansible.builtin.assert:
    that:
      - cis_default_shell_timeout | default(900) | int > 0
      - cis_default_shell_timeout | default(900) | int <= 900
    fail_msg: "TMOUT must be between 1 and 900 seconds."
  tags: [cis_5.4.3.2, users]

- name: "CIS 5.4.3.2 | Remediation | Configure default shell timeout once"
  when: cis_5_4_3_2_default_shell_timeout | default(true)
  ansible.builtin.copy:
    dest: /etc/profile.d/99-cis-tmout.sh
    content: |
      # Managed by Ansible - CIS 5.4.3.2
      readonly TMOUT={{ cis_default_shell_timeout | default(900) }}
      export TMOUT
    owner: root
    group: root
    mode: "0644"
  tags: [level1-server, level1-workstation, remediation, cis_5.4.3.2, users]

- name: "CIS 5.4.3.2 | Audit | Find conflicting system-wide TMOUT values"
  ansible.builtin.shell: |
    set -o pipefail
    grep -RHE '^\s*(readonly\s+)?TMOUT=(0|9[0-9][1-9]|9[1-9][0-9]|[1-9][0-9]{3,})\b' \
      /etc/profile /etc/bash.bashrc /etc/profile.d/*.sh | \
      grep -v '^/etc/profile.d/99-cis-tmout.sh:'
  args:
    executable: /bin/bash
  register: _cis_conflicting_tmout
  changed_when: false
  check_mode: false
  failed_when: _cis_conflicting_tmout.rc not in [0, 1]
  tags: [level1-server, level1-workstation, audit, manual, cis_5.4.3.2, users]

- name: "CIS 5.4.3.2 | Manual | Report conflicting TMOUT values"
  when: _cis_conflicting_tmout.rc == 0
  ansible.builtin.debug:
    msg: "Review conflicting TMOUT definitions: {{ _cis_conflicting_tmout.stdout_lines }}"
  tags: [level1-server, level1-workstation, audit, manual, cis_5.4.3.2, users]

- name: "CIS 5.4.3.3 | Remediation | Configure secure login.defs umask"
  when: cis_5_4_3_3_default_umask | default(true)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*UMASK\s+'
    line: "UMASK           {{ cis_default_umask | default('027') }}"
  tags: [level1-server, level1-workstation, remediation, cis_5.4.3.3, users]

- name: "CIS 5.4.3.3 | Remediation | Configure shell umask at highest system precedence"
  when: cis_5_4_3_3_default_umask | default(true)
  ansible.builtin.copy:
    dest: /etc/profile.d/99-cis-umask.sh
    content: |
      # Managed by Ansible - CIS 5.4.3.3
      umask {{ cis_default_umask | default('027') }}
    owner: root
    group: root
    mode: "0644"
  tags: [level1-server, level1-workstation, remediation, cis_5.4.3.3, users]
