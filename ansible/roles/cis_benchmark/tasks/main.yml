---

- name: Gather package facts
  package_facts:
    manager: auto

- name: Gather service facts
  service_facts:

  # =============================================================================
# SECTION 1: INITIAL SETUP
# =============================================================================
- name: Include section 1 initial setup
  when: cis_section1_initial_setup | default(true)
  ansible.builtin.import_tasks: section1_initialsetup/main.yml
  tags:
    - cis_1
    - cis_sec1
    - initial_setup
    - filesystem
    - packages
    - apparmor
    - bootloader
    - process_hardening
    - banners
    - gdm

# BEGIN SECTION 2 BLOCK
# Section 2: Services
- name: Include section 2 services configuration
  when: cis_section2_services | default(true)
  ansible.builtin.import_tasks: section2_services/main.yml
  tags:
    - cis_2
    - cis_2_1
    - cis_2_2
    - cis_2_3
    - cis_2_4
    - services
    - time_sync
    - job_schedulers
# END SECTION 2 BLOCK


- name: Include section 3 network configuration
  when: section3_network.enabled | default(true)
  ansible.builtin.import_tasks: section3_network/main.yml
  tags:
    - cis_3
    - cis_3_1
    - cis_3_2
    - cis_3_3
    - cis_3_1_1
    - cis_3_1_2
    - cis_3_1_3
    - cis_3_2_1
    - cis_3_2_2
    - cis_3_2_3
    - cis_3_2_4
    - cis_3_3_1
    - cis_3_3_2
    - cis_3_3_3
    - cis_3_3_4
    - cis_3_3_5
    - cis_3_3_6
    - cis_3_3_7
    - cis_3_3_8
    - cis_3_3_9
    - cis_3_3_10
    - network
    - network_devices
    - network_modules
    - network_sysctl
    

# =============================================================================
# SECTION 4: FIREWALL
# =============================================================================
- name: Include section 4 firewall configuration
  when: cis_section4_firewall | default(true)
  ansible.builtin.import_tasks: section4_firewall/main.yml
  tags:
    - cis_4
    - cis_sec4
    - firewall
    - ufw
    - nftables
    - iptables

# =============================================================================
# SECTION 5: ACCESS CONTROL
# =============================================================================
- name: Include section 5 access control configuration
  when: cis_section5_access_control | default(true)
  ansible.builtin.import_tasks: section5_access/main.yml
  tags:
    - cis_5
    - cis_sec5
    - access_control
    - ssh
    - sudo
    - pam
    - users




# BEGIN SECTION 6 BLOCK
# Section 6: Logging and Auditing
- name: Include section 6 logging and auditing
  when: section6_logging.enabled | default(true)
  ansible.builtin.include_tasks: section6_logging/main.yml
  tags:
    - cis_6
    - cis_6_1
    - cis_6_2
    - cis_6_3
    - cis_6_1_1
    - cis_6_1_2
    - cis_6_1_3
    - cis_6_1_4
    - cis_6_2_1
    - cis_6_2_2
    - cis_6_2_3
    - cis_6_2_4
    - cis_6_3_1
    - cis_6_3_2
    - cis_6_3_3
    - logging
    - auditing
    - aide
    - aide_install
    - aide_timer
    - aide_rules
    - aide_config
# END SECTION 6 BLOCK


