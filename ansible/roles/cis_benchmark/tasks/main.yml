---

- name: Run the common platform and release preflight
  ansible.builtin.import_role:
    name: cis_platform_preflight
  tags: [always, preflight, platform]

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  tags: always

- name: Gather service facts
  ansible.builtin.service_facts:
  tags: always

- name: Validate Ubuntu 24.04 target
  ansible.builtin.assert:
    that:
      - cis_platform_id == 'ubuntu_2404'
    fail_msg: >-
      This role supports Ubuntu 24.04 only;
      detected {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
    success_msg: Validated Ubuntu 24.04 target.
  tags: always

# =============================================================================
# SECTION 1: INITIAL SETUP
# =============================================================================
- name: Include section 1 initial setup
  when: cis_section1_initial_setup | default(true)
  ansible.builtin.import_tasks: section1_initialsetup/main.yml
  tags:
    - cis_1
    - cis_sec1

# BEGIN SECTION 2 BLOCK
# Section 2: Services
- name: Include section 2 services configuration
  when: cis_section2_services | default(true)
  ansible.builtin.import_tasks: section2_services/main.yml
  tags:
    - cis_2
    - cis_sec2
# END SECTION 2 BLOCK


- name: Include section 3 network configuration
  when:
    - cis_section3_network | bool
    - section3_network.enabled | bool
  ansible.builtin.import_tasks: section3_network/main.yml
  tags:
    - cis_3
    - cis_sec3
    

# =============================================================================
# SECTION 4: FIREWALL
# =============================================================================
- name: Include section 4 firewall configuration
  when: cis_section4_firewall | default(true)
  ansible.builtin.import_tasks: section4_firewall/main.yml
  tags:
    - cis_4
    - cis_sec4

# =============================================================================
# SECTION 5: ACCESS CONTROL
# =============================================================================
- name: Include section 5 access control configuration
  when: cis_section5_access_control | default(true)
  ansible.builtin.import_tasks: section5_access/main.yml
  tags:
    - cis_5
    - cis_sec5




# BEGIN SECTION 6 BLOCK
# Section 6: Logging and Auditing
- name: Include section 6 logging and auditing
  when: cis_section6_logging_audit | bool
  ansible.builtin.import_tasks: section6_logging/main.yml
  tags:
    - cis_6
    - cis_sec6
# END SECTION 6 BLOCK

# =============================================================================
# SECTION 7: SYSTEM MAINTENANCE
# =============================================================================
- name: Include section 7 system maintenance
  when: cis_section7_system | bool
  ansible.builtin.import_tasks: section7_system/main.yml
  tags:
    - cis_7
    - cis_sec7
    - system_maintenance
