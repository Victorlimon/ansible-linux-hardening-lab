---
# =============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 1.3: Mandatory Access Control
# Controls: 1.3.1.1-1.3.1.4 | AppArmor installation, bootloader config, profiles
# =============================================================================

- name: "CIS 1.3.1.1 | Remediation | Ensure AppArmor is installed"
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils
    state: present
    update_cache: yes
  when:
    - cis_section1_3_mac | default(true)
    - cis_1_3_1_1_apparmor_installed | default(true)
  tags: ['cis_sec1', 'cis_1.3.1.1', 'level1', 'NIST800-53R5_AC-3']

- name: "CIS 1.3.1.2 | Remediation | Ensure AppArmor is enabled in bootloader configuration"
  block:
    - name: "CIS 1.3.1.2 | AUDIT | Read current GRUB config"
      ansible.builtin.slurp:
        src: /etc/default/grub
      register: _cis_grub_content
      failed_when: false

    - name: "CIS 1.3.1.2 | Remediation | Ensure apparmor=1 security=apparmor in GRUB"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="apparmor=1 security=apparmor"'
        state: present
        backup: yes
      notify: Update grub
      when:
        - _cis_grub_content.content is defined
        - "'apparmor=1' not in (_cis_grub_content.content | b64decode) or 'security=apparmor' not in (_cis_grub_content.content | b64decode)"
  when:
    - cis_section1_3_mac | default(true)
    - cis_1_3_1_2_apparmor_bootloader | default(true)
  tags: ['cis_sec1', 'cis_1.3.1.2', 'level1', 'NIST800-53R5_AC-3']

- name: "CIS 1.3.1.3 | Remediation | Ensure all AppArmor Profiles are in enforce or complain mode"
  ansible.builtin.command: "aa-{{ cis_apparmor_default_mode | default('enforce') }} /etc/apparmor.d/*"
  register: _cis_apparmor_result
  changed_when: "'Setting' in _cis_apparmor_result.stdout"
  failed_when:
    - _cis_apparmor_result.rc != 0
    - "'does not exist' not in _cis_apparmor_result.stderr"
  when:
    - cis_section1_3_mac | default(true)
    - cis_1_3_1_3_apparmor_profiles_active | default(true)
  tags: ['cis_sec1', 'cis_1.3.1.3', 'level1', 'NIST800-53R5_AC-3']

- name: "CIS 1.3.1.4 | Remediation | Ensure all AppArmor Profiles are enforcing (Level 2)"
  ansible.builtin.command: aa-enforce /etc/apparmor.d/*
  register: _cis_apparmor_enforce_result
  changed_when: "'Setting' in _cis_apparmor_enforce_result.stdout"
  failed_when:
    - _cis_apparmor_enforce_result.rc != 0
    - "'does not exist' not in _cis_apparmor_enforce_result.stderr"
  when:
    - cis_section1_3_mac | default(true)
    - cis_1_3_1_4_apparmor_enforcing | default(false)
  tags: ['cis_sec1', 'cis_1.3.1.4', 'level2', 'NIST800-53R5_AC-3']
