---
# =============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Updates
# =============================================================================

- name: "CIS 1.2.2.1 | Remediation | Configure automatic security updates when approved"
  when:
    - cis_section1_2_packages | default(true)
    - cis_1_2_2_auto_updates | default(false)  # Disabled by default, enable if needed
  block:
    - name: "CIS 1.2.2 | Install unattended-upgrades package"
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: "CIS 1.2.2 | Configure unattended-upgrades"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}";
              "${distro_id}:${distro_codename}-security";
          };
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
        owner: root
        group: root
        mode: '0644'
        backup: yes

    - name: "CIS 1.2.2 | Enable unattended-upgrades service"
      ansible.builtin.systemd_service:
        name: unattended-upgrades.service
        enabled: yes
        state: started
  tags: ['cis_sec1', 'cis_1.2.2', 'cis_1.2.2.1', 'level2', 'auto-updates']
