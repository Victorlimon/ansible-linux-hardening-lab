---
- name: "CIS 1.2.1.1 | Ensure Ubuntu archive keyring is installed"
  ansible.builtin.apt:
    name: ubuntu-keyring
    state: present
  when:
    - cis_section1_2_packages | bool
    - cis_1_2_1_1_gpg_keys | bool
  tags: [cis_sec1, cis_1.2.1, cis_1.2.1.1, gpg]

- name: "CIS 1.2.1.1 | Ensure unauthenticated packages are rejected"
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/99cis-secure
    regexp: '^APT::Get::AllowUnauthenticated'
    line: 'APT::Get::AllowUnauthenticated "false";'
    create: true
    mode: '0644'
    owner: root
    group: root
  when:
    - cis_section1_2_packages | bool
    - cis_1_2_1_1_gpg_keys | bool
  tags: [cis_sec1, cis_1.2.1, cis_1.2.1.1, gpg]
