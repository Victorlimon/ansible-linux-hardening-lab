---
# =============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 1.2.1: Configure Repositories
# Verifica que los repositorios oficiales estén configurados y firmados.
# Sin dependencias de templates externos.
# =============================================================================

- name: "CIS 1.2.1.2 | Audit | Verify apt sources configuration"
  block:
    - name: "CIS 1.2.1 | AUDIT | Check /etc/apt/sources.list.d/ubuntu.sources"
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/ubuntu.sources
      register: _cis_ubuntu_sources
      tags: ['cis_sec1', 'cis_1.2.1', 'cis_1.2.1.2', 'packages']

    - name: "CIS 1.2.1 | AUDIT | Check /etc/apt/sources.list"
      ansible.builtin.stat:
        path: /etc/apt/sources.list
      register: _cis_sources_list
      tags: ['cis_sec1', 'cis_1.2.1', 'cis_1.2.1.2', 'packages']

    - name: "CIS 1.2.1 | AUDIT | Read ubuntu.sources when present"
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/ubuntu.sources
      register: _cis_ubuntu_sources_content
      when: _cis_ubuntu_sources.stat.exists
      tags: ['cis_sec1', 'cis_1.2.1', 'cis_1.2.1.2', 'packages']

    - name: "CIS 1.2.1 | AUDIT | Read legacy sources.list when present"
      ansible.builtin.slurp:
        src: /etc/apt/sources.list
      register: _cis_sources_list_content
      when: _cis_sources_list.stat.exists
      tags: ['cis_sec1', 'cis_1.2.1', 'cis_1.2.1.2', 'packages']

    - name: "CIS 1.2.1 | AUDIT | Derive active official source presence"
      ansible.builtin.set_fact:
        _cis_ubuntu_sources_active: >-
          {{ ((_cis_ubuntu_sources_content.content | default('') | b64decode |
              regex_search('(?im)^\s*Types:\s*deb(?:\s|$)'))) is not none and
             ((_cis_ubuntu_sources_content.content | default('') | b64decode |
              regex_search('(?im)^\s*URIs:\s*https?://(?:[a-z]{2}\.)?archive\.ubuntu\.com/ubuntu/?'))) is not none and
             ((_cis_ubuntu_sources_content.content | default('') | b64decode |
              regex_search('(?im)^\s*Suites:.*\b' ~ ansible_facts.distribution_release ~ '\b'))) is not none and
             ((_cis_ubuntu_sources_content.content | default('') | b64decode |
              regex_search('(?im)^\s*URIs:\s*https?://security\.ubuntu\.com/ubuntu/?'))) is not none and
             ((_cis_ubuntu_sources_content.content | default('') | b64decode |
              regex_search('(?im)^\s*Suites:.*\b' ~ ansible_facts.distribution_release ~ '-security\b'))) is not none and
             ((_cis_ubuntu_sources_content.content | default('') | b64decode |
              regex_search('(?im)^\s*Enabled:\s*no\s*$'))) is none }}
        _cis_sources_list_active: >-
          {{ ((_cis_sources_list_content.content | default('') | b64decode |
              regex_search('(?im)^\s*deb(?:\s+\[[^]]+\])?\s+https?://(?:[a-z]{2}\.)?archive\.ubuntu\.com/ubuntu/?\s+' ~ ansible_facts.distribution_release ~ '(?:\s|$)'))) is not none and
             ((_cis_sources_list_content.content | default('') | b64decode |
              regex_search('(?im)^\s*deb(?:\s+\[[^]]+\])?\s+https?://security\.ubuntu\.com/ubuntu/?\s+' ~ ansible_facts.distribution_release ~ '-security(?:\s|$)'))) is not none }}
      tags: ['cis_sec1', 'cis_1.2.1', 'cis_1.2.1.2', 'packages']

    - name: "CIS 1.2.1 | REPORT | Display repository configuration status"
      ansible.builtin.debug:
        msg:
          - "=== CIS 1.2.1 - Repository Configuration ==="
          - "ubuntu.sources has active deb entries: {{ _cis_ubuntu_sources_active }}"
          - "sources.list has active deb entries: {{ _cis_sources_list_active }}"
          - "Note: CIS 1.2.1 requires official Ubuntu repositories to be configured."
          - "If using default Ubuntu 24.04, repositories are pre-configured correctly."
      when: not _cis_ubuntu_sources_active and not _cis_sources_list_active
      tags: ['cis_sec1', 'cis_1.2.1', 'cis_1.2.1.2', 'packages']

- name: "CIS 1.2.1.2 | Remediation | Ensure official repositories are present"
  when:
    - not _cis_ubuntu_sources_active
    - not _cis_sources_list_active
  block:
    - name: "CIS 1.2.1 | Create ubuntu.sources with official repositories"
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/ubuntu.sources
        content: |
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: {{ ansible_facts.distribution_release }} {{ ansible_facts.distribution_release }}-updates {{ ansible_facts.distribution_release }}-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: {{ ansible_facts.distribution_release }}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        owner: root
        group: root
        mode: '0644'
      tags: ['cis_sec1', 'cis_1.2.1', 'cis_1.2.1.2', 'packages']

- name: "CIS 1.2.1.2 | Remediation | Archive unapproved third-party repositories"
  when: cis_1_2_1_remove_third_party | default(false)
  block:
    - name: "CIS 1.2.1 | Find non-official repository files"
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: "*.sources,*.list"
        excludes: "ubuntu.sources"
      register: _cis_third_party_repos
      tags: ['cis_sec1', 'cis_1.2.1', 'cis_1.2.1.2', 'packages']

    - name: "CIS 1.2.1 | Archive third-party repositories"
      ansible.builtin.command:
        argv:
          - mv
          - "{{ item.path }}"
          - "{{ item.path }}.cis_disabled"
      loop: "{{ _cis_third_party_repos.files }}"
      when: _cis_third_party_repos.files | length > 0
      changed_when: true
      tags: ['cis_sec1', 'cis_1.2.1', 'cis_1.2.1.2', 'packages']
