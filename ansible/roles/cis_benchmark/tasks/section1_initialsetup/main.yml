---
# =============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 1: Initial Setup
# Entry point - importa todos los sub-módulos con tags y condicionales
# =============================================================================

- name: Include Section 1.1 - Filesystem Configuration
  when: cis_section1_1_filesystem | default(true)
  ansible.builtin.import_tasks: 1.1-configure_filesystem/main.yml
  tags: ['cis_sec1', 'cis_1.1', 'filesystem']

- name: Include Section 1.2 - Package Management
  when: cis_section1_2_packages | default(true)
  ansible.builtin.import_tasks: 1.2-configure_package_management/main.yml
  tags: ['cis_sec1', 'cis_1.2', 'packages']

- name: Include Section 1.3 - Mandatory Access Control (AppArmor)
  when: cis_section1_3_mac | default(true)
  ansible.builtin.import_tasks: 1.3-configure_mandatory_access_control.yml
  tags: ['cis_sec1', 'cis_1.3', 'apparmor', 'mac']

- name: Include Section 1.4 - Bootloader Configuration
  when: cis_section1_4_bootloader | default(true)
  ansible.builtin.import_tasks: 1.4-configure_bootloader.yml
  tags: ['cis_sec1', 'cis_1.4', 'bootloader', 'grub']

- name: Include Section 1.5 - Process Hardening
  when: cis_section1_5_process_hardening | default(true)
  ansible.builtin.import_tasks: 1.5-configure_process_hardening.yml
  tags: ['cis_sec1', 'cis_1.5', 'process', 'hardening']

- name: Include Section 1.6 - Login Banners
  when: cis_section1_6_banners | default(true)
  ansible.builtin.import_tasks: 1.6-configure_login_banners.yml
  tags: ['cis_sec1', 'cis_1.6', 'banners', 'motd']

- name: Include Section 1.7 - GDM Configuration (Workstation only)
  when:
    - cis_section1_7_gdm | default(true)
    - ansible_facts.distribution == "Ubuntu" and ansible_facts.distribution_version is version('24.04', '==')
  ansible.builtin.import_tasks: 1.7-configure_gdm.yml
  tags: ['cis_sec1', 'cis_1.7', 'gdm', 'gui', 'workstation']
