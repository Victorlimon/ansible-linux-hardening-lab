- name: "CIS 1.1.1.10 | Audit | List unused filesystem modules for manual review"
  ansible.builtin.shell: |
    set -o pipefail
    find "$(readlink -f /lib/modules/$(uname -r)/kernel/fs)" \
      -mindepth 1 -maxdepth 1 -type d ! -empty -printf '%f\n' | sort
  args:
    executable: /bin/bash
  register: _cis_all_fs_modules
  changed_when: false
  check_mode: false
  when: cis_1_1_1_10_unused_modules_manual | default(false)
  tags: ['cis_sec1', 'cis_1.1.1.10']

- name: "CIS 1.1.1.10 | Manual | Report filesystem modules for review"
  ansible.builtin.debug:
    msg:
      - "MANUAL: Review available filesystem modules and disable only those without an approved dependency."
      - "{{ _cis_all_fs_modules.stdout_lines }}"
  when: cis_1_1_1_10_unused_modules_manual | default(false)
  tags: ['cis_sec1', 'cis_1.1.1.10']
