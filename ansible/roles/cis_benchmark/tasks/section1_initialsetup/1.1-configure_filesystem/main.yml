---
# =============================================================================
# CIS 1.1 | Filesystem Configuration - Entry Point
# Importa kernel modules y partitions con tags y condicionales
# =============================================================================

- name: Include kernel modules configuration
  when: cis_1_1_1_kernel_modules | default(true)
  ansible.builtin.import_tasks: 1.1.1-configure_kernel_modules.yml
  tags: ['cis_sec1', 'cis_1.1.1', 'kernel_modules']

- name: Include partitions configuration
  when: cis_1_1_2_partitions | default(true)
  ansible.builtin.import_tasks: 1.1.2-configure_partitions/main.yml
  tags: ['cis_sec1', 'cis_1.1.2', 'partitions']
