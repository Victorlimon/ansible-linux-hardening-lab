---
- name: "CIS 1.1.2.4.1 | Audit | Determine whether /var is a separate mount"
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, /var, --noheadings]
  register: _cis_var_mount
  changed_when: false
  check_mode: false
  failed_when: _cis_var_mount.rc not in [0, 1]
  tags: ['cis_sec1', 'cis_1.1.2.4.1']

- name: "CIS 1.1.2.4.1 | Manual | Report missing /var partition"
  ansible.builtin.debug:
    msg: "MANUAL: /var is not a separate mount. Provision and migrate it offline after backup; no disk changes were made."
  when: _cis_var_mount.rc == 1
  tags: ['cis_sec1', 'cis_1.1.2.4.1']

- name: "CIS 1.1.2.4.2 | Remediation | Configure nodev on /var"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.4.2']}
  vars: {_cis_mount_control: 1.1.2.4.2, _cis_mount_path: /var, _cis_mount_option: nodev}
  when: _cis_var_mount.rc == 0 and cis_1_1_2_var_nodev | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.4.2']

- name: "CIS 1.1.2.4.3 | Remediation | Configure nosuid on /var"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.4.3']}
  vars: {_cis_mount_control: 1.1.2.4.3, _cis_mount_path: /var, _cis_mount_option: nosuid}
  when: _cis_var_mount.rc == 0 and cis_1_1_2_var_nosuid | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.4.3']
