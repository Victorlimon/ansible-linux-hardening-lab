---
- name: "CIS 1.1.2.2.1 | Audit | Determine whether /dev/shm is a mount point"
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, /dev/shm, --noheadings]
  register: _cis_dev_shm_mount
  changed_when: false
  check_mode: false
  failed_when: _cis_dev_shm_mount.rc not in [0, 1]
  tags: ['cis_sec1', 'cis_1.1.2.2.1']

- name: "CIS 1.1.2.2.1 | Manual | Report that /dev/shm requires provisioning"
  ansible.builtin.debug:
    msg: "MANUAL: /dev/shm is not a separate mount. Provision tmpfs during a maintenance window; no disk changes were made."
  when: _cis_dev_shm_mount.rc == 1
  tags: ['cis_sec1', 'cis_1.1.2.2.1']

- name: "CIS 1.1.2.2.2 | Remediation | Configure nodev on /dev/shm"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.2.2']}
  vars: {_cis_mount_control: 1.1.2.2.2, _cis_mount_path: /dev/shm, _cis_mount_option: nodev}
  when: _cis_dev_shm_mount.rc == 0 and cis_1_1_2_dev_shm_nodev | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.2.2']

- name: "CIS 1.1.2.2.3 | Remediation | Configure nosuid on /dev/shm"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.2.3']}
  vars: {_cis_mount_control: 1.1.2.2.3, _cis_mount_path: /dev/shm, _cis_mount_option: nosuid}
  when: _cis_dev_shm_mount.rc == 0 and cis_1_1_2_dev_shm_nosuid | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.2.3']

- name: "CIS 1.1.2.2.4 | Remediation | Configure noexec on /dev/shm"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.2.4']}
  vars: {_cis_mount_control: 1.1.2.2.4, _cis_mount_path: /dev/shm, _cis_mount_option: noexec}
  when: _cis_dev_shm_mount.rc == 0 and cis_1_1_2_dev_shm_noexec | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.2.4']
