---
- name: "CIS 1.1.2.3.1 | Audit | Determine whether /home is a separate mount"
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, /home, --noheadings]
  register: _cis_home_mount
  changed_when: false
  check_mode: false
  failed_when: _cis_home_mount.rc not in [0, 1]
  tags: ['cis_sec1', 'cis_1.1.2.3.1']

- name: "CIS 1.1.2.3.1 | Manual | Report missing /home partition"
  ansible.builtin.debug:
    msg: "MANUAL: /home is not a separate mount. Provision and migrate it offline after backup; no disk changes were made."
  when: _cis_home_mount.rc == 1
  tags: ['cis_sec1', 'cis_1.1.2.3.1']

- name: "CIS 1.1.2.3.2 | Remediation | Configure nodev on /home"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.3.2']}
  vars: {_cis_mount_control: 1.1.2.3.2, _cis_mount_path: /home, _cis_mount_option: nodev}
  when: _cis_home_mount.rc == 0 and cis_1_1_2_home_nodev | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.3.2']

- name: "CIS 1.1.2.3.3 | Remediation | Configure nosuid on /home"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.3.3']}
  vars: {_cis_mount_control: 1.1.2.3.3, _cis_mount_path: /home, _cis_mount_option: nosuid}
  when: _cis_home_mount.rc == 0 and cis_1_1_2_home_nosuid | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.3.3']
