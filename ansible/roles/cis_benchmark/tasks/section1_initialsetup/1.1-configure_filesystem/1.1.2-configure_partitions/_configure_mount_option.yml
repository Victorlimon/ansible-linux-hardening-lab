---
- name: "CIS {{ _cis_mount_control }} | Audit | Read current {{ _cis_mount_path }} mount options"
  ansible.builtin.command:
    argv:
      - findmnt
      - --mountpoint
      - "{{ _cis_mount_path }}"
      - --noheadings
      - --output
      - SOURCE,FSTYPE,OPTIONS
  register: _cis_current_mount
  changed_when: false
  check_mode: false

- name: "CIS {{ _cis_mount_control }} | Audit | Read persistent {{ _cis_mount_path }} mount options"
  ansible.builtin.command:
    argv:
      - findmnt
      - --fstab
      - --mountpoint
      - "{{ _cis_mount_path }}"
      - --noheadings
      - --output
      - SOURCE,FSTYPE,OPTIONS
  register: _cis_persistent_mount
  changed_when: false
  failed_when: _cis_persistent_mount.rc not in [0, 1]
  check_mode: false

- name: "CIS {{ _cis_mount_control }} | Remediation | Persist {{ _cis_mount_option }} on {{ _cis_mount_path }}"
  ansible.posix.mount:
    path: "{{ _cis_mount_path }}"
    src: "{{ _cis_persistent_mount.stdout.split()[0] if _cis_persistent_mount.rc == 0 else _cis_current_mount.stdout.split()[0] }}"
    fstype: "{{ _cis_persistent_mount.stdout.split()[1] if _cis_persistent_mount.rc == 0 else _cis_current_mount.stdout.split()[1] }}"
    opts: "{{ ((_cis_persistent_mount.stdout.split()[2].split(',') if _cis_persistent_mount.rc == 0 else _cis_current_mount.stdout.split()[2].split(',')) | union([_cis_mount_option])) | join(',') }}"
    state: mounted
  when: >-
    _cis_persistent_mount.rc != 0 or
    _cis_mount_option not in _cis_persistent_mount.stdout.split()[2].split(',') or
    _cis_mount_option not in _cis_current_mount.stdout.split()[2].split(',')
