---
- name: "CIS 1.1.2.5.1 | Audit | Determine whether /var/tmp is a separate mount"
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, /var/tmp, --noheadings]
  register: _cis_var_tmp_mount
  changed_when: false
  check_mode: false
  failed_when: _cis_var_tmp_mount.rc not in [0, 1]
  tags: ['cis_sec1', 'cis_1.1.2.5.1']

- name: "CIS 1.1.2.5.1 | Manual | Report missing /var/tmp partition"
  ansible.builtin.debug:
    msg: "MANUAL: /var/tmp is not a separate mount. Provision and migrate it offline after backup; no disk changes were made."
  when: _cis_var_tmp_mount.rc == 1
  tags: ['cis_sec1', 'cis_1.1.2.5.1']

- name: "CIS 1.1.2.5.2 | Remediation | Configure nodev on /var/tmp"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.5.2']}
  vars: {_cis_mount_control: 1.1.2.5.2, _cis_mount_path: /var/tmp, _cis_mount_option: nodev}
  when: _cis_var_tmp_mount.rc == 0 and cis_1_1_2_var_tmp_nodev | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.5.2']

- name: "CIS 1.1.2.5.3 | Remediation | Configure nosuid on /var/tmp"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.5.3']}
  vars: {_cis_mount_control: 1.1.2.5.3, _cis_mount_path: /var/tmp, _cis_mount_option: nosuid}
  when: _cis_var_tmp_mount.rc == 0 and cis_1_1_2_var_tmp_nosuid | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.5.3']

- name: "CIS 1.1.2.5.4 | Remediation | Configure noexec on /var/tmp"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.5.4']}
  vars: {_cis_mount_control: 1.1.2.5.4, _cis_mount_path: /var/tmp, _cis_mount_option: noexec}
  when: _cis_var_tmp_mount.rc == 0 and cis_1_1_2_var_tmp_noexec | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.5.4']
