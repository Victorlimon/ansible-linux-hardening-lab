---
# =============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 1.1.2.7: Configure /var/log/audit
# =============================================================================
# Nota: Solo verifica opciones de montaje en particiones existentes.
#       La creación de particiones debe hacerse en provisioning inicial.
# Referencia: CIS 1.1.2.7.1 - 1.1.2.7.4
# =============================================================================

- name: "CIS 1.1.2.7.1 | AUDIT | Check if /var/log/audit is a separate partition"
  ansible.builtin.shell: findmnt -kn /var/log/audit 2>/dev/null || true
  changed_when: false
  failed_when: false
  register: _cis_varlogaudit_mount
  tags: ['cis_sec1', 'cis_1.1.2.7', 'partitions', 'var_log_audit', 'audit']

- name: "CIS 1.1.2.7.2 | Remediation | Ensure nodev option set on /var/log/audit"
  when:
    - _cis_varlogaudit_mount.rc == 0
    - _cis_varlogaudit_mount.stdout | length > 0
    - cis_1_1_2_var_log_audit_nodev | default(true)
  block:
    - name: "CIS 1.1.2.7.2 | AUDIT | Re-read /var/log/audit mount options"
      ansible.builtin.shell: findmnt -kn /var/log/audit -o OPTIONS 2>/dev/null || true
      changed_when: false
      register: _cis_varlogaudit_opts
      tags: ['cis_sec1', 'cis_1.1.2.7', 'partitions', 'var_log_audit', 'audit']

    - name: "CIS 1.1.2.7.2 | Remediation | Apply nodev to /var/log/audit"
      when: "'nodev' not in _cis_varlogaudit_opts.stdout"
      ansible.posix.mount:
        path: /var/log/audit
        src: "{{ _cis_varlogaudit_mount.stdout.split()[1] }}"
        fstype: "{{ _cis_varlogaudit_mount.stdout.split()[2] }}"
        opts: "{{ (_cis_varlogaudit_opts.stdout | trim).split(',') | union(['nodev']) | join(',') }}"
        state: remounted
      tags: ['cis_sec1', 'cis_1.1.2.7', 'partitions', 'var_log_audit', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']

- name: "CIS 1.1.2.7.3 | Remediation | Ensure nosuid option set on /var/log/audit"
  when:
    - _cis_varlogaudit_mount.rc == 0
    - _cis_varlogaudit_mount.stdout | length > 0
    - cis_1_1_2_var_log_audit_nosuid | default(true)
  block:
    - name: "CIS 1.1.2.7.3 | AUDIT | Re-read /var/log/audit mount options"
      ansible.builtin.shell: findmnt -kn /var/log/audit -o OPTIONS 2>/dev/null || true
      changed_when: false
      register: _cis_varlogaudit_opts
      tags: ['cis_sec1', 'cis_1.1.2.7', 'partitions', 'var_log_audit', 'audit']

    - name: "CIS 1.1.2.7.3 | Remediation | Apply nosuid to /var/log/audit"
      when: "'nosuid' not in _cis_varlogaudit_opts.stdout"
      ansible.posix.mount:
        path: /var/log/audit
        src: "{{ _cis_varlogaudit_mount.stdout.split()[1] }}"
        fstype: "{{ _cis_varlogaudit_mount.stdout.split()[2] }}"
        opts: "{{ (_cis_varlogaudit_opts.stdout | trim).split(',') | union(['nosuid']) | join(',') }}"
        state: remounted
      tags: ['cis_sec1', 'cis_1.1.2.7', 'partitions', 'var_log_audit', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']

- name: "CIS 1.1.2.7.4 | Remediation | Ensure noexec option set on /var/log/audit"
  when:
    - _cis_varlogaudit_mount.rc == 0
    - _cis_varlogaudit_mount.stdout | length > 0
    - cis_1_1_2_var_log_audit_noexec | default(true)
  block:
    - name: "CIS 1.1.2.7.4 | AUDIT | Re-read /var/log/audit mount options"
      ansible.builtin.shell: findmnt -kn /var/log/audit -o OPTIONS 2>/dev/null || true
      changed_when: false
      register: _cis_varlogaudit_opts
      tags: ['cis_sec1', 'cis_1.1.2.7', 'partitions', 'var_log_audit', 'audit']

    - name: "CIS 1.1.2.7.4 | Remediation | Apply noexec to /var/log/audit"
      when: "'noexec' not in _cis_varlogaudit_opts.stdout"
      ansible.posix.mount:
        path: /var/log/audit
        src: "{{ _cis_varlogaudit_mount.stdout.split()[1] }}"
        fstype: "{{ _cis_varlogaudit_mount.stdout.split()[2] }}"
        opts: "{{ (_cis_varlogaudit_opts.stdout | trim).split(',') | union(['noexec']) | join(',') }}"
        state: remounted
      tags: ['cis_sec1', 'cis_1.1.2.7', 'partitions', 'var_log_audit', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']
