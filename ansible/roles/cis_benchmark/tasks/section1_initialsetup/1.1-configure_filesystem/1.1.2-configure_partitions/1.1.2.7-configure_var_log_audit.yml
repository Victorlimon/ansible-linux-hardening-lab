---
- name: "CIS 1.1.2.7.1 | Audit | Determine whether /var/log/audit is a separate mount"
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, /var/log/audit, --noheadings]
  register: _cis_var_log_audit_mount
  changed_when: false
  check_mode: false
  failed_when: _cis_var_log_audit_mount.rc not in [0, 1]
  tags: ['cis_sec1', 'cis_1.1.2.7.1']

- name: "CIS 1.1.2.7.1 | Manual | Report missing /var/log/audit partition"
  ansible.builtin.debug:
    msg: "MANUAL: /var/log/audit is not a separate mount. Provision and migrate it offline with auditd stopped and after backup; no disk changes were made."
  when: _cis_var_log_audit_mount.rc == 1
  tags: ['cis_sec1', 'cis_1.1.2.7.1']

- name: "CIS 1.1.2.7.2 | Remediation | Configure nodev on /var/log/audit"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.7.2']}
  vars: {_cis_mount_control: 1.1.2.7.2, _cis_mount_path: /var/log/audit, _cis_mount_option: nodev}
  when: _cis_var_log_audit_mount.rc == 0 and cis_1_1_2_var_log_audit_nodev | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.7.2']

- name: "CIS 1.1.2.7.3 | Remediation | Configure nosuid on /var/log/audit"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.7.3']}
  vars: {_cis_mount_control: 1.1.2.7.3, _cis_mount_path: /var/log/audit, _cis_mount_option: nosuid}
  when: _cis_var_log_audit_mount.rc == 0 and cis_1_1_2_var_log_audit_nosuid | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.7.3']

- name: "CIS 1.1.2.7.4 | Remediation | Configure noexec on /var/log/audit"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply: {tags: ['cis_sec1', 'cis_1.1.2.7.4']}
  vars: {_cis_mount_control: 1.1.2.7.4, _cis_mount_path: /var/log/audit, _cis_mount_option: noexec}
  when: _cis_var_log_audit_mount.rc == 0 and cis_1_1_2_var_log_audit_noexec | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.7.4']
