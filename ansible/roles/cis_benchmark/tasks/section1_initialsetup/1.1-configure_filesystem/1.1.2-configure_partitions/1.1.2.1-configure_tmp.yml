---
# =============================================================================
# CIS 1.1.2.1 | Configure /tmp Partition
# Idempotente, optimizado (lectura única de mount), compatible con check_mode
# =============================================================================

- name: "CIS 1.1.2.1 | AUDIT | Check /tmp mount and options"
  ansible.builtin.shell: |
    findmnt -kn /tmp -o TARGET,SOURCE,FSTYPE,OPTIONS 2>/dev/null || echo "not_mounted"
  changed_when: false
  failed_when: false
  check_mode: false
  register: _cis_tmp_mount_info
  tags: ['cis_sec1', 'cis_1.1.2.1', 'partitions', 'tmp']

- name: "CIS 1.1.2.1.2 | Remediation | Ensure nodev option set on /tmp"
  when:
    - _cis_tmp_mount_info.stdout != "not_mounted"
    - "'nodev' not in _cis_tmp_mount_info.stdout"
    - cis_1_1_2_tmp_nodev | default(true)
  ansible.posix.mount:
    path: /tmp
    src: "{{ _cis_tmp_mount_info.stdout.split()[1] }}"
    fstype: "{{ _cis_tmp_mount_info.stdout.split()[2] }}"
    opts: "{{ (_cis_tmp_mount_info.stdout.split()[-1] | trim).split(',') | union(['nodev']) | join(',') }}"
    state: mounted
  tags: ['cis_sec1', 'cis_1.1.2.1', 'partitions', 'tmp']

- name: "CIS 1.1.2.1.3 | Remediation | Ensure nosuid option set on /tmp"
  when:
    - _cis_tmp_mount_info.stdout != "not_mounted"
    - "'nosuid' not in _cis_tmp_mount_info.stdout"
    - cis_1_1_2_tmp_nosuid | default(true)
  ansible.posix.mount:
    path: /tmp
    src: "{{ _cis_tmp_mount_info.stdout.split()[1] }}"
    fstype: "{{ _cis_tmp_mount_info.stdout.split()[2] }}"
    opts: "{{ (_cis_tmp_mount_info.stdout.split()[-1] | trim).split(',') | union(['nosuid']) | join(',') }}"
    state: mounted
  tags: ['cis_sec1', 'cis_1.1.2.1', 'partitions', 'tmp']

- name: "CIS 1.1.2.1.4 | Remediation | Ensure noexec option set on /tmp"
  when:
    - _cis_tmp_mount_info.stdout != "not_mounted"
    - "'noexec' not in _cis_tmp_mount_info.stdout"
    - cis_1_1_2_tmp_noexec | default(true)
  ansible.posix.mount:
    path: /tmp
    src: "{{ _cis_tmp_mount_info.stdout.split()[1] }}"
    fstype: "{{ _cis_tmp_mount_info.stdout.split()[2] }}"
    opts: "{{ (_cis_tmp_mount_info.stdout.split()[-1] | trim).split(',') | union(['noexec']) | join(',') }}"
    state: mounted
  tags: ['cis_sec1', 'cis_1.1.2.1', 'partitions', 'tmp']
