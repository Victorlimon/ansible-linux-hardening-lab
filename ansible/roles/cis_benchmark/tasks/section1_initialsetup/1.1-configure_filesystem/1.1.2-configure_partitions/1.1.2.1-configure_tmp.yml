---
- name: "CIS 1.1.2.1.1 | Audit | Determine whether /tmp is a mount point"
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, /tmp, --noheadings]
  register: _cis_tmp_mount
  changed_when: false
  check_mode: false
  failed_when: _cis_tmp_mount.rc not in [0, 1]
  tags: ['cis_sec1', 'cis_1.1.2.1.1']

- name: "CIS 1.1.2.1.1 | Manual | Report that /tmp requires provisioning"
  ansible.builtin.debug:
    msg: "MANUAL: /tmp is not a separate mount. Provision a partition or an appropriately sized tmpfs during a maintenance window; no disk changes were made."
  when: _cis_tmp_mount.rc == 1
  tags: ['cis_sec1', 'cis_1.1.2.1.1']

- name: "CIS 1.1.2.1.2 | Remediation | Configure nodev on /tmp"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply:
      tags: ['cis_sec1', 'cis_1.1.2.1.2']
  vars:
    _cis_mount_control: 1.1.2.1.2
    _cis_mount_path: /tmp
    _cis_mount_option: nodev
  when: _cis_tmp_mount.rc == 0 and cis_1_1_2_tmp_nodev | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.1.2']

- name: "CIS 1.1.2.1.3 | Remediation | Configure nosuid on /tmp"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply:
      tags: ['cis_sec1', 'cis_1.1.2.1.3']
  vars:
    _cis_mount_control: 1.1.2.1.3
    _cis_mount_path: /tmp
    _cis_mount_option: nosuid
  when: _cis_tmp_mount.rc == 0 and cis_1_1_2_tmp_nosuid | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.1.3']

- name: "CIS 1.1.2.1.4 | Remediation | Configure noexec on /tmp"
  ansible.builtin.include_tasks:
    file: _configure_mount_option.yml
    apply:
      tags: ['cis_sec1', 'cis_1.1.2.1.4']
  vars:
    _cis_mount_control: 1.1.2.1.4
    _cis_mount_path: /tmp
    _cis_mount_option: noexec
  when: _cis_tmp_mount.rc == 0 and cis_1_1_2_tmp_noexec | default(true)
  tags: ['cis_sec1', 'cis_1.1.2.1.4']
