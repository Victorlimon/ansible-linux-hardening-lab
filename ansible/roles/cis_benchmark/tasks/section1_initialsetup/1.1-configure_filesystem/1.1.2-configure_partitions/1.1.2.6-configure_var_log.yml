---
# =============================================================================
# CIS Ubuntu 24.04 LTS Benchmark v1.0.0 - Section 1.1.2.6: Configure /var/log
# =============================================================================
# Nota: Solo verifica opciones de montaje en particiones existentes.
#       La creación de particiones debe hacerse en provisioning inicial.
# Referencia: CIS 1.1.2.6.1 - 1.1.2.6.4
# =============================================================================

- name: "CIS 1.1.2.6.1 | AUDIT | Check if /var/log is a separate partition"
  ansible.builtin.shell: findmnt -kn /var/log 2>/dev/null || true
  changed_when: false
  failed_when: false
  register: _cis_varlog_mount
  tags: ['cis_sec1', 'cis_1.1.2.6', 'partitions', 'var_log', 'audit']

- name: "CIS 1.1.2.6.2 | Remediation | Ensure nodev option set on /var/log"
  when:
    - _cis_varlog_mount.rc == 0
    - _cis_varlog_mount.stdout | length > 0
    - cis_1_1_2_var_log_nodev | default(true)
  block:
    - name: "CIS 1.1.2.6.2 | AUDIT | Re-read /var/log mount options"
      ansible.builtin.shell: findmnt -kn /var/log -o OPTIONS 2>/dev/null || true
      changed_when: false
      register: _cis_varlog_opts
      tags: ['cis_sec1', 'cis_1.1.2.6', 'partitions', 'var_log', 'audit']

    - name: "CIS 1.1.2.6.2 | Remediation | Apply nodev to /var/log"
      when: "'nodev' not in _cis_varlog_opts.stdout"
      ansible.posix.mount:
        path: /var/log
        src: "{{ _cis_varlog_mount.stdout.split()[1] }}"
        fstype: "{{ _cis_varlog_mount.stdout.split()[2] }}"
        opts: "{{ (_cis_varlog_opts.stdout | trim).split(',') | union(['nodev']) | join(',') }}"
        state: remounted
      tags: ['cis_sec1', 'cis_1.1.2.6', 'partitions', 'var_log', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']

- name: "CIS 1.1.2.6.3 | Remediation | Ensure nosuid option set on /var/log"
  when:
    - _cis_varlog_mount.rc == 0
    - _cis_varlog_mount.stdout | length > 0
    - cis_1_1_2_var_log_nosuid | default(true)
  block:
    - name: "CIS 1.1.2.6.3 | AUDIT | Re-read /var/log mount options"
      ansible.builtin.shell: findmnt -kn /var/log -o OPTIONS 2>/dev/null || true
      changed_when: false
      register: _cis_varlog_opts
      tags: ['cis_sec1', 'cis_1.1.2.6', 'partitions', 'var_log', 'audit']

    - name: "CIS 1.1.2.6.3 | Remediation | Apply nosuid to /var/log"
      when: "'nosuid' not in _cis_varlog_opts.stdout"
      ansible.posix.mount:
        path: /var/log
        src: "{{ _cis_varlog_mount.stdout.split()[1] }}"
        fstype: "{{ _cis_varlog_mount.stdout.split()[2] }}"
        opts: "{{ (_cis_varlog_opts.stdout | trim).split(',') | union(['nosuid']) | join(',') }}"
        state: remounted
      tags: ['cis_sec1', 'cis_1.1.2.6', 'partitions', 'var_log', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']

- name: "CIS 1.1.2.6.4 | Remediation | Ensure noexec option set on /var/log"
  when:
    - _cis_varlog_mount.rc == 0
    - _cis_varlog_mount.stdout | length > 0
    - cis_1_1_2_var_log_noexec | default(true)
  block:
    - name: "CIS 1.1.2.6.4 | AUDIT | Re-read /var/log mount options"
      ansible.builtin.shell: findmnt -kn /var/log -o OPTIONS 2>/dev/null || true
      changed_when: false
      register: _cis_varlog_opts
      tags: ['cis_sec1', 'cis_1.1.2.6', 'partitions', 'var_log', 'audit']

    - name: "CIS 1.1.2.6.4 | Remediation | Apply noexec to /var/log"
      when: "'noexec' not in _cis_varlog_opts.stdout"
      ansible.posix.mount:
        path: /var/log
        src: "{{ _cis_varlog_mount.stdout.split()[1] }}"
        fstype: "{{ _cis_varlog_mount.stdout.split()[2] }}"
        opts: "{{ (_cis_varlog_opts.stdout | trim).split(',') | union(['noexec']) | join(',') }}"
        state: remounted
      tags: ['cis_sec1', 'cis_1.1.2.6', 'partitions', 'var_log', 'NIST800-53R5_AC-3', 'NIST800-53R5_MP-2']
