---
# =============================================================================
# Internal: Disable a single filesystem kernel module
# Expects: _module (module name), _cis_module_paths (from parent)
# Idempotente, compatible con check_mode, con manejo robusto de errores
# =============================================================================

- name: "CIS 1.1.1 | AUDIT | Check if {{ _module }} exists on system"
  ansible.builtin.shell: |
    mod_name="{{ _module }}"
    mod_slash="${mod_name//-//}"
    found=0
    for base in {{ _cis_module_paths.stdout_lines | to_json }}; do
      base=$(echo "$base" | tr -d '"')
      [ -d "$base/$mod_slash" ] && [ -n "$(ls -A "$base/$mod_slash" 2>/dev/null)" ] && found=1 && break
    done
    echo "$found"
  changed_when: false
  failed_when: false
  check_mode: false
  register: _module_exists
  tags: ['cis_sec1', 'cis_1.1.1', 'kernel_modules']

- name: "CIS 1.1.1 | Remediation | Configure modprobe.d for {{ _module }}"
  when:
    - _module_exists.stdout | trim == '1'
    - "cis_1_1_1_disable_{{ _module | replace('-', '_') }} | default(true)"
  ansible.builtin.copy:
    dest: "/etc/modprobe.d/cis_{{ _module }}.conf"
    content: |
      # CIS 1.1.1 - Disable {{ _module }} filesystem module
      install {{ _module }} /bin/true
      blacklist {{ _module }}
    owner: root
    group: root
    mode: '0644'
    backup: yes
  tags: ['cis_sec1', 'cis_1.1.1', 'kernel_modules']

- name: "CIS 1.1.1 | Remediation | Unload {{ _module }} from running kernel"
  when:
    - _module_exists.stdout | trim == '1'
    - "cis_1_1_1_disable_{{ _module | replace('-', '_') }} | default(true)"
  community.general.modprobe:
    name: "{{ _module }}"
    state: absent
  ignore_errors: true
  failed_when: false
  tags: ['cis_sec1', 'cis_1.1.1', 'kernel_modules']
