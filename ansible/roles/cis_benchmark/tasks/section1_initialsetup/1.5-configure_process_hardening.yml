---
- name: "CIS 1.5 | Audit | Gather package facts for process hardening"
  ansible.builtin.package_facts:
    manager: auto
  tags: ['cis_sec1', 'cis_1.5.1', 'cis_1.5.2', 'cis_1.5.3', 'cis_1.5.4', 'cis_1.5.5']

- name: "CIS 1.5.1 | Remediation | Ensure address space layout randomization is enabled"
  ansible.posix.sysctl:
    name: kernel.randomize_va_space
    value: '2'
    sysctl_file: /etc/sysctl.d/60-cis-process-hardening.conf
    state: present
    sysctl_set: true
    reload: true
  when:
    - cis_section1_5_process_hardening | default(true)
    - cis_1_5_1_enable_aslr | default(cis_1_5_3_enable_aslr | default(true))
  tags: ['cis_sec1', 'cis_1.5.1']

- name: "CIS 1.5.2 | Remediation | Ensure ptrace_scope is restricted"
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: "{{ cis_ptrace_scope | default(1) | string }}"
    sysctl_file: /etc/sysctl.d/60-cis-process-hardening.conf
    state: present
    sysctl_set: true
    reload: true
  when:
    - cis_section1_5_process_hardening | default(true)
    - cis_1_5_2_restrict_ptrace | default(true)
  tags: ['cis_sec1', 'cis_1.5.2']

- name: "CIS 1.5.3 | Remediation | Set the hard core dump limit"
  ansible.builtin.copy:
    dest: /etc/security/limits.d/60-cis-core-dumps.conf
    content: "* hard core 0\n"
    owner: root
    group: root
    mode: '0644'
  when:
    - cis_section1_5_process_hardening | default(true)
    - cis_1_5_3_restrict_core_dumps | default(cis_1_5_1_disable_core_dumps | default(true))
  tags: ['cis_sec1', 'cis_1.5.3']

- name: "CIS 1.5.3 | Remediation | Disable setuid core dumps"
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: '0'
    sysctl_file: /etc/sysctl.d/60-cis-process-hardening.conf
    state: present
    sysctl_set: true
    reload: true
  when:
    - cis_section1_5_process_hardening | default(true)
    - cis_1_5_3_restrict_core_dumps | default(cis_1_5_1_disable_core_dumps | default(true))
  tags: ['cis_sec1', 'cis_1.5.3']

- name: "CIS 1.5.3 | Remediation | Ensure the systemd coredump drop-in directory exists"
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - cis_1_5_3_restrict_core_dumps | default(cis_1_5_1_disable_core_dumps | default(true))
    - "'systemd-coredump' in ansible_facts.packages"
  tags: ['cis_sec1', 'cis_1.5.3']

- name: "CIS 1.5.3 | Remediation | Disable systemd coredump storage"
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/60-cis.conf
    content: |
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon
  when:
    - cis_1_5_3_restrict_core_dumps | default(cis_1_5_1_disable_core_dumps | default(true))
    - "'systemd-coredump' in ansible_facts.packages"
  tags: ['cis_sec1', 'cis_1.5.3']

- name: "CIS 1.5.4 | Remediation | Restore prelinked binaries before package removal"
  ansible.builtin.command:
    argv: [prelink, -ua]
  when:
    - cis_section1_5_process_hardening | default(true)
    - cis_1_5_4_prelink_absent | default(true)
    - "'prelink' in ansible_facts.packages"
  tags: ['cis_sec1', 'cis_1.5.4']

- name: "CIS 1.5.4 | Remediation | Ensure prelink is not installed"
  ansible.builtin.apt:
    name: prelink
    state: absent
    purge: true
  when:
    - cis_section1_5_process_hardening | default(true)
    - cis_1_5_4_prelink_absent | default(true)
    - "'prelink' in ansible_facts.packages"
  tags: ['cis_sec1', 'cis_1.5.4']

- name: "CIS 1.5.5 | Remediation | Ensure automatic error reporting is not installed"
  ansible.builtin.apt:
    name: apport
    state: absent
    purge: true
  when:
    - cis_section1_5_process_hardening | default(true)
    - cis_1_5_5_disable_apport | default(true)
    - "'apport' in ansible_facts.packages"
  tags: ['cis_sec1', 'cis_1.5.5']
