---
- name: "6.1.2.1.1 | Install journal remote client support"
  ansible.builtin.apt:
    name: systemd-journal-remote
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
    - section6_logging['6_1_2_1_1_journal_remote_installed'].enabled | default(false) | bool
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_1_1, journald, remote]

- name: "6.1.2.1.2 | Require complete journal upload TLS configuration"
  ansible.builtin.assert:
    that:
      - section6_logging['6_1_2_1_2_journal_upload_auth'].URL | default('') | length > 0
      - section6_logging['6_1_2_1_2_journal_upload_auth'].ServerKeyFile | default('') | length > 0
      - section6_logging['6_1_2_1_2_journal_upload_auth'].ServerCertificateFile | default('') | length > 0
      - section6_logging['6_1_2_1_2_journal_upload_auth'].TrustedCertificateFile | default('') | length > 0
    fail_msg: "Journal upload requires URL and all three TLS file paths"
  when: section6_logging['6_1_2_1_2_journal_upload_auth'].enabled | default(false) | bool
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_1_2, journald, remote]

- name: "6.1.2.1.2 | Ensure journal upload drop-in directory exists"
  ansible.builtin.file:
    path: /etc/systemd/journal-upload.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: section6_logging['6_1_2_1_2_journal_upload_auth'].enabled | default(false) | bool
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_1_2, journald, remote]

- name: "6.1.2.1.2 | Configure authenticated journal upload"
  ansible.builtin.copy:
    dest: /etc/systemd/journal-upload.conf.d/60-cis-upload.conf
    owner: root
    group: root
    mode: '0600'
    content: |
      [Upload]
      URL={{ section6_logging['6_1_2_1_2_journal_upload_auth'].URL }}
      ServerKeyFile={{ section6_logging['6_1_2_1_2_journal_upload_auth'].ServerKeyFile }}
      ServerCertificateFile={{ section6_logging['6_1_2_1_2_journal_upload_auth'].ServerCertificateFile }}
      TrustedCertificateFile={{ section6_logging['6_1_2_1_2_journal_upload_auth'].TrustedCertificateFile }}
  register: cis_journal_upload_config
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
    - section6_logging['6_1_2_1_2_journal_upload_auth'].enabled | default(false) | bool
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_1_2, journald, remote]

- name: "6.1.2.1.3 | Enable authenticated journal upload"
  ansible.builtin.systemd_service:
    name: systemd-journal-upload.service
    state: "{{ 'restarted' if cis_journal_upload_config.changed | default(false) else 'started' }}"
    enabled: true
    masked: false
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
    - section6_logging['6_1_2_1_3_journal_upload_enabled'].enabled | default(false) | bool
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_1_3, journald, remote]

- name: "6.1.2.1.4 | Inspect optional journal receiver units"
  ansible.builtin.stat:
    path: "/usr/lib/systemd/system/{{ item }}"
  check_mode: false
  loop:
    - systemd-journal-remote.socket
    - systemd-journal-remote.service
  register: cis_journal_receiver_units
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
    - section6_logging['6_1_2_1_4_journal_remote_disabled'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_1_4, journald, remote]

- name: "6.1.2.1.4 | Disable existing journal receiver units on clients"
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ cis_journal_receiver_units.results | default([]) }}"
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
    - section6_logging['6_1_2_1_4_journal_remote_disabled'].enabled | default(true) | bool
    - item.stat.exists
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_1_4, journald, remote]

- name: "6.1.2.2 | Ensure journald drop-in directory exists"
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_2, journald]

- name: "6.1.2.2 | Ensure journald ForwardToSyslog is disabled"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-cis-forwarding.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      ForwardToSyslog=no
  register: cis_journald_forwarding
  when: (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_2, journald]

- name: "6.1.2 | Remove obsolete combined role drop-in"
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/90-cis-logging.conf
    state: absent
  register: cis_journald_obsolete_config
  tags: [cis_6, cis_6_1, cis_6_1_2, journald]

- name: "6.1.2.3 | Configure journald compression"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/91-cis-compression.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      Compress={{ section6_logging['6_1_2_3_journald_compress'].value | default('yes') }}
  register: cis_journald_compression
  when: (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_3, journald]

- name: "6.1.2.4 | Configure journald storage"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/92-cis-storage.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      Storage={{ section6_logging['6_1_2_4_journald_storage'].value | default('persistent') }}
  register: cis_journald_storage
  when: (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_4, journald]

- name: "6.1.2.2-4 | Restart journald after configuration changes"
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  when: >-
    cis_journald_forwarding.changed | default(false)
    or cis_journald_compression.changed | default(false)
    or cis_journald_storage.changed | default(false)
    or cis_journald_obsolete_config.changed | default(false)
  tags: [cis_6, cis_6_1, cis_6_1_2, cis_6_1_2_2, cis_6_1_2_3, cis_6_1_2_4, journald]
