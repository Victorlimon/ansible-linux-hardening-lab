---
- name: "6.1.1.1 | Ensure systemd-journald is unmasked and active"
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: started
    masked: false
  when: section6_logging['6_1_1_journald_service'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_1, cis_6_1_1_1, journald]

# journald is a static unit and must remain active even when rsyslog is selected.
- name: "6.1.1.2 | Ensure journald drop-in directory exists"
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [cis_6, cis_6_1, cis_6_1_1, cis_6_1_1_2, journald]

- name: "6.1.1.2 | Ensure persistent journal directory has restrictive access"
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "{{ section6_logging['6_1_1_2_journald_logfile_perms'].dir_mode | default('2750') }}"
  when: section6_logging['6_1_1_2_journald_logfile_perms'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_1, cis_6_1_1_2, journald, permissions]

- name: "6.1.1.3 | Configure journald rotation policy"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-cis-rotation.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      SystemMaxUse={{ section6_logging['6_1_1_3_journald_rotation'].SystemMaxUse | default('1G') }}
      SystemKeepFree={{ section6_logging['6_1_1_3_journald_rotation'].SystemKeepFree | default('500M') }}
      RuntimeMaxUse={{ section6_logging['6_1_1_3_journald_rotation'].RuntimeMaxUse | default('100M') }}
      RuntimeKeepFree={{ section6_logging['6_1_1_3_journald_rotation'].RuntimeKeepFree | default('50M') }}
      MaxFileSec={{ section6_logging['6_1_1_3_journald_rotation'].MaxFileSec | default('1month') }}
  register: cis_journald_rotation
  when: section6_logging['6_1_1_3_journald_rotation'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_1, cis_6_1_1_3, journald, rotation]

- name: "6.1.1.3 | Restart journald after rotation changes"
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  when: cis_journald_rotation.changed | default(false)
  tags: [cis_6, cis_6_1, cis_6_1_1, cis_6_1_1_3, journald, rotation]

- name: "6.1.1.4 | Validate selected logging backend"
  ansible.builtin.assert:
    that:
      - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) in ['journald', 'rsyslog']
    fail_msg: "cis_logging_backend must be journald or rsyslog"
  tags: [cis_6, cis_6_1, cis_6_1_1, cis_6_1_1_4, logging]
