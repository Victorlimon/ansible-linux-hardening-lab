# roles/cis_benchmark/tasks/section6_logging/6.1-system_logging/6.1.1-configure_systemd_journald_service.yml
---
# ============================================================================
# PRE-FLIGHT CHECK: Detect if systemd/D-Bus is responsive
# ============================================================================
- name: "6.1.1 | PRE-FLIGHT | Check if systemd is responsive"
  block:
    - name: "6.1.1 | PRE-FLIGHT | Test D-Bus connectivity (lightweight)"
      ansible.builtin.command: systemctl --version
      register: systemd_version_check
      changed_when: false
      failed_when: false
      ignore_errors: true
      timeout: 3  # Fail fast if systemd is hung

    - name: "6.1.1 | PRE-FLIGHT | Set fact if systemd is NOT responsive"
      ansible.builtin.set_fact:
        systemd_unresponsive: true
      when:
        - systemd_version_check is defined
        - systemd_version_check.rc is defined
        - systemd_version_check.rc != 0 or 
          (systemd_version_check.stderr is defined and 
          ('timed out' in systemd_version_check.stderr or 'D-Bus' in systemd_version_check.stderr))

    - name: "6.1.1 | PRE-FLIGHT | Warn if systemd is unresponsive"
      ansible.builtin.debug:
        msg: "⚠️  WARNING: systemd/D-Bus not responsive. Skipping systemd-dependent tasks."
      when: systemd_unresponsive | default(false)

  tags:
    - cis_6
    - cis_6_1
    - cis_6_1_1
    - preflight
    - logging

# ============================================================================
# 6.1.1.1 - Ensure systemd-journald service is enabled and active
# ============================================================================
- name: "6.1.1.1 | Configure systemd-journald service (CIS 6.1.1.1)"
  block:
    - name: "6.1.1.1 | AUDIT | Check journald status via command (reliable)"
      ansible.builtin.command: systemctl is-active systemd-journald.service
      register: journald_audit
      changed_when: false
      failed_when: false
      ignore_errors: true
      timeout: 3

    - name: "6.1.1.1 | REMEDIATE | Ensure journald is enabled/started"
      block:
        - name: "6.1.1.1 | Unmask if masked (symlink removal)"
          ansible.builtin.file:
            path: "/etc/systemd/system/systemd-journald.service"
            state: absent
          when: section6_logging['6_1_1_journald_service'].unmask | default(true)
          ignore_errors: true
          failed_when: false

        - name: "6.1.1.1 | Enable and Start (systemd module with fallback)"
          ansible.builtin.systemd:
            name: systemd-journald.service
            state: started
            enabled: true
            daemon_reload: true
          register: journald_start_result
          ignore_errors: true
          failed_when: false
          timeout: 10

        - name: "6.1.1.1 | FALLBACK | Start via command if module failed"
          ansible.builtin.command: systemctl start systemd-journald.service
          when:
            - journald_start_result is defined
            - journald_start_result.failed | default(true)
            - journald_start_result.msg is defined
            - "'timed out' in journald_start_result.msg or 'D-Bus' in journald_start_result.msg"
          changed_when: true
          ignore_errors: true
          failed_when: false
          timeout: 10

      when:
        - section6_logging['6_1_1_journald_service'].enabled | default(true)
        - journald_audit is defined
        - ((journald_audit.rc | default(1)) != 0) or ((journald_audit.stdout | default('')) != "active")
        - not (systemd_unresponsive | default(false))
      notify: Restart journald

    - name: "6.1.1.1 | REPORT | journald service status"
      ansible.builtin.debug:
        msg: "6.1.1.1 | systemd-journald.service: {{ journald_audit.stdout | default('unknown') }} (rc={{ journald_audit.rc | default('N/A') }})"
      when: not ansible_check_mode

  when: not (systemd_unresponsive | default(false))
  tags:
    - cis_6
    - cis_6_1
    - cis_6_1_1
    - cis_6_1_1_1
    - journald
    - logging

# ============================================================================
# 6.1.1.2 - Configure journald log file access permissions
# ============================================================================
- name: "6.1.1.2 | Configure journald log file access (CIS 6.1.1.2)"
  block:
    - name: "6.1.1.2 | AUDIT | Check /var/log/journal permissions"
      ansible.builtin.stat:
        path: /var/log/journal
      register: journal_dir_stat
      failed_when: false

    - name: "6.1.1.2 | REMEDIATE | Set secure permissions (idempotent)"
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        mode: "{{ section6_logging['6_1_1_2_journald_logfile_perms'].dir_mode | default('2750') }}"
        owner: root
        group: systemd-journal
        recurse: true
      when:
        - section6_logging['6_1_1_2_journald_logfile_perms'].enabled | default(true)
        - journal_dir_stat.stat.exists | default(false)
        - journal_dir_stat.stat is defined
        - journal_dir_stat.stat.mode is defined
        - journal_dir_stat.stat.mode != (section6_logging['6_1_1_2_journald_logfile_perms'].dir_mode | default('2750'))
      notify: Reload systemd-tmpfiles
      ignore_errors: true
      failed_when: false

    - name: "6.1.1.2 | REPORT | journald log permissions"
      ansible.builtin.debug:
        msg: "6.1.1.2 | /var/log/journal mode: {{ journal_dir_stat.stat.mode | default('N/A') if journal_dir_stat.stat is defined else 'N/A' }}"
      when: not ansible_check_mode

  tags:
    - cis_6
    - cis_6_1
    - cis_6_1_1
    - cis_6_1_1_2
    - journald
    - permissions

# ============================================================================
# 6.1.1.3 - Configure journald log rotation settings
# ============================================================================
- name: "6.1.1.3 | Configure journald log rotation (CIS 6.1.1.3)"
  block:
    - name: "6.1.1.3 | AUDIT | Check journald rotation settings"
      ansible.builtin.command: grep -E "^SystemMaxUse=|^SystemKeepFree=|^RuntimeMaxUse=|^MaxFileSec=" /etc/systemd/journald.conf || true
      register: rotation_check
      changed_when: false
      failed_when: false

    - name: "6.1.1.3 | REMEDIATE | Apply journald rotation config (idempotent)"
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        backup: true
      loop:
        - { key: 'SystemMaxUse', value: "{{ section6_logging['6_1_1_3_journald_rotation'].SystemMaxUse | default('1G') }}" }
        - { key: 'SystemKeepFree', value: "{{ section6_logging['6_1_1_3_journald_rotation'].SystemKeepFree | default('500M') }}" }
        - { key: 'RuntimeMaxUse', value: "{{ section6_logging['6_1_1_3_journald_rotation'].RuntimeMaxUse | default('100M') }}" }
        - { key: 'MaxFileSec', value: "{{ section6_logging['6_1_1_3_journald_rotation'].MaxFileSec | default('1month') }}" }
      when: not (systemd_unresponsive | default(false))
      ignore_errors: true
      failed_when: false
      notify: Restart journald

    - name: "6.1.1.3 | REPORT | journald rotation config applied"
      ansible.builtin.debug:
        msg: "6.1.1.3 | journald rotation settings updated in /etc/systemd/journald.conf"
      when: not ansible_check_mode and not (systemd_unresponsive | default(false))

  tags:
    - cis_6
    - cis_6_1
    - cis_6_1_1
    - cis_6_1_1_3
    - journald
    - rotation

# ============================================================================
# 6.1.1.4 - Ensure only one logging system is active
# ============================================================================
- name: "6.1.1.4 | Ensure only one logging system is active (CIS 6.1.1.4)"
  block:
    - name: "6.1.1.4 | AUDIT | Check preferred logging system status"
      ansible.builtin.command: "systemctl is-active {{ section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog') }}"
      register: preferred_system_audit
      changed_when: false
      failed_when: false
      ignore_errors: true
      timeout: 3

    - name: "6.1.1.4 | REMEDIATE | Disable non-preferred logging system"
      ansible.builtin.systemd:
        name: "{{ 'systemd-journald' if ((preferred_system_audit.rc | default(1)) == 0) else 'rsyslog' }}"
        state: stopped
        enabled: false
      when:
        - section6_logging['6_1_1_4_single_logging_system'].enabled | default(true)
        - preferred_system_audit is defined
        - (preferred_system_audit.rc | default(1)) == 0
        - not (systemd_unresponsive | default(false))
      notify:
        - Restart journald
        - Restart rsyslog
      ignore_errors: true
      failed_when: false
      timeout: 10

    - name: "6.1.1.4 | REPORT | logging system status"
      ansible.builtin.debug:
        msg: "6.1.1.4 | Preferred: {{ section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog') }}, Status: {{ preferred_system_audit.stdout | default('unknown') }}"
      when: not ansible_check_mode

  tags:
    - cis_6
    - cis_6_1
    - cis_6_1_1
    - cis_6_1_1_4
    - logging_conflict
    - logging

# ============================================================================
# FINAL REPORT: Summary for Section 6.1.1
# ============================================================================
- name: "6.1.1 | REPORT | Section 6.1.1 execution summary"
  ansible.builtin.debug:
    msg: |
      === CIS 6.1.1 Summary ===
      Host: {{ inventory_hostname }}
      systemd responsive: {{ not (systemd_unresponsive | default(false)) }}
      journald status: {{ journald_audit.stdout | default('unknown') if journald_audit is defined else 'unknown' }}
      Note: If systemd is unresponsive, manual intervention may be required.
  when: not ansible_check_mode
  tags:
    - cis_6
    - cis_6_1
    - cis_6_1_1
    - reporting
    - logging
