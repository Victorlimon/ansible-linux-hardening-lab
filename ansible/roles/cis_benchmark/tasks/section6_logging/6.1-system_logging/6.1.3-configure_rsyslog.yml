---
- name: "6.1.3.1 | Install rsyslog when selected"
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - section6_logging['6_1_3_1_rsyslog_installed'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_1, rsyslog]

- name: "6.1.3.2 | Enable rsyslog when selected"
  ansible.builtin.systemd_service:
    name: rsyslog.service
    state: started
    enabled: true
    masked: false
  when: (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_2, rsyslog]

- name: "6.1.3.3 | Ensure journald drop-in directory exists"
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_3, journald, rsyslog]

- name: "6.1.3.3 | Ensure journald sends logs to rsyslog"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-cis-forwarding.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      ForwardToSyslog=yes
  register: cis_journald_to_rsyslog
  when: (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_3, journald, rsyslog]

- name: "6.1.3.3 | Restart journald after forwarding changes"
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  when: cis_journald_to_rsyslog.changed | default(false)
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_3, journald, rsyslog]

- name: "6.1.3.4 | Configure restrictive rsyslog file creation mode"
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/60-cis-file-mode.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      $FileCreateMode {{ section6_logging['6_1_3_4_rsyslog_filemode'].value | default('0640') }}
    backup: true
    validate: /usr/sbin/rsyslogd -N1 -f %s
  register: cis_rsyslog_file_mode
  when: (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_4, rsyslog]

- name: "6.1.3.5 | Configure local rsyslog logging policy"
  ansible.builtin.copy:
    dest: "{{ section6_logging['6_1_3_5_rsyslog_local'].config_file | default('/etc/rsyslog.d/70-cis-local.conf') }}"
    owner: root
    group: root
    mode: '0640'
    content: "{{ section6_logging['6_1_3_5_rsyslog_local'].rules | trim }}\n"
    backup: true
    validate: /usr/sbin/rsyslogd -N1 -f %s
  register: cis_rsyslog_local
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - section6_logging['6_1_3_5_rsyslog_local'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_5, rsyslog, logging]

- name: "6.1.3.6 | Require a remote rsyslog destination when enabled"
  ansible.builtin.assert:
    that:
      - section6_logging['6_1_3_6_rsyslog_remote'].remote_host | default('') | length > 0
      - section6_logging['6_1_3_6_rsyslog_remote'].protocol | default('@@') in ['@', '@@']
    fail_msg: "Remote rsyslog requires remote_host and protocol @ or @@"
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - section6_logging['6_1_3_6_rsyslog_remote'].enabled | default(false) | bool
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_6, rsyslog, remote]

- name: "6.1.3.6 | Configure remote rsyslog forwarding"
  ansible.builtin.copy:
    dest: "{{ section6_logging['6_1_3_6_rsyslog_remote'].config_file | default('/etc/rsyslog.d/60-cis-remote.conf') }}"
    owner: root
    group: root
    mode: '0640'
    content: |
      *.* {{ section6_logging['6_1_3_6_rsyslog_remote'].protocol | default('@@') }}{{ section6_logging['6_1_3_6_rsyslog_remote'].remote_host }}:{{ section6_logging['6_1_3_6_rsyslog_remote'].port | default(514) }}
    backup: true
    validate: /usr/sbin/rsyslogd -N1 -f %s
  register: cis_rsyslog_remote
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - section6_logging['6_1_3_6_rsyslog_remote'].enabled | default(false) | bool
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_6, rsyslog, remote]

- name: "6.1.3.7 | Remove obsolete role-managed rsyslog listener configuration"
  ansible.builtin.file:
    path: /etc/rsyslog.d/60-cis-listener.conf
    state: absent
  register: cis_rsyslog_listener
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - section6_logging['6_1_3_7_rsyslog_no_server'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_7, rsyslog]

- name: "6.1.3.7 | Inspect the main rsyslog configuration"
  ansible.builtin.stat:
    path: /etc/rsyslog.conf
  check_mode: false
  register: cis_rsyslog_main_config
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - section6_logging['6_1_3_7_rsyslog_no_server'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_7, rsyslog]

- name: "6.1.3.7 | Inspect rsyslog drop-in configurations"
  ansible.builtin.find:
    paths: /etc/rsyslog.d
    patterns: '*.conf'
    file_type: file
    recurse: false
  check_mode: false
  register: cis_rsyslog_dropins
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - section6_logging['6_1_3_7_rsyslog_no_server'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_7, rsyslog]

- name: "6.1.3.7 | Read rsyslog configurations for listener audit"
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: >-
    {{ ([cis_rsyslog_main_config.stat.path]
        if cis_rsyslog_main_config.stat.exists | default(false) else [])
       + (cis_rsyslog_dropins.files | default([]) | map(attribute='path') | list) }}
  register: cis_rsyslog_config_contents
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - section6_logging['6_1_3_7_rsyslog_no_server'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_7, rsyslog]

- name: "6.1.3.7 | Derive rsyslog files containing listener directives"
  ansible.builtin.set_fact:
    cis_rsyslog_listener_files: >-
      {{ cis_rsyslog_listener_files | default([]) +
         ([item.source] if
          (item.content | b64decode |
           regex_search('(?im)^[ \t]*(?:module\s*\(\s*load\s*=\s*"?im(?:tcp|udp)\b|input\s*\(\s*type\s*=\s*"?im(?:tcp|udp)\b|\$ModLoad\s+im(?:tcp|udp)\b|\$(?:InputTCPServerRun|InputUDPServerRun|UDPServerRun)\b)')) is not none
          else []) }}
  loop: "{{ cis_rsyslog_config_contents.results | default([]) }}"
  when:
    - not (item.skipped | default(false))
  no_log: true
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_7, rsyslog]

- name: "6.1.3.7 | Refuse unexpected rsyslog listener configuration"
  ansible.builtin.assert:
    that:
      - cis_rsyslog_listener_files | default([]) | length == 0
    fail_msg: >-
      Rsyslog receiver directives exist in {{ cis_rsyslog_listener_files | join(', ') }}.
      Review this site policy instead of allowing the hardening role to delete it.
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_7, rsyslog]

- name: "6.1.3.8 | Configure log rotation for rsyslog files"
  ansible.builtin.copy:
    dest: "{{ section6_logging['6_1_3_8_logrotate'].config_file | default('/etc/logrotate.d/rsyslog') }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      {{ section6_logging['6_1_3_8_logrotate'].log_files | join(' ') }} {
          {{ section6_logging['6_1_3_8_logrotate'].frequency | default('daily') }}
          rotate {{ section6_logging['6_1_3_8_logrotate'].rotate | default(7) }}
      {% for option in section6_logging['6_1_3_8_logrotate'].options | default(['missingok', 'notifempty', 'compress', 'delaycompress', 'sharedscripts']) %}
          {{ option }}
      {% endfor %}
          postrotate
              {{ section6_logging['6_1_3_8_logrotate'].postrotate_command | default('/usr/lib/rsyslog/rsyslog-rotate') }}
          endscript
      }
  register: cis_rsyslog_logrotate
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - section6_logging['6_1_3_8_logrotate'].enabled | default(true) | bool
  tags: [cis_6, cis_6_1, cis_6_1_3, cis_6_1_3_8, rsyslog, logrotate]

- name: "6.1.3 | Validate effective rsyslog configuration with rollback"
  block:
    - name: "6.1.3 | Validate the complete live rsyslog configuration"
      ansible.builtin.command:
        argv: [rsyslogd, -N1]
      register: cis_rsyslog_validation
      changed_when: false
      check_mode: false
  rescue:
    - name: "6.1.3 | Restore replaced rsyslog files after validation failure"
      ansible.builtin.copy:
        src: "{{ item.backup_file }}"
        dest: "{{ item.dest }}"
        remote_src: true
      loop:
        - "{{ cis_rsyslog_file_mode | default({}) }}"
        - "{{ cis_rsyslog_local | default({}) }}"
        - "{{ cis_rsyslog_remote | default({}) }}"
      loop_control:
        label: "{{ item.dest | default('unchanged file') }}"
      when:
        - item.changed | default(false)
        - item.backup_file is defined

    - name: "6.1.3 | Remove new rsyslog files after validation failure"
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: absent
      loop:
        - "{{ cis_rsyslog_file_mode | default({}) }}"
        - "{{ cis_rsyslog_local | default({}) }}"
        - "{{ cis_rsyslog_remote | default({}) }}"
      loop_control:
        label: "{{ item.dest | default('unchanged file') }}"
      when:
        - item.changed | default(false)
        - item.backup_file is not defined
        - item.dest is defined

    - name: "6.1.3 | Verify restored rsyslog configuration"
      ansible.builtin.command:
        argv: [rsyslogd, -N1]
      changed_when: false

    - name: "6.1.3 | Stop after rolling back invalid rsyslog changes"
      ansible.builtin.fail:
        msg: >-
          The complete rsyslog configuration was invalid. Role-managed changes
          were rolled back; review the conflicting site policy.
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'rsyslog'
    - not ansible_check_mode
    - >-
      cis_rsyslog_file_mode.changed | default(false)
      or cis_rsyslog_local.changed | default(false)
      or cis_rsyslog_remote.changed | default(false)
      or cis_rsyslog_listener.changed | default(false)
  tags: [cis_6, cis_6_1, cis_6_1_3, rsyslog]

- name: "6.1.3 | Inspect rsyslog unit when journald is selected"
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/rsyslog.service
  check_mode: false
  register: cis_rsyslog_unit
  when: (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
  tags: [cis_6, cis_6_1, cis_6_1_1_4, cis_6_1_3, rsyslog]

- name: "6.1.3 | Disable rsyslog when journald is selected"
  ansible.builtin.systemd_service:
    name: rsyslog.service
    state: stopped
    enabled: false
  when:
    - (cis_logging_backend | default(section6_logging['6_1_1_4_single_logging_system'].preferred_system | default('rsyslog'))) == 'journald'
    - cis_rsyslog_unit.stat.exists
  tags: [cis_6, cis_6_1, cis_6_1_1_4, cis_6_1_3, rsyslog]

- name: "6.1.3 | Restart rsyslog after validated changes"
  ansible.builtin.systemd_service:
    name: rsyslog.service
    state: restarted
  when:
    - cis_rsyslog_validation is not skipped
    - cis_rsyslog_validation.rc == 0
  tags: [cis_6, cis_6_1, cis_6_1_3, rsyslog]
