---
- name: "6.1.4.1 | Inspect standard log files without creating optional files"
  ansible.builtin.stat:
    path: "{{ item.path }}"
  check_mode: false
  loop:
    - {path: /var/log/syslog, mode: 'u-x,g-wx,o-rwx'}
    - {path: /var/log/auth.log, mode: 'u-x,g-wx,o-rwx'}
    - {path: /var/log/kern.log, mode: 'u-x,g-wx,o-rwx'}
    - {path: /var/log/messages, mode: 'u-x,g-wx,o-rwx'}
    - {path: /var/log/secure, mode: 'u-x,g-wx,o-rwx'}
    - {path: /var/log/wtmp, mode: 'u-x,g-w,o-rwx'}
    - {path: /var/log/btmp, mode: 'u-x,g-w,o-rwx'}
    - {path: /var/log/lastlog, mode: 'u-x,g-w,o-rwx'}
  register: cis_standard_logs
  tags: [cis_6, cis_6_1, cis_6_1_4, cis_6_1_4_1, logging, permissions]

- name: "6.1.4.1 | Remove excessive permissions from existing standard logs"
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: file
    mode: "{{ item.item.mode }}"
  loop: "{{ cis_standard_logs.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - section6_logging['6_1_4_1_logfile_permissions'].enabled | default(true) | bool
    - item.stat.exists
    - item.stat.isreg
  tags: [cis_6, cis_6_1, cis_6_1_4, cis_6_1_4_1, logging, permissions]

- name: "6.1.4.1 | Inspect explicitly configured logfile overrides"
  ansible.builtin.stat:
    path: "{{ item.path }}"
  check_mode: false
  loop: "{{ section6_logging['6_1_4_1_logfile_permissions'].file_overrides | default([]) }}"
  register: cis_logfile_overrides
  tags: [cis_6, cis_6_1, cis_6_1_4, cis_6_1_4_1, logging, permissions]

- name: "6.1.4.1 | Apply explicitly configured logfile overrides"
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: file
    owner: "{{ item.item.owner }}"
    group: "{{ item.item.group }}"
    mode: "{{ item.item.mode }}"
  loop: "{{ cis_logfile_overrides.results }}"
  when: item.stat.isreg | default(false)
  tags: [cis_6, cis_6_1, cis_6_1_4, cis_6_1_4_1, logging, permissions]
