- name: "6.2.3 | Import audit rule controls"
  ansible.builtin.import_tasks: 6.2.3-configure_auditd_rules.yml
  when: not ansible_check_mode or 'auditd' in ansible_facts.packages
  tags: [cis_6, cis_6_2, cis_6_2_3, auditd]

- name: "6.2.4 | Import audit file access controls"
  ansible.builtin.import_tasks: 6.2.4-configure_audit_file_access.yml
  when: not ansible_check_mode or 'auditd' in ansible_facts.packages
  tags: [cis_6, cis_6_2, cis_6_2_4, auditd]
