---
# =================================================================
# CIS Benchmark 6.2.4: Configure auditd File Access
# Ubuntu 24.04 LTS - Idempotent Implementation
# =================================================================

# Helper: Get audit log directory from auditd.conf
- name: "6.2.4 | HELPER | Get audit log directory path"
  ansible.builtin.shell: |
    if [ -f /etc/audit/auditd.conf ]; then
      dirname "$(awk -F= '/^\s*log_file\s*/{print $2}' /etc/audit/auditd.conf | xargs)"
    else
      echo "/var/log/audit"
    fi
  register: audit_log_dir
  changed_when: false
  failed_when: false
  when: not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_4
    - auditd
    - helper

# -----------------------------------------------------------------
# 6.2.4.1 | Ensure audit log files mode is configured (Automated)
# Mode: 0640 or more restrictive
# -----------------------------------------------------------------
- name: "6.2.4.1 | Ensure audit log files mode is configured"
  block:
    - name: "AUDIT | Find audit log files with incorrect permissions"
      ansible.builtin.find:
        paths: "{{ audit_log_dir.stdout | default('/var/log/audit') }}"
        patterns: "*.log"
        file_type: file
        recurse: false
      register: audit_log_files
      failed_when: false

    - name: "REMEDIATE | Fix permissions on audit log files"
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: '0640'
        owner: root
        # Fixed: Use correct variable name and attribute
        group: "{{ (section6_logging['6_2_4_3_audit_log_group'].log_group_param) | default('adm') }}"
        state: file
      loop: "{{ audit_log_files.files }}"
      when: 
        - item.mode is defined
        - (item.mode | regex_replace('^0?', '')) != '640'
      notify: Reload auditd config

    - name: "REPORT | Audit log file permissions status"
      ansible.builtin.debug:
        msg: "6.2.4.1 | Found {{ audit_log_files.files | length }} audit log files; {{ audit_log_files.files | selectattr('mode', 'defined') | selectattr('mode', 'match', '^(?!0?640$)') | list | length }} needed permission fixes"
      when: not ansible_check_mode
  when: 
    - section6_logging['6_2_4_1_log_mode'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_4
    - cis_6_2_4_1
    - auditd
    - permissions
    - log_files

# -----------------------------------------------------------------
# 6.2.4.2 | Ensure audit log files owner is configured (Automated)
# Owner: root
# -----------------------------------------------------------------
- name: "6.2.4.2 | Ensure audit log files owner is configured"
  block:
    - name: "AUDIT | Find audit log files with incorrect owner"
      ansible.builtin.find:
        paths: "{{ audit_log_dir.stdout | default('/var/log/audit') }}"
        patterns: "*.log"
        file_type: file
        recurse: false
      register: audit_log_files_owner
      failed_when: false

    - name: "REMEDIATE | Fix owner on audit log files"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        state: file
      loop: "{{ audit_log_files_owner.files }}"
      when: 
        - item.pw_name is defined
        - item.pw_name != 'root'
      notify: Reload auditd config
  when: 
    - section6_logging['6_2_4_2_log_owner'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_4
    - cis_6_2_4_2
    - auditd
    - permissions
    - log_owner

# -----------------------------------------------------------------
# 6.2.4.3 | Ensure audit log files group owner is configured (Automated)
# Group: adm or root
# -----------------------------------------------------------------
- name: "6.2.4.3 | Ensure audit log files group owner is configured"
  block:
    - name: "REMEDIATE | Set log_group parameter in auditd.conf"
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^log_group\s*='
        # Fixed: Use correct variable name and attribute from defaults/main.yml
        # Variable is '6_2_4_3_audit_log_group' with 'log_group_param' attribute
        line: "log_group = {{ (section6_logging['6_2_4_3_audit_log_group'].log_group_param) | default('adm') }}"
        owner: root
        group: root
        mode: '0640'
        backup: true
        # validate removed - grep with spaces/quotes in pattern causes parsing issues in VMs
        # lineinfile with regexp is already idempotent for this use case
      notify: Restart auditd

    - name: "AUDIT | Find audit log files with incorrect group"
      ansible.builtin.find:
        paths: "{{ audit_log_dir.stdout | default('/var/log/audit') }}"
        patterns: "*.log"
        file_type: file
        recurse: false
      register: audit_log_files_group
      failed_when: false

    - name: "REMEDIATE | Fix group on audit log files"
      ansible.builtin.file:
        path: "{{ item.path }}"
        # Fixed: Use correct variable name and attribute
        group: "{{ (section6_logging['6_2_4_3_audit_log_group'].log_group_param) | default('adm') }}"
        state: file
      loop: "{{ audit_log_files_group.files }}"
      when: 
        - item.gr_name is defined
        - item.gr_name not in ['root', (section6_logging['6_2_4_3_audit_log_group'].log_group_param) | default('adm')]
      notify: Reload auditd config
  when: 
    - section6_logging['6_2_4_3_audit_log_group'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_4
    - cis_6_2_4_3
    - auditd
    - permissions
    - log_group

# -----------------------------------------------------------------
# 6.2.4.4 | Ensure the audit log file directory mode is configured (Automated)
# Directory mode: 0750 or more restrictive
# -----------------------------------------------------------------
- name: "6.2.4.4 | Ensure the audit log file directory mode is configured"
  block:
    - name: "AUDIT | Check audit log directory permissions"
      ansible.builtin.stat:
        path: "{{ audit_log_dir.stdout | default('/var/log/audit') }}"
      register: audit_log_dir_stat
      failed_when: false

    - name: "REMEDIATE | Fix audit log directory permissions"
      ansible.builtin.file:
        path: "{{ audit_log_dir.stdout | default('/var/log/audit') }}"
        state: directory
        mode: '0750'
        owner: root
        # Fixed: Use correct variable name and attribute
        group: "{{ (section6_logging['6_2_4_3_audit_log_group'].log_group_param) | default('adm') }}"
      when: 
        - audit_log_dir_stat.stat.exists
        - audit_log_dir_stat.stat.mode is defined
        - (audit_log_dir_stat.stat.mode | regex_replace('^0?', '')) != '750'
      notify: Reload auditd config
  when: 
    - section6_logging['6_2_4_4_log_dir_mode'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_4
    - cis_6_2_4_4
    - auditd
    - permissions
    - log_directory

