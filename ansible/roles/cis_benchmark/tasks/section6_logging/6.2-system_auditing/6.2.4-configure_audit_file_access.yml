# -----------------------------------------------------------------
# 6.2.4.8 | Ensure audit tools mode is configured (Automated)
# Tools mode: 0755 or more restrictive (no write for group/other)
# -----------------------------------------------------------------
- name: "6.2.4.8 | Ensure audit tools mode is configured"
  block:
    - name: "AUDIT | Get current permissions of audit tools"
      ansible.builtin.stat:
        path: "{{ tool_path }}"
      loop:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/augenrules
      loop_control:
        loop_var: tool_path
        label: "{{ tool_path }}"
      register: audit_tools_stat
      failed_when: false

    - name: "REMEDIATE | Fix permissions on audit tools"
      ansible.builtin.file:
        path: "{{ tool_audit.stat.path }}"
        mode: '0755'
        state: file
      loop: "{{ audit_tools_stat.results }}"
      loop_control:
        loop_var: tool_audit
        label: "{{ tool_audit.stat.path }}"
      when: 
        - tool_audit.stat.exists | default(false)
        - tool_audit.stat.mode is defined
        - (tool_audit.stat.mode | regex_replace('^0?', '')) != '755'
      ignore_errors: true
  when: 
    - section6_logging['6_2_4_8_tools_mode'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_4
    - cis_6_2_4_8
    - auditd
    - permissions
    - audit_tools

