---
- name: "6.2.4 | Read configured audit log file"
  ansible.builtin.command:
    argv: [awk, '-F=', '/^[[:space:]]*log_file[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}', /etc/audit/auditd.conf]
  register: cis_audit_log_file
  changed_when: false
  check_mode: false
  tags: [cis_6, cis_6_2, cis_6_2_4, auditd]

- name: "6.2.4 | Derive audit log directory and group"
  ansible.builtin.set_fact:
    cis_audit_log_directory: "{{ (cis_audit_log_file.stdout | default('/var/log/audit/audit.log', true)) | dirname }}"
    cis_audit_log_group: "{{ (section6_logging | default({})).get('6_2_4_3_log_group', {}).get('value', (section6_logging | default({})).get('6_2_4_3_audit_log_group', {}).get('log_group_param', 'adm')) }}"
  changed_when: false
  tags: [cis_6, cis_6_2, cis_6_2_4, auditd]

- name: "6.2.4.1-3 | Find audit log files"
  ansible.builtin.find:
    paths: "{{ cis_audit_log_directory }}"
    file_type: file
    recurse: false
  register: cis_audit_log_files
  tags: [cis_6, cis_6_2, cis_6_2_4, cis_6_2_4_1, cis_6_2_4_2, cis_6_2_4_3, auditd]

- name: "6.2.4.1-3 | Secure audit log files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: file
    owner: root
    group: "{{ cis_audit_log_group }}"
    mode: 'u-x,g-wx,o-rwx'
  loop: "{{ cis_audit_log_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [cis_6, cis_6_2, cis_6_2_4, cis_6_2_4_1, cis_6_2_4_2, cis_6_2_4_3, auditd]

- name: "6.2.4.3 | Configure audit log group"
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*log_group\s*='
    line: "log_group = {{ cis_audit_log_group }}"
    backup: true
  register: cis_audit_log_group_config
  tags: [cis_6, cis_6_2, cis_6_2_4, cis_6_2_4_3, auditd]

- name: "6.2.4.4 | Secure audit log directory without broadening access"
  ansible.builtin.file:
    path: "{{ cis_audit_log_directory }}"
    state: directory
    owner: root
    group: "{{ cis_audit_log_group }}"
    mode: 'g-w,o-rwx'
  tags: [cis_6, cis_6_2, cis_6_2_4, cis_6_2_4_4, auditd]

- name: "6.2.4.5-7 | Find audit configuration files"
  ansible.builtin.find:
    paths: /etc/audit
    patterns: ['*.conf', '*.rules']
    file_type: file
    recurse: true
  register: cis_audit_config_files
  tags: [cis_6, cis_6_2, cis_6_2_4, cis_6_2_4_5, cis_6_2_4_6, cis_6_2_4_7, auditd]

- name: "6.2.4.5-7 | Secure audit configuration files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: file
    owner: root
    group: root
    mode: 'u-x,g-wx,o-rwx'
  loop: "{{ cis_audit_config_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [cis_6, cis_6_2, cis_6_2_4, cis_6_2_4_5, cis_6_2_4_6, cis_6_2_4_7, auditd]

- name: "6.2.4.8-10 | Inspect audit tools"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/sbin/auditctl
    - /usr/sbin/aureport
    - /usr/sbin/ausearch
    - /usr/sbin/autrace
    - /usr/sbin/auditd
    - /usr/sbin/augenrules
  register: cis_audit_tools
  tags: [cis_6, cis_6_2, cis_6_2_4, cis_6_2_4_8, cis_6_2_4_9, cis_6_2_4_10, auditd]

- name: "6.2.4.8-10 | Secure existing audit tools without adding permissions"
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: file
    owner: root
    group: root
    mode: 'go-w'
  loop: "{{ cis_audit_tools.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  tags: [cis_6, cis_6_2, cis_6_2_4, cis_6_2_4_8, cis_6_2_4_9, cis_6_2_4_10, auditd]

- name: "6.2.4 | Validate changed auditd configuration"
  ansible.builtin.command:
    argv: [auditd, -t]
  changed_when: false
  when: cis_audit_log_group_config.changed
  tags: [cis_6, cis_6_2, cis_6_2_4, auditd]

- name: "6.2.4 | Reload changed auditd configuration"
  ansible.builtin.command:
    argv: [service, auditd, reload]
  changed_when: true
  when: cis_audit_log_group_config.changed
  tags: [cis_6, cis_6_2, cis_6_2_4, auditd]
