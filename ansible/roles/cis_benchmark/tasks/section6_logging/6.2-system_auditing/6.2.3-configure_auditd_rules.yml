# -----------------------------------------------------------------
# 6.2.3.15-6.2.3.18 | Ensure successful/unsuccessful attempts to use privileged commands are collected
# Grouped for efficiency: chcon, setfacl, chacl, usermod
# -----------------------------------------------------------------
- name: "6.2.3.15-18 | Ensure privileged command usage is collected (chcon, setfacl, chacl, usermod)"
  block:
    - name: "REMEDIATE | Add audit rules for privileged commands"
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/50-perm_chng.rules
        line: "{{ item }}"
        create: true
        mode: '0640'
        owner: root
        group: root
        # validate removed - grep with spaces in pattern causes parsing issues in VMs
      loop:
        # 6.2.3.15 - chcon
        - "-a always,exit -F path=/usr/bin/chcon -F perm=x -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k perm_chng"
        # 6.2.3.16 - setfacl
        - "-a always,exit -F path=/usr/bin/setfacl -F perm=x -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k perm_chng"
        # 6.2.3.17 - chacl
        - "-a always,exit -F path=/usr/bin/chacl -F perm=x -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k perm_chng"
        # 6.2.3.18 - usermod
        - "-a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k usermod"
      notify: Load audit rules
  when: 
    - section6_logging['6_2_3_15_18_priv_commands'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_15
    - cis_6_2_3_16
    - cis_6_2_3_17
    - cis_6_2_3_18
    - auditd
    - rules
    - privileged_commands

# -----------------------------------------------------------------
# 6.2.3.19 | Ensure kernel module loading unloading and modification is collected
# -----------------------------------------------------------------
- name: "6.2.3.19 | Ensure kernel module loading unloading and modification is collected"
  block:
    - name: "AUDIT | Check kernel_modules rules"
      ansible.builtin.command: grep -E '^-a.*(init_module|finit_module|delete_module).*-k\s+kernel_modules' /etc/audit/rules.d/*.rules
      register: kernel_mod_check
      changed_when: false
      failed_when: false

    - name: "REMEDIATE | Add kernel module audit rules"
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/50-kernel_modules.rules
        line: "{{ item }}"
        create: true
        mode: '0640'
        owner: root
        group: root
        # validate removed - grep with spaces in pattern causes parsing issues in VMs
      loop:
        - "-a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module,query_module -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k kernel_modules"
        - "-a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k kernel_modules"
      when: 
        - item not in kernel_mod_check.stdout
      notify: Load audit rules
  when: 
    - section6_logging['6_2_3_19_kernel_modules'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_19
    - auditd
    - rules
    - kernel
    - modules

# -----------------------------------------------------------------
# 6.2.3.20 | Ensure the audit configuration is immutable (Automated)
# WARNING: Requires reboot to take effect; placed last in rules file
# -----------------------------------------------------------------
- name: "6.2.3.20 | Ensure the audit configuration is immutable"
  block:
    - name: "AUDIT | Check if immutable flag is set"
      ansible.builtin.command: grep -E '^-e\s+2\s*$' /etc/audit/rules.d/99-finalize.rules
      register: immutable_check
      changed_when: false
      failed_when: false

    - name: "REMEDIATE | Add immutable flag to finalize rules"
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/99-finalize.rules
        line: "-e 2"
        create: true
        mode: '0640'
        owner: root
        group: root
        insertafter: EOF
        # validate removed - grep with spaces in pattern causes parsing issues in VMs
      when: immutable_check.rc != 0
      notify: "Load audit rules and warn reboot"  # Fixed: Handler name must match exactly (case-sensitive)
  when: 
    - section6_logging['6_2_3_20_immutable'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_20
    - auditd
    - rules
    - immutable
    - reboot_required

# -----------------------------------------------------------------
# 6.2.3.21 | Ensure the running and on disk configuration is the same (Manual)
# This is a manual check; we provide automation to sync if needed
# -----------------------------------------------------------------
- name: "6.2.3.21 | Ensure the running and on disk configuration is the same"
  block:
    - name: "AUDIT | Check if rules need to be loaded"
      ansible.builtin.command: augenrules --check
      register: augenrules_check
      changed_when: false
      failed_when: false
      ignore_errors: true

    - name: "REMEDIATE | Load audit rules if out of sync"
      ansible.builtin.command: augenrules --load
      when: 
        - augenrules_check.rc != 0 or 'No change' not in augenrules_check.stdout
      changed_when: true
      notify: "Restart auditd"  # Fixed: Handler name must match exactly; 'Restart auditd if needed' does not exist
  when: 
    - section6_logging['6_2_3_21_sync_rules'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_21
    - auditd
    - rules
    - sync
    - manual_check
