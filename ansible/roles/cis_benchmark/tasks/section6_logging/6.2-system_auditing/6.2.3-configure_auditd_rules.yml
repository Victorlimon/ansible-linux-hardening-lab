# -----------------------------------------------------------------
# 6.2.3.6 | Ensure use of privileged commands are collected
# NOTE: This is resource-intensive; exclude large/noexec partitions
# -----------------------------------------------------------------
- name: "6.2.3.6 | Ensure use of privileged commands are collected"
  block:
    - name: "AUDIT | Find privileged commands (setuid/setgid)"
      ansible.builtin.shell: |
        findmnt -n -l -k -it $(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,) | grep -Pv "noexec|nosuid" | awk '{print $1}' | while read PART; do
          find "$PART" -xdev -perm /6000 -type f 2>/dev/null
        done | head -100
      register: privileged_cmds
      changed_when: false
      failed_when: false

    - name: "REMEDIATE | Add audit rules for privileged commands"
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/50-privileged.rules
        line: "-a always,exit -F path={{ item }} -F perm=x -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k privileged"
        create: true
        mode: '0640'
        owner: root
        group: root
      loop: "{{ privileged_cmds.stdout_lines | default([]) }}"
      when: 
        - item not in existing_priv_rules.stdout | default('')
      notify: Load audit rules
      ignore_errors: true  # May have many files; continue on error

    - name: "AUDIT | Check existing privileged rules"
      ansible.builtin.command: grep -E '^-a.*perm=x.*-k\s+privileged' /etc/audit/rules.d/50-privileged.rules
      register: existing_priv_rules
      changed_when: false
      failed_when: false
  when: 
    - section6_logging['6_2_3_6_privileged_cmds'].enabled | default(false)  # Disabled by default due to performance
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_6
    - auditd
    - rules
    - privileged
    - performance_warning

# -----------------------------------------------------------------
# 6.2.3.7 | Ensure unsuccessful file access attempts are collected
# -----------------------------------------------------------------
- name: "6.2.3.7 | Ensure unsuccessful file access attempts are collected"
  block:
    - name: "AUDIT | Check access failure rules"
      ansible.builtin.command: grep -E '^-a.*(creat|open|openat|truncate|ftruncate).*exit=-E(Access|Perm).*-k\s+access' /etc/audit/rules.d/*.rules
      register: access_fail_check
      changed_when: false
      failed_when: false

    - name: "REMEDIATE | Add unsuccessful file access audit rules"
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/50-access.rules
        line: "{{ item }}"
        create: true
        mode: '0640'
        owner: root
        group: root
        # validate removed - grep with spaces in pattern causes parsing issues in VMs
      loop:
        - "-a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k access"
        - "-a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k access"
        - "-a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k access"
        - "-a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -k access"
      when: 
        - item not in access_fail_check.stdout
      notify: Load audit rules
  when: 
    - section6_logging['6_2_3_7_access_failures'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_7
    - auditd
    - rules
    - access
    - failures

