---
- name: "6.2.3 | Read UID_MIN"
  ansible.builtin.command:
    argv: [awk, '/^[[:space:]]*UID_MIN[[:space:]]+/{print $2}', /etc/login.defs]
  register: cis_uid_min
  changed_when: false
  check_mode: false
  tags: [cis_6, cis_6_2, cis_6_2_3, auditd]

- name: "6.2.3 | Validate UID_MIN"
  ansible.builtin.assert:
    that:
      - cis_uid_min.stdout is match('^[0-9]+$')
    fail_msg: "UID_MIN is missing or invalid in /etc/login.defs"
  tags: [cis_6, cis_6_2, cis_6_2_3, auditd]

- name: "6.2.3 | Inspect optional audit watch paths"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ cis_sudo_logfile | default('/var/log/sudo.log') }}"
    - /etc/networks
    - /etc/network
    - /etc/netplan
    - /etc/security/opasswd
    - /etc/pam.conf
    - /var/run/utmp
    - /var/log/wtmp
    - /var/log/btmp
    - /var/log/lastlog
    - /var/run/faillock
    - /etc/apparmor
    - /etc/apparmor.d
  register: cis_audit_optional_path_stats
  tags: [cis_6, cis_6_2, cis_6_2_3, auditd]

- name: "6.2.3 | Record existing optional audit paths"
  ansible.builtin.set_fact:
    cis_audit_existing_paths: >-
      {{ cis_audit_optional_path_stats.results
         | selectattr('stat.exists') | map(attribute='item') | list }}
  changed_when: false
  tags: [cis_6, cis_6_2, cis_6_2_3, auditd]

- name: "6.2.3.1 | Audit changes to sudoers scope"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-scope.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope
  register: cis_audit_rule_scope
  when: section6_logging['6_2_3_1_sudoers_scope'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_1, auditd]

- name: "6.2.3.2 | Audit actions performed as another user"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-user-emulation.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation
      -a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation
  register: cis_audit_rule_emulation
  when: section6_logging['6_2_3_2_user_emulation'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_2, auditd]

- name: "6.2.3.3 | Audit the configured sudo log when present"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-sudo-log.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% set sudo_log = cis_sudo_logfile | default('/var/log/sudo.log') %}
      {% if sudo_log in cis_audit_existing_paths %}-w {{ sudo_log }} -p wa -k sudo_log_file
      {% endif %}
  register: cis_audit_rule_sudo_log
  when: section6_logging['6_2_3_3_sudo_log'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_3, auditd]

- name: "6.2.3.4 | Audit changes to date and time"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-time-change.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday -k time-change
      -a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k time-change
      -a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -k time-change
      -w /etc/localtime -p wa -k time-change
  register: cis_audit_rule_time
  when: section6_logging['6_2_3_4_time_change'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_4, auditd]

- name: "6.2.3.5 | Audit changes to the network environment"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-system-locale.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      {% for path in ['/etc/networks', '/etc/network', '/etc/netplan'] if path in cis_audit_existing_paths %}-w {{ path }} -p wa -k system-locale
      {% endfor %}
  register: cis_audit_rule_locale
  when: section6_logging['6_2_3_5_system_locale'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_5, auditd]

- name: "6.2.3.6 | Discover privileged files on eligible local mounts"
  ansible.builtin.shell: |
    set -o pipefail
    findmnt -rn -o TARGET,FSTYPE,OPTIONS | awk '$2 !~ /^(proc|sysfs|devtmpfs|devpts|tmpfs|squashfs|overlay|nfs|nfs4|cifs)$/ && $3 !~ /(^|,)(noexec|nosuid)(,|$)/ {print $1}' | while read -r mountpoint; do
      find "$mountpoint" -xdev -type f -perm /6000 -print
    done
  args:
    executable: /bin/bash
  register: cis_privileged_files
  changed_when: false
  failed_when: cis_privileged_files.rc != 0
  when: section6_logging['6_2_3_6_privileged_cmds'].enabled | default(false) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_6, auditd]

- name: "6.2.3.6 | Audit use of all discovered privileged files"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-privileged.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% for path in cis_privileged_files.stdout_lines | default([]) | unique | sort %}-a always,exit -F path={{ path }} -F perm=x -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k privileged
      {% endfor %}
  register: cis_audit_rule_privileged
  when: section6_logging['6_2_3_6_privileged_cmds'].enabled | default(false) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_6, auditd]

- name: "6.2.3.7 | Audit unsuccessful file access"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-access.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% for arch in ['b64', 'b32'] %}
      -a always,exit -F arch={{ arch }} -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k access
      -a always,exit -F arch={{ arch }} -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k access
      {% endfor %}
  register: cis_audit_rule_access
  when: section6_logging['6_2_3_7_access_failures'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_7, auditd]

- name: "6.2.3.8 | Audit changes to identity files"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-identity.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% for path in ['/etc/group', '/etc/passwd', '/etc/gshadow', '/etc/shadow', '/etc/nsswitch.conf', '/etc/pam.d'] %}-w {{ path }} -p wa -k identity
      {% endfor %}
      {% for path in ['/etc/security/opasswd', '/etc/pam.conf'] if path in cis_audit_existing_paths %}-w {{ path }} -p wa -k identity
      {% endfor %}
  register: cis_audit_rule_identity
  when: section6_logging['6_2_3_8_identity'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_8, auditd]

- name: "6.2.3.9 | Audit discretionary permission changes"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-perm-mod.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% for arch in ['b64', 'b32'] %}
      -a always,exit -F arch={{ arch }} -S chmod,fchmod,fchmodat -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k perm_mod
      -a always,exit -F arch={{ arch }} -S chown,fchown,lchown,fchownat -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k perm_mod
      -a always,exit -F arch={{ arch }} -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k perm_mod
      {% endfor %}
  register: cis_audit_rule_perm_mod
  when: section6_logging['6_2_3_9_perm_mod'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_9, auditd]

- name: "6.2.3.10 | Audit filesystem mounts"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-mounts.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -a always,exit -F arch=b64 -S mount -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k mounts
      -a always,exit -F arch=b32 -S mount -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k mounts
  register: cis_audit_rule_mounts
  when: section6_logging['6_2_3_10_mounts'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_10, auditd]

- name: "6.2.3.11 | Audit session initiation files that exist"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-session.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% for path in ['/var/run/utmp', '/var/log/wtmp', '/var/log/btmp'] if path in cis_audit_existing_paths %}-w {{ path }} -p wa -k session
      {% endfor %}
  register: cis_audit_rule_session
  when: section6_logging['6_2_3_11_session'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_11, auditd]

- name: "6.2.3.12 | Audit login records that exist"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-login.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% for path in ['/var/log/lastlog', '/var/run/faillock'] if path in cis_audit_existing_paths %}-w {{ path }} -p wa -k logins
      {% endfor %}
  register: cis_audit_rule_login
  when: section6_logging['6_2_3_12_logins'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_12, auditd]

- name: "6.2.3.13 | Audit file deletion and rename events"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-delete.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -a always,exit -F arch=b64 -S rename,unlink,unlinkat,renameat -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k delete
      -a always,exit -F arch=b32 -S rename,unlink,unlinkat,renameat -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k delete
  register: cis_audit_rule_delete
  when: section6_logging['6_2_3_13_delete'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_13, auditd]

- name: "6.2.3.14 | Audit AppArmor policy paths that exist"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-mac-policy.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% for path in ['/etc/apparmor', '/etc/apparmor.d'] if path in cis_audit_existing_paths %}-w {{ path }} -p wa -k MAC-policy
      {% endfor %}
  register: cis_audit_rule_mac
  when: section6_logging['6_2_3_14_mac_policy'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_14, auditd]

- name: "6.2.3.15-18 | Inspect privileged administration commands"
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - {control: '15', path: /usr/bin/chcon, key: perm_chng}
    - {control: '16', path: /usr/bin/setfacl, key: perm_chng}
    - {control: '17', path: /usr/bin/chacl, key: perm_chng}
    - {control: '18', path: /usr/sbin/usermod, key: usermod}
  register: cis_audit_admin_commands
  when: section6_logging['6_2_3_15_18_priv_commands'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_15, cis_6_2_3_16, cis_6_2_3_17, cis_6_2_3_18, auditd]

- name: "6.2.3.15-18 | Audit existing privileged administration commands"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-perm-change-commands.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      {% for result in cis_audit_admin_commands.results | default([]) if result.stat.exists %}-a always,exit -F path={{ result.item.path }} -F perm=x -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k {{ result.item.key }}
      {% endfor %}
  register: cis_audit_rule_admin_commands
  when: section6_logging['6_2_3_15_18_priv_commands'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_15, cis_6_2_3_16, cis_6_2_3_17, cis_6_2_3_18, auditd]

- name: "6.2.3.19 | Audit kernel module operations"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-kernel-modules.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module,query_module -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k kernel_modules
      -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>={{ cis_uid_min.stdout }} -F auid!=unset -k kernel_modules
  register: cis_audit_rule_modules
  when: section6_logging['6_2_3_19_kernel_modules'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_19, auditd]

- name: "6.2.3.20 | Configure immutable audit rules only with explicit opt-in"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/99-finalize.rules
    owner: root
    group: root
    mode: '0640'
    content: "-e 2\n"
  register: cis_audit_rule_immutable
  when: section6_logging['6_2_3_20_immutable'].enabled | default(false) | bool
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_20, auditd]

- name: "6.2.3.20 | Remove role-managed immutable rule without opt-in"
  ansible.builtin.file:
    path: /etc/audit/rules.d/99-finalize.rules
    state: absent
  register: cis_audit_rule_mutable
  when: not (section6_logging['6_2_3_20_immutable'].enabled | default(false) | bool)
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_20, auditd]

- name: "6.2.3.21 | Check generated audit rule set"
  ansible.builtin.command:
    argv: [augenrules, --check]
  register: cis_augenrules_check
  changed_when: false
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_21, auditd]

- name: "6.2.3.21 | Read kernel audit lock state"
  ansible.builtin.command:
    argv: [auditctl, -s]
  register: cis_audit_status
  changed_when: false
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_21, auditd]

- name: "6.2.3.21 | Merge and load validated audit rules"
  ansible.builtin.command:
    argv: [augenrules, --load]
  register: cis_augenrules_load
  changed_when: "'No change' not in cis_augenrules_load.stdout"
  when: "'enabled 2' not in cis_audit_status.stdout"
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_21, auditd]

- name: "6.2.3.21 | Report that a reboot is required for locked audit rules"
  ansible.builtin.debug:
    msg: "Audit is immutable; on-disk rules are validated but require a reboot to become active."
  when: "'enabled 2' in cis_audit_status.stdout"
  tags: [cis_6, cis_6_2, cis_6_2_3, cis_6_2_3_21, auditd]
