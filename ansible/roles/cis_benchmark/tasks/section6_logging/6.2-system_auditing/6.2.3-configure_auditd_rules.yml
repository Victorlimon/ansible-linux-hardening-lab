        - "-a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -F key=perm_mod"
        - "-a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>={{ uid_min_value.stdout | default(1000) }} -F auid!=unset -F key=perm_mod"
