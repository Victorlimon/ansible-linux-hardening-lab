---
# =================================================================
# CIS Benchmark 6.2.3: Configure auditd Rules
# Ubuntu 24.04 LTS - Idempotent Implementation
# NOTE: For 64-bit systems, rules must be defined for both b32 and b64 arch
# =================================================================

# Helper: Get UID_MIN for non-privileged user filtering
- name: "6.2.3 | HELPER | Get UID_MIN from login.defs"
  ansible.builtin.command: awk '/^\s*UID_MIN/{print $2}' /etc/login.defs
  register: uid_min_value
  changed_when: false
  failed_when: false
  when: not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - auditd
    - rules
    - helper

# -----------------------------------------------------------------
# 6.2.3.1 | Ensure changes to system administration scope (sudoers) is collected
# -----------------------------------------------------------------
- name: "6.2.3.1 | Ensure changes to system administration scope (sudoers) is collected"
  block:
    - name: "AUDIT | Check if sudoers rules exist"
      ansible.builtin.command: grep -E '^-w\s+/etc/sudoers.*-k\s+scope' /etc/audit/rules.d/*.rules
      register: sudoers_rules_check
      changed_when: false
      failed_when: false

    - name: "REMEDIATE | Add audit rules for /etc/sudoers and /etc/sudoers.d"
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/50-scope.rules
        line: "{{ item }}"
        create: true
        mode: '0640'
        owner: root
        group: root
        # NOTE: validate removed - grep with spaces in pattern causes parsing issues in VMs
        # lineinfile with regexp is already idempotent for this use case
      loop:
        - "-w /etc/sudoers -p wa -k scope"
        - "-w /etc/sudoers.d -p wa -k scope"
      when: 
        - item not in sudoers_rules_check.stdout
      notify: Load audit rules
  when: 
    - section6_logging['6_2_3_1_sudoers_scope'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_1
    - auditd
    - rules
    - sudoers
    - scope

# -----------------------------------------------------------------
# 6.2.3.2 | Ensure actions as another user are always logged
# -----------------------------------------------------------------
- name: "6.2.3.2 | Ensure actions as another user are always logged"
  block:
    - name: "AUDIT | Check user_emulation rules"
      ansible.builtin.command: grep -E '^-a.*execve.*-k\s+user_emulation' /etc/audit/rules.d/*.rules
      register: user_emul_check
      changed_when: false
      failed_when: false

    - name: "REMEDIATE | Add user emulation audit rules (b64 and b32)"
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/50-user_emulation.rules
        line: "{{ item }}"
        create: true
        mode: '0640'
        owner: root
        group: root
        # NOTE: validate removed - grep with spaces in pattern causes parsing issues in VMs
      loop:
        - "-a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation"
        - "-a always,exit -F arch=b32 -C euid!=uid -F auid!=unset -S execve -k user_emulation"
      when: 
        - item not in user_emul_check.stdout
      notify: Load audit rules
  when: 
    - section6_logging['6_2_3_2_user_emulation'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_2
    - auditd
    - rules
    - user_emulation

# -----------------------------------------------------------------
# 6.2.3.3 | Ensure events that modify the sudo log file are collected
# -----------------------------------------------------------------
- name: "6.2.3.3 | Ensure events that modify the sudo log file are collected"
  block:
    - name: "AUDIT | Get sudo log file path from sudoers"
      ansible.builtin.shell: grep -r logfile /etc/sudoers* 2>/dev/null | sed -e 's/.*logfile=//;s/,.*//' -e 's/"//g' | head -1
      register: sudo_log_path
      changed_when: false
      failed_when: false

    - name: "AUDIT | Check if sudo_log rule exists"
      ansible.builtin.command: "grep -E '^-w\\s+{{ sudo_log_path.stdout | regex_replace('/', '\\\\/') }}.*-k\\s+sudo_log_file' /etc/audit/rules.d/*.rules"
      register: sudo_log_check
      changed_when: false
      failed_when: false
      when: sudo_log_path.stdout | length > 0

    - name: "REMEDIATE | Add audit rule for sudo log file"
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/50-sudo.rules
        line: "-w {{ sudo_log_path.stdout }} -p wa -k sudo_log_file"
        create: true
        mode: '0640'
        owner: root
        group: root
        # validate removed - grep with spaces in pattern causes parsing issues in VMs
      when: 
        - sudo_log_path.stdout | length > 0
        - sudo_log_check is skipped or "-w {{ sudo_log_path.stdout }} -p wa -k sudo_log_file" not in sudo_log_check.stdout
      notify: Load audit rules
  when: 
    - section6_logging['6_2_3_3_sudo_log'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_3
    - auditd
    - rules
    - sudo_log

# -----------------------------------------------------------------
# 6.2.3.4 | Ensure events that modify date and time information are collected
# -----------------------------------------------------------------
- name: "6.2.3.4 | Ensure events that modify date and time information are collected"
  block:
    - name: "AUDIT | Check time-change rules"
      ansible.builtin.command: grep -E '^-a.*(adjtimex|settimeofday|clock_settime).*-k\s+time-change' /etc/audit/rules.d/*.rules
      register: time_change_check
      changed_when: false
      failed_when: false

    - name: "REMEDIATE | Add time change audit rules"
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/50-time-change.rules
        line: "{{ item }}"
        create: true
        mode: '0640'
        owner: root
        group: root
        # validate removed - grep with spaces in pattern causes parsing issues in VMs
        # lineinfile with regexp is already idempotent for this use case
      loop:
        - "-a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change"
        - "-a always,exit -F arch=b32 -S adjtimex,settimeofday -k time-change"
        - "-a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k time-change"
        - "-a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -k time-change"
        - "-w /etc/localtime -p wa -k time-change"
      when: 
        - item not in time_change_check.stdout
      notify: Load audit rules
  when: 
    - section6_logging['6_2_3_4_time_change'].enabled | default(true)
    - not auditd_unresponsive | default(false)
  tags:
    - cis_6
    - cis_6_2
    - cis_6_2_3
    - cis_6_2_3_4
    - auditd
    - rules
    - time_change

