---
- name: "6.2.2 | Select safe effective audit retention actions"
  ansible.builtin.set_fact:
    cis_audit_disk_full_action: >-
      {{ section6_logging['6_2_2_3_disk_actions'].disk_full_action | default('syslog')
         if cis_audit_allow_disruptive_actions | default(false) | bool else 'syslog' }}
    cis_audit_disk_error_action: >-
      {{ section6_logging['6_2_2_3_disk_actions'].disk_error_action | default('syslog')
         if cis_audit_allow_disruptive_actions | default(false) | bool else 'syslog' }}
    cis_audit_admin_space_action: >-
      {{ section6_logging['6_2_2_4_space_warnings'].admin_space_left_action | default('syslog')
         if cis_audit_allow_disruptive_actions | default(false) | bool else 'syslog' }}
    cis_audit_space_left_action: >-
      {{ section6_logging['6_2_2_4_space_warnings'].space_left_action | default('syslog')
         if (section6_logging['6_2_2_4_space_warnings'].space_left_action | default('syslog') != 'email'
             or cis_audit_use_email_alerts | default(false) | bool) else 'syslog' }}
  changed_when: false
  tags: [cis_6, cis_6_2, cis_6_2_2, auditd]

- name: "6.2.2 | Validate audit retention values"
  ansible.builtin.assert:
    that:
      - section6_logging['6_2_2_1_max_log_file'].value | default(100) | int > 0
      - section6_logging['6_2_2_2_max_log_file_action'].value | default('keep_logs') in ['ignore', 'syslog', 'suspend', 'rotate', 'keep_logs']
      - cis_audit_disk_full_action in ['ignore', 'syslog', 'rotate', 'suspend', 'single', 'halt']
      - cis_audit_disk_error_action in ['ignore', 'syslog', 'suspend', 'single', 'halt']
      - section6_logging['6_2_2_4_space_warnings'].space_left | default(100) | int > section6_logging['6_2_2_4_space_warnings'].admin_space_left | default(50) | int
      - cis_audit_space_left_action in ['ignore', 'syslog', 'rotate', 'email', 'suspend', 'single', 'halt']
      - cis_audit_admin_space_action in ['ignore', 'syslog', 'rotate', 'email', 'suspend', 'single', 'halt']
  tags: [cis_6, cis_6_2, cis_6_2_2, auditd]

- name: "6.2.2.1 | Configure audit log size"
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*max_log_file\s*='
    line: "max_log_file = {{ section6_logging['6_2_2_1_max_log_file'].value | default(100) }}"
    backup: true
  register: cis_audit_max_log_file
  when: section6_logging['6_2_2_1_max_log_file'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_2, cis_6_2_2_1, auditd]

- name: "6.2.2.2 | Configure audit log retention"
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*max_log_file_action\s*='
    line: "max_log_file_action = {{ section6_logging['6_2_2_2_max_log_file_action'].value | default('keep_logs') }}"
    backup: true
  register: cis_audit_max_log_action
  when: section6_logging['6_2_2_2_max_log_file_action'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_2, cis_6_2_2_2, auditd]

- name: "6.2.2.3 | Configure safe full/error actions"
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    backup: true
  loop:
    - {key: disk_full_action, value: "{{ cis_audit_disk_full_action }}"}
    - {key: disk_error_action, value: "{{ cis_audit_disk_error_action }}"}
  register: cis_audit_disk_actions
  when: section6_logging['6_2_2_3_disk_actions'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_2, cis_6_2_2_3, auditd]

- name: "6.2.2.4 | Configure audit low-space warnings"
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    backup: true
  loop:
    - {key: space_left, value: "{{ section6_logging['6_2_2_4_space_warnings'].space_left | default(100) }}"}
    - {key: space_left_action, value: "{{ cis_audit_space_left_action }}"}
    - {key: admin_space_left, value: "{{ section6_logging['6_2_2_4_space_warnings'].admin_space_left | default(50) }}"}
    - {key: admin_space_left_action, value: "{{ cis_audit_admin_space_action }}"}
    - {key: action_mail_acct, value: "{{ section6_logging['6_2_2_4_space_warnings'].action_mail_acct | default('root') }}"}
  register: cis_audit_space_actions
  when: section6_logging['6_2_2_4_space_warnings'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_2, cis_6_2_2_4, auditd]

- name: "6.2.2 | Reload auditd after constrained retention changes"
  ansible.builtin.command:
    argv: [service, auditd, reload]
  changed_when: true
  when: cis_audit_max_log_file.changed | default(false) or cis_audit_max_log_action.changed | default(false) or cis_audit_disk_actions.changed | default(false) or cis_audit_space_actions.changed | default(false)
  tags: [cis_6, cis_6_2, cis_6_2_2, auditd]
