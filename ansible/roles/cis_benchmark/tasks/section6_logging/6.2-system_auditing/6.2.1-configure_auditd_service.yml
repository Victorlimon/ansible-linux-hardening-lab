---
- name: "6.2.1.1 | Install auditd packages"
  ansible.builtin.apt:
    name: "{{ section6_logging['6_2_1_1_auditd_packages'].packages | default(['auditd', 'audispd-plugins']) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: section6_logging['6_2_1_1_auditd_packages'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_1, cis_6_2_1_1, auditd]

- name: "6.2.1.2 | Enable and start auditd"
  ansible.builtin.systemd_service:
    name: auditd.service
    state: started
    enabled: true
    masked: false
  when:
    - section6_logging['6_2_1_2_auditd_enabled'].enabled | default(true) | bool
    - not ansible_check_mode or 'auditd' in ansible_facts.packages
  tags: [cis_6, cis_6_2, cis_6_2_1, cis_6_2_1_2, auditd]

- name: "6.2.1.3 | Add early boot auditing to GRUB"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX="(?![^"]*\baudit=1\b)[^"]*)"$'
    replace: '\1 audit=1"'
    backup: true
  register: cis_grub_audit
  when: section6_logging['6_2_1_3_audit_boot_param'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_1, cis_6_2_1_3, auditd, grub]

- name: "6.2.1.4 | Replace an existing audit backlog limit"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '(?m)^(GRUB_CMDLINE_LINUX="[^"]*\baudit_backlog_limit=)\d+(\b[^"]*"$)'
    replace: '\g<1>{{ section6_logging["6_2_1_4_audit_backlog_limit"].value | default(8192) }}\2'
    backup: true
  register: cis_grub_backlog_replace
  when: section6_logging['6_2_1_4_audit_backlog_limit'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_1, cis_6_2_1_4, auditd, grub]

- name: "6.2.1.4 | Add a missing audit backlog limit"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX="(?![^"]*\baudit_backlog_limit=)[^"]*)"$'
    replace: '\1 audit_backlog_limit={{ section6_logging["6_2_1_4_audit_backlog_limit"].value | default(8192) }}"'
    backup: true
  register: cis_grub_backlog_add
  when: section6_logging['6_2_1_4_audit_backlog_limit'].enabled | default(true) | bool
  tags: [cis_6, cis_6_2, cis_6_2_1, cis_6_2_1_4, auditd, grub]

- name: "6.2.1.3-4 | Regenerate GRUB configuration"
  ansible.builtin.command: update-grub
  register: cis_update_grub
  changed_when: true
  when: cis_grub_audit.changed | default(false) or cis_grub_backlog_replace.changed | default(false) or cis_grub_backlog_add.changed | default(false)
  tags: [cis_6, cis_6_2, cis_6_2_1, cis_6_2_1_3, cis_6_2_1_4, auditd, grub]
