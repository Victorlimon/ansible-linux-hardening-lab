---
- name: "6.3.1 | Install AIDE packages"
  ansible.builtin.apt:
    name: "{{ section6_logging['6_3_1_aide_installed'].packages | default(['aide', 'aide-common']) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: cis_aide_packages
  when: section6_logging['6_3_1_aide_installed'].enabled | default(true) | bool
  tags: [cis_6, cis_6_3, cis_6_3_1, aide]

- name: "6.3 | Inspect the AIDE configuration file"
  ansible.builtin.stat:
    path: "{{ section6_logging['6_3_3_aide_audit_tools_integrity'].aide_conf | default('/etc/aide/aide.conf') }}"
  register: cis_aide_configuration
  tags: [cis_6, cis_6_3, aide]

- name: "6.3.3 | Inspect audit tools for AIDE rules"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ section6_logging['6_3_3_aide_audit_tools_integrity'].audit_tools | default(['/usr/sbin/auditctl', '/usr/sbin/auditd', '/usr/sbin/ausearch', '/usr/sbin/aureport', '/usr/sbin/autrace', '/usr/sbin/augenrules']) }}"
  register: cis_aide_audit_tools
  when: section6_logging['6_3_3_aide_audit_tools_integrity'].enabled | default(true) | bool
  tags: [cis_6, cis_6_3, cis_6_3_3, aide]

- name: "6.3.3 | Configure AIDE protection for existing audit tools"
  ansible.builtin.lineinfile:
    path: "{{ section6_logging['6_3_3_aide_audit_tools_integrity'].aide_conf | default('/etc/aide/aide.conf') }}"
    regexp: "^{{ item.item | regex_escape }}\\s+"
    line: "{{ item.item }} {{ section6_logging['6_3_3_aide_audit_tools_integrity'].audit_tool_attrs | default('p+i+n+u+g+s+b+acl+xattrs+sha512') }}"
    owner: root
    group: root
    mode: '0640'
    backup: true
  loop: "{{ cis_aide_audit_tools.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - section6_logging['6_3_3_aide_audit_tools_integrity'].enabled | default(true) | bool
    - item.stat.exists
    - not ansible_check_mode or cis_aide_configuration.stat.exists
  register: cis_aide_config
  tags: [cis_6, cis_6_3, cis_6_3_3, aide]

- name: "6.3.3 | Validate AIDE configuration"
  ansible.builtin.command:
    argv:
      - /usr/bin/aide
      - --config
      - "{{ section6_logging['6_3_3_aide_audit_tools_integrity'].aide_conf | default('/etc/aide/aide.conf') }}"
      - --config-check
  changed_when: false
  when:
    - section6_logging['6_3_3_aide_config_validation'].enabled | default(true) | bool
    - not ansible_check_mode or cis_aide_configuration.stat.exists
  tags: [cis_6, cis_6_3, cis_6_3_3, aide]

- name: "6.3.1 | Check for an initialized AIDE database"
  ansible.builtin.stat:
    path: "{{ section6_logging['6_3_1_aide_init'].db_path | default('/var/lib/aide/aide.db') }}"
  register: cis_aide_database
  tags: [cis_6, cis_6_3, cis_6_3_1, aide]

- name: "6.3.1 | Initialize the AIDE database once"
  ansible.builtin.command:
    argv: [/usr/sbin/aideinit, --yes]
  register: cis_aide_init
  changed_when: true
  when:
    - section6_logging['6_3_1_aide_init'].enabled | default(true) | bool
    - not cis_aide_database.stat.exists
  tags: [cis_6, cis_6_3, cis_6_3_1, aide]

- name: "6.3.1 | Inspect the newly initialized AIDE database"
  ansible.builtin.stat:
    path: "{{ section6_logging['6_3_1_aide_init'].db_new_path | default('/var/lib/aide/aide.db.new') }}"
  register: cis_aide_new_database
  when: cis_aide_init.changed | default(false)
  tags: [cis_6, cis_6_3, cis_6_3_1, aide]

- name: "6.3.1 | Promote the newly initialized AIDE database"
  ansible.builtin.copy:
    src: "{{ section6_logging['6_3_1_aide_init'].db_new_path | default('/var/lib/aide/aide.db.new') }}"
    dest: "{{ section6_logging['6_3_1_aide_init'].db_path | default('/var/lib/aide/aide.db') }}"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when:
    - cis_aide_new_database.stat.exists | default(false)
    - not cis_aide_database.stat.exists
  register: cis_aide_database_promoted
  tags: [cis_6, cis_6_3, cis_6_3_1, aide]

- name: "6.3.1 | Remove promoted initialization database"
  ansible.builtin.file:
    path: "{{ section6_logging['6_3_1_aide_init'].db_new_path | default('/var/lib/aide/aide.db.new') }}"
    state: absent
  when: cis_aide_database_promoted.changed | default(false)
  tags: [cis_6, cis_6_3, cis_6_3_1, aide]

- name: "6.3.1 | Verify AIDE initialization produced a database"
  ansible.builtin.stat:
    path: "{{ section6_logging['6_3_1_aide_init'].db_path | default('/var/lib/aide/aide.db') }}"
  register: cis_aide_database_verified
  when: cis_aide_init.changed | default(false)
  tags: [cis_6, cis_6_3, cis_6_3_1, aide]

- name: "6.3.1 | Assert that the initialized database is usable"
  ansible.builtin.assert:
    that:
      - cis_aide_database_verified.stat.exists
      - cis_aide_database_verified.stat.isreg
      - cis_aide_database_verified.stat.size | int > 0
    fail_msg: "AIDE initialization did not produce a non-empty production database"
  when: cis_aide_init.changed | default(false)
  tags: [cis_6, cis_6_3, cis_6_3_1, aide]

- name: "6.3.3 | Update AIDE database after validated configuration changes"
  ansible.builtin.command:
    argv: [/usr/bin/aide.wrapper, --update]
  register: cis_aide_update
  changed_when: cis_aide_update.rc < 8
  failed_when: cis_aide_update.rc >= 8
  when:
    - section6_logging.get('6_3_3_aide_database_update', {}).get('enabled', false) | bool
    - cis_aide_config.changed | default(false)
    - cis_aide_database.stat.exists
  tags: [cis_6, cis_6_3, cis_6_3_3, aide]

- name: "6.3.3 | Verify the updated AIDE database candidate"
  ansible.builtin.stat:
    path: "{{ section6_logging['6_3_1_aide_init'].db_new_path | default('/var/lib/aide/aide.db.new') }}"
    checksum_algorithm: sha256
  register: cis_aide_updated_database
  when: cis_aide_update.changed | default(false)
  tags: [cis_6, cis_6_3, cis_6_3_3, aide]

- name: "6.3.3 | Assert that the updated AIDE database is usable"
  ansible.builtin.assert:
    that:
      - cis_aide_updated_database.stat.exists
      - cis_aide_updated_database.stat.isreg
      - cis_aide_updated_database.stat.size | int > 0
    fail_msg: "AIDE update did not produce a non-empty database candidate"
  when: cis_aide_update.changed | default(false)
  tags: [cis_6, cis_6_3, cis_6_3_3, aide]

- name: "6.3.3 | Promote updated AIDE database"
  ansible.builtin.copy:
    src: "{{ section6_logging['6_3_1_aide_init'].db_new_path | default('/var/lib/aide/aide.db.new') }}"
    dest: "{{ section6_logging['6_3_1_aide_init'].db_path | default('/var/lib/aide/aide.db') }}"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when:
    - cis_aide_update.changed | default(false)
    - section6_logging.get('6_3_3_aide_database_update', {}).get('promote_candidate', false) | bool
  register: cis_aide_updated_database_promoted
  tags: [cis_6, cis_6_3, cis_6_3_3, aide]

- name: "6.3.3 | Remove promoted update database"
  ansible.builtin.file:
    path: "{{ section6_logging['6_3_1_aide_init'].db_new_path | default('/var/lib/aide/aide.db.new') }}"
    state: absent
  when: cis_aide_updated_database_promoted.changed | default(false)
  tags: [cis_6, cis_6_3, cis_6_3_3, aide]

- name: "6.3.3 | Report unpromoted AIDE database candidate"
  ansible.builtin.debug:
    msg: >-
      AIDE candidate {{ section6_logging['6_3_1_aide_init'].db_new_path | default('/var/lib/aide/aide.db.new') }}
      was generated with SHA-256 {{ cis_aide_updated_database.stat.checksum }}.
      Review integrity findings before enabling promote_candidate.
  when:
    - cis_aide_update.changed | default(false)
    - not (section6_logging.get('6_3_3_aide_database_update', {}).get('promote_candidate', false) | bool)
  tags: [cis_6, cis_6_3, cis_6_3_3, aide]

- name: "6.3.2 | Derive availability of a verified AIDE database"
  ansible.builtin.set_fact:
    cis_aide_database_available: >-
      {{ cis_aide_database.stat.exists | default(false) or
         cis_aide_database_verified.stat.exists | default(false) }}
  tags: [cis_6, cis_6_3, cis_6_3_2, aide]

- name: "6.3.2 | Keep the daily AIDE timer disabled until a database exists"
  ansible.builtin.systemd_service:
    name: "{{ section6_logging['6_3_2_aide_timer'].timer_name | default('dailyaidecheck.timer') }}"
    state: stopped
    enabled: false
    masked: false
    daemon_reload: true
  when:
    - section6_logging['6_3_2_aide_timer'].enabled | default(true) | bool
    - not ansible_check_mode
    - not cis_aide_database_available | bool
  tags: [cis_6, cis_6_3, cis_6_3_2, aide]

- name: "6.3.2 | Enable the Ubuntu daily AIDE timer"
  ansible.builtin.systemd_service:
    name: "{{ section6_logging['6_3_2_aide_timer'].timer_name | default('dailyaidecheck.timer') }}"
    state: started
    enabled: true
    masked: false
    daemon_reload: true
  when:
    - section6_logging['6_3_2_aide_timer'].enabled | default(true) | bool
    - not ansible_check_mode
    - cis_aide_database_available | bool
  tags: [cis_6, cis_6_3, cis_6_3_2, aide]
