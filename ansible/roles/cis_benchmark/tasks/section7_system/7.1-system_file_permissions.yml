---
- name: "7.1.2/4/6/8 | Inspect optional account backup files"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/etc/passwd-, /etc/group-, /etc/shadow-, /etc/gshadow-]
  register: cis_account_backup_files
  tags: [cis_7, cis_7_1, cis_7_1_2, cis_7_1_4, cis_7_1_6, cis_7_1_8]

- name: "7.1.1 | Secure /etc/passwd"
  ansible.builtin.file:
    path: /etc/passwd
    state: file
    owner: root
    group: root
    mode: 'u-x,go-wx'
  tags: [cis_7, cis_7_1, cis_7_1_1]

- name: "7.1.2 | Secure /etc/passwd- when present"
  ansible.builtin.file:
    path: /etc/passwd-
    state: file
    owner: root
    group: root
    mode: 'u-x,go-wx'
  when: cis_account_backup_files.results[0].stat.exists
  tags: [cis_7, cis_7_1, cis_7_1_2]

- name: "7.1.3 | Secure /etc/group"
  ansible.builtin.file:
    path: /etc/group
    state: file
    owner: root
    group: root
    mode: 'u-x,go-wx'
  tags: [cis_7, cis_7_1, cis_7_1_3]

- name: "7.1.4 | Secure /etc/group- when present"
  ansible.builtin.file:
    path: /etc/group-
    state: file
    owner: root
    group: root
    mode: 'u-x,go-wx'
  when: cis_account_backup_files.results[1].stat.exists
  tags: [cis_7, cis_7_1, cis_7_1_4]

- name: "7.1.5 | Secure /etc/shadow"
  ansible.builtin.file:
    path: /etc/shadow
    state: file
    owner: root
    group: shadow
    mode: 'u-x,g-wx,o-rwx'
  tags: [cis_7, cis_7_1, cis_7_1_5]

- name: "7.1.6 | Secure /etc/shadow- when present"
  ansible.builtin.file:
    path: /etc/shadow-
    state: file
    owner: root
    group: shadow
    mode: 'u-x,g-wx,o-rwx'
  when: cis_account_backup_files.results[2].stat.exists
  tags: [cis_7, cis_7_1, cis_7_1_6]

- name: "7.1.7 | Secure /etc/gshadow"
  ansible.builtin.file:
    path: /etc/gshadow
    state: file
    owner: root
    group: shadow
    mode: 'u-x,g-wx,o-rwx'
  tags: [cis_7, cis_7_1, cis_7_1_7]

- name: "7.1.8 | Secure /etc/gshadow- when present"
  ansible.builtin.file:
    path: /etc/gshadow-
    state: file
    owner: root
    group: shadow
    mode: 'u-x,g-wx,o-rwx'
  when: cis_account_backup_files.results[3].stat.exists
  tags: [cis_7, cis_7_1, cis_7_1_8]

- name: "7.1.9 | Secure /etc/shells"
  ansible.builtin.file:
    path: /etc/shells
    state: file
    owner: root
    group: root
    mode: 'u-x,go-wx'
  tags: [cis_7, cis_7_1, cis_7_1_9]

- name: "7.1.10 | Inspect optional password history files"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/etc/security/opasswd, /etc/security/opasswd.old]
  register: cis_password_history_files
  tags: [cis_7, cis_7_1, cis_7_1_10]

- name: "7.1.10 | Secure existing password history files"
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: file
    owner: root
    group: root
    mode: 'u-x,go-rwx'
  loop: "{{ cis_password_history_files.results }}"
  when: item.stat.exists
  tags: [cis_7, cis_7_1, cis_7_1_10]

- name: "7.1.11 | Discover world-writable files on eligible local mounts"
  ansible.builtin.shell: |
    set -o pipefail
    findmnt -rn -o TARGET,FSTYPE,OPTIONS | while read -r target fstype options; do
      case "$fstype" in proc|sysfs|devtmpfs|devpts|tmpfs|squashfs|overlay|nfs*|cifs|smb*) continue ;; esac
      find "$target" -xdev -type f -perm -0002 \
        ! -path '/run/user/*' ! -path '*/containerd/*' \
        ! -path '*/kubelet/pods/*' ! -path '*/kubelet/plugins/*' -print
    done
  args:
    executable: /bin/bash
  register: cis_world_writable_files
  changed_when: false
  check_mode: false
  failed_when: cis_world_writable_files.rc != 0
  tags: [cis_7, cis_7_1, cis_7_1_11]

- name: "7.1.11 | Remove world-write from files with explicit opt-in"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: 'o-w'
  loop: "{{ cis_world_writable_files.stdout_lines }}"
  when: cis_7_1_11_remove_world_writable_file_bits | default(false) | bool
  tags: [cis_7, cis_7_1, cis_7_1_11]

- name: "7.1.11 | Report world-writable files left for policy review"
  ansible.builtin.debug:
    var: cis_world_writable_files.stdout_lines
  when:
    - not (cis_7_1_11_remove_world_writable_file_bits | default(false) | bool)
    - cis_world_writable_files.stdout_lines | length > 0
  tags: [cis_7, cis_7_1, cis_7_1_11]

- name: "7.1.11 | Discover world-writable directories without sticky bit"
  ansible.builtin.shell: |
    set -o pipefail
    findmnt -rn -o TARGET,FSTYPE,OPTIONS | while read -r target fstype options; do
      case "$fstype" in proc|sysfs|devtmpfs|devpts|tmpfs|squashfs|overlay|nfs*|cifs|smb*) continue ;; esac
      find "$target" -xdev -type d -perm -0002 ! -perm -1000 \
        ! -path '/run/user/*' ! -path '*/containerd/*' \
        ! -path '*/kubelet/pods/*' ! -path '*/kubelet/plugins/*' -print
    done
  args:
    executable: /bin/bash
  register: cis_world_writable_directories
  changed_when: false
  check_mode: false
  failed_when: cis_world_writable_directories.rc != 0
  tags: [cis_7, cis_7_1, cis_7_1_11]

- name: "7.1.11 | Add sticky bit to world-writable directories"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: 'a+t'
  loop: "{{ cis_world_writable_directories.stdout_lines }}"
  tags: [cis_7, cis_7_1, cis_7_1_11]

- name: "7.1.12 | Discover unowned or ungrouped filesystem objects"
  ansible.builtin.shell: |
    set -o pipefail
    findmnt -rn -o TARGET,FSTYPE,OPTIONS | while read -r target fstype options; do
      case "$fstype" in proc|sysfs|devtmpfs|devpts|tmpfs|squashfs|overlay|nfs*|cifs|smb*) continue ;; esac
      find "$target" -xdev \( -nouser -o -nogroup \) \
        ! -path '/run/user/*' ! -path '*/containerd/*' \
        ! -path '*/kubelet/pods/*' ! -path '*/kubelet/plugins/*' -print
    done
  args:
    executable: /bin/bash
  register: cis_orphaned_objects
  changed_when: false
  check_mode: false
  failed_when: cis_orphaned_objects.rc != 0
  tags: [cis_7, cis_7_1, cis_7_1_12]

- name: "7.1.12 | Report unowned or ungrouped objects"
  ansible.builtin.debug:
    var: cis_orphaned_objects.stdout_lines
  when: cis_orphaned_objects.stdout_lines | length > 0
  tags: [cis_7, cis_7_1, cis_7_1_12]

- name: "7.1.12 | Apply explicitly mapped orphan ownership"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
  loop: "{{ cis_7_1_12_orphan_ownership_map | default([]) }}"
  when:
    - cis_7_1_12_reassign_orphans | default(false) | bool
    - item.path in cis_orphaned_objects.stdout_lines
  tags: [cis_7, cis_7_1, cis_7_1_12]

- name: "7.1.13 | Discover SUID and SGID files for review"
  ansible.builtin.shell: |
    set -o pipefail
    findmnt -rn -o TARGET,FSTYPE,OPTIONS | while read -r target fstype options; do
      case "$fstype" in proc|sysfs|devtmpfs|devpts|tmpfs|squashfs|overlay|nfs*|cifs|smb*) continue ;; esac
      case ",$options," in *,nosuid,*|*,noexec,*) continue ;; esac
      find "$target" -xdev -type f -perm /6000 -print
    done
  args:
    executable: /bin/bash
  register: cis_suid_sgid_files
  changed_when: false
  check_mode: false
  failed_when: cis_suid_sgid_files.rc != 0
  tags: [cis_7, cis_7_1, cis_7_1_13]

- name: "7.1.13 | Report SUID and SGID files"
  ansible.builtin.debug:
    var: cis_suid_sgid_files.stdout_lines
  tags: [cis_7, cis_7_1, cis_7_1_13]
