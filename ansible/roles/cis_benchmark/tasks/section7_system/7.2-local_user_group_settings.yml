---
- name: "7.2.1 | Find accounts not using shadowed passwords"
  ansible.builtin.command:
    argv: [awk, '-F:', '$2 != "x" {print $1}', /etc/passwd]
  register: cis_unshadowed_accounts
  changed_when: false
  check_mode: false
  tags: [cis_7, cis_7_2, cis_7_2_1]

- name: "7.2.1 | Convert local passwords to shadow with explicit opt-in"
  ansible.builtin.command: pwconv
  register: cis_pwconv
  changed_when: true
  when:
    - section7_system_7_2_local_user_group_settings_7_2_1_shadow_passwords | default(false) | bool
    - cis_unshadowed_accounts.stdout_lines | length > 0
  tags: [cis_7, cis_7_2, cis_7_2_1]

- name: "7.2.2 | Find accounts with empty password fields"
  ansible.builtin.command:
    argv: [awk, '-F:', '$2 == "" {print $1}', /etc/shadow]
  register: cis_empty_password_accounts
  changed_when: false
  check_mode: false
  tags: [cis_7, cis_7_2, cis_7_2_2]

- name: "7.2.2 | Lock empty-password accounts with explicit opt-in"
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
  loop: "{{ cis_empty_password_accounts.stdout_lines }}"
  when: section7_system_7_2_local_user_group_settings_7_2_2_lock_empty_passwords | default(false) | bool
  tags: [cis_7, cis_7_2, cis_7_2_2]

- name: "7.2.3 | Report passwd GIDs missing from local groups"
  ansible.builtin.shell: |
    awk -F: 'NR==FNR {gid[$3]=1; next} !($4 in gid) {print $1 ":" $4}' /etc/group /etc/passwd
  args:
    executable: /bin/bash
  register: cis_missing_primary_groups
  changed_when: false
  check_mode: false
  failed_when: cis_missing_primary_groups.rc != 0
  tags: [cis_7, cis_7_2, cis_7_2_3]

- name: "7.2.3 | Show users whose primary GID is missing"
  ansible.builtin.debug:
    var: cis_missing_primary_groups.stdout_lines
  when: cis_missing_primary_groups.stdout_lines | length > 0
  tags: [cis_7, cis_7_2, cis_7_2_3]

- name: "7.2.4 | Read shadow group"
  ansible.builtin.getent:
    database: group
    key: shadow
  tags: [cis_7, cis_7_2, cis_7_2_4]

- name: "7.2.4 | Derive shadow group membership"
  ansible.builtin.set_fact:
    cis_shadow_gid: "{{ ansible_facts.getent_group.shadow[1] }}"
    cis_shadow_members: "{{ ansible_facts.getent_group.shadow[2].split(',') | reject('equalto', '') | list }}"
  changed_when: false
  tags: [cis_7, cis_7_2, cis_7_2_4]

- name: "7.2.4 | Find users whose primary group is shadow"
  ansible.builtin.command:
    argv: [awk, '-F:', "$4 == {{ cis_shadow_gid }} {print $1}", /etc/passwd]
  register: cis_shadow_primary_users
  changed_when: false
  check_mode: false
  tags: [cis_7, cis_7_2, cis_7_2_4]

- name: "7.2.4 | Remove secondary shadow members with explicit opt-in"
  ansible.builtin.command:
    argv: [gpasswd, -d, "{{ item }}", shadow]
  register: cis_shadow_member_removal
  changed_when: cis_shadow_member_removal.rc == 0
  loop: "{{ cis_shadow_members }}"
  when: section7_system_7_2_local_user_group_settings_7_2_4_empty_shadow_group | default(false) | bool
  tags: [cis_7, cis_7_2, cis_7_2_4]

- name: "7.2.4 | Apply explicitly mapped replacement primary groups"
  ansible.builtin.user:
    name: "{{ item.key }}"
    group: "{{ item.value }}"
  loop: "{{ cis_7_2_4_shadow_primary_group_map | default({}) | dict2items }}"
  when:
    - cis_7_2_4_reassign_shadow_primary_groups | default(false) | bool
    - item.key in cis_shadow_primary_users.stdout_lines
  tags: [cis_7, cis_7_2, cis_7_2_4]

- name: "7.2.5-8 | Audit duplicate local account identifiers and names"
  ansible.builtin.shell: |
    awk -F: '{count[$3]++; names[$3]=names[$3] " " $1} END {for (id in count) if (count[id] > 1) print id ":" names[id]}' /etc/passwd
    awk -F: '{count[$3]++; names[$3]=names[$3] " " $1} END {for (id in count) if (count[id] > 1) print id ":" names[id]}' /etc/group
    awk -F: '{count[$1]++} END {for (name in count) if (count[name] > 1) print "user:" name}' /etc/passwd
    awk -F: '{count[$1]++} END {for (name in count) if (count[name] > 1) print "group:" name}' /etc/group
  args:
    executable: /bin/bash
  register: cis_duplicate_accounts
  changed_when: false
  check_mode: false
  failed_when: cis_duplicate_accounts.rc != 0
  tags: [cis_7, cis_7_2, cis_7_2_5, cis_7_2_6, cis_7_2_7, cis_7_2_8]

- name: "7.2.5-8 | Report duplicate local account data"
  ansible.builtin.debug:
    var: cis_duplicate_accounts.stdout_lines
  when: cis_duplicate_accounts.stdout_lines | length > 0
  tags: [cis_7, cis_7_2, cis_7_2_5, cis_7_2_6, cis_7_2_7, cis_7_2_8]

- name: "7.2.9 | Read valid interactive shells"
  ansible.builtin.command:
    argv: [awk, '/^\// && $0 !~ /(nologin|false)$/ {print}', /etc/shells]
  register: cis_valid_shells
  changed_when: false
  check_mode: false
  tags: [cis_7, cis_7_2, cis_7_2_9]

- name: "7.2.9 | Read local passwd database"
  ansible.builtin.getent:
    database: passwd
    service: files
  tags: [cis_7, cis_7_2, cis_7_2_9]

- name: "7.2.9 | Select local interactive users"
  ansible.builtin.set_fact:
    cis_interactive_users: >-
      {{ ansible_facts.getent_passwd | dict2items
         | selectattr('value.5', 'in', cis_valid_shells.stdout_lines) | list }}
  changed_when: false
  tags: [cis_7, cis_7_2, cis_7_2_9]

- name: "7.2.9 | Inspect interactive user home directories"
  ansible.builtin.stat:
    path: "{{ item.value[4] }}"
  loop: "{{ cis_interactive_users }}"
  loop_control:
    label: "{{ item.key }} | {{ item.value[4] }}"
  register: cis_interactive_home_stats
  tags: [cis_7, cis_7_2, cis_7_2_9]

- name: "7.2.9 | Secure existing interactive user home directories"
  ansible.builtin.file:
    path: "{{ item.item.value[4] }}"
    state: directory
    owner: "{{ item.item.key }}"
    group: "{{ item.item.value[2] }}"
    mode: 'g-w,o-rwx'
  loop: "{{ cis_interactive_home_stats.results }}"
  loop_control:
    label: "{{ item.item.key }} | {{ item.item.value[4] }}"
  when: item.stat.isdir | default(false)
  tags: [cis_7, cis_7_2, cis_7_2_9]

- name: "7.2.9 | Report missing interactive user homes"
  ansible.builtin.debug:
    msg: "Home {{ item.item.value[4] }} for {{ item.item.key }} does not exist; no directory was created automatically."
  loop: "{{ cis_interactive_home_stats.results }}"
  when: not item.stat.exists
  tags: [cis_7, cis_7_2, cis_7_2_9]

- name: "7.2.10 | Find dot files in existing interactive homes"
  ansible.builtin.find:
    paths: "{{ item.item.value[4] }}"
    patterns: '.*'
    hidden: true
    recurse: false
    file_type: file
  loop: "{{ cis_interactive_home_stats.results }}"
  loop_control:
    label: "{{ item.item.key }} | {{ item.item.value[4] }}"
  when: item.stat.isdir | default(false)
  register: cis_interactive_dotfiles
  tags: [cis_7, cis_7_2, cis_7_2_10]

- name: "7.2.10 | Secure ordinary interactive user dot files"
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: file
    owner: "{{ item.0.item.item.key }}"
    group: "{{ item.0.item.item.value[2] }}"
    mode: 'u-x,go-wx'
  loop: "{{ query('subelements', cis_interactive_dotfiles.results | selectattr('files', 'defined') | list, 'files', {'skip_missing': true}) }}"
  loop_control:
    label: "{{ item.1.path }}"
  when: item.1.path is not search('/\.(bash_history|netrc|forward|rhosts?)$')
  tags: [cis_7, cis_7_2, cis_7_2_10]

- name: "7.2.10 | Secure sensitive history and netrc files"
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: file
    owner: "{{ item.0.item.item.key }}"
    group: "{{ item.0.item.item.value[2] }}"
    mode: 'u-x,go-rwx'
  loop: "{{ query('subelements', cis_interactive_dotfiles.results | selectattr('files', 'defined') | list, 'files', {'skip_missing': true}) }}"
  when: item.1.path is search('/\.(bash_history|netrc)$')
  tags: [cis_7, cis_7_2, cis_7_2_10]

- name: "7.2.10 | Report prohibited trust and forwarding dot files"
  ansible.builtin.debug:
    msg: "Review prohibited dot file {{ item.1.path }} for user {{ item.0.item.item.key }}"
  loop: "{{ query('subelements', cis_interactive_dotfiles.results | selectattr('files', 'defined') | list, 'files', {'skip_missing': true}) }}"
  when: item.1.path is search('/\.(forward|rhosts?)$')
  tags: [cis_7, cis_7_2, cis_7_2_10]

- name: "7.2.10 | Remove prohibited dot files with explicit opt-in"
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: absent
  loop: "{{ query('subelements', cis_interactive_dotfiles.results | selectattr('files', 'defined') | list, 'files', {'skip_missing': true}) }}"
  when:
    - cis_7_2_10_remove_prohibited_dotfiles | default(false) | bool
    - item.1.path is search('/\.(forward|rhosts?)$')
  tags: [cis_7, cis_7_2, cis_7_2_10]
