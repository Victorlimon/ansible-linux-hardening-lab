---
- name: Verify implemented CIS controls on Debian 12 without remediation
  hosts: debian_12
  become: false
  gather_facts: true
  vars:
    cis_preflight_allowed_release_statuses: [canary, released]
    cis_debian_12_execution_mode: verification
  roles:
    - role: cis_platform_preflight
      tags: [always, preflight, platform]
    - role: cis_debian_12
      tags: [cis_debian_12, cis_debian_12_verification]
